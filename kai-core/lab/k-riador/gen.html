<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OMNITRIX 4D - K-AI</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}
body {
  background:radial-gradient(circle at center, #001100 0%, #000 100%);
  display:flex;justify-content:center;align-items:center;height:100vh;
  overflow:hidden;perspective:1500px;font-family:Arial;
}

/* FUNDO 4D */
.bg {position:absolute;width:200%;height:200%;background:repeating-linear-gradient(transparent, transparent 2px, rgba(0,255,0,0.05) 3px);
  transform:rotateX(70deg) translateZ(-500px);animation:bg 20s linear infinite}
@keyframes bg {100%{transform:rotateX(70deg) translateZ(-500px) translateY(100px)}}

/* OMNITRIX */
.omnitrix {
  width:350px;height:350px;border-radius:50%;position:relative;z-index:10;
  background:radial-gradient(circle, #00FF00 0%, #00AA00 40%, #004400 70%);
  box-shadow:0 0 200px #00FF00, inset 0 0 100px #00FF00;
  animation:spin 10s infinite linear;cursor:pointer;transition:0.3s;
}
.omnitrix:hover {transform:scale(1.05) translateZ(50px)}
.omnitrix-core {
  width:200px;height:200px;border-radius:50%;background:#00FF00;
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 80px #00FF00;border:6px solid #004400;
}
.omnitrix-face {
  width:80px;height:80px;background:#000;border-radius:50%;position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);border:4px solid #00FF00;
}

/* HOLOGRAMA EM CIMA DO RELÓGIO */
.holo-alien {
  position:absolute;bottom:420px;width:400px;height:400px;
  display:flex;justify-content:center;align-items:center;opacity:0;
  transition:1s;transform:translateY(50px) rotateX(20deg)
}
.holo-alien.ativo {opacity:1;transform:translateY(0) rotateX(0)}
.holo-alien .img {
  font-size:120px;text-shadow:0 0 60px #00FF00;
  animation:float 3s ease-in-out infinite
}
@keyframes float {50%{transform:translateY(-20px)}}

/* CORPO HUMANO 360 */
.corpo {
  position:absolute;bottom:50px;width:200px;height:400px;
  transform-style:preserve-3d;animation:rotate360 8s infinite linear;
  opacity:0;transition:1s
}
.corpo.ativo {opacity:1}
.corpo .boneco {
  width:100%;height:100%;background:linear-gradient(#FFDDBB, #FFDDBB);
  border-radius:100px 100px 40px 40px;box-shadow:0 0 40px rgba(0,255,0,0.5)
}

/* MENU ALIENS */
.alien-menu {
  position:absolute;bottom:40px;display:flex;gap:15px;z-index:20
}
.btn-alien {
  padding:12px 20px;background:rgba(0,255,0,0.1);border:2px solid #00FF00;color:#00FF00;
  border-radius:12px;font-weight:900;cursor:pointer;transition:0.3s;
  backdrop-filter:blur(10px)
}
.btn-alien:hover {background:#00FF00;color:#000;transform:scale(1.1) translateZ(20px)}

/* TRANSFORMAÇÃO 5S */
.transformacao {
  position:absolute;top:0;left:0;width:100%;height:100%;z-index:50;
  background:#000;display:none;justify-content:center;align-items:center;flex-direction:column
}
.transformacao.ativo {display:flex;animation:flash 5s}
.transformacao h1 {
  color:#00FF00;font-size:60px;text-shadow:0 0 40px #00FF00;
  animation:texto 5s
}
.barras {width:600px;height:20px;background:#002200;border:2px solid #00FF00;border-radius:10px;margin-top:20px}
.barra-fill {height:100%;width:0%;background:#00FF00;box-shadow:0 0 20px #00FF00;animation:carregar 5s forwards}

@keyframes spin {100%{transform:rotateZ(360deg)}}
@keyframes rotate360 {100%{transform:rotateY(360deg)}}
@keyframes flash {0%{background:#FFF} 10%{background:#000} 100%{background:#000}}
@keyframes texto {0%{opacity:0;transform:scale(0.5)} 20%{opacity:1;transform:scale(1.2)} 100%{opacity:1}}
@keyframes carregar {100%{width:100%}}
</style>
</head>
<body>

<div class="bg"></div>

<!-- HOLOGRAMA -->
<div class="holo-alien" id="holo"><div class="img" id="holoImg">🔥</div></div>

<!-- CORPO 360 -->
<div class="corpo" id="corpo"><div class="boneco"></div></div>

<!-- OMNITRIX -->
<div class="omnitrix" onclick="ativarOmnitrix()">
  <div class="omnitrix-core"></div>
  <div class="omnitrix-face"></div>
</div>

<!-- MENU 4 ALIENS ORIGINAIS -->
<div class="alien-menu">
  <button class="btn-alien" onclick="selecionarAlien('FOGO','🔥','QUATRO BRACOS')">FOGO</button>
  <button class="btn-alien" onclick="selecionarAlien('QUATRO BRACOS','💪','FOGO')">QUATRO BRAÇOS</button>
  <button class="btn-alien" onclick="selecionarAlien('ULTRA T','⚙️','XLR8')">ULTRA T</button>
  <button class="btn-alien" onclick="selecionarAlien('XLR8','💨','ULTRA T')">XLR8</button>
</div>

<!-- TELA TRANSFORMAÇÃO 5S -->
<div class="transformacao" id="transf">
  <h1 id="transfText">TRANSFORMANDO EM FOGO</h1>
  <div class="barras"><div class="barra-fill"></div></div>
</div>

<!-- SONS OMNITRIX ORIGINAIS -->
<audio id="sndAtivar" src="data:audio/wav;base64,UklGRlIAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA="></audio>
<audio id="sndSelecionar" src="data:audio/wav;base64,UklGRlIAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA="></audio>
<audio id="sndTransformar" src="data:audio/wav;base64,UklGRlIAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA="></audio>

<script>
let alienAtual = null;

function tocar(som) {
  document.getElementById(som).currentTime = 0;
  document.getElementById(som).play().catch(()=>{});
}

function ativarOmnitrix() {
  tocar('sndAtivar');
  document.querySelector('.omnitrix').style.animation = 'spin 2s infinite linear';
  setTimeout(()=>{document.querySelector('.omnitrix').style.animation = 'spin 10s infinite linear'}, 2000);
}

function selecionarAlien(nome, emoji, prox) {
  if(alienAtual === nome) return;
  alienAtual = nome;
  tocar('sndSelecionar');
  
  // MOSTRA HOLOGRAMA EM CIMA
  document.getElementById('holo').classList.add('ativo');
  document.getElementById('holoImg').innerText = emoji;
  
  // MOSTRA CORPO GIRANDO
  document.getElementById('corpo').classList.add('ativo');
  
  // INICIA TRANSFORMAÇÃO 5S
  document.getElementById('transf').classList.add('ativo');
  document.getElementById('transfText').innerText = 'TRANSFORMANDO EM ' + nome;
  tocar('sndTransformar');
  
  setTimeout(()=>{
    document.getElementById('transf').classList.remove('ativo');
    // AQUI PODERIA TROCAR A SKIN DO BONECO PRA COR DO ALIEN
    document.querySelector('.boneco').style.background = 
      nome==='FOGO'?'linear-gradient(red, orange)':
      nome==='QUATRO BRACOS'?'linear-gradient(red, darkred)':
      nome==='ULTRA T'?'linear-gradient(gray, #333)':
      'linear-gradient(blue, cyan)';
  }, 5000);
}
</script>

</body></html>
