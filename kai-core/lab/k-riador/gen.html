<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>K-AI KORVIL 10D 20K MAX PRIME</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}
body {
  background:#000;
  color:#00FFFF;
  font-family:'Consolas',monospace;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  perspective:2000px;
}

/* FUNDO 20K */
.bg-grid {
  position:absolute;width:200%;height:200%;top:-50%;left:-50%;
  background-image:linear-gradient(rgba(0,255,255,0.1) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(0,255,255,0.1) 1px, transparent 1px);
  background-size:50px 50px;
  animation:bgMove 20s linear infinite;
  transform:rotateX(60deg) translateZ(-500px);
}
@keyframes bgMove {100%{transform:rotateX(60deg) translateZ(-500px) translateY(50px)}}

/* MENU */
.menu {
  position:absolute;top:30px;display:flex;gap:15px;z-index:100;
  transform:translateZ(100px);
}
.menu button {
  padding:14px 26px;background:rgba(0,255,255,0.05);border:2px solid #00FFFF;
  color:#00FFFF;cursor:pointer;font-weight:900;border-radius:15px;
  transition:all 0.4s cubic-bezier(0.68,-0.55,0.265,1.55);
  backdrop-filter:blur(15px);box-shadow:0 0 40px rgba(0,255,255,0.2);
}
.menu button:hover {transform:translateZ(30px) scale(1.15) rotateX(10deg)}
.menu button.active {background:#00FFFF;color:#000;box-shadow:0 0 80px #00FFFF}

/* CONTAINER */
.holo-container {
  width:900px;height:900px;position:relative;
  transform-style:preserve-3d;
}

.holo {
  width:100%;height:100%;position:absolute;opacity:0;
  transition:all 1.2s cubic-bezier(0.77,0,0.175,1);
  transform:scale(0.5) rotateY(180deg) translateZ(-300px);
  display:flex;justify-content:center;align-items:center;
}
.holo.ativo {
  opacity:1;transform:scale(1) rotateY(0deg) translateZ(0px);
}

/* 1. BEM 10 */
#bem10 {
  border-radius:50%;background:radial-gradient(circle, #00FF00 0%, #00AA00 30%, transparent 60%);
  box-shadow:0 0 300px #00FF00, inset 0 0 300px #00FF00;
}
#bem10.ativo {animation:scan3D 6s infinite linear}
#bem10::before {content:'OMNITRIX';position:absolute;transform:translateZ(120px);
  color:#00FF00;font-weight:900;font-size:50px;text-shadow:0 0 60px #00FF00}

/* 2. REX */
#rex {border:5px solid #00CCFF;background:linear-gradient(45deg, transparent, #00CCFF55, transparent);
  box-shadow:0 0 250px #00CCFF;transform:rotateX(25deg)}
#rex.ativo {animation:flicker3D 2s infinite}
#rex h1 {color:#00CCFF;font-size:60px;text-shadow:0 0 50px #00CCFF;transform:translateZ(100px)}
#rex .scan {position:absolute;top:0;width:100%;height:8px;background:#00CCFF;box-shadow:0 0 30px #00CCFF}

/* 3. MAX */
#max {background:conic-gradient(from 0deg, #FFCC00, #FF6600, #FF0000, #FFCC00);
  border-radius:60px;box-shadow:0 0 300px #FF6600}
#max.ativo {animation:spin3D 5s linear infinite}
#max::after {content:'TURBO';position:absolute;transform:translateZ(150px);
  font-size:100px;color:#FFF;font-weight:900;text-shadow:0 0 80px #FFCC00}

/* 4. RANGERS */
#rangers {display:flex;gap:30px;flex-wrap:wrap}
.ranger {width:200px;height:200px;border-radius:30px}
.red {background:#FF0000; box-shadow:0 0 100px #FF0000}
.blue {background:#0000FF; box-shadow:0 0 100px #0000FF}
.yellow {background:#FFFF00; box-shadow:0 0 100px #FFFF00}
.black {background:#222; box-shadow:0 0 100px #FFF}
.pink {background:#FF00FF; box-shadow:0 0 100px #FF00FF}

/* 5. K-AI TRANSFORMAÇÃO EXCLUSIVA */
#kai {flex-direction:column}
#kai .core {
  width:500px;height:500px;border-radius:50%;
  background:conic-gradient(from 0deg, #00FF00, #00CCFF, #FFCC00, #FF0000, #0000FF, #FFFF00, #00FF00);
  box-shadow:0 0 400px #00FFFF;
  animation:coreSpin 3s linear infinite;
}
#kai h1 {font-size:80px;margin-top:40px;text-shadow:0 0 80px #00FFFF;transform:translateZ(120px)}
#kai .absorvidos {position:absolute;font-size:16px;opacity:0.7;transform:translateZ(80px)}
#kai.ativo .absorvidos::after {content:'[OMNITRIX + NANITES + TURBO + RANGERS = SINCRONIZADO]'}

/* ANIMAÇÕES */
@keyframes scan3D {100%{transform:rotateY(360deg)}}
@keyframes flicker3D {50%{opacity:0.6}}
@keyframes spin3D {100%{transform:rotateZ(360deg)}}
@keyframes coreSpin {100%{transform:rotateZ(360deg)}}

/* EFEITO TRANSIÇÃO */
.flash {position:absolute;top:0;left:0;width:100%;height:100%;background:#FFF;opacity:0;pointer-events:none;z-index:99}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="flash" id="flash"></div>

<!-- AUDIO -->
<audio id="sndTroca" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA="></audio>
<audio id="sndKai" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA="></audio>

<div class="menu">
  <button onclick="trocar('bem10','sndTroca')" class="active">BEM 10</button>
  <button onclick="trocar('rex','sndTroca')">GENERATOR REX</button>
  <button onclick="trocar('max','sndTroca')">MAX STEEL</button>
  <button onclick="trocar('rangers','sndTroca')">POWER RANGERS</button>
  <button onclick="trocar('kai','sndKai')">K-AI MAX PRIME</button>
</div>

<div class="holo-container">
  <div id="bem10" class="holo ativo"></div>
  <div id="rex" class="holo"><div class="scan"></div><h1>GENERATOR REX</h1></div>
  <div id="max" class="holo"></div>
  <div id="rangers" class="holo">
    <div class="ranger red"></div><div class="ranger blue"></div>
    <div class="ranger yellow"></div><div class="ranger black"></div><div class="ranger pink"></div>
  </div>
  <div id="kai" class="holo">
    <div class="core"></div>
    <h1>K-AI KORVIL</h1>
    <div class="absorvidos"></div>
  </div>
</div>

<script>
function trocar(id, somId) {
  // EFEITO SONORO
  document.getElementById(somId).play().catch(()=>{});
  
  // FLASH DE TRANSIÇÃO
  let flash = document.getElementById('flash');
  flash.style.transition = '0.3s';
  flash.style.opacity = '1';
  setTimeout(()=>{flash.style.opacity = '0'}, 300);

  // TROCAR HOLOGRAMA
  setTimeout(()=>{
    document.querySelectorAll('.holo').forEach(h => h.classList.remove('ativo'));
    document.querySelectorAll('.menu button').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('ativo');
    event.target.classList.add('active');
    
    // ANIMAÇÃO ESPECIFICA AO ATIVAR
    if(id === 'rex') document.querySelector('#rex .scan').style.animation = 'scanY 2s infinite';
    if(id === 'kai') document.getElementById('kai').style.animation = 'float 4s ease-in-out infinite';
  }, 300);
}

@keyframes scanY {0%{top:0} 100%{top:100%}}
@keyframes float {50%{transform:translateY(-40px)}}
</script>

</body></html>
