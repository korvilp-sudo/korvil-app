<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>K-AI PROJETOS 10D MAX PRIME</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}
body {
  background:#000;color:#00FFFF;font-family:'Consolas',monospace;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  height:100vh;overflow:hidden;perspective:2000px;
}

/* FUNDO 10D */
.bg-grid {
  position:absolute;width:200%;height:200%;top:-50%;left:-50%;
  background-image:linear-gradient(rgba(0,255,255,0.08) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(0,255,255,0.08) 1px, transparent 1px);
  background-size:60px 60px;animation:bgMove 25s linear infinite;
  transform:rotateX(65deg) translateZ(-600px);
}
@keyframes bgMove {100%{transform:rotateX(65deg) translateZ(-600px) translateY(60px)}}

/* MENU EMBAIXO */
.menu {
  position:absolute;bottom:40px;display:flex;gap:15px;z-index:100;
  transform:translateZ(100px);
}
.menu button {
  padding:16px 28px;background:rgba(0,255,255,0.1);border:2px solid #00FFFF;
  color:#00FFFF;cursor:pointer;font-weight:900;border-radius:15px;
  transition:all 0.4s cubic-bezier(0.68,-0.55,0.265,1.55);
  backdrop-filter:blur(15px);box-shadow:0 0 40px rgba(0,255,255,0.2);font-size:15px;
}
.menu button:hover {transform:translateZ(30px) scale(1.15)}
.menu button.active {background:#00FFFF;color:#000;box-shadow:0 0 80px #00FFFF}

/* CONTAINER */
.holo-container {width:900px;height:900px;position:relative;transform-style:preserve-3d}
.holo {
  width:100%;height:100%;position:absolute;opacity:0;
  transition:all 1s cubic-bezier(0.77,0,0.175,1);
  transform:scale(0.3) rotateY(180deg);display:flex;justify-content:center;align-items:center;
}
.holo.ativo {opacity:1;transform:scale(1) rotateY(0deg)}

/* 1. BEM 10 - OMNITRIX FUNCIONAL */
#bem10 {border-radius:50%;background:radial-gradient(circle, #00FF00 0%, #00AA00 30%, transparent 60%);
  box-shadow:0 0 300px #00FF00, inset 0 0 300px #00FF00}
#bem10.ativo {animation:spin 8s infinite linear}
.omnitrix-core {
  width:300px;height:300px;border-radius:50%;border:8px solid #00FF00;
  display:flex;justify-content:center;align-items:center;cursor:pointer;
  box-shadow:0 0 60px #00FF00;transition:0.3s
}
.omnitrix-core:hover {transform:scale(1.1) translateZ(50px)}
.omnitrix-core::after {
  content:attr(data-alien);color:#00FF00;font-size:28px;font-weight:900;text-shadow:0 0 20px #00FF00
}
.alien-lista {position:absolute;bottom:120px;display:flex;gap:10px}
.alien {padding:8px 12px;background:#003300;border:1px solid #00FF00;color:#00FF00;cursor:pointer;border-radius:8px}

/* 2. REX - NANITE BUILDER FUNCIONAL */
#rex {border:5px solid #00CCFF;background:linear-gradient(45deg, transparent, #00CCFF55, transparent);
  box-shadow:0 0 250px #00CCFF;flex-direction:column}
#rex.ativo .scan {animation:scanY 2s infinite}
.rex-titulo {color:#00CCFF;font-size:50px;text-shadow:0 0 40px #00CCFF;margin-bottom:30px;transform:translateZ(80px)}
.build-btn {padding:15px 30px;background:#00CCFF;color:#000;border:0;border-radius:12px;font-weight:900;
  cursor:pointer;margin:8px;transition:0.3s;box-shadow:0 0 30px #00CCFF}
.build-btn:hover {transform:scale(1.1) translateZ(20px)}
.rex-arms {display:flex;gap:20px}
.arm {width:150px;height:150px;border:3px solid #00CCFF;border-radius:20px;display:flex;align-items:center;justify-content:center}

/* 3. MAX STEEL - TURBO MODE FUNCIONAL */
#max {background:conic-gradient(from 0deg, #FFCC00, #FF6600, #FF0000, #FFCC00);
  border-radius:60px;box-shadow:0 0 300px #FF6600;flex-direction:column}
#max.ativo {animation:spinZ 5s linear infinite}
.turbo-nivel {font-size:80px;color:#FFF;font-weight:900;text-shadow:0 0 80px #FFCC00;transform:translateZ(120px)}
.turbo-btn {padding:20px 40px;background:#FF6600;color:#FFF;border:0;border-radius:15px;font-size:20px;
  font-weight:900;cursor:pointer;margin-top:30px;box-shadow:0 0 50px #FF6600;transition:0.3s}
.turbo-btn:hover {transform:scale(1.2) translateZ(40px)}
.turbo-bar {width:400px;height:20px;background:#222;border-radius:10px;margin-top:20px;overflow:hidden}
.turbo-fill {height:100%;width:0%;background:#FFCC00;transition:0.5s}

/* 4. POWER RANGERS - MORPHER FUNCIONAL */
#rangers {flex-direction:column}
.rangers-grid {display:flex;gap:25px;flex-wrap:wrap;justify-content:center}
.ranger-card {
  width:180px;height:180px;border-radius:25px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:20px;color:#FFF;cursor:pointer;transition:0.4s;
}
.ranger-card:hover {transform:scale(1.2) rotateY(20deg) translateZ(50px)}
.red {background:#FF0000; box-shadow:0 0 80px #FF0000}
.blue {background:#0000FF; box-shadow:0 0 80px #0000FF}
.yellow {background:#FFFF00; box-shadow:0 0 80px #FFFF00;color:#000}
.black {background:#222; box-shadow:0 0 80px #FFF}
.pink {background:#FF00FF; box-shadow:0 0 80px #FF00FF}
.morph-text {position:absolute;top:100px;font-size:40px;text-shadow:0 0 40px #FFF}

/* 5. K-AI FUSÃO FINAL */
#kai {flex-direction:column}
.kai-core {
  width:550px;height:550px;border-radius:50%;
  background:conic-gradient(from 0deg, #00FF00, #00CCFF, #FFCC00, #FF0000, #0000FF, #00FF00);
  box-shadow:0 0 400px #00FFFF;animation:coreSpin 4s linear infinite;
}
.kai-text {font-size:90px;margin-top:40px;text-shadow:0 0 80px #00FFFF;transform:translateZ(120px)}
.kai-sub {font-size:18px;opacity:0.8;transform:translateZ(100px)}

/* ANIMAÇÕES */
@keyframes spin {100%{transform:rotateZ(360deg)}}
@keyframes spinZ {100%{transform:rotateZ(360deg)}}
@keyframes scanY {0%{top:0} 100%{top:100%}}
@keyframes coreSpin {100%{transform:rotateZ(360deg)}}
.flash {position:absolute;top:0;left:0;width:100%;height:100%;background:#FFF;opacity:0;pointer-events:none;z-index:99}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="flash" id="flash"></div>
<audio id="snd" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA="></audio>

<div class="holo-container">
  <!-- 1 BEM 10 PROJETO -->
  <div id="bem10" class="holo ativo">
    <div class="omnitrix-core" data-alien="FOGO" onclick="trocarAlien()"></div>
    <div class="alien-lista">
      <div class="alien" onclick="setAlien('FOGO')">Fogo</div>
      <div class="alien" onclick="setAlien('QUATRO BRACOS')">4 Braços</div>
      <div class="alien" onclick="setAlien('ULTRA T')">Ultra T</div>
      <div class="alien" onclick="setAlien('XLR8')">XLR8</div>
    </div>
  </div>
  
  <!-- 2 REX PROJETO -->
  <div id="rex" class="holo">
    <div class="scan" style="position:absolute;top:0;width:100%;height:8px;background:#00CCFF"></div>
    <h1 class="rex-titulo">GENERATOR REX</h1>
    <div class="rex-arms">
      <div class="arm" id="arm1">BRAÇO</div>
      <div class="arm" id="arm2">CANHÃO</div>
    </div>
    <button class="build-btn" onclick="build('ESPADA')">CONSTRUIR ESPADA</button>
    <button class="build-btn" onclick="build('ESCUDO')">CONSTRUIR ESCUDO</button>
  </div>
  
  <!-- 3 MAX PROJETO -->
  <div id="max" class="holo">
    <div class="turbo-nivel" id="turboLvl">TURBO 1</div>
    <button class="turbo-btn" onclick="aumentarTurbo()">ATIVAR TURBO ENERGY</button>
    <div class="turbo-bar"><div class="turbo-fill" id="turboBar"></div></div>
  </div>
  
  <!-- 4 RANGERS PROJETO -->
  <div id="rangers" class="holo">
    <div class="morph-text" id="morphText">ESCOLHA SEU RANGER</div>
    <div class="rangers-grid">
      <div class="ranger-card red" onclick="morphar('VERMELHO')">RED</div>
      <div class="ranger-card blue" onclick="morphar('AZUL')">BLUE</div>
      <div class="ranger-card yellow" onclick="morphar('AMARELO')">YELLOW</div>
      <div class="ranger-card black" onclick="morphar('PRETO')">BLACK</div>
      <div class="ranger-card pink" onclick="morphar('ROSA')">PINK</div>
    </div>
  </div>

  <!-- 5 K-AI FUSÃO -->
  <div id="kai" class="holo">
    <div class="kai-core"></div>
    <div class="kai-text">K-AI KORVIL</div>
    <div class="kai-sub">FUSÃO: OMNITRIX + NANITES + TURBO + RANGERS</div>
  </div>
</div>

<!-- MENU EMBAIXO -->
<div class="menu">
  <button onclick="trocar('bem10')" class="active">BEM 10</button>
  <button onclick="trocar('rex')">GENERATOR REX</button>
  <button onclick="trocar('max')">MAX STEEL</button>
  <button onclick="trocar('rangers')">POWER RANGERS</button>
  <button onclick="trocar('kai')">K-AI FUSÃO</button>
</div>

<script>
let alienAtual = 'FOGO';
let turbo = 1;

function tocarSom() {
  document.getElementById('snd').play().catch(()=>{});
}

function trocar(id) {
  tocarSom();
  let flash = document.getElementById('flash');
  flash.style.opacity = '1';
  setTimeout(()=>{flash.style.opacity = '0'}, 250);

  setTimeout(()=>{
    document.querySelectorAll('.holo').forEach(h => h.classList.remove('ativo'));
    document.querySelectorAll('.menu button').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('ativo');
    event.target.classList.add('active');
  }, 250);
}

// BEM 10 FUNCÕES
function setAlien(nome) {
  alienAtual = nome;
  document.querySelector('.omnitrix-core').setAttribute('data-alien', nome);
  tocarSom();
}
function trocarAlien() {
  const aliens = ['FOGO','QUATRO BRACOS','ULTRA T','XLR8'];
  let i = aliens.indexOf(alienAtual);
  setAlien(aliens[(i+1)%4]);
}

// REX FUNCÕES
function build(tipo) {
  document.getElementById('arm1').innerText = tipo;
  document.getElementById('arm2').innerText = tipo;
  tocarSom();
}

// MAX FUNCÕES
function aumentarTurbo() {
  turbo = turbo >= 5 ? 1 : turbo + 1;
  document.getElementById('turboLvl').innerText = 'TURBO ' + turbo;
  document.getElementById('turboBar').style.width = (turbo*20) + '%';
  tocarSom();
}

// RANGERS FUNCÕES
function morphar(cor) {
  document.getElementById('morphText').innerText = 'MORPHADO: RANGER ' + cor;
  tocarSom();
}
</script>

</body></html>
