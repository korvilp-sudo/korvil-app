<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>K-AI KORVIL HOLOGRAMAS 4D 8K</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}
body {
  background:radial-gradient(circle at center, #001122 0%, #000 100%);
  color:#00FFFF;
  font-family:'Consolas',monospace;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  perspective:1200px;
}

/* MENU 4D */
.menu {
  position:absolute;
  top:20px;
  display:flex;
  gap:12px;
  z-index:10;
  transform:translateZ(50px);
  flex-wrap:wrap;
  justify-content:center;
}
.menu button {
  padding:12px 22px;
  background:rgba(0,255,255,0.1);
  border:2px solid #00FFFF;
  color:#00FFFF;
  cursor:pointer;
  font-weight:900;
  border-radius:12px;
  transition:0.3s;
  backdrop-filter:blur(10px);
  box-shadow:0 0 30px rgba(0,255,255,0.3);
  font-size:14px;
}
.menu button:hover, .menu button.active {
  background:#00FFFF;
  color:#000;
  box-shadow:0 0 60px #00FFFF;
  transform:translateZ(20px) scale(1.1);
}

/* CONTAINER 4D */
.holo-container {
  width:850px;
  height:850px;
  position:relative;
  transform-style:preserve-3d;
  animation:float 6s ease-in-out infinite;
}

.holo {
  width:100%;
  height:100%;
  position:absolute;
  opacity:0;
  transition:1s;
  transform-style:preserve-3d;
  display:flex;
  justify-content:center;
  align-items:center;
}
.holo.ativo {opacity:1}

/* 1. BEM 10 */
#bem10 {
  border-radius:50%;
  background:radial-gradient(circle, #00FF00 0%, #00AA00 30%, transparent 60%);
  box-shadow:0 0 200px #00FF00, inset 0 0 200px #00FF00;
  animation:scan3D 8s infinite linear;
}
#bem10::before {
  content:'OMNITRIX';
  position:absolute;transform:translateZ(100px);
  color:#00FF00;font-weight:900;font-size:40px;text-shadow:0 0 40px #00FF00
}
#bem10 .linhas {
  position:absolute;width:100%;height:100%;
  background:repeating-linear-gradient(transparent 0px, rgba(0,255,0,0.2) 3px, transparent 6px);
  border-radius:50%;
  animation:rotateX 10s infinite linear;
}

/* 2. REX */
#rex {
  border:4px solid #00CCFF;
  background:linear-gradient(45deg, transparent, #00CCFF44, transparent);
  box-shadow:0 0 150px #00CCFF;
  animation:flicker3D 3s infinite;
  transform:rotateX(20deg);
}
#rex h1 {
  color:#00CCFF;font-size:50px;
  text-shadow:0 0 40px #00CCFF;
  transform:translateZ(80px)
}
#rex .scan {
  position:absolute;top:0;width:100%;height:6px;background:#00CCFF;animation:scanY3D 2.5s infinite;
  box-shadow:0 0 20px #00CCFF
}

/* 3. MAX STEEL */
#max {
  background:conic-gradient(from 0deg, #FFCC00, #FF6600, #FF0000, #FFCC00);
  border-radius:50px;
  box-shadow:0 0 200px #FF6600;
  animation:spin3D 6s linear infinite;
}
#max::after {
  content:'TURBO';
  position:absolute;transform:translateZ(120px);
  font-size:80px;color:#FFF;font-weight:900;text-shadow:0 0 60px #FFCC00
}

/* 4. POWER RANGERS */
#rangers {display:flex;gap:25px;flex-wrap:wrap}
.ranger {
  width:180px;height:180px;border-radius:25px;animation:glow3D 3s infinite;
}
.red {background:#FF0000; box-shadow:0 0 80px #FF0000}
.blue {background:#0000FF; box-shadow:0 0 80px #0000FF}
.yellow {background:#FFFF00; box-shadow:0 0 80px #FFFF00}
.black {background:#222; box-shadow:0 0 80px #FFF}
.pink {background:#FF00FF; box-shadow:0 0 80px #FF00FF}

/* 5. K-AI KORVIL FINAL */
#kai {
  flex-direction:column;
  background:radial-gradient(circle, rgba(0,255,255,0.2) 0%, transparent 70%);
}
#kai .avatar {
  width:400px;height:400px;border-radius:50%;
  border:5px solid #00FFFF;
  box-shadow:0 0 150px #00FFFF, inset 0 0 150px #00FFFF;
  animation:pulseKai 2s infinite;
  background:conic-gradient(from 0deg, #00FFFF, #0088FF, #00FFFF);
}
#kai h1 {
  font-size:60px;margin-top:30px;
  text-shadow:0 0 50px #00FFFF;
  animation:textGlow 3s infinite;
  transform:translateZ(100px)
}
#kai p {
  font-size:20px;opacity:0.8;
  transform:translateZ(80px)
}

/* ANIMAÇÕES */
@keyframes scan3D {100%{transform:rotateY(360deg) rotateX(360deg)}}
@keyframes rotateX {100%{transform:rotateX(360deg)}}
@keyframes scanY3D {0%{top:0} 100%{top:100%}}
@keyframes flicker3D {50%{opacity:0.5; transform:rotateX(20deg) translateZ(30px)}}
@keyframes spin3D {100%{transform:rotateY(360deg) rotateZ(360deg)}}
@keyframes glow3D {50%{transform:scale(1.2) translateZ(50px)}}
@keyframes float {50%{transform:translateY(-30px) rotateX(5deg)}}
@keyframes pulseKai {50%{box-shadow:0 0 250px #00FFFF, inset 0 0 250px #00FFFF}}
@keyframes textGlow {50%{text-shadow:0 0 80px #00FFFF}}

/* PARTICULAS 8K */
.particula {
  position:absolute;width:4px;height:4px;background:#00FFFF;border-radius:50%;
  box-shadow:0 0 15px #00FFFF;animation:part 6s infinite linear
}
@keyframes part {
 0%{transform:translateY(100vh) translateZ(-300px)}
 100%{transform:translateY(-100vh) translateZ(300px)}
}
</style>
</head>
<body>

<!-- PARTICULAS -->
<script>
for(let i=0;i<150;i++){
  let p = document.createElement('div');
  p.className = 'particula';
  p.style.left = Math.random()*100+'%';
  p.style.animationDelay = Math.random()*6+'s';
  document.body.appendChild(p);
}
</script>

<div class="menu">
  <button onclick="trocar('bem10')" class="active">BEM 10</button>
  <button onclick="trocar('rex')">GENERATOR REX</button>
  <button onclick="trocar('max')">MAX STEEL</button>
  <button onclick="trocar('rangers')">POWER RANGERS</button>
  <button onclick="trocar('kai')">K-AI KORVIL</button>
</div>

<div class="holo-container">
  <!-- 1 BEM 10 -->
  <div id="bem10" class="holo ativo"><div class="linhas"></div></div>
  
  <!-- 2 REX -->
  <div id="rex" class="holo"><div class="scan"></div><h1>GENERATOR REX</h1></div>
  
  <!-- 3 MAX -->
  <div id="max" class="holo"></div>
  
  <!-- 4 RANGERS -->
  <div id="rangers" class="holo">
    <div class="ranger red"></div>
    <div class="ranger blue"></div>
    <div class="ranger yellow"></div>
    <div class="ranger black"></div>
    <div class="ranger pink"></div>
  </div>

  <!-- 5 K-AI FINAL -->
  <div id="kai" class="holo">
    <div class="avatar"></div>
    <h1>K-AI KORVIL</h1>
    <p>v-9100 | SISTEMA 4D ATIVADO</p>
  </div>
</div>

<script>
function trocar(id) {
  document.querySelectorAll('.holo').forEach(h => h.classList.remove('ativo'));
  document.querySelectorAll('.menu button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('ativo');
  event.target.classList.add('active');
}
</script>

</body></html>
