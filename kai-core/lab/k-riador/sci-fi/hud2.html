<body>

```

<!-- ======================================================
     MEDIAPIPE TASKS VISION
====================================================== -->

<script type="module">

import {
    FaceLandmarker,
    FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";


/* ======================================================
   ELEMENTOS
====================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startBtn =
    document.getElementById("startBtn");

const cameraBtn =
    document.getElementById("cameraBtn");

const status =
    document.getElementById("status");


/* ======================================================
   ESTADO
====================================================== */

let faceLandmarker = null;

let stream = null;

let running = false;

let frontCamera = true;

let lastVideoTime = -1;

let face = null;

let centeredSince = null;

let helmetActivated = false;


/* ======================================================
   RESIZE
====================================================== */

function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* ======================================================
   MEDIAPIPE
====================================================== */

async function createFaceLandmarker() {

    status.textContent =
        "CARREGANDO SISTEMA FACIAL...";


    const vision =
        await FilesetResolver.forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

        );


    faceLandmarker =
        await FaceLandmarker.createFromOptions(

            vision,

            {

                baseOptions: {

                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                    delegate:
                        "GPU"

                },

                runningMode:
                    "VIDEO",

                numFaces:
                    1,

                minFaceDetectionConfidence:
                    .55,

                minFacePresenceConfidence:
                    .55,

                minTrackingConfidence:
                    .55,

                outputFaceBlendshapes:
                    false,

                outputFacialTransformationMatrixes:
                    true

            }

        );


    status.textContent =
        "SISTEMA PRONTO";
}


/* ======================================================
   CÂMERA
====================================================== */

async function startCamera() {

    if (running)
        return;


    try {

        if (!faceLandmarker) {

            await createFaceLandmarker();

        }


        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            frontCamera
                            ? "user"
                            : "environment",

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        },

                        frameRate: {
                            ideal: 30
                        }

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        running = true;

        lastVideoTime = -1;

        centeredSince = null;

        helmetActivated = false;


        /*
         * IMPORTANTE:
         *
         * NÃO espelhamos o vídeo.
         *
         * O canvas é que corrige
         * a coordenada quando necessário.
         */

        video.style.transform =
            "none";


        startBtn.style.display =
            "none";


        status.textContent =
            "PROCURANDO SEU ROSTO...";


        requestAnimationFrame(
            detect
        );


    }

    catch (error) {

        console.error(error);

        status.textContent =
            "ERRO AO ABRIR A CÂMERA";

        startBtn.style.display =
            "block";

        running = false;

    }

}


/* ======================================================
   DETECÇÃO
====================================================== */

function detect() {

    if (!running)
        return;


    if (
        video.readyState >= 2 &&
        video.currentTime !== lastVideoTime
    ) {

        lastVideoTime =
            video.currentTime;


        const result =
            faceLandmarker.detectForVideo(

                video,

                performance.now()

            );


        if (
            result.faceLandmarks &&
            result.faceLandmarks.length
        ) {

            face =
                result.faceLandmarks[0];

            processFace();

        }

        else {

            face = null;

            resetFace();

        }

    }


    render();


    requestAnimationFrame(
        detect
    );
}


/* ======================================================
   CONVERSÃO DE COORDENADAS
====================================================== */

function screenPoint(
    landmark
) {

    let x =
        landmark.x *
        canvas.width;

    const y =
        landmark.y *
        canvas.height;


    /*
     * A câmera frontal aparece
     * como um espelho para o usuário.
     *
     * Como o vídeo não foi espelhado,
     * espelhamos somente o holograma.
     */

    if (frontCamera) {

        x =
            canvas.width - x;

    }


    return {
        x,
        y,
        z: landmark.z
    };
}


/* ======================================================
   PROCESSAMENTO DO ROSTO
====================================================== */

function processFace() {

    const leftSide =
        screenPoint(
            face[234]
        );

    const rightSide =
        screenPoint(
            face[454]
        );

    const forehead =
        screenPoint(
            face[10]
        );

    const chin =
        screenPoint(
            face[152]
        );


    const centerX =
        (leftSide.x +
         rightSide.x) / 2;


    const centerY =
        (forehead.y +
         chin.y) / 2;


    const faceWidth =
        Math.abs(
            rightSide.x -
            leftSide.x
        );


    const faceHeight =
        Math.abs(
            chin.y -
            forehead.y
        );


    /*
     * CENTRO DA TELA
     */

    const screenCenterX =
        canvas.width / 2;

    const screenCenterY =
        canvas.height / 2;


    /*
     * TOLERÂNCIA DINÂMICA
     */

    const toleranceX =
        Math.min(
            110,
            faceWidth * .35
        );


    const toleranceY =
        Math.min(
            140,
            faceHeight * .30
        );


    const centered =
        Math.abs(
            centerX -
            screenCenterX
        ) < toleranceX
        &&
        Math.abs(
            centerY -
            screenCenterY
        ) < toleranceY;


    if (centered) {

        status.textContent =
            "ROSTO CENTRALIZADO";


        if (!centeredSince) {

            centeredSince =
                performance.now();

        }


        const elapsed =
            performance.now() -
            centeredSince;


        if (
            elapsed >= 3000 &&
            !helmetActivated
        ) {

            helmetActivated =
                true;

            status.textContent =
                "CAPACETE ATIVADO";

        }

    }

    else {

        centeredSince =
            null;

        helmetActivated =
            false;

        status.textContent =
            "CENTRALIZE O ROSTO";

    }

}


/* ======================================================
   RESET
====================================================== */

function resetFace() {

    centeredSince =
        null;

    helmetActivated =
        false;

    status.textContent =
        "PROCURANDO SEU ROSTO...";
}


/* ======================================================
   RENDER
====================================================== */

function render() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (!face)
        return;


    drawFaceTarget();


    if (helmetActivated) {

        drawHelmet();

    }

}


/* ======================================================
   ALVO DE CENTRALIZAÇÃO
====================================================== */

function drawFaceTarget() {

    const left =
        screenPoint(
            face[234]
        );

    const right =
        screenPoint(
            face[454]
        );

    const top =
        screenPoint(
            face[10]
        );

    const bottom =
        screenPoint(
            face[152]
        );


    const cx =
        (left.x + right.x) / 2;

    const cy =
        (top.y + bottom.y) / 2;


    const width =
        Math.abs(
            right.x - left.x
        );


    const height =
        Math.abs(
            bottom.y - top.y
        );


    /*
     * Antes da ativação:
     * moldura acompanha o rosto.
     */

    if (!helmetActivated) {

        ctx.save();

        ctx.beginPath();

        ctx.ellipse(

            cx,
            cy,

            width * .62,
            height * .62,

            0,
            0,
            Math.PI * 2

        );

        ctx.strokeStyle =
            "#00ffff";

        ctx.lineWidth =
            2;

        ctx.setLineDash([
            10,
            8
        ]);

        ctx.shadowColor =
            "#00ffff";

        ctx.shadowBlur =
            15;

        ctx.stroke();

        ctx.restore();


        /*
         * MARCA CENTRAL
         */

        ctx.beginPath();

        ctx.arc(
            canvas.width / 2,
            canvas.height / 2,
            5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#00ffff";

        ctx.shadowColor =
            "#00ffff";

        ctx.shadowBlur =
            20;

        ctx.fill();

    }

}


/* ======================================================
   CAPACETE HOLOGRÁFICO
====================================================== */

function drawHelmet() {

    const leftEar =
        screenPoint(
            face[234]
        );

    const rightEar =
        screenPoint(
            face[454]
        );

    const leftEye =
        screenPoint(
            face[468]
        );

    const rightEye =
        screenPoint(
            face[473]
        );

    const nose =
        screenPoint(
            face[1]
        );

    const mouth =
        screenPoint(
            face[13]
        );

    const forehead =
        screenPoint(
            face[10]
        );

    const chin =
        screenPoint(
            face[152]
        );


    const cx =
        (leftEar.x +
         rightEar.x) / 2;

    const cy =
        (forehead.y +
         chin.y) / 2;


    const radius =
        Math.abs(
            rightEar.x -
            leftEar.x
        ) * .65;


    /*
     * ANÉIS DO CAPACETE
     */

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        ctx.save();

        ctx.beginPath();

        ctx.ellipse(

            cx,
            cy - 10,

            radius + i * 9,

            radius * 1.25 + i * 9,

            0,
            0,
            Math.PI * 2

        );

        ctx.strokeStyle =
            `rgba(0,255,255,${.60 - i * .11})`;

        ctx.lineWidth =
            1.5;

        ctx.shadowColor =
            "#00ffff";

        ctx.shadowBlur =
            20;

        ctx.stroke();

        ctx.restore();

    }


    /*
     * LINHAS
     */

    holoLine(
        leftEar,
        leftEye
    );

    holoLine(
        leftEye,
        rightEye
    );

    holoLine(
        rightEye,
        rightEar
    );

    holoLine(
        leftEye,
        nose
    );

    holoLine(
        rightEye,
        nose
    );

    holoLine(
        nose,
        mouth
    );

    holoLine(
        forehead,
        nose
    );


    /*
     * PONTOS
     */

    holoPoint(
        leftEye,
        10
    );

    holoPoint(
        rightEye,
        10
    );

    holoPoint(
        leftEar,
        11
    );

    holoPoint(
        rightEar,
        11
    );

    holoPoint(
        nose,
        13
    );

    holoPoint(
        mouth,
        11
    );

    holoPoint(
        forehead,
        13
    );


    /*
     * NÚCLEO CENTRAL
     */

    holoPoint(
        {
            x: cx,
            y: cy - radius * .35
        },
        20
    );


    /*
     * LINHA VERTICAL CENTRAL
     */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        cx,
        cy - radius * 1.35
    );

    ctx.lineTo(
        cx,
        cy + radius * 1.15
    );

    ctx.strokeStyle =
        "rgba(0,255,255,.25)";

    ctx.lineWidth =
        1;

    ctx.stroke();

    ctx.restore();


    /*
     * TEXTO
     */

    ctx.save();

    ctx.fillStyle =
        "#00ffff";

    ctx.font =
        "10px Courier New";

    ctx.textAlign =
        "center";

    ctx.shadowColor =
        "#00ffff";

    ctx.shadowBlur =
        10;

    ctx.fillText(
        "KORVIL HELMET",
        cx,
        cy - radius * 1.45
    );

    ctx.restore();

}


/* ======================================================
   PONTO OCTAÉDRICO
====================================================== */

function holoPoint(
    p,
    size
) {

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );


    /*
     * LOSANGO EXTERNO
     */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -size
    );

    ctx.lineTo(
        size,
        0
    );

    ctx.lineTo(
        0,
        size
    );

    ctx.lineTo(
        -size,
        0
    );

    ctx.closePath();


    ctx.strokeStyle =
        "#00ffff";

    ctx.lineWidth =
        2;

    ctx.shadowColor =
        "#00ffff";

    ctx.shadowBlur =
        18;

    ctx.stroke();


    /*
     * LOSANGO INTERNO
     */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -size * .45
    );

    ctx.lineTo(
        size * .45,
        0
    );

    ctx.lineTo(
        0,
        size * .45
    );

    ctx.lineTo(
        -size * .45,
        0
    );

    ctx.closePath();

    ctx.strokeStyle =
        "rgba(0,255,255,.65)";

    ctx.lineWidth =
        1;

    ctx.stroke();


    /*
     * NÚCLEO
     */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        3,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.fill();


    /*
     * PULSO EXTERNO
     */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        size * 1.7,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "rgba(0,255,255,.25)";

    ctx.lineWidth =
        1;

    ctx.stroke();


    ctx.restore();
}


/* ======================================================
   LINHA HOLOGRÁFICA
====================================================== */

function holoLine(
    a,
    b
) {

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        a.x,
        a.y
    );

    ctx.lineTo(
        b.x,
        b.y
    );

    ctx.strokeStyle =
        "rgba(0,255,255,.38)";

    ctx.lineWidth =
        1.3;

    ctx.shadowColor =
        "#00ffff";

    ctx.shadowBlur =
        8;

    ctx.stroke();

    ctx.restore();
}


/* ======================================================
   TROCAR CÂMERA
====================================================== */

cameraBtn.onclick =
async function() {

    frontCamera =
        !frontCamera;


    if (stream) {

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    stream = null;

    running = false;

    face = null;

    centeredSince = null;

    helmetActivated = false;


    await startCamera();

};


/* ======================================================
   INICIAR
====================================================== */

startBtn.onclick =
    startCamera;

</script>
