<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KORVIL Helmet Hologram</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", monospace;
}

#video {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 1;

    background: #000;

    filter: brightness(.45);
}

#canvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 2;

    pointer-events: none;
}

#interface {
    position: fixed;

    top: 12px;
    left: 0;

    width: 100%;

    z-index: 10;

    text-align: center;

    color: #00ffff;

    text-shadow:
        0 0 8px #00ffff,
        0 0 20px #00ffff;
}

#title {
    font-size: 14px;
}

#status {
    margin-top: 7px;

    font-size: 11px;

    color: #fff;

    text-shadow:
        0 0 8px #00ffff;
}

#start {
    position: fixed;

    left: 50%;
    bottom: 45px;

    transform: translateX(-50%);

    z-index: 20;

    padding: 16px 32px;

    border: 0;

    border-radius: 25px;

    background: #00ffff;

    color: #000;

    font-family: "Courier New", monospace;

    font-size: 16px;

    font-weight: bold;

    box-shadow:
        0 0 15px #00ffff,
        0 0 40px rgba(0,255,255,.5);

    cursor: pointer;
}

#switchCamera {

    position: fixed;

    top: 45px;
    right: 18px;

    width: 52px;
    height: 52px;

    z-index: 20;

    border-radius: 50%;

    border: 1px solid #00ffff;

    background: rgba(0,15,25,.8);

    color: #00ffff;

    font-size: 23px;

    box-shadow:
        0 0 15px #00ffff;

    cursor: pointer;
}

#debug {

    position: fixed;

    left: 10px;
    bottom: 10px;

    z-index: 20;

    max-width: 90%;

    color: #00ffff;

    font-size: 9px;

    background: rgba(0,0,0,.55);

    padding: 6px 8px;

    border-left: 2px solid #00ffff;
}

</style>

</head>

<body>

<video
 id="video"
 autoplay
 muted
 playsinline> </video>

<canvas id="canvas"></canvas>

<div id="interface">

```
<div id="title">
    KORVIL — CAPACETE HOLOGRÁFICO
</div>

<div id="status">
    SISTEMA DESLIGADO
</div>
```

</div>

<button id="switchCamera">
    ↻
</button>

<button id="start">
    INICIAR CÂMERA
</button>

<div id="debug">
    Aguardando inicialização...
</div>

<!-- ======================================================
     MEDIAPIPE TASKS VISION
====================================================== -->

<script type="module">

import {
    FaceLandmarker,
    FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";


/* ======================================================
   ELEMENTOS
====================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const start =
    document.getElementById("start");

const switchCamera =
    document.getElementById("switchCamera");

const status =
    document.getElementById("status");

const debug =
    document.getElementById("debug");


/* ======================================================
   ESTADO
====================================================== */

let stream = null;

let running = false;

let frontCamera = true;

let faceLandmarker = null;

let face = null;

let centeredTime = null;

let helmetActive = false;

let lastVideoTime = -1;

let detectorReady = false;


/* ======================================================
   DEBUG
====================================================== */

function message(text) {

    debug.textContent = text;

    console.log(text);

}


/* ======================================================
   CANVAS
====================================================== */

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* ======================================================
   1 — ABRIR CÂMERA
====================================================== */

async function openCamera() {

    message(
        "Solicitando permissão da câmera..."
    );

    status.textContent =
        "ABRINDO CÂMERA...";


    try {

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        /*
         * CÂMERA FRONTAL
         */

        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            frontCamera
                            ? "user"
                            : "environment",

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        running = true;

        lastVideoTime = -1;

        centeredTime = null;

        helmetActive = false;


        /*
         * Não espelhar o vídeo.
         */

        video.style.transform =
            "none";


        start.style.display =
            "none";


        status.textContent =
            "CÂMERA ATIVA — PROCURANDO ROSTO";

        message(
            "Câmera funcionando."
        );


        /*
         * Agora carregamos
         * o detector facial.
         */

        await loadFaceDetector();


        requestAnimationFrame(
            loop
        );

    }

    catch (error) {

        console.error(error);

        running = false;

        start.style.display =
            "block";


        status.textContent =
            "ERRO NA CÂMERA";

        message(
            "ERRO: " +
            error.message
        );

    }

}


/* ======================================================
   2 — CARREGAR FACE LANDMARKER
====================================================== */

async function loadFaceDetector() {

    if (detectorReady)
        return;


    status.textContent =
        "CARREGANDO DETECTOR FACIAL...";

    message(
        "Baixando modelo facial..."
    );


    try {

        const vision =
            await FilesetResolver.forVisionTasks(

                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

            );


        message(
            "Motor MediaPipe carregado."
        );


        faceLandmarker =
            await FaceLandmarker.createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                        delegate:
                            "GPU"

                    },

                    runningMode:
                        "VIDEO",

                    numFaces:
                        1,

                    minFaceDetectionConfidence:
                        .5,

                    minFacePresenceConfidence:
                        .5,

                    minTrackingConfidence:
                        .5

                }

            );


        detectorReady = true;


        status.textContent =
            "DETECTOR PRONTO — PROCURANDO ROSTO";

        message(
            "Detector facial pronto."
        );

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "ERRO NO DETECTOR";

        message(
            "ERRO MODELO: " +
            error.message
        );

        throw error;

    }

}


/* ======================================================
   3 — LOOP
====================================================== */

function loop() {

    if (!running)
        return;


    if (
        detectorReady &&
        faceLandmarker &&
        video.readyState >= 2 &&
        video.currentTime !== lastVideoTime
    ) {

        lastVideoTime =
            video.currentTime;


        try {

            const result =
                faceLandmarker.detectForVideo(

                    video,

                    performance.now()

                );


            if (
                result.faceLandmarks &&
                result.faceLandmarks.length > 0
            ) {

                face =
                    result.faceLandmarks[0];

                processFace();

            }

            else {

                face = null;

                centeredTime = null;

                helmetActive = false;

                status.textContent =
                    "PROCURANDO ROSTO...";

            }

        }

        catch (error) {

            console.error(error);

            message(
                "Erro na detecção: " +
                error.message
            );

        }

    }


    render();


    requestAnimationFrame(
        loop
    );

}


/* ======================================================
   COORDENADA
====================================================== */

function p(landmark) {

    let x =
        landmark.x *
        canvas.width;

    const y =
        landmark.y *
        canvas.height;


    /*
     * Espelha somente
     * o holograma frontal.
     */

    if (frontCamera) {

        x =
            canvas.width - x;

    }


    return {
        x,
        y
    };

}


/* ======================================================
   PROCESSAR ROSTO
====================================================== */

function processFace() {

    const left =
        p(face[234]);

    const right =
        p(face[454]);

    const top =
        p(face[10]);

    const bottom =
        p(face[152]);


    const cx =
        (left.x + right.x) / 2;

    const cy =
        (top.y + bottom.y) / 2;


    const width =
        Math.abs(
            right.x - left.x
        );

    const height =
        Math.abs(
            bottom.y - top.y
        );


    /*
     * CENTRO DA TELA
     */

    const targetX =
        canvas.width / 2;

    const targetY =
        canvas.height / 2;


    /*
     * TOLERÂNCIA
     */

    const toleranceX =
        Math.max(
            70,
            width * .40
        );

    const toleranceY =
        Math.max(
            90,
            height * .35
        );


    const isCentered =
        Math.abs(
            cx - targetX
        ) < toleranceX
        &&
        Math.abs(
            cy - targetY
        ) < toleranceY;


    if (isCentered) {

        if (!centeredTime) {

            centeredTime =
                performance.now();

        }


        const elapsed =
            performance.now() -
            centeredTime;


        const seconds =
            Math.min(
                3,
                elapsed / 1000
            );


        if (elapsed < 3000) {

            status.textContent =
                "CENTRALIZE — ATIVANDO " +
                seconds.toFixed(1) +
                "s";

        }


        if (
            elapsed >= 3000 &&
            !helmetActive
        ) {

            helmetActive =
                true;

            status.textContent =
                "✓ CAPACETE ATIVADO";

            message(
                "Holograma ativado."
            );

        }

    }

    else {

        centeredTime =
            null;

        helmetActive =
            false;

        status.textContent =
            "CENTRALIZE O ROSTO";

    }

}


/* ======================================================
   RENDER
====================================================== */

function render() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (!face)
        return;


    if (!helmetActive) {

        drawTarget();

    }


    if (helmetActive) {

        drawHelmet();

    }

}


/* ======================================================
   ALVO
====================================================== */

function drawTarget() {

    const left =
        p(face[234]);

    const right =
        p(face[454]);

    const top =
        p(face[10]);

    const bottom =
        p(face[152]);


    const cx =
        (left.x + right.x) / 2;

    const cy =
        (top.y + bottom.y) / 2;


    const w =
        Math.abs(
            right.x - left.x
        );

    const h =
        Math.abs(
            bottom.y - top.y
        );


    ctx.save();


    /*
     * OVAL
     */

    ctx.beginPath();

    ctx.ellipse(

        cx,
        cy,

        w * .65,
        h * .65,

        0,
        0,
        Math.PI * 2

    );


    ctx.strokeStyle =
        "#00ffff";

    ctx.lineWidth =
        2;

    ctx.setLineDash([
        12,
        8
    ]);

    ctx.shadowColor =
        "#00ffff";

    ctx.shadowBlur =
        18;

    ctx.stroke();


    /*
     * CENTRO
     */

    ctx.setLineDash([]);

    ctx.beginPath();

    ctx.arc(
        canvas.width / 2,
        canvas.height / 2,
        5,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#00ffff";

    ctx.shadowBlur =
        20;

    ctx.fill();


    ctx.restore();

}


/* ======================================================
   CAPACETE
====================================================== */

function drawHelmet() {

    const leftEar =
        p(face[234]);

    const rightEar =
        p(face[454]);

    const leftEye =
        p(face[468]);

    const rightEye =
        p(face[473]);

    const nose =
        p(face[1]);

    const mouth =
        p(face[13]);

    const forehead =
        p(face[10]);

    const chin =
        p(face[152]);


    const cx =
        (leftEar.x +
         rightEar.x) / 2;

    const cy =
        (forehead.y +
         chin.y) / 2;


    const radius =
        Math.abs(
            rightEar.x -
            leftEar.x
        ) * .65;


    /*
     * ANÉIS
     */

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        ctx.save();

        ctx.beginPath();

        ctx.ellipse(

            cx,
            cy - 10,

            radius + i * 10,

            radius * 1.25 + i * 10,

            0,
            0,
            Math.PI * 2

        );

        ctx.strokeStyle =
            `rgba(0,255,255,${.65 - i * .12})`;

        ctx.lineWidth =
            1.5;

        ctx.shadowColor =
            "#00ffff";

        ctx.shadowBlur =
            20;

        ctx.stroke();

        ctx.restore();

    }


    /*
     * CONEXÕES
     */

    line(leftEar, leftEye);

    line(leftEye, rightEye);

    line(rightEye, rightEar);

    line(leftEye, nose);

    line(rightEye, nose);

    line(nose, mouth);

    line(forehead, nose);


    /*
     * PONTOS
     */

    point(leftEye, 10);

    point(rightEye, 10);

    point(leftEar, 12);

    point(rightEar, 12);

    point(nose, 14);

    point(mouth, 11);

    point(forehead, 14);


    /*
     * NÚCLEO
     */

    point(
        {
            x: cx,
            y: cy - radius * .35
        },
        22
    );


    /*
     * LINHA CENTRAL
     */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        cx,
        cy - radius * 1.3
    );

    ctx.lineTo(
        cx,
        cy + radius * 1.15
    );

    ctx.strokeStyle =
        "rgba(0,255,255,.3)";

    ctx.lineWidth =
        1;

    ctx.stroke();

    ctx.restore();


    /*
     * IDENTIFICAÇÃO
     */

    ctx.save();

    ctx.font =
        "10px Courier New";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "#00ffff";

    ctx.shadowColor =
        "#00ffff";

    ctx.shadowBlur =
        12;

    ctx.fillText(
        "KORVIL HELMET ACTIVE",
        cx,
        cy - radius * 1.45
    );

    ctx.restore();

}


/* ======================================================
   PONTO HOLOGRÁFICO
====================================================== */

function point(pos, size) {

    ctx.save();

    ctx.translate(
        pos.x,
        pos.y
    );


    /*
     * OCTAEDRO
     */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -size
    );

    ctx.lineTo(
        size,
        0
    );

    ctx.lineTo(
        0,
        size
    );

    ctx.lineTo(
        -size,
        0
    );

    ctx.closePath();


    ctx.strokeStyle =
        "#00ffff";

    ctx.lineWidth =
        2;

    ctx.shadowColor =
        "#00ffff";

    ctx.shadowBlur =
        18;

    ctx.stroke();


    /*
     * INTERNO
     */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -size * .45
    );

    ctx.lineTo(
        size * .45,
        0
    );

    ctx.lineTo(
        0,
        size * .45
    );

    ctx.lineTo(
        -size * .45,
        0
    );

    ctx.closePath();

    ctx.strokeStyle =
        "rgba(0,255,255,.7)";

    ctx.lineWidth =
        1;

    ctx.stroke();


    /*
     * CENTRO
     */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        3,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#fff";

    ctx.fill();


    /*
     * PULSO
     */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        size * 1.8,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "rgba(0,255,255,.25)";

    ctx.lineWidth =
        1;

    ctx.stroke();


    ctx.restore();

}


/* ======================================================
   LINHA
====================================================== */

function line(a, b) {

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        a.x,
        a.y
    );

    ctx.lineTo(
        b.x,
        b.y
    );

    ctx.strokeStyle =
        "rgba(0,255,255,.4)";

    ctx.lineWidth =
        1.4;

    ctx.shadowColor =
        "#00ffff";

    ctx.shadowBlur =
        8;

    ctx.stroke();

    ctx.restore();

}


/* ======================================================
   TROCAR CÂMERA
====================================================== */

switchCamera.onclick =
async function() {

    frontCamera =
        !frontCamera;


    if (stream) {

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    stream = null;

    running = false;

    face = null;

    centeredTime = null;

    helmetActive = false;


    await openCamera();

};


/* ======================================================
   BOTÃO INICIAR
====================================================== */

start.onclick =
    openCamera;


/* ======================================================
   TESTE DE SUPORTE
====================================================== */

if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
) {

    status.textContent =
        "CÂMERA NÃO SUPORTADA";

    message(
        "Use Chrome/Edge/Safari com HTTPS."
    );

}

</script>

</body>
</html>
