\<!DOCTYPE html>
\<html lang="pt-br">
\<head>
\<meta charset="UTF-8">
\<meta name="viewport" content="width=device-width, initial-scale=1.0">
\<title>holograma cgm\</title>
\<style>
  body { margin:0; background:#000; overflow\:hidden; color:#fff; font-family:'Courier New', monospace; }
  \#video { position\:absolute; top:0; left:0; width:100vw; height:100vh; object-fit\:cover; z-index:1; filter\:brightness(0.4); transform\:scaleX(-1); }
  \#canvas { position\:absolute; top:0; left:0; width:100vw; height:100vh; z-index:2; pointer-events\:none; }
  \#ui { position\:absolute; z-index:3; top:10px; width:100%; text-align\:center; font-size:12px; color:#0ff; }
  \#start\_btn { position\:absolute; z-index:4; bottom:50px; left:50%; transform\:translateX(-50%); padding:15px 40px; background:#0ff; color:#000; border\:none; border-radius:20px; font-size:18px; }
\</style>
\<script src="[https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js](https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js)">\</script>
\<script src="[https://cdn.jsdelivr.net/npm/@mediapipe/camera\_utils/camera\_utils.js](https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js)">\</script>
\<script src="[https://cdn.jsdelivr.net/npm/@mediapipe/drawing\_utils/drawing\_utils.js](https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js)">\</script>
\</head>
\<body>
  \<div id="ui">sci-fi hologram by cgm\</div>
  \<video id="video" autoplay playsinline muted>\</video>
  \<canvas id="canvas">\</canvas>
  \<button id="start\_btn">iniciar camera\</button>

\<script>
const videoElement = document.getElementById('video');
const canvasElement = document.getElementById('canvas');
const canvasCtx = canvasElement.getContext('2d');
const startBtn = document.getElementById('start\_btn');

let hand1 = null;
let hand2 = null;
let appScreen = null;
let loadingPercent = 0;
let cameraRunning = false;

const buttons = [
  {id: 'grid', icon: '■', y\_offset: -50, active: false},
  {id: 'settings', icon: '⚙', y\_offset: 0, active: false},
  {id: 'power', icon: '⚡', y\_offset: 50, active: false},
];

function resize() {
  canvasElement.width = window\.innerWidth;
  canvasElement.height = window\.innerHeight;
}
resize();
window\.onresize = resize;

// 1. MEDIAPIPE HANDS
const hands = new Hands({locateFile: (file) => \`[https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file](https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file)}\`});
hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });

hands.onResults((results) => {
  canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
  canvasCtx.shadowColor = '#00ffff';
  canvasCtx.shadowBlur = 25;

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    // CORRECAO: INVERTER X PQ O VIDEO TA ESPELHADO
    hand1 = results.multiHandLandmarks[0].map(lm => ({x: 1 - lm.x, y: lm.y, z: lm.z}));
    hand2 = results.multiHandLandmarks[1]? results.multiHandLandmarks[1].map(lm => ({x: 1 - lm.x, y: lm.y, z: lm.z})) : null;

    drawHandSkeleton(hand1, '#00ffff');
    if(hand1) drawHologramBase(hand1);
    if(appScreen && hand1) drawAppScreen(hand1);

    if(hand2) {
      drawHandSkeleton(hand2, '#ff00ff');
      checkButtonClick(hand2[8], hand1);
    }
  }
});

function drawHandSkeleton(landmarks, color) {
  window\.drawConnectors(canvasCtx, landmarks, HAND\_CONNECTIONS, {color: color, lineWidth: 2});
  window\.drawLandmarks(canvasCtx, landmarks, {color: color, radius: 4});
}

// 2. HOLOGRAMA NA PALMA
function drawHologramBase(landmarks) {
  const cx = landmarks[9].x \* canvasElement.width;
  const cy = landmarks[9].y \* canvasElement.height;

  for(let i=0; i<3; i++) {
    canvasCtx.beginPath();
    canvasCtx.arc(cx, cy, 60 + i\*30, 0, 2 \* Math.PI);
    canvasCtx.strokeStyle = \`rgba(0,255,255,${0.9 - i\*0.3})\`;
    canvasCtx.lineWidth = 2;
    canvasCtx.stroke();
  }

  // botoes do lado do polegar
  const bx\_base = landmarks[4].x \* canvasElement.width + 80;
  const by\_base = landmarks[4].y \* canvasElement.height;

  buttons.forEach(b => {
    b.x = bx\_base;
    b.y = by\_base + b.y\_offset;
    drawHexagon(b.x, b.y, 25, b.active);
    canvasCtx.fillStyle = '#fff';
    canvasCtx.font = '18px sans-serif';
    canvasCtx.textAlign = 'center';
    canvasCtx.fillText(b.icon, b.x, b.y + 6);
  });
}

function drawHexagon(x, y, radius, active) {
  canvasCtx.beginPath();
  for(let i=0; i<6; i++){
    const angle = Math.PI / 3 \* i - Math.PI/6;
    const px = x + radius \* Math.cos(angle);
    const py = y + radius \* Math.sin(angle);
    if(i===0) canvasCtx.moveTo(px, py); else canvasCtx.lineTo(px, py);
  }
  canvasCtx.closePath();
  canvasCtx.fillStyle = active? 'rgba(0,255,255,0.9)' : 'rgba(0,255,255,0.2)';
  canvasCtx.fill();
  canvasCtx.strokeStyle = '#00ffff';
  canvasCtx.stroke();
}

// 3. TELA DE APP
function drawAppScreen(landmarks) {
  const x = landmarks[9].x \* canvasElement.width - 180;
  const y = landmarks[9].y \* canvasElement.height - 120;
  const w = 360; const h = 240;

  canvasCtx.fillStyle = 'rgba(0, 20, 40, 0.7)';
  canvasCtx.fillRect(x, y, w, h);
  canvasCtx.strokeStyle = '#00ffff';
  canvasCtx.lineWidth = 2;
  canvasCtx.strokeRect(x, y, w, h);

  if(appScreen === 'loading') {
    canvasCtx.fillStyle = '#00ffff';
    canvasCtx.font = '28px Courier New';
    canvasCtx.textAlign = 'center';
    canvasCtx.fillText(\`${loadingPercent}%\`, x + w/2, y + h/2);
    canvasCtx.fillStyle = 'rgba(0,255,255,0.3)';
    canvasCtx.fillRect(x + 40, y + h - 30, w - 80, 8);
    canvasCtx.fillStyle = '#00ffff';
    canvasCtx.fillRect(x + 40, y + h - 30, (w - 80) \* (loadingPercent/100), 8);
  }

  if(appScreen === 'mapa') {
    canvasCtx.fillStyle = 'rgba(0, 100, 50, 0.8)';
    canvasCtx.fillRect(x + 10, y + 10, w - 20, h - 20);
    canvasCtx.strokeStyle = '#00ff88';
    for(let i=0; i<4; i++){
      canvasCtx.beginPath();
      canvasCtx.moveTo(x + 10, y + 10 + i\*50);
      canvasCtx.lineTo(x + w - 10, y + 10 + i\*50);
      canvasCtx.stroke();
    }
    canvasCtx.fillStyle = '#ff0000';
    canvasCtx.beginPath();
    canvasCtx.arc(x + 80, y + 60, 5, 0, 2 \* Math.PI); canvasCtx.fill();
    canvasCtx.fillStyle = '#fff';
    canvasCtx.font = '12px Courier New';
    canvasCtx.fillText("3 km - 30 min", x + 180, y + 220);
  }
}

function updateLoading() {
  if(appScreen === 'loading' && loadingPercent < 100) {
    loadingPercent += 3;
  } else if(loadingPercent >= 100) {
    appScreen = 'mapa';
  }
  requestAnimationFrame(updateLoading);
}
updateLoading();

// 4. CLIQUE
function checkButtonClick(landmark, base\_hand) {
  if(!base\_hand) return;
  const x = landmark.x \* canvasElement.width;
  const y = landmark.y \* canvasElement.height;

  buttons.forEach(b => {
    const dist = Math.sqrt(Math.pow(x - b.x, 2) + Math.pow(y - b.y, 2));
    if(dist < 30 &&!b.active) {
      b.active = true;
      setTimeout(() => b.active = false, 300);

      if(b.id === 'grid') {
        appScreen = 'loading';
        loadingPercent = 0;
      }
      if(b.id === 'power') {
        appScreen = null;
      }
    }
  })
}

// 5. LIGAR CAMERA AO CLICAR
startBtn.onclick = async () => {
  if(cameraRunning) return;
  cameraRunning = true;
  startBtn.style.display = 'none';

  const camera = new Camera(videoElement, {
    onFrame: async () => { await hands.send({image: videoElement}); },
    width: 1280, height: 720
  });
  camera.start();
}

\</script>
\</body>
\</html>
