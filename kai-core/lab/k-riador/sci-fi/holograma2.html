<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>CGM — Holograma 3D 4D</title>

<!-- =====================================================
     MEDIAPIPE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<!-- =====================================================
     THREE.JS / WEBGL
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    font-family:
        "Courier New",
        monospace;

}

/* =====================================================
   CÂMERA
===================================================== */

#video{

    position:fixed;

    top:0;
    left:0;

    width:100vw;
    height:100vh;

    object-fit:cover;

    z-index:1;

    transform:scaleX(-1);

    filter:
        brightness(.32)
        contrast(1.18)
        saturate(.65);

}

/* =====================================================
   WEBGL 3D
===================================================== */

#webgl{

    position:fixed;

    top:0;
    left:0;

    width:100vw;
    height:100vh;

    z-index:2;

    pointer-events:none;

}

/* =====================================================
   CANVAS 2D
===================================================== */

#canvas{

    position:fixed;

    top:0;
    left:0;

    width:100vw;
    height:100vh;

    z-index:5;

    pointer-events:none;

}

/* =====================================================
   SCANLINES
===================================================== */

#scanlines{

    position:fixed;

    inset:0;

    z-index:7;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0,255,255,.025) 0px,
            rgba(0,255,255,.025) 1px,
            transparent 2px,
            transparent 5px
        );

    mix-blend-mode:screen;

}

/* =====================================================
   VIGNETTE
===================================================== */

#vignette{

    position:fixed;

    inset:0;

    z-index:8;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 40%,
            rgba(0,0,0,.3) 70%,
            rgba(0,0,0,.9) 100%
        );

}

/* =====================================================
   HUD
===================================================== */

#ui{

    position:fixed;

    top:14px;
    left:50%;

    transform:translateX(-50%);

    width:100%;

    z-index:20;

    text-align:center;

    color:#00ffff;

    font-size:12px;

    letter-spacing:4px;

    text-shadow:
        0 0 5px #00ffff,
        0 0 15px #00ffff,
        0 0 35px #00ffff;

}

/* =====================================================
   STATUS
===================================================== */

#status{

    margin-top:7px;

    font-size:9px;

    letter-spacing:2px;

    opacity:.8;

}

/* =====================================================
   STATUS DA MÃO
===================================================== */

#handStatus{

    position:fixed;

    left:15px;
    bottom:15px;

    z-index:20;

    font-size:9px;

    color:#00ffff;

    opacity:.75;

    text-shadow:
        0 0 8px #00ffff;

}

/* =====================================================
   RESOLUÇÃO
===================================================== */

#resolution{

    position:fixed;

    right:15px;
    bottom:15px;

    z-index:20;

    font-size:9px;

    color:#00ffff;

    opacity:.75;

    text-shadow:
        0 0 8px #00ffff;

}

/* =====================================================
   FPS
===================================================== */

#fps{

    position:fixed;

    right:15px;
    top:15px;

    z-index:20;

    font-size:9px;

    color:#00ffff;

    opacity:.7;

}

/* =====================================================
   BOTÃO
===================================================== */

#start_btn{

    position:fixed;

    z-index:30;

    bottom:50px;

    left:50%;

    transform:translateX(-50%);

    padding:
        15px 40px;

    background:
        rgba(0,255,255,.15);

    color:#fff;

    border:
        1px solid #00ffff;

    border-radius:25px;

    font-family:
        "Courier New",
        monospace;

    font-size:16px;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:

        0 0 10px #00ffff,

        0 0 30px rgba(0,255,255,.5),

        inset 0 0 15px
        rgba(0,255,255,.2);

    text-shadow:
        0 0 10px #00ffff;

    transition:.2s;

}

#start_btn:hover{

    transform:
        translateX(-50%)
        scale(1.06);

    box-shadow:

        0 0 20px #00ffff,

        0 0 60px
        rgba(0,255,255,.8);

}

</style>
</head>

<body>

<!-- =====================================================
     CÂMERA
===================================================== -->

<video
    id="video"
    autoplay
    playsinline
    muted>
</video>

<!-- =====================================================
     WEBGL
===================================================== -->

<canvas id="webgl"></canvas>

<!-- =====================================================
     HOLOGRAMA 2D
===================================================== -->

<canvas id="canvas"></canvas>

<div id="scanlines"></div>

<div id="vignette"></div>

<!-- =====================================================
     HUD
===================================================== -->

<div id="ui">

    SCI-FI HOLOGRAM BY CGM

    <div id="status">
        3D / 4D HOLOGRAPHIC CORE — STANDBY
    </div>

</div>

<div id="handStatus">
    HAND TRACKING: OFFLINE
</div>

<div id="resolution">
    RENDER: AUTO
</div>

<div id="fps">
    FPS: --
</div>

<button id="start_btn">
    INICIAR CÂMERA
</button>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const videoElement =
    document.getElementById("video");

const canvasElement =
    document.getElementById("canvas");

const canvasCtx =
    canvasElement.getContext(
        "2d",
        {
            alpha:true,
            desynchronized:true
        }
    );

const webglCanvas =
    document.getElementById("webgl");

const startBtn =
    document.getElementById("start_btn");

const statusElement =
    document.getElementById("status");

const handStatus =
    document.getElementById("handStatus");

const resolutionElement =
    document.getElementById("resolution");

const fpsElement =
    document.getElementById("fps");


/* =====================================================
   ESTADO
===================================================== */

let hand1 = null;

let hand2 = null;

let cameraRunning = false;

let cameraStream = null;

let appScreen = null;

let loadingPercent = 0;

let hologramVisible = true;

let time4D = 0;

let frameCounter = 0;

let lastFPSUpdate =
    performance.now();


/* =====================================================
   RESIZE 2D
===================================================== */

function resizeCanvas(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvasElement.width =
        Math.floor(
            window.innerWidth * dpr
        );

    canvasElement.height =
        Math.floor(
            window.innerHeight * dpr
        );

    canvasElement.style.width =
        window.innerWidth + "px";

    canvasElement.style.height =
        window.innerHeight + "px";

    canvasCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}

resizeCanvas();


/* =====================================================
   THREE.JS
===================================================== */

const renderer =
    new THREE.WebGLRenderer({

        canvas:webglCanvas,

        alpha:true,

        antialias:true,

        powerPreference:
            "high-performance"

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;


/* =====================================================
   CENA
===================================================== */

const scene =
    new THREE.Scene();


/* =====================================================
   CÂMERA 3D
===================================================== */

const camera3D =
    new THREE.PerspectiveCamera(

        55,

        window.innerWidth /
        window.innerHeight,

        .1,

        1000

    );

camera3D.position.z = 8;


/* =====================================================
   GRUPO HOLOGRÁFICO
===================================================== */

const holoGroup =
    new THREE.Group();

scene.add(
    holoGroup
);


/* =====================================================
   NÚCLEO 3D
===================================================== */

const coreGeometry =
    new THREE.IcosahedronGeometry(
        1.25,
        3
    );

const coreMaterial =
    new THREE.MeshBasicMaterial({

        color:0x00ffff,

        wireframe:true,

        transparent:true,

        opacity:.5

    });

const core =
    new THREE.Mesh(
        coreGeometry,
        coreMaterial
    );

holoGroup.add(core);


/* =====================================================
   NÚCLEO INTERNO
===================================================== */

const innerGeometry =
    new THREE.IcosahedronGeometry(
        .7,
        2
    );

const innerMaterial =
    new THREE.MeshBasicMaterial({

        color:0x66ffff,

        wireframe:true,

        transparent:true,

        opacity:.8

    });

const innerCore =
    new THREE.Mesh(
        innerGeometry,
        innerMaterial
    );

holoGroup.add(
    innerCore
);


/* =====================================================
   ANÉIS
===================================================== */

const rings = [];


for(let i=0;i<7;i++){

    const geometry =
        new THREE.TorusGeometry(

            1.5 +
            i*.25,

            .014 +
            i*.003,

            8,

            128

        );

    const material =
        new THREE.MeshBasicMaterial({

            color:
                i % 2 === 0
                ? 0x00ffff
                : 0xff00ff,

            transparent:true,

            opacity:
                .18 +
                i*.045

        });

    const ring =
        new THREE.Mesh(
            geometry,
            material
        );

    ring.rotation.x =
        Math.random()*Math.PI;

    ring.rotation.y =
        Math.random()*Math.PI;

    ring.rotation.z =
        Math.random()*Math.PI;

    holoGroup.add(
        ring
    );

    rings.push(
        ring
    );
}


/* =====================================================
   PARTICULAS
===================================================== */

const particleCount =
    3500;

const particlePositions =
    new Float32Array(
        particleCount * 3
    );

const particleInfo = [];


for(
    let i=0;
    i<particleCount;
    i++
){

    const radius =
        1.2 +
        Math.random()*4.5;

    const theta =
        Math.random() *
        Math.PI*2;

    const phi =
        Math.acos(
            2*Math.random()-1
        );

    particlePositions[
        i*3
    ] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    particlePositions[
        i*3+1
    ] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    particlePositions[
        i*3+2
    ] =
        radius *
        Math.cos(phi);

    particleInfo.push({

        x:
            particlePositions[i*3],

        y:
            particlePositions[i*3+1],

        z:
            particlePositions[i*3+2],

        phase:
            Math.random()*Math.PI*2,

        speed:
            .2 +
            Math.random()*.8

    });

}


const particleGeometry =
    new THREE.BufferGeometry();

particleGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(
        particlePositions,
        3
    )

);


const particleMaterial =
    new THREE.PointsMaterial({

        color:0x00ffff,

        size:.035,

        transparent:true,

        opacity:.7,

        blending:
            THREE.AdditiveBlending,

        depthWrite:false

    });


const particles =
    new THREE.Points(

        particleGeometry,

        particleMaterial

    );


scene.add(
    particles
);


/* =====================================================
   GRADE ESFÉRICA
===================================================== */

const sphereGeometry =
    new THREE.SphereGeometry(
        4.8,
        32,
        32
    );

const sphereMaterial =
    new THREE.MeshBasicMaterial({

        color:0x00ffff,

        wireframe:true,

        transparent:true,

        opacity:.025

    });

const sphereGrid =
    new THREE.Mesh(
        sphereGeometry,
        sphereMaterial
    );

scene.add(
    sphereGrid
);


/* =====================================================
   POSIÇÃO DO HOLOGRAMA
===================================================== */

let targetX = 0;

let targetY = 0;

let targetZ = 0;


/* =====================================================
   ANIMAÇÃO WEBGL 3D/4D
===================================================== */

function animate3D(){

    requestAnimationFrame(
        animate3D
    );

    time4D += .016;


    /* ================================================
       CORE
    ================================================ */

    core.rotation.x =
        time4D*.25;

    core.rotation.y =
        time4D*.42;

    innerCore.rotation.x =
        -time4D*.5;

    innerCore.rotation.y =
        time4D*.7;


    /* ================================================
       PULSO 4D
    ================================================ */

    const pulse =
        1 +
        Math.sin(
            time4D*2
        )*.06;

    core.scale.set(
        pulse,
        pulse,
        pulse
    );


    /* ================================================
       ANÉIS
    ================================================ */

    rings.forEach(
        (ring,index)=>{

            ring.rotation.x +=
                .002 +
                index*.0003;

            ring.rotation.y +=
                .003 +
                index*.0004;

            ring.rotation.z +=
                .001;

            const p =
                1 +
                Math.sin(
                    time4D*1.8 +
                    index
                )*.1;

            ring.scale.set(
                p,
                p,
                p
            );

        }
    );


    /* ================================================
       MOVIMENTO TEMPORAL DAS PARTÍCULAS
    ================================================ */

    const positions =
        particleGeometry
        .attributes
        .position
        .array;


    for(
        let i=0;
        i<particleCount;
        i++
    ){

        const data =
            particleInfo[i];

        const phase =
            time4D *
            data.speed +
            data.phase;

        const wave =
            1 +
            Math.sin(
                phase
            )*.045;

        positions[i*3] =
            data.x *
            wave;

        positions[i*3+1] =
            data.y *
            wave;

        positions[i*3+2] =
            data.z *
            wave;

    }


    particleGeometry
        .attributes
        .position
        .needsUpdate = true;


    particles.rotation.y +=
        .0007;

    particles.rotation.x +=
        .0003;


    /* ================================================
       GRADE
    ================================================ */

    sphereGrid.rotation.y +=
        .0002;


    /* ================================================
       POSIÇÃO PELA MÃO
    ================================================ */

    holoGroup.position.x +=
        (
            targetX -
            holoGroup.position.x
        )*.08;

    holoGroup.position.y +=
        (
            targetY -
            holoGroup.position.y
        )*.08;

    holoGroup.position.z +=
        (
            targetZ -
            holoGroup.position.z
        )*.08;


    renderer.render(
        scene,
        camera3D
    );

}

animate3D();


/* =====================================================
   RESIZE WEBGL
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        resizeCanvas();

        camera3D.aspect =
            window.innerWidth /
            window.innerHeight;

        camera3D.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                2
            )
        );

        resolutionElement.textContent =
            `VIEW: ${
                window.innerWidth
            } × ${
                window.innerHeight
            }`;

    }
);


/* =====================================================
   MEDIAPIPE HANDS
===================================================== */

const hands =
    new Hands({

        locateFile:
            file =>
                `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

    });


hands.setOptions({

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:.65,

    minTrackingConfidence:.65

});


/* =====================================================
   RESULTADO DAS MÃOS
===================================================== */

hands.onResults(
    results => {

        canvasCtx.clearRect(
            0,
            0,
            window.innerWidth,
            window.innerHeight
        );


        hand1 = null;

        hand2 = null;


        if(
            results.multiHandLandmarks &&
            results.multiHandLandmarks.length
        ){

            hand1 =
                convertLandmarks(
                    results
                    .multiHandLandmarks[0]
                );


            if(
                results
                .multiHandLandmarks[1]
            ){

                hand2 =
                    convertLandmarks(
                        results
                        .multiHandLandmarks[1]
                    );

            }


            if(hand2){

                handStatus.textContent =
                    "HAND TRACKING: 2 MÃOS";

            }else{

                handStatus.textContent =
                    "HAND TRACKING: 1 MÃO";

            }


            /* =========================================
               MÃO PRINCIPAL
            ========================================= */

            drawHandSkeleton(
                hand1,
                "#00ffff"
            );

            drawHologramBase(
                hand1
            );


            /* =========================================
               SEGUNDA MÃO
            ========================================= */

            if(hand2){

                drawHandSkeleton(
                    hand2,
                    "#ff00ff"
                );

                checkButtonClick(
                    hand2[8],
                    hand1
                );

            }

        }else{

            handStatus.textContent =
                "HAND TRACKING: PROCURANDO...";

        }

    }
);


/* =====================================================
   CONVERTER LANDMARKS
===================================================== */

function convertLandmarks(
    landmarks
){

    return landmarks.map(
        lm => ({

            x:
                1-lm.x,

            y:
                lm.y,

            z:
                lm.z

        })
    );

}


/* =====================================================
   ESQUELETO DA MÃO
===================================================== */

function drawHandSkeleton(
    landmarks,
    color
){

    canvasCtx.save();

    canvasCtx.shadowColor =
        color;

    canvasCtx.shadowBlur =
        20;


    window.drawConnectors(

        canvasCtx,

        landmarks,

        HAND_CONNECTIONS,

        {

            color:color,

            lineWidth:3

        }

    );


    window.drawLandmarks(

        canvasCtx,

        landmarks,

        {

            color:color,

            radius:5

        }

    );


    canvasCtx.restore();

}


/* =====================================================
   BOTÕES
===================================================== */

const buttons = [

    {
        id:"grid",
        icon:"■",
        y_offset:-50,
        active:false,
        x:0,
        y:0
    },

    {
        id:"settings",
        icon:"⚙",
        y_offset:0,
        active:false,
        x:0,
        y:0
    },

    {
        id:"power",
        icon:"⚡",
        y_offset:50,
        active:false,
        x:0,
        y:0
    }

];


/* =====================================================
   HOLOGRAMA DA PALMA
   MANTÉM O PADRÃO DA LUVA
===================================================== */

function drawHologramBase(
    landmarks
){

    const cx =
        landmarks[9].x *
        window.innerWidth;

    const cy =
        landmarks[9].y *
        window.innerHeight;


    /* ================================================
       PROFUNDIDADE 3D
    ================================================ */

    targetX =
        (landmarks[9].x-.5)*6;

    targetY =
        -(landmarks[9].y-.5)*4;

    targetZ =
        THREE.MathUtils.clamp(
            -landmarks[9].z*10,
            -3,
            3
        );


    /* ================================================
       PALMA HOLOGRÁFICA
    ================================================ */

    canvasCtx.save();

    canvasCtx.translate(
        cx,
        cy
    );


    canvasCtx.shadowColor =
        "#00ffff";

    canvasCtx.shadowBlur =
        28;


    /* ================================================
       3 ANÉIS PRINCIPAIS
       PADRÃO ORIGINAL DA LUVA
    ================================================ */

    for(
        let i=0;
        i<3;
        i++
    ){

        const pulse =
            Math.sin(
                time4D*2 +
                i
            )*5;


        canvasCtx.beginPath();


        canvasCtx.arc(

            0,
            0,

            60 +
            i*30 +
            pulse,

            0,
            Math.PI*2

        );


        canvasCtx.strokeStyle =
            `rgba(
                0,
                255,
                255,
                ${.9-i*.3}
            )`;


        canvasCtx.lineWidth =
            i===0
            ? 3
            : 2;


        canvasCtx.stroke();

    }


    /* ================================================
       ANEL INTERNO
    ================================================ */

    canvasCtx.beginPath();

    canvasCtx.arc(
        0,
        0,
        22 +
        Math.sin(
            time4D*3
        )*3,
        0,
        Math.PI*2
    );

    canvasCtx.strokeStyle =
        "rgba(255,255,255,.8)";

    canvasCtx.lineWidth =
        1.5;

    canvasCtx.stroke();


    /* ================================================
       CRUZ CENTRAL
    ================================================ */

    canvasCtx.beginPath();

    canvasCtx.moveTo(
        -105,
        0
    );

    canvasCtx.lineTo(
        105,
        0
    );

    canvasCtx.moveTo(
        0,
        -105
    );

    canvasCtx.lineTo(
        0,
        105
    );

    canvasCtx.strokeStyle =
        "rgba(0,255,255,.25)";

    canvasCtx.lineWidth =
        1;

    canvasCtx.stroke();


    /* ================================================
       LINHAS RADIAIS
    ================================================ */

    for(
        let i=0;
        i<12;
        i++
    ){

        const angle =
            i *
            Math.PI /
            6;

        const x =
            Math.cos(angle);

        const y =
            Math.sin(angle);


        canvasCtx.beginPath();

        canvasCtx.moveTo(
            x*75,
            y*75
        );

        canvasCtx.lineTo(
            x*115,
            y*115
        );

        canvasCtx.strokeStyle =
            "rgba(0,255,255,.4)";

        canvasCtx.stroke();

    }


    canvasCtx.restore();


    /* ================================================
       BOTÕES AO LADO DO POLEGAR
       PADRÃO ORIGINAL
    ================================================ */

    const bx_base =
        landmarks[4].x *
        window.innerWidth +
        80;

    const by_base =
        landmarks[4].y *
        window.innerHeight;


    buttons.forEach(
        button => {

            button.x =
                bx_base;

            button.y =
                by_base +
                button.y_offset;


            drawHexagon(

                button.x,

                button.y,

                25,

                button.active

            );


            canvasCtx.save();


            canvasCtx.fillStyle =
                "#ffffff";


            canvasCtx.font =
                "18px sans-serif";


            canvasCtx.textAlign =
                "center";


            canvasCtx.textBaseline =
                "middle";


            canvasCtx.shadowColor =
                "#00ffff";


            canvasCtx.shadowBlur =
                15;


            canvasCtx.fillText(

                button.icon,

                button.x,

                button.y

            );


            canvasCtx.restore();

        }
    );


    /* ================================================
       PAINEL
    ================================================ */

    if(appScreen){

        drawAppScreen(
            landmarks
        );

    }

}


/* =====================================================
   HEXÁGONO
===================================================== */

function drawHexagon(
    x,
    y,
    radius,
    active
){

    canvasCtx.save();

    canvasCtx.beginPath();


    for(
        let i=0;
        i<6;
        i++
    ){

        const angle =
            Math.PI/3*i -
            Math.PI/6;

        const px =
            x +
            radius *
            Math.cos(angle);

        const py =
            y +
            radius *
            Math.sin(angle);


        if(i===0){

            canvasCtx.moveTo(
                px,
                py
            );

        }else{

            canvasCtx.lineTo(
                px,
                py
            );

        }

    }


    canvasCtx.closePath();


    canvasCtx.fillStyle =
        active
        ? "rgba(0,255,255,.9)"
        : "rgba(0,255,255,.2)";


    canvasCtx.strokeStyle =
        "#00ffff";


    canvasCtx.lineWidth =
        active ? 3 : 1.5;


    canvasCtx.shadowColor =
        "#00ffff";


    canvasCtx.shadowBlur =
        active ? 35 : 15;


    canvasCtx.fill();

    canvasCtx.stroke();


    canvasCtx.restore();

}


/* =====================================================
   TELA DO APP
===================================================== */

function drawAppScreen(
    landmarks
){

    const x =
        landmarks[9].x *
        window.innerWidth -
        180;

    const y =
        landmarks[9].y *
        window.innerHeight -
        120;


    const w =
        360;

    const h =
        240;


    canvasCtx.save();


    /* ================================================
       PAINEL
    ================================================ */

    canvasCtx.shadowColor =
        "#00ffff";

    canvasCtx.shadowBlur =
        25;


    canvasCtx.fillStyle =
        "rgba(0,20,40,.72)";


    canvasCtx.fillRect(
        x,
        y,
        w,
        h
    );


    canvasCtx.strokeStyle =
        "#00ffff";


    canvasCtx.lineWidth =
        2;


    canvasCtx.strokeRect(
        x,
        y,
        w,
        h
    );


    /* ================================================
       LINHAS DE HUD
    ================================================ */

    canvasCtx.strokeStyle =
        "rgba(0,255,255,.25)";


    for(
        let i=1;
        i<5;
        i++
    ){

        canvasCtx.beginPath();

        canvasCtx.moveTo(
            x,
            y+i*45
        );

        canvasCtx.lineTo(
            x+w,
            y+i*45
        );

        canvasCtx.stroke();

    }


    /* ================================================
       LOADING
    ================================================ */

    if(
        appScreen === "loading"
    ){

        canvasCtx.fillStyle =
            "#00ffff";


        canvasCtx.font =
            "28px Courier New";


        canvasCtx.textAlign =
            "center";


        canvasCtx.fillText(

            `${Math.floor(
                loadingPercent
            )}%`,

            x+w/2,

            y+h/2

        );


        canvasCtx.fillStyle =
            "rgba(0,255,255,.25)";


        canvasCtx.fillRect(

            x+40,

            y+h-30,

            w-80,

            8

        );


        canvasCtx.fillStyle =
            "#00ffff";


        canvasCtx.fillRect(

            x+40,

            y+h-30,

            (w-80) *
            (loadingPercent/100),

            8

        );

    }


    /* ================================================
       MAPA
    ================================================ */

    if(
        appScreen === "mapa"
    ){

        canvasCtx.fillStyle =
            "rgba(0,100,50,.8)";


        canvasCtx.fillRect(

            x+10,

            y+10,

            w-20,

            h-20

        );


        canvasCtx.strokeStyle =
            "#00ff88";


        for(
            let i=0;
            i<4;
            i++
        ){

            canvasCtx.beginPath();

            canvasCtx.moveTo(

                x+10,

                y+10+i*50

            );

            canvasCtx.lineTo(

                x+w-10,

                y+10+i*50

            );

            canvasCtx.stroke();

        }


        /* marcador */

        canvasCtx.fillStyle =
            "#ff0000";


        canvasCtx.shadowColor =
            "#ff0000";


        canvasCtx.shadowBlur =
            15;


        canvasCtx.beginPath();

        canvasCtx.arc(

            x+80,

            y+60,

            5,

            0,

            Math.PI*2

        );

        canvasCtx.fill();


        canvasCtx.shadowBlur = 0;


        canvasCtx.fillStyle =
            "#fff";


        canvasCtx.font =
            "12px Courier New";


        canvasCtx.textAlign =
            "center";


        canvasCtx.fillText(

            "3 km - 30 min",

            x+180,

            y+220

        );

    }


    canvasCtx.restore();

}


/* =====================================================
   LOADING
===================================================== */

function updateLoading(){

    if(
        appScreen === "loading" &&
        loadingPercent < 100
    ){

        loadingPercent +=
            1.5;

    }


    if(
        loadingPercent >= 100
    ){

        loadingPercent =
            100;

        appScreen =
            "mapa";

    }


    requestAnimationFrame(
        updateLoading
    );

}

updateLoading();


/* =====================================================
   CLIQUE COM A SEGUNDA MÃO
===================================================== */

function checkButtonClick(
    landmark,
    baseHand
){

    if(!baseHand)
        return;


    const x =
        landmark.x *
        window.innerWidth;

    const y =
        landmark.y *
        window.innerHeight;


    buttons.forEach(
        button => {

            const dx =
                x-button.x;

            const dy =
                y-button.y;


            const distance =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );


            if(
                distance < 32 &&
                !button.active
            ){

                button.active =
                    true;


                setTimeout(
                    ()=>{

                        button.active =
                            false;

                    },
                    350
                );


                /* =====================================
                   GRID
                ===================================== */

                if(
                    button.id === "grid"
                ){

                    appScreen =
                        "loading";

                    loadingPercent =
                        0;

                }


                /* =====================================
                   POWER
                ===================================== */

                if(
                    button.id === "power"
                ){

                    hologramVisible =
                        !hologramVisible;


                    holoGroup.visible =
                        hologramVisible;


                    particles.visible =
                        hologramVisible;

                }


                /* =====================================
                   SETTINGS
                ===================================== */

                if(
                    button.id === "settings"
                ){

                    statusElement.textContent =
                        "SETTINGS // 3D 4D MODE";

                }

            }

        }
    );

}


/* =====================================================
   CÂMERA — MÉTODO CORRIGIDO
===================================================== */

startBtn.addEventListener(
    "click",
    startCamera
);


async function startCamera(){

    if(cameraRunning)
        return;


    try{

        statusElement.textContent =
            "SOLICITANDO CÂMERA...";


        startBtn.textContent =
            "ABRINDO CÂMERA...";


        /* =============================================
           SUPORTE
        ============================================= */

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "getUserMedia não disponível"
            );

        }


        /* =============================================
           STREAM
        ============================================= */

        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video:{

                        facingMode:
                            "user",

                        width:{
                            ideal:1920
                        },

                        height:{
                            ideal:1080
                        },

                        frameRate:{
                            ideal:30,
                            max:60
                        }

                    },

                    audio:false

                });


        /* =============================================
           VÍDEO
        ============================================= */

        videoElement.srcObject =
            cameraStream;


        videoElement.muted =
            true;


        videoElement.playsInline =
            true;


        await videoElement.play();


        /* =============================================
           ONLINE
        ============================================= */

        cameraRunning =
            true;


        startBtn.style.display =
            "none";


        statusElement.textContent =
            "3D / 4D HOLOGRAPHIC CORE — ONLINE";


        /* =============================================
           LOOP MEDIAPIPE
        ============================================= */

        processCameraFrame();


    }catch(error){

        console.error(
            "ERRO CÂMERA:",
            error
        );


        cameraRunning =
            false;


        startBtn.style.display =
            "block";


        startBtn.textContent =
            "TENTAR NOVAMENTE";


        /* =============================================
           ERROS
        ============================================= */

        if(
            error.name ===
            "NotAllowedError"
        ){

            statusElement.textContent =
                "CÂMERA BLOQUEADA — PERMITA O ACESSO";

        }

        else if(
            error.name ===
            "NotFoundError"
        ){

            statusElement.textContent =
                "NENHUMA CÂMERA ENCONTRADA";

        }

        else if(
            error.name ===
            "NotReadableError"
        ){

            statusElement.textContent =
                "CÂMERA ESTÁ SENDO USADA";

        }

        else{

            statusElement.textContent =
                "ERRO AO INICIAR CÂMERA";

        }

    }

}


/* =====================================================
   PROCESSAMENTO DA CÂMERA
===================================================== */

async function processCameraFrame(){

    if(!cameraRunning)
        return;


    if(
        videoElement.readyState >=
        HTMLMediaElement.HAVE_CURRENT_DATA
    ){

        try{

            await hands.send({

                image:
                    videoElement

            });

        }catch(error){

            console.error(
                "MediaPipe:",
                error
            );

        }

    }


    requestAnimationFrame(
        processCameraFrame
    );

}


/* =====================================================
   FPS
===================================================== */

function updateFPS(){

    frameCounter++;


    const now =
        performance.now();


    if(
        now -
        lastFPSUpdate >=
        1000
    ){

        fpsElement.textContent =
            `FPS: ${frameCounter}`;


        frameCounter =
            0;


        lastFPSUpdate =
            now;

    }


    requestAnimationFrame(
        updateFPS
    );

}

updateFPS();


/* =====================================================
   LOOP EXTRA
===================================================== */

function visualLoop(){

    frameCounter++;

    requestAnimationFrame(
        visualLoop
    );

}

visualLoop();


/* =====================================================
   RESOLUÇÃO
===================================================== */

resolutionElement.textContent =
    `VIEW: ${
        window.innerWidth
    } × ${
        window.innerHeight
    }`;

</script>
