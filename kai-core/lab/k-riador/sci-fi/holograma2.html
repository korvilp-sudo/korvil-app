<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>holograma cgm</title>
<style>
  body { margin:0; background:#000; overflow:hidden; color:#fff; font-family:'Courier New', monospace; }
  #video { position:absolute; top:0; left:0; width:100vw; height:100vh; object-fit:cover; z-index:1; filter:brightness(0.4); }
  #canvas { position:absolute; top:0; left:0; width:100vw; height:100vh; z-index:2; pointer-events:none; }
  #ui { position:absolute; z-index:3; top:10px; width:100%; text-align:center; font-size:12px; color:#0ff; }
  #start_btn { position:absolute; z-index:4; bottom:50px; left:50%; transform:translateX(-50%); padding:15px 40px; background:#0ff; color:#000; border:none; border-radius:20px; font-size:18px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
</head>
<body>
  <div id="ui">sci-fi hologram by cgm</div>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <button id="start_btn">iniciar camera</button>

<script>
const videoElement = document.getElementById('video');
const canvasElement = document.getElementById('canvas');
const canvasCtx = canvasElement.getContext('2d');
const startBtn = document.getElementById('start_btn');

let hand1 = null;
let hand2 = null;
let appScreen = null;
let loadingPercent = 0;
let cameraRunning = false;
let isFrontCamera = true;
let swapTimer = null; // TIMER PRA TROCAR HOLOGRAMA
let hologramSide = 'left'; // left = hand1, right = hand2

const buttons = [
  {id: 'grid', icon: '■', y_offset: -50, active: false},
  {id: 'settings', icon: '⚙', y_offset: 0, active: false},
  {id: 'power', icon: '⚡', y_offset: 50, active: false},
];

function resize() {
  canvasElement.width = window.innerWidth;
  canvasElement.height = window.innerHeight;
}
resize();
window.onresize = resize;

// 1. MEDIAPIPE HANDS
const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });

hands.onResults((results) => {
  canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
  canvasCtx.shadowColor = '#00ffff';
  canvasCtx.shadowBlur = 25;

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    // CORRECAO: SÓ INVERTE SE FOR CAMERA FRONTAL
    if(isFrontCamera){
      hand1 = results.multiHandLandmarks[0].map(lm => ({x: 1 - lm.x, y: lm.y, z: lm.z}));
      hand2 = results.multiHandLandmarks[1]? results.multiHandLandmarks[1].map(lm => ({x: 1 - lm.x, y: lm.y, z: lm.z})) : null;
    } else {
      hand1 = results.multiHandLandmarks[0];
      hand2 = results.multiHandLandmarks[1] || null;
    }

    // DESENHA AS 2 MAOS
    if(hand1) drawHandSkeleton(hand1, '#00ffff');
    if(hand2) drawHandSkeleton(hand2, '#ff00ff');

    // VERIFICA TROCA DE HOLOGRAMA: MAOS JUNTAS 3s TIPO REZAR
    if(hand1 && hand2) {
      const distHands = Math.hypot(hand1[9].x - hand2[9].x, hand1[9].y - hand2[9].y);
      if(distHands < 0.15) { // maos perto
        if(!swapTimer) {
          swapTimer = setTimeout(() => {
            hologramSide = hologramSide === 'left'? 'right' : 'left';
            swapTimer = null;
          }, 3000);
        }
      } else {
        if(swapTimer) { clearTimeout(swapTimer); swapTimer = null; }
      }
    } else {
      if(swapTimer) { clearTimeout(swapTimer); swapTimer = null; }
    }

    // DEFINE QUAL MAO DESENHA O HOLOGRAMA BASEADO NO LADO
    const hologramHand = hologramSide === 'left'? hand1 : hand2;
    const clickHand = hologramSide === 'left'? hand2 : hand1;

    if(hologramHand) {
      drawHologramBase(hologramHand);
      if(appScreen) drawAppScreen(hologramHand);
    }

    // CLIQUE SÓ COM PINCA POLEGAR + INDICADOR
    if(clickHand) {
      checkButtonClick(clickHand, hologramHand);
    }
  }
});

function drawHandSkeleton(landmarks, color) {
  window.drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: color, lineWidth: 2});
  window.drawLandmarks(canvasCtx, landmarks, {color: color, radius: 4});
}

// 2. HOLOGRAMA NA PALMA
function drawHologramBase(landmarks) {
  const cx = landmarks[9].x * canvasElement.width;
  const cy = landmarks[9].y * canvasElement.height;

  for(let i=0; i<3; i++) {
    canvasCtx.beginPath();
    canvasCtx.arc(cx, cy, 60 + i*30, 0, 2 * Math.PI);
    canvasCtx.strokeStyle = `rgba(0,255,255,${0.9 - i*0.3})`;
    canvasCtx.lineWidth = 2;
    canvasCtx.stroke();
  }

  // botoes do lado do polegar
  const bx_base = landmarks[4].x * canvasElement.width + 80;
  const by_base = landmarks[4].y * canvasElement.height;

  buttons.forEach(b => {
    b.x = bx_base;
    b.y = by_base + b.y_offset;
    drawHexagon(b.x, b.y, 25, b.active);
    canvasCtx.fillStyle = '#fff';
    canvasCtx.font = '18px sans-serif';
    canvasCtx.textAlign = 'center';
    canvasCtx.fillText(b.icon, b.x, b.y + 6);
  });
}

function drawHexagon(x, y, radius, active) {
  canvasCtx.beginPath();
  for(let i=0; i<6; i++){
    const angle = Math.PI / 3 * i - Math.PI/6;
    const px = x + radius * Math.cos(angle);
    const py = y + radius * Math.sin(angle);
    if(i===0) canvasCtx.moveTo(px, py); else canvasCtx.lineTo(px, py);
  }
  canvasCtx.closePath();
  canvasCtx.fillStyle = active? 'rgba(0,255,255,0.9)' : 'rgba(0,255,255,0.2)';
  canvasCtx.fill();
  canvasCtx.strokeStyle = '#00ffff';
  canvasCtx.stroke();
}

// 3. TELA DE APP
function drawAppScreen(landmarks) {
  const x = landmarks[9].x * canvasElement.width - 180;
  const y = landmarks[9].y * canvasElement.height - 120;
  const w = 360; const h = 240;

  canvasCtx.fillStyle = 'rgba(0, 20, 40, 0.7)';
  canvasCtx.fillRect(x, y, w, h);
  canvasCtx.strokeStyle = '#00ffff';
  canvasCtx.lineWidth = 2;
  canvasCtx.strokeRect(x, y, w, h);

  if(appScreen === 'loading') {
    canvasCtx.fillStyle = '#00ffff';
    canvasCtx.font = '28px Courier New';
    canvasCtx.textAlign = 'center';
    canvasCtx.fillText(`${loadingPercent}%`, x + w/2, y + h/2);
    canvasCtx.fillStyle = 'rgba(0,255,255,0.3)';
    canvasCtx.fillRect(x + 40, y + h - 30, w - 80, 8);
    canvasCtx.fillStyle = '#00ffff';
    canvasCtx.fillRect(x + 40, y + h - 30, (w - 80) * (loadingPercent/100), 8);
  }

  if(appScreen === 'mapa') {
    canvasCtx.fillStyle = 'rgba(0, 100, 50, 0.8)';
    canvasCtx.fillRect(x + 10, y + 10, w - 20, h - 20);
    canvasCtx.strokeStyle = '#00ff88';
    for(let i=0; i<4; i++){
      canvasCtx.beginPath();
      canvasCtx.moveTo(x + 10, y + 10 + i*50);
      canvasCtx.lineTo(x + w - 10, y + 10 + i*50);
      canvasCtx.stroke();
    }
    canvasCtx.fillStyle = '#ff0000';
    canvasCtx.beginPath();
    canvasCtx.arc(x + 80, y + 60, 5, 0, 2 * Math.PI); canvasCtx.fill();
    canvasCtx.fillStyle = '#fff';
    canvasCtx.font = '12px Courier New';
    canvasCtx.fillText("3 km - 30 min", x + 180, y + 220);
  }
}

function updateLoading() {
  if(appScreen === 'loading' && loadingPercent < 100) {
    loadingPercent += 3;
  } else if(loadingPercent >= 100) {
    appScreen = 'mapa';
  }
  requestAnimationFrame(updateLoading);
}
updateLoading();

// 4. CLIQUE: SÓ COM PINCA POLEGAR + INDICADOR
function checkButtonClick(clickHand, base_hand) {
  if(!base_hand) return;
  const thumb = clickHand[4];
  const index = clickHand[8];
  const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);

  // SÓ CLICA SE ESTIVER EM PINCA
  if(pinchDist > 0.05) return;

  const x = index.x * canvasElement.width;
  const y = index.y * canvasElement.height;

  buttons.forEach(b => {
    const dist = Math.sqrt(Math.pow(x - b.x, 2) + Math.pow(y - b.y, 2));
    if(dist < 30 &&!b.active) {
      b.active = true;
      setTimeout(() => b.active = false, 300);

      if(b.id === 'grid') {
        appScreen = 'loading';
        loadingPercent = 0;
      }
      if(b.id === 'power') {
        appScreen = null;
      }
    }
  })
}

// 5. LIGAR CAMERA AO CLICAR - DETECTA FRENTE/TRASEIRA
startBtn.onclick = async () => {
  if(cameraRunning) return;
  cameraRunning = true;
  startBtn.style.display = 'none';

  let constraints = {video: {facingMode: 'user', width: 1280, height: 720}};
  const stream = await navigator.mediaDevices.getUserMedia(constraints);
  videoElement.srcObject = stream;

  isFrontCamera = constraints.video.facingMode === 'user';
  videoElement.style.transform = isFrontCamera? 'scaleX(-1)' : 'scaleX(1)';

  const camera = new Camera(videoElement, {
    onFrame: async () => { await hands.send({image: videoElement}); },
    width: 1280, height: 720
  });
  camera.start();
}

</script>
</body>
</html>
