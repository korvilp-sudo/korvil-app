<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>KORVIL — HOLOGRAM 3D/4D</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:"Courier New",monospace;
}

body{
    position:relative;
    color:#00ffff;
}

/* =========================================================
   CÂMERA
========================================================= */

#video{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    z-index:1;

    transform:scaleX(-1);

    filter:
        brightness(.28)
        contrast(1.25)
        saturate(.65);
}

/* =========================================================
   CAMADA WEBGL
========================================================= */

#webgl{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:2;
    pointer-events:none;
}

/* =========================================================
   CANVAS DAS MÃOS / HUD
========================================================= */

#canvas{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:5;
    pointer-events:none;
}

/* =========================================================
   SCANLINES
========================================================= */

#scanlines{
    position:fixed;
    inset:0;
    z-index:6;
    pointer-events:none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0,255,255,.025) 0px,
            rgba(0,255,255,.025) 1px,
            transparent 2px,
            transparent 5px
        );

    mix-blend-mode:screen;
}

/* =========================================================
   VINHETA
========================================================= */

#vignette{
    position:fixed;
    inset:0;
    z-index:7;
    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,.35) 75%,
            rgba(0,0,0,.9) 100%
        );
}

/* =========================================================
   HUD
========================================================= */

#ui{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;

    text-align:center;

    color:#00ffff;

    font-size:13px;
    letter-spacing:4px;

    text-shadow:
        0 0 5px #00ffff,
        0 0 15px #00ffff,
        0 0 35px #00ffff;
}

#status{
    margin-top:8px;
    font-size:10px;
    letter-spacing:2px;
    opacity:.8;
}

/* =========================================================
   BOTÃO
========================================================= */

#start_btn{
    position:fixed;
    left:50%;
    bottom:50px;
    transform:translateX(-50%);

    z-index:20;

    padding:16px 42px;

    border:1px solid #00ffff;
    border-radius:30px;

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.4),
            rgba(0,40,60,.6)
        );

    color:#fff;

    font-family:"Courier New",monospace;
    font-size:16px;
    letter-spacing:3px;

    cursor:pointer;

    box-shadow:
        0 0 10px #00ffff,
        0 0 30px rgba(0,255,255,.6),
        inset 0 0 20px rgba(0,255,255,.2);

    text-shadow:0 0 10px #00ffff;

    transition:.25s;
}

#start_btn:hover{
    transform:translateX(-50%) scale(1.08);

    box-shadow:
        0 0 20px #00ffff,
        0 0 60px rgba(0,255,255,.8),
        inset 0 0 30px rgba(0,255,255,.3);
}

/* =========================================================
   INDICADOR DE RESOLUÇÃO
========================================================= */

#resolution{
    position:fixed;
    right:18px;
    bottom:15px;

    z-index:10;

    font-size:9px;
    color:#00ffff;

    opacity:.65;

    text-shadow:0 0 8px #00ffff;
}

/* =========================================================
   STATUS
========================================================= */

#handStatus{
    position:fixed;
    left:18px;
    bottom:15px;

    z-index:10;

    font-size:9px;
    color:#00ffff;

    opacity:.7;

    text-shadow:0 0 8px #00ffff;
}
</style>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<!-- MEDIA PIPE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

</head>

<body>

<!-- =====================================================
     CÂMERA
===================================================== -->

<video
    id="video"
    autoplay
    playsinline
    muted>
</video>

<!-- =====================================================
     WEBGL 3D
===================================================== -->

<canvas id="webgl"></canvas>

<!-- =====================================================
     HUD 2D
===================================================== -->

<canvas id="canvas"></canvas>

<div id="scanlines"></div>
<div id="vignette"></div>

<div id="ui">

    KORVIL // HOLOGRAPHIC CORE

    <div id="status">
        3D / 4D TEMPORAL ENGINE — ONLINE
    </div>

</div>

<div id="handStatus">
    HAND TRACKING: OFFLINE
</div>

<div id="resolution">
    RENDER: AUTO
</div>

<button id="start_btn">
    INICIAR HOLOGRAMA
</button>


<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const webglCanvas = document.getElementById("webgl");

const startBtn = document.getElementById("start_btn");

const statusEl = document.getElementById("status");
const handStatus = document.getElementById("handStatus");
const resolutionEl = document.getElementById("resolution");


/* =========================================================
   VARIÁVEIS
========================================================= */

let hand1 = null;
let hand2 = null;

let cameraRunning = false;

let appScreen = null;

let loadingPercent = 0;

let time4D = 0;

let targetX = 0;
let targetY = 0;
let targetZ = 0;

let hologramVisible = true;


/* =========================================================
   RESOLUÇÃO ADAPTATIVA
========================================================= */

function resizeCanvas(){

    const dpr = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    canvas.width =
        window.innerWidth * dpr;

    canvas.height =
        window.innerHeight * dpr;

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    updateResolutionLabel();
}

function updateResolutionLabel(){

    const w = window.innerWidth;
    const h = window.innerHeight;

    resolutionEl.textContent =
        `VIEWPORT: ${w} × ${h} | WEBGL: ADAPTIVE`;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   THREE.JS — MOTOR 3D
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        canvas:webglCanvas,
        antialias:true,
        alpha:true,
        powerPreference:"high-performance"
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.setClearColor(
    0x000000,
    0
);


/* =========================================================
   CENA
========================================================= */

const scene =
    new THREE.Scene();


/* =========================================================
   CÂMERA 3D
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        55,
        window.innerWidth /
        window.innerHeight,
        .1,
        1000
    );

camera.position.z = 8;


/* =========================================================
   LUZES
========================================================= */

const ambient =
    new THREE.AmbientLight(
        0x00ffff,
        .4
    );

scene.add(ambient);

const pointLight =
    new THREE.PointLight(
        0x00ffff,
        5,
        30
    );

pointLight.position.set(
    0,
    0,
    5
);

scene.add(pointLight);


/* =========================================================
   GRUPO PRINCIPAL
========================================================= */

const holoGroup =
    new THREE.Group();

scene.add(holoGroup);


/* =========================================================
   GEOMETRIA CENTRAL
========================================================= */

const coreGeometry =
    new THREE.IcosahedronGeometry(
        1.3,
        3
    );

const coreMaterial =
    new THREE.MeshBasicMaterial({
        color:0x00ffff,
        wireframe:true,
        transparent:true,
        opacity:.45
    });

const core =
    new THREE.Mesh(
        coreGeometry,
        coreMaterial
    );

holoGroup.add(core);


/* =========================================================
   CORE INTERNO
========================================================= */

const innerGeometry =
    new THREE.IcosahedronGeometry(
        .72,
        2
    );

const innerMaterial =
    new THREE.MeshBasicMaterial({
        color:0x66ffff,
        wireframe:true,
        transparent:true,
        opacity:.75
    });

const innerCore =
    new THREE.Mesh(
        innerGeometry,
        innerMaterial
    );

holoGroup.add(innerCore);


/* =========================================================
   ANÉIS 3D
========================================================= */

const rings = [];

for(let i=0;i<8;i++){

    const geometry =
        new THREE.TorusGeometry(
            1.6 + i*.23,
            .018 + i*.004,
            8,
            128
        );

    const material =
        new THREE.MeshBasicMaterial({
            color:
                i % 2 === 0
                ? 0x00ffff
                : 0xff00ff,

            transparent:true,

            opacity:
                .15 + i*.045
        });

    const ring =
        new THREE.Mesh(
            geometry,
            material
        );

    ring.rotation.x =
        Math.random()*Math.PI;

    ring.rotation.y =
        Math.random()*Math.PI;

    ring.rotation.z =
        Math.random()*Math.PI;

    holoGroup.add(ring);

    rings.push(ring);
}


/* =========================================================
   PARTICULAS 3D
========================================================= */

const particleCount = 5000;

const particlePositions =
    new Float32Array(
        particleCount * 3
    );

const particleData = [];

for(let i=0;i<particleCount;i++){

    const radius =
        1.5 +
        Math.random()*4.5;

    const theta =
        Math.random() *
        Math.PI*2;

    const phi =
        Math.acos(
            2*Math.random()-1
        );

    particlePositions[i*3] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    particlePositions[i*3+1] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    particlePositions[i*3+2] =
        radius *
        Math.cos(phi);

    particleData.push({
        speed:
            .1 +
            Math.random()*.6,

        phase:
            Math.random()*Math.PI*2,

        radius
    });
}

const particleGeometry =
    new THREE.BufferGeometry();

particleGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        particlePositions,
        3
    )
);

const particleMaterial =
    new THREE.PointsMaterial({

        color:0x00ffff,

        size:.035,

        transparent:true,

        opacity:.75,

        blending:
            THREE.AdditiveBlending,

        depthWrite:false
    });

const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

scene.add(particles);


/* =========================================================
   GRADE HOLOGRÁFICA
========================================================= */

const gridGeometry =
    new THREE.SphereGeometry(
        5,
        32,
        32
    );

const gridMaterial =
    new THREE.MeshBasicMaterial({

        color:0x00ffff,

        wireframe:true,

        transparent:true,

        opacity:.025
    });

const globalGrid =
    new THREE.Mesh(
        gridGeometry,
        gridMaterial
    );

scene.add(globalGrid);


/* =========================================================
   ANIMAÇÃO 3D/4D
========================================================= */

function animate3D(){

    requestAnimationFrame(
        animate3D
    );

    time4D += .016;


    /* =========================================
       ROTAÇÃO DO CORE
    ========================================= */

    core.rotation.x =
        time4D * .25;

    core.rotation.y =
        time4D * .42;

    innerCore.rotation.x =
        -time4D * .5;

    innerCore.rotation.y =
        time4D * .7;


    /* =========================================
       ANÉIS
    ========================================= */

    rings.forEach(
        (ring,i)=>{

            ring.rotation.x +=
                .002 + i*.0004;

            ring.rotation.y +=
                .003 + i*.0005;

            ring.rotation.z +=
                .001 + i*.0003;

            /*
             * 4D:
             * expansão/contração temporal
             */

            const pulse =
                1 +
                Math.sin(
                    time4D*1.7 +
                    i
                )*.12;

            ring.scale.set(
                pulse,
                pulse,
                pulse
            );
        }
    );


    /* =========================================
       PARTÍCULAS
    ========================================= */

    const positions =
        particleGeometry.attributes
        .position.array;

    for(let i=0;i<particleCount;i++){

        const d =
            particleData[i];

        const index =
            i*3;

        const phase =
            time4D*d.speed +
            d.phase;

        const factor =
            1 +
            Math.sin(phase)*.08;

        positions[index] *= factor;
        positions[index+1] *= factor;
        positions[index+2] *= factor;
    }

    particleGeometry.attributes
        .position.needsUpdate = true;


    particles.rotation.y += .0007;
    particles.rotation.x += .0003;


    /* =========================================
       MOVIMENTO DA MÃO
    ========================================= */

    holoGroup.position.x +=
        (targetX -
         holoGroup.position.x)*.08;

    holoGroup.position.y +=
        (targetY -
         holoGroup.position.y)*.08;

    holoGroup.position.z +=
        (targetZ -
         holoGroup.position.z)*.08;


    /* =========================================
       EFEITO 4D GLOBAL
    ========================================= */

    const pulse =
        1 +
        Math.sin(time4D*2.2)*.035;

    holoGroup.scale.set(
        pulse,
        pulse,
        pulse
    );


    renderer.render(
        scene,
        camera
    );
}

animate3D();


/* =========================================================
   RESIZE WEBGL
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                2
            )
        );
    }
);


/* =========================================================
   MEDIAPIPE HANDS
========================================================= */

const hands =
    new Hands({

        locateFile:
            file =>
                `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });


hands.setOptions({

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:.65,

    minTrackingConfidence:.65
});


/* =========================================================
   CONEXÕES
========================================================= */

const connections =
    window.HAND_CONNECTIONS;


/* =========================================================
   RESULTADOS
========================================================= */

hands.onResults(
    results => {

        ctx.clearRect(
            0,
            0,
            window.innerWidth,
            window.innerHeight
        );


        hand1 = null;
        hand2 = null;


        if(
            results.multiHandLandmarks &&
            results.multiHandLandmarks.length
        ){

            hand1 =
                convertHand(
                    results.multiHandLandmarks[0]
                );

            if(
                results.multiHandLandmarks[1]
            ){

                hand2 =
                    convertHand(
                        results.multiHandLandmarks[1]
                    );
            }


            handStatus.textContent =
                hand2
                ? "HAND TRACKING: 2 HANDS"
                : "HAND TRACKING: 1 HAND";


            /* =====================================
               MÃO 1
            ===================================== */

            drawHandSkeleton(
                hand1,
                "#00ffff"
            );

            drawHologramBase(
                hand1
            );


            /* =====================================
               MÃO 2
            ===================================== */

            if(hand2){

                drawHandSkeleton(
                    hand2,
                    "#ff00ff"
                );

                checkButtonClick(
                    hand2[8],
                    hand1
                );
            }

        }else{

            handStatus.textContent =
                "HAND TRACKING: SEARCHING...";
        }
    }
);


/* =========================================================
   CONVERSÃO DAS COORDENADAS
========================================================= */

function convertHand(landmarks){

    return landmarks.map(
        lm => ({

            x:1-lm.x,

            y:lm.y,

            z:lm.z
        })
    );
}


/* =========================================================
   DESENHO DAS MÃOS
========================================================= */

function drawHandSkeleton(
    landmarks,
    color
){

    ctx.save();

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        18;

    window.drawConnectors(
        ctx,
        landmarks,
        connections,
        {
            color:color,
            lineWidth:3
        }
    );

    window.drawLandmarks(
        ctx,
        landmarks,
        {
            color:color,
            radius:5
        }
    );

    ctx.restore();
}


/* =========================================================
   BOTÕES
========================================================= */

const buttons = [

    {
        id:"grid",
        icon:"◈",
        yOffset:-60,
        active:false
    },

    {
        id:"settings",
        icon:"⚙",
        yOffset:0,
        active:false
    },

    {
        id:"power",
        icon:"⚡",
        yOffset:60,
        active:false
    }

];


/* =========================================================
   HOLOGRAMA DA PALMA
========================================================= */

function drawHologramBase(
    landmarks
){

    const cx =
        landmarks[9].x *
        window.innerWidth;

    const cy =
        landmarks[9].y *
        window.innerHeight;


    /* =====================================
       POSIÇÃO DO 3D
    ===================================== */

    targetX =
        (landmarks[9].x-.5)*6;

    targetY =
        -(landmarks[9].y-.5)*4;

    targetZ =
        THREE.MathUtils.clamp(
            -landmarks[9].z*12,
            -3,
            3
        );


    /* =====================================
       CÍRCULOS 2D
    ===================================== */

    ctx.save();

    ctx.translate(
        cx,
        cy
    );

    ctx.shadowColor =
        "#00ffff";

    ctx.shadowBlur =
        30;


    for(let i=0;i<6;i++){

        const pulse =
            Math.sin(
                time4D*2 +
                i
            )*8;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            60 +
            i*25 +
            pulse,
            0,
            Math.PI*2
        );

        ctx.strokeStyle =
            `rgba(0,255,255,${.8-i*.1})`;

        ctx.lineWidth =
            i===0 ? 3 : 1;

        ctx.stroke();
    }


    /* =====================================
       EIXOS 3D
    ===================================== */

    ctx.beginPath();

    ctx.moveTo(-110,0);
    ctx.lineTo(110,0);

    ctx.moveTo(0,-110);
    ctx.lineTo(0,110);

    ctx.strokeStyle =
        "rgba(0,255,255,.3)";

    ctx.stroke();


    ctx.restore();


    /* =====================================
       BOTÕES
    ===================================== */

    const bx =
        landmarks[4].x *
        window.innerWidth +
        100;

    const by =
        landmarks[4].y *
        window.innerHeight;


    buttons.forEach(
        b=>{

            b.x = bx;

            b.y =
                by +
                b.yOffset;

            drawHexagon(
                b.x,
                b.y,
                30,
                b.active
            );

            ctx.save();

            ctx.font =
                "20px Arial";

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.fillStyle =
                "#ffffff";

            ctx.shadowColor =
                "#00ffff";

            ctx.shadowBlur =
                15;

            ctx.fillText(
                b.icon,
                b.x,
                b.y
            );

            ctx.restore();
        }
    );


    /* =====================================
       PAINEL
    ===================================== */

    if(appScreen){

        drawAppScreen(
            landmarks
        );
    }
}


/* =========================================================
   HEXÁGONO
========================================================= */

function drawHexagon(
    x,
    y,
    radius,
    active
){

    ctx.save();

    ctx.beginPath();

    for(
        let i=0;
        i<6;
        i++
    ){

        const angle =
            Math.PI/3*i -
            Math.PI/6;

        const px =
            x +
            radius *
            Math.cos(angle);

        const py =
            y +
            radius *
            Math.sin(angle);

        if(i===0)
            ctx.moveTo(px,py);
        else
            ctx.lineTo(px,py);
    }

    ctx.closePath();

    ctx.fillStyle =
        active
        ? "rgba(0,255,255,.85)"
        : "rgba(0,255,255,.12)";

    ctx.strokeStyle =
        "#00ffff";

    ctx.lineWidth =
        active ? 3 : 1.5;

    ctx.shadowColor =
        "#00ffff";

    ctx.shadowBlur =
        active ? 35 : 15;

    ctx.fill();

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   PAINEL APP
========================================================= */

function drawAppScreen(
    landmarks
){

    const cx =
        landmarks[9].x *
        window.innerWidth;

    const cy =
        landmarks[9].y *
        window.innerHeight;


    const width =
        Math.min(
            420,
            window.innerWidth*.75
        );

    const height =
        270;


    const x =
        cx -
        width/2;

    const y =
        cy -
        210;


    ctx.save();

    /* =====================================
       SOMBRA
    ===================================== */

    ctx.shadowColor =
        "#00ffff";

    ctx.shadowBlur =
        35;


    /* =====================================
       PAINEL
    ===================================== */

    ctx.fillStyle =
        "rgba(0,15,35,.75)";

    ctx.fillRect(
        x,
        y,
        width,
        height
    );


    ctx.strokeStyle =
        "#00ffff";

    ctx.lineWidth =
        2;

    ctx.strokeRect(
        x,
        y,
        width,
        height
    );


    /* =====================================
       CABEÇALHO
    ===================================== */

    ctx.fillStyle =
        "#00ffff";

    ctx.font =
        "13px Courier New";

    ctx.textAlign =
        "left";

    ctx.fillText(
        "KORVIL // HOLOGRAPHIC SYSTEM",
        x+15,
        y+25
    );


    /* =====================================
       LOADING
    ===================================== */

    if(
        appScreen === "loading"
    ){

        ctx.textAlign =
            "center";

        ctx.font =
            "42px Courier New";

        ctx.fillText(
            `${Math.floor(loadingPercent)}%`,
            x+width/2,
            y+120
        );


        ctx.fillStyle =
            "rgba(0,255,255,.15)";

        ctx.fillRect(
            x+40,
            y+190,
            width-80,
            8
        );


        ctx.fillStyle =
            "#00ffff";

        ctx.fillRect(
            x+40,
            y+190,
            (width-80) *
            (loadingPercent/100),
            8
        );
    }


    /* =====================================
       MAPA
    ===================================== */

    if(
        appScreen === "mapa"
    ){

        ctx.fillStyle =
            "rgba(0,70,50,.5)";

        ctx.fillRect(
            x+10,
            y+45,
            width-20,
            height-60
        );


        ctx.strokeStyle =
            "rgba(0,255,150,.35)";


        for(
            let i=0;
            i<5;
            i++
        ){

            ctx.beginPath();

            ctx.moveTo(
                x+10,
                y+50+i*38
            );

            ctx.lineTo(
                x+width-10,
                y+50+i*38
            );

            ctx.stroke();
        }


        /* marcador */

        ctx.fillStyle =
            "#ff004c";

        ctx.shadowColor =
            "#ff004c";

        ctx.shadowBlur =
            20;

        ctx.beginPath();

        ctx.arc(
            x+90,
            y+100,
            7,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.shadowBlur = 0;

        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "12px Courier New";

        ctx.textAlign =
            "left";

        ctx.fillText(
            "DESTINO",
            x+110,
            y+105
        );


        ctx.fillText(
            "3 KM // 30 MIN",
            x+20,
            y+245
        );
    }


    ctx.restore();
}


/* =========================================================
   LOADING
========================================================= */

function updateLoading(){

    if(
        appScreen === "loading"
    ){

        loadingPercent +=
            .8;

        if(
            loadingPercent >= 100
        ){

            loadingPercent = 100;

            appScreen =
                "mapa";
        }
    }

    requestAnimationFrame(
        updateLoading
    );
}

updateLoading();


/* =========================================================
   INTERAÇÃO
========================================================= */

function checkButtonClick(
    landmark,
    baseHand
){

    if(!baseHand)
        return;


    const x =
        landmark.x *
        window.innerWidth;

    const y =
        landmark.y *
        window.innerHeight;


    buttons.forEach(
        b=>{

            const dx =
                x-b.x;

            const dy =
                y-b.y;

            const distance =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );


            if(
                distance < 40 &&
                !b.active
            ){

                b.active = true;


                setTimeout(
                    ()=>{
                        b.active=false;
                    },
                    400
                );


                /* GRID */

                if(
                    b.id === "grid"
                ){

                    appScreen =
                        "loading";

                    loadingPercent =
                        0;
                }


                /* POWER */

                if(
                    b.id === "power"
                ){

                    hologramVisible =
                        !hologramVisible;

                    holoGroup.visible =
                        hologramVisible;

                    particles.visible =
                        hologramVisible;
                }


                /* SETTINGS */

                if(
                    b.id === "settings"
                ){

                    statusEl.textContent =
                        "SYSTEM SETTINGS // 4D MODE";
                }
            }
        }
    );
}


/* =========================================================
   INICIAR CÂMERA
========================================================= */

startBtn.onclick =
    async ()=>{

        if(cameraRunning)
            return;


        cameraRunning =
            true;

        startBtn.style.display =
            "none";


        statusEl.textContent =
            "INITIALIZING HOLOGRAPHIC CORE...";


        try{

            const camera =
                new Camera(
                    video,
                    {

                        onFrame:
                            async()=>{
                                await hands.send({
                                    image:video
                                });
                            },

                        width:1920,
                        height:1080
                    }
                );


            camera.start();


            statusEl.textContent =
                "3D / 4D TEMPORAL ENGINE — ONLINE";

        }
        catch(error){

            console.error(error);

            statusEl.textContent =
                "CAMERA ERROR";
        }
    };


/* =========================================================
   LOOP VISUAL 4D
========================================================= */

function visualLoop(){

    /*
     * Pequena oscilação temporal do ambiente.
     */

    globalGrid.rotation.y +=
        .00025;

    globalGrid.rotation.x =
        Math.sin(time4D*.15)*.08;


    requestAnimationFrame(
        visualLoop
    );
}

visualLoop();
