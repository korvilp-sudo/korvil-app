<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CGM Holograma — Luva 3D 4D</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Courier New,monospace;
}

#video{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    transform:scaleX(-1);
    z-index:1;

    filter:
        brightness(.35)
        contrast(1.15)
        saturate(.7);
}

#canvas{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:5;
    pointer-events:none;
}

#ui{
    position:fixed;
    top:15px;
    left:0;
    width:100%;
    z-index:20;

    text-align:center;

    color:#00ffff;

    font-size:13px;

    letter-spacing:3px;

    text-shadow:
        0 0 5px #00ffff,
        0 0 15px #00ffff,
        0 0 30px #00ffff;
}

#status{
    margin-top:7px;
    font-size:10px;
}

#handStatus{
    position:fixed;
    bottom:15px;
    left:15px;

    z-index:20;

    color:#00ffff;
    font-size:10px;

    text-shadow:0 0 10px #00ffff;
}

#start_btn{

    position:fixed;

    left:50%;
    bottom:50px;

    transform:translateX(-50%);

    z-index:30;

    padding:16px 40px;

    border:2px solid #00ffff;

    border-radius:30px;

    background:
        rgba(0,255,255,.15);

    color:#fff;

    font-family:Courier New,monospace;

    font-size:17px;

    cursor:pointer;

    box-shadow:
        0 0 15px #00ffff,
        0 0 40px rgba(0,255,255,.5);

}

#start_btn:hover{

    background:
        rgba(0,255,255,.4);

    box-shadow:
        0 0 25px #00ffff,
        0 0 70px #00ffff;

}

#scanlines{

    position:fixed;
    inset:0;

    z-index:10;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0,255,255,.025) 0px,
            rgba(0,255,255,.025) 1px,
            transparent 2px,
            transparent 5px
        );

}

</style>
</head>

<body>

<video
    id="video"
    autoplay
    playsinline
    muted>
</video>

<canvas id="canvas"></canvas>

<div id="scanlines"></div>

<div id="ui">

    SCI-FI HOLOGRAM BY CGM

    <div id="status">
        LUVA OFFLINE
    </div>

</div>

<div id="handStatus">
    MÃO: PROCURANDO
</div>

<button id="start_btn">
    ATIVAR LUVA
</button>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const button =
    document.getElementById("start_btn");

const status =
    document.getElementById("status");

const handStatus =
    document.getElementById("handStatus");


/* =====================================================
   ESTADO
===================================================== */

let cameraRunning = false;

let gloveActive = false;

let stream = null;

let hand1 = null;

let hand2 = null;

let time = 0;

let loading = 0;

let appScreen = null;


/* =====================================================
   RESOLUÇÃO
===================================================== */

function resize(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        window.innerWidth*dpr;

    canvas.height =
        window.innerHeight*dpr;

    canvas.style.width =
        window.innerWidth+"px";

    canvas.style.height =
        window.innerHeight+"px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands =
    new Hands({

        locateFile:
            file =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

    });


hands.setOptions({

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:.55,

    minTrackingConfidence:.55

});


/* =====================================================
   RESULTADO
===================================================== */

hands.onResults(
    results => {

        ctx.clearRect(
            0,
            0,
            window.innerWidth,
            window.innerHeight
        );


        hand1 = null;
        hand2 = null;


        if(
            results.multiHandLandmarks &&
            results.multiHandLandmarks.length
        ){

            hand1 =
                convert(
                    results.multiHandLandmarks[0]
                );


            if(
                results.multiHandLandmarks[1]
            ){

                hand2 =
                    convert(
                        results.multiHandLandmarks[1]
                    );

            }


            handStatus.textContent =
                hand2
                ? "MÃOS: 2 DETECTADAS"
                : "MÃO: DETECTADA";


            /*
             * A LUVA SÓ É DESENHADA
             * QUANDO ESTÁ ATIVA.
             */

            if(gloveActive){

                drawGlove(
                    hand1
                );


                if(hand2){

                    drawSecondHand(
                        hand2
                    );

                }

            }

        }else{

            handStatus.textContent =
                "MÃO: PROCURANDO";

        }

    }
);


/* =====================================================
   CONVERSÃO
===================================================== */

function convert(
    landmarks
){

    return landmarks.map(
        p => ({

            x:1-p.x,

            y:p.y,

            z:p.z

        })
    );

}


/* =====================================================
   ATIVAR LUVA
===================================================== */

button.addEventListener(
    "click",
    activateGlove
);


async function activateGlove(){

    if(cameraRunning)
        return;


    try{

        status.textContent =
            "SOLICITANDO CÂMERA...";

        button.textContent =
            "ABRINDO CÂMERA...";


        /*
         * SOLICITA CÂMERA
         */

        stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video:{

                    facingMode:"user",

                    width:{
                        ideal:1920
                    },

                    height:{
                        ideal:1080
                    },

                    frameRate:{
                        ideal:30
                    }

                },

                audio:false

            });


        /*
         * COLOCA A CÂMERA NO VIDEO
         */

        video.srcObject =
            stream;


        video.muted =
            true;

        video.playsInline =
            true;


        await video.play();


        /*
         * ATIVA
         */

        cameraRunning =
            true;

        gloveActive =
            true;


        button.style.display =
            "none";


        status.textContent =
            "LUVA HOLOGRÁFICA ATIVA";


        /*
         * COMEÇA MEDIAPIPE
         */

        processFrame();


    }catch(error){

        console.error(error);


        cameraRunning =
            false;

        gloveActive =
            false;


        button.style.display =
            "block";

        button.textContent =
            "ATIVAR LUVA";


        if(
            error.name ===
            "NotAllowedError"
        ){

            status.textContent =
                "PERMITA O ACESSO À CÂMERA";

        }else{

            status.textContent =
                "ERRO AO ATIVAR LUVA";

        }

    }

}


/* =====================================================
   PROCESSAMENTO
===================================================== */

async function processFrame(){

    if(!cameraRunning)
        return;


    if(
        video.readyState >=
        HTMLMediaElement.HAVE_CURRENT_DATA
    ){

        try{

            await hands.send({

                image:video

            });

        }catch(error){

            console.error(
                error
            );

        }

    }


    requestAnimationFrame(
        processFrame
    );

}


/* =====================================================
   DESENHO DA LUVA
===================================================== */

function drawGlove(
    hand
){

    ctx.save();


    /*
     * MÃO
     */

    ctx.shadowColor =
        "#00ffff";

    ctx.shadowBlur =
        20;


    drawConnectors(
        ctx,
        hand,
        HAND_CONNECTIONS,
        {

            color:"#00ffff",

            lineWidth:3

        }
    );


    drawLandmarks(
        ctx,
        hand,
        {

            color:"#00ffff",

            radius:5

        }
    );


    /*
     * PALMA
     */

    drawPalm(
        hand
    );


    /*
     * BOTÕES
     */

    drawButtons(
        hand
    );


    ctx.restore();

}


/* =====================================================
   PALMA HOLOGRÁFICA
===================================================== */

function drawPalm(
    hand
){

    const cx =
        hand[9].x *
        window.innerWidth;

    const cy =
        hand[9].y *
        window.innerHeight;


    /*
     * PROFUNDIDADE
     */

    const depth =
        Math.max(
            .7,
            Math.min(
                1.4,
                1-hand[9].z*2
            )
        );


    ctx.save();

    ctx.translate(
        cx,
        cy
    );

    ctx.scale(
        depth,
        depth
    );


    /*
     * ANÉIS PRINCIPAIS
     */

    for(
        let i=0;
        i<4;
        i++
    ){

        const pulse =
            Math.sin(
                time*2+i
            )*6;


        ctx.beginPath();


        ctx.arc(

            0,
            0,

            55 +
            i*28 +
            pulse,

            0,
            Math.PI*2

        );


        ctx.strokeStyle =
            `rgba(
                0,
                255,
                255,
                ${.85-i*.18}
            )`;


        ctx.lineWidth =
            i===0
            ? 3
            : 1.5;


        ctx.stroke();

    }


    /*
     * NÚCLEO
     */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        18+
        Math.sin(time*4)*3,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "rgba(0,255,255,.35)";

    ctx.fill();

    ctx.strokeStyle =
        "#ffffff";

    ctx.stroke();


    /*
     * LINHAS 3D
     */

    for(
        let i=0;
        i<12;
        i++
    ){

        const angle =
            i*Math.PI/6;


        ctx.beginPath();

        ctx.moveTo(

            Math.cos(angle)*65,

            Math.sin(angle)*65

        );

        ctx.lineTo(

            Math.cos(angle)*120,

            Math.sin(angle)*120

        );

        ctx.strokeStyle =
            "rgba(0,255,255,.35)";

        ctx.stroke();

    }


    /*
     * EIXOS
     */

    ctx.beginPath();

    ctx.moveTo(
        -120,
        0
    );

    ctx.lineTo(
        120,
        0
    );

    ctx.moveTo(
        0,
        -120
    );

    ctx.lineTo(
        0,
        120
    );

    ctx.strokeStyle =
        "rgba(0,255,255,.2)";

    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   BOTÕES
===================================================== */

const buttons = [

    {
        id:"grid",
        icon:"■",
        offset:-50,
        x:0,
        y:0,
        active:false
    },

    {
        id:"settings",
        icon:"⚙",
        offset:0,
        x:0,
        y:0,
        active:false
    },

    {
        id:"power",
        icon:"⚡",
        offset:50,
        x:0,
        y:0,
        active:false
    }

];


function drawButtons(
    hand
){

    const x =
        hand[4].x *
        window.innerWidth +
        80;

    const y =
        hand[4].y *
        window.innerHeight;


    buttons.forEach(
        b => {

            b.x = x;

            b.y =
                y +
                b.offset;


            drawHexagon(
                b.x,
                b.y,
                25,
                b.active
            );


            ctx.save();


            ctx.fillStyle =
                "#fff";

            ctx.font =
                "18px Arial";

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.shadowColor =
                "#00ffff";

            ctx.shadowBlur =
                15;


            ctx.fillText(
                b.icon,
                b.x,
                b.y
            );


            ctx.restore();

        }
    );

}


/* =====================================================
   HEXÁGONO
===================================================== */

function drawHexagon(
    x,
    y,
    radius,
    active
){

    ctx.save();

    ctx.beginPath();


    for(
        let i=0;
        i<6;
        i++
    ){

        const angle =
            Math.PI/3*i -
            Math.PI/6;


        const px =
            x +
            radius *
            Math.cos(angle);

        const py =
            y +
            radius *
            Math.sin(angle);


        if(i===0)
            ctx.moveTo(px,py);
        else
            ctx.lineTo(px,py);

    }


    ctx.closePath();


    ctx.fillStyle =
        active
        ? "rgba(0,255,255,.9)"
        : "rgba(0,255,255,.2)";


    ctx.strokeStyle =
        "#00ffff";


    ctx.lineWidth =
        active
        ? 3
        : 1.5;


    ctx.shadowColor =
        "#00ffff";

    ctx.shadowBlur =
        active
        ? 35
        : 15;


    ctx.fill();

    ctx.stroke();

    ctx.restore();

}


/* =====================================================
   SEGUNDA MÃO
===================================================== */

function drawSecondHand(
    hand
){

    ctx.save();

    ctx.shadowColor =
        "#ff00ff";

    ctx.shadowBlur =
        20;


    drawConnectors(
        ctx,
        hand,
        HAND_CONNECTIONS,
        {

            color:"#ff00ff",

            lineWidth:3

        }
    );


    drawLandmarks(
        ctx,
        hand,
        {

            color:"#ff00ff",

            radius:5

        }
    );


    /*
     * indicador
     */

    const x =
        hand[8].x *
        window.innerWidth;

    const y =
        hand[8].y *
        window.innerHeight;


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        12+
        Math.sin(time*5)*3,
        0,
        Math.PI*2
    );

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth =
        2;

    ctx.stroke();


    ctx.restore();


    checkButton(
        x,
        y
    );

}


/* =====================================================
   CLIQUE
===================================================== */

function checkButton(
    x,
    y
){

    buttons.forEach(
        b => {

            const dx =
                x-b.x;

            const dy =
                y-b.y;


            const distance =
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(
                distance < 35 &&
                !b.active
            ){

                b.active =
                    true;


                setTimeout(
                    ()=>{
                        b.active =
                            false;
                    },
                    350
                );


                /*
                 * GRID
                 */

                if(
                    b.id === "grid"
                ){

                    appScreen =
                        "loading";

                    loading =
                        0;

                }


                /*
                 * POWER
                 */

                if(
                    b.id === "power"
                ){

                    gloveActive =
                        !gloveActive;


                    status.textContent =
                        gloveActive
                        ? "LUVA HOLOGRÁFICA ATIVA"
                        : "LUVA DESATIVADA";

                }


                /*
                 * SETTINGS
                 */

                if(
                    b.id === "settings"
                ){

                    status.textContent =
                        "MODO 3D / 4D ATIVO";

                }

            }

        }
    );

}


/* =====================================================
   LOOP TEMPORAL
===================================================== */

function animationLoop(){

    time += .016;


    if(
        appScreen === "loading"
    ){

        loading += 2;


        if(
            loading >= 100
        ){

            loading =
                100;

            appScreen =
                "mapa";

        }

    }


    requestAnimationFrame(
        animationLoop
    );

}

animationLoop();

</script>

</body>
</html>
