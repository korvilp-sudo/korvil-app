<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visão Cibernética AI - Reconhecimento Facial & Gestos</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React e ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel para transpilar JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- MediaPipe Face Mesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    @keyframes scan {
      0% { top: 0%; opacity: 0.8; }
      50% { opacity: 1; }
      100% { top: 100%; opacity: 0.8; }
    }
    .animate-scan {
      animation: scan 1.8s ease-in-out infinite;
    }
    .hud-glow {
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.45);
    }
    .hud-glow-red {
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.65);
    }
  </style>
</head>
<body class="bg-slate-950 text-cyan-400 font-mono overflow-hidden select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // Gerador Sintético de Efeitos Sonoros Futuristicos (Web Audio API)
    const playCyberSfx = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'beep') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'lock') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(1760, now + 0.15);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'scan') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(1200, now + 0.3);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch (e) {
        console.warn('Web Audio API não inicializado:', e);
      }
    };

    function CyberHUD() {
      // Estados do Sistema
      const [status, setStatus] = useState('INICIALIZANDO');
      const [faceDetected, setFaceDetected] = useState(false);
      const [aimActive, setAimActive] = useState(false);
      const [scanning, setScanning] = useState(false);
      const [scanResults, setScanResults] = useState(null);
      const [priorities, setPriorities] = useState([]);
      const [awaitingVoice, setAwaitingVoice] = useState(false);
      const [selectedActionIndex, setSelectedActionIndex] = useState(null);
      const [feedbackMsg, setFeedbackMsg] = useState('Iniciando reconhecimento facial...');
      const [eyeStatusText, setEyeStatusText] = useState('Aguardando Detecção...');

      // Refs de Controle Interno
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const stateRef = useRef({ aimActive: false, scanning: false, awaitingVoice: false, selectedIndex: null });
      const blinkCooldownRef = useRef(0);
      const recognitionRef = useRef(null);

      // Sincronizar Refs com Estados
      useEffect(() => {
        stateRef.current.aimActive = aimActive;
        stateRef.current.scanning = scanning;
        stateRef.current.awaitingVoice = awaitingVoice;
        stateRef.current.selectedIndex = selectedActionIndex;
      }, [aimActive, scanning, awaitingVoice, selectedActionIndex]);

      // Síntese de Voz (TTS)
      const speak = useCallback((text, onEnd) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'pt-BR';
          utterance.rate = 1.05;
          utterance.pitch = 0.95;
          if (onEnd) utterance.onend = onEnd;
          window.speechSynthesis.speak(utterance);
        }
      }, []);

      // Cálculo de Distância Euclidiana 2D para Landmarks
      const getDist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);

      // Cálculo Avançado de Eye Aspect Ratio (EAR)
      const calculateEAR = (landmarks, indices) => {
        const p1 = landmarks[indices[0]];
        const p2 = landmarks[indices[1]];
        const p3 = landmarks[indices[2]];
        const p4 = landmarks[indices[3]];
        const p5 = landmarks[indices[4]];
        const p6 = landmarks[indices[5]];

        const v1 = getDist(p2, p6);
        const v2 = getDist(p3, p5);
        const h = getDist(p1, p4);

        return (v1 + v2) / (2.0 * h);
      };

      // Manipulação de Ações baseada nos Gestos
      const handleRightEyeBlink = () => {
        playCyberSfx('lock');
        setAimActive(prev => {
          const newState = !prev;
          if (newState) {
            setFeedbackMsg('Mira cibernética ativada. Pisque o olho ESQUERDO para escanear.');
            speak('Mira ativada.');
          } else {
            setFeedbackMsg('Mira desativada.');
            speak('Mira desativada.');
          }
          return newState;
        });
      };

      const handleLeftEyeBlink = () => {
        if (!stateRef.current.aimActive) {
          playCyberSfx('beep');
          setFeedbackMsg('Ative a mira primeiro piscando o Olho DIREITO!');
          speak('Aviso: Ative a mira primeiro piscando o olho direito.');
          return;
        }
        if (stateRef.current.scanning) return;
        runEnvironmentScan();
      };

      const handleBothEyesBlink = () => {
        if (!stateRef.current.aimActive) return;
        playCyberSfx('lock');

        const indexToExecute = stateRef.current.selectedIndex !== null ? stateRef.current.selectedIndex : 0;
        const currentPriorities = priorities.length ? priorities : [
          'Otimizar fluxo de trabalho do sistema',
          'Verificar notificações urgentes do terminal',
          'Fazer uma pausa para hidratação'
        ];
        const actionText = currentPriorities[indexToExecute] || 'Ação do Sistema';

        setStatus('EXECUTANDO AÇÃO');
        setFeedbackMsg(`Executando agora: "${actionText}"`);
        speak(`Executando ação imediatamente: ${actionText}`);

        setTimeout(() => {
          setAwaitingVoice(false);
          setSelectedActionIndex(null);
          setStatus('SISTEMA PRONTO');
        }, 3500);
      };

      const runEnvironmentScan = () => {
        playCyberSfx('scan');
        setScanning(true);
        setStatus('ESCANEANDO AMBIENTE...');
        setFeedbackMsg('Escaner analítico rodando... Identificando objetos, pessoas e situações.');
        speak('Escaneando ambiente. Analisando dados.');

        setTimeout(() => {
          setScanning(false);
          setStatus('SISTEMA PRONTO');

          const detectedElements = {
            pessoas: '1 Pessoa identificada (Operador Primário - Postura Estável)',
            objetos: 'Terminal Cyber, Mesa de Trabalho, Dispositivo Móvel',
            ambiente: 'Iluminação interna adequada, Sem ameaças detectadas',
            situacao: 'Sessão de trabalho em andamento - Nível de foco alto'
          };

          const topPriorities = [
            'Otimizar fluxo de trabalho do sistema',
            'Verificar notificações urgentes do terminal',
            'Fazer uma pausa para hidratação'
          ];

          setScanResults(detectedElements);
          setPriorities(topPriorities);
          setAwaitingVoice(true);
          setFeedbackMsg('Escaneamento concluído! Aguardando resposta por voz ou piscada dupla.');

          speak('Escaneamento concluído. O que quer fazer senhor?', () => {
            startVoiceRecognition();
          });
        }, 3000);
      };

      // Reconhecimento de Voz
      const startVoiceRecognition = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          setFeedbackMsg('Reconhecimento de voz indisponível. Utilize a piscada dupla.');
          return;
        }

        try {
          if (recognitionRef.current) recognitionRef.current.stop();

          const recognition = new SpeechRecognition();
          recognition.lang = 'pt-BR';
          recognition.continuous = false;
          recognition.interimResults = false;

          recognition.onstart = () => {
            setFeedbackMsg('Ouvindo sua resposta... Fale a opção desejada.');
          };

          recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.toLowerCase();
            playCyberSfx('beep');
            setFeedbackMsg(`Você falou: "${transcript}"`);

            if (transcript.includes('1') || transcript.includes('primeira') || transcript.includes('otimizar')) {
              setSelectedActionIndex(0);
              speak('Opção 1 selecionada. Pisque os dois olhos para executar.');
            } else if (transcript.includes('2') || transcript.includes('segunda') || transcript.includes('notificação') || transcript.includes('verificar')) {
              setSelectedActionIndex(1);
              speak('Opção 2 selecionada. Pisque os dois olhos para executar.');
            } else if (transcript.includes('3') || transcript.includes('terceira') || transcript.includes('pausa') || transcript.includes('hidratação')) {
              setSelectedActionIndex(2);
              speak('Opção 3 selecionada. Pisque os dois olhos para executar.');
            } else {
              setSelectedActionIndex(0);
              speak(`Comando processado. Opção 1 marcada por padrão. Pisque os dois olhos para executar.`);
            }
          };

          recognition.onerror = () => {
            setFeedbackMsg('Voz não reconhecida. Opção 1 selecionada por padrão. Pisque 2x os olhos.');
            setSelectedActionIndex(0);
          };

          recognition.start();
          recognitionRef.current = recognition;
        } catch (e) {
          console.warn('Erro ao inicializar reconhecimento de voz:', e);
        }
      };

      // Processador de Quadros do MediaPipe
      const onFaceResults = useCallback((results) => {
        const canvasCtx = canvasRef.current?.getContext('2d');
        if (!canvasCtx || !canvasRef.current) return;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          if (!faceDetected) {
            setFaceDetected(true);
            setStatus('SISTEMA PRONTO');
            setFeedbackMsg('Rosto reconhecido com sucesso. Pisque o Olho DIREITO para ativar a mira.');
            speak('Rosto reconhecido com sucesso. Sistema de visão pronto.');
            playCyberSfx('lock');
          }

          const landmarks = results.multiFaceLandmarks[0];
          const w = canvasRef.current.width;
          const h = canvasRef.current.height;

          // Desenhar HUD nos Pontos Chave da Face
          canvasCtx.fillStyle = '#22d3ee';
          canvasCtx.strokeStyle = 'rgba(34, 211, 238, 0.4)';
          canvasCtx.lineWidth = 1;

          [33, 263, 1, 61, 291, 199].forEach(idx => {
            const pt = landmarks[idx];
            canvasCtx.beginPath();
            canvasCtx.arc(pt.x * w, pt.y * h, 3, 0, 2 * Math.PI);
            canvasCtx.fill();
          });

          // Índices MediaPipe para cálculo de EAR
          const leftEyeIndices = [33, 160, 158, 133, 153, 144];
          const rightEyeIndices = [362, 385, 387, 263, 373, 380];

          const leftEAR = calculateEAR(landmarks, leftEyeIndices);
          const rightEAR = calculateEAR(landmarks, rightEyeIndices);

          const earThreshold = 0.19; // Limiar de precisão
          const leftClosed = leftEAR < earThreshold;
          const rightClosed = rightEAR < earThreshold;

          const now = Date.now();
          if (now - blinkCooldownRef.current > 700) {
            if (leftClosed && rightClosed) {
              blinkCooldownRef.current = now;
              setEyeStatusText('PISCADA DUPLA DETECTADA');
              handleBothEyesBlink();
            } else if (rightClosed && !leftClosed) {
              blinkCooldownRef.current = now;
              setEyeStatusText('OLHO DIREITO PISCOU');
              handleRightEyeBlink();
            } else if (leftClosed && !rightClosed) {
              blinkCooldownRef.current = now;
              setEyeStatusText('OLHO ESQUERDO PISCOU');
              handleLeftEyeBlink();
            }
          }
        } else {
          if (faceDetected) {
            setFaceDetected(false);
            setStatus('PROCURANDO ROSTO...');
            setEyeStatusText('Aguardando Detecção...');
          }
        }
        canvasCtx.restore();
      }, [faceDetected, speak]);

      // Inicializar Câmera e MediaPipe
      useEffect(() => {
        let camera = null;
        const faceMesh = new FaceMesh({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.65,
          minTrackingConfidence: 0.65
        });

        faceMesh.onResults(onFaceResults);

        if (videoRef.current) {
          camera = new Camera(videoRef.current, {
            onFrame: async () => {
              if (videoRef.current) {
                await faceMesh.send({ image: videoRef.current });
              }
            },
            width: 1280,
            height: 720
          });
          camera.start();
        }

        return () => {
          if (camera) camera.stop();
          faceMesh.close();
        };
      }, [onFaceResults]);

      return (
        <div className="relative w-screen h-screen bg-slate-950 flex flex-col items-center justify-center overflow-hidden">
          
          {/* Câmera Realista de Fundo com Canvas HUD */}
          <div className="absolute inset-0 z-0">
            <video 
              ref={videoRef} 
              className="w-full h-full object-cover opacity-40 scale-x-[-1]" 
              playsInline 
              muted 
            />
            <canvas 
              ref={canvasRef} 
              className="absolute inset-0 w-full h-full object-cover scale-x-[-1]" 
              width={1280} 
              height={720} 
            />
          </div>

          {/* Overlay de Linhas Cibernéticas e HUD */}
          <div className="absolute inset-0 z-10 pointer-events-none border-[12px] border-cyan-500/20 m-2 rounded-xl flex flex-col justify-between p-6">
            
            {/* Cabeçalho do HUD */}
            <div className="flex justify-between items-start bg-slate-900/80 p-4 rounded-lg border border-cyan-500/40 backdrop-blur-md pointer-events-auto">
              <div>
                <h1 className="text-xl font-bold tracking-widest text-cyan-300 flex items-center gap-2">
                  <span className="inline-block w-3 h-3 bg-cyan-400 rounded-full animate-ping"></span>
                  VISÃO CIBERNÉTICA AI // SYSTEM v4.0
                </h1>
                <p className="text-xs text-cyan-400/70 mt-1">OPERADOR: SAY KORVIL | RECONHECIMENTO FACIAL AUTÔNOMO</p>
              </div>

              <div className="text-right">
                <div className="text-xs text-slate-400">STATUS DO SISTEMA</div>
                <div className={`text-sm font-bold tracking-wider ${faceDetected ? 'text-emerald-400' : 'text-amber-400'}`}>
                  {status}
                </div>
                <div className="text-[10px] text-cyan-500/80 mt-1">{eyeStatusText}</div>
              </div>
            </div>

            {/* MIRA CIBERNÉTICA DO OLHO DIREITO */}
            {aimActive && (
              <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none flex flex-col items-center justify-center">
                <div className={`relative w-72 h-72 border-2 rounded-full flex items-center justify-center transition-all duration-300 ${scanning ? 'border-red-500 animate-pulse hud-glow-red' : 'border-cyan-400 hud-glow'}`}>
                  
                  {/* Retículas e Mira */}
                  <div className="absolute inset-2 border border-dashed border-cyan-300/40 rounded-full"></div>
                  <div className="w-4 h-4 bg-cyan-400/80 rounded-full animate-ping"></div>
                  <div className="absolute w-full h-[1px] bg-cyan-400/50"></div>
                  <div className="absolute h-full w-[1px] bg-cyan-400/50"></div>
                  
                  {/* Linha de Animação de Scan */}
                  {scanning && (
                    <div className="absolute w-full h-1 bg-red-500 shadow-[0_0_15px_#ef4444] animate-scan"></div>
                  )}

                  <div className="absolute -top-7 text-xs font-bold text-cyan-300 bg-slate-900/90 px-3 py-1 rounded border border-cyan-400">
                    {scanning ? 'ESCANEANDO AMBIENTE...' : 'MIRA ATIVA [OLHO DIREITO]'}
                  </div>
                </div>
              </div>
            )}

            {/* PAINEL CENTRAL DE RESULTADOS E PRIORIDADES DO SCANNER */}
            {scanResults && (
              <div className="absolute left-8 top-28 w-96 bg-slate-900/90 border border-cyan-500/50 rounded-lg p-5 backdrop-blur-md pointer-events-auto shadow-2xl space-y-4">
                <div className="border-b border-cyan-500/30 pb-2 flex justify-between items-center">
                  <h2 className="text-sm font-bold text-cyan-300 tracking-wider">DIAGNÓSTICO DO ESCANER</h2>
                  <span className="text-[10px] bg-cyan-950 text-cyan-300 px-2 py-0.5 rounded border border-cyan-500/40">COMPLETO</span>
                </div>

                {/* Leitura e Objetos */}
                <div className="space-y-1.5 text-xs">
                  <p><span className="text-cyan-500 font-semibold">Pessoas:</span> {scanResults.pessoas}</p>
                  <p><span className="text-cyan-500 font-semibold">Objetos:</span> {scanResults.objetos}</p>
                  <p><span className="text-cyan-500 font-semibold">Ambiente:</span> {scanResults.ambiente}</p>
                  <p><span className="text-cyan-500 font-semibold">Situação:</span> {scanResults.situacao}</p>
                </div>

                {/* Lista de Ações Prioritárias */}
                <div className="pt-2 border-t border-cyan-500/30">
                  <h3 className="text-xs font-bold text-amber-400 mb-2 tracking-wider">3 AÇÕES PRIORITÁRIAS RECOMENDADAS:</h3>
                  <div className="space-y-2">
                    {priorities.map((item, idx) => (
                      <div 
                        key={idx}
                        className={`p-2 rounded border text-xs flex items-center justify-between transition-all ${selectedActionIndex === idx ? 'bg-cyan-500/20 border-cyan-400 text-white font-bold' : 'bg-slate-800/60 border-slate-700 text-cyan-200'}`}
                      >
                        <span>{idx + 1}. {item}</span>
                        {selectedActionIndex === idx && (
                          <span className="text-[10px] bg-emerald-500 text-slate-950 font-extrabold px-1.5 py-0.5 rounded">SELECIONADO</span>
                        )}
                      </div>
                    ))}
                  </div>
                </div>

                {awaitingVoice && (
                  <div className="p-3 bg-amber-500/10 border border-amber-500/40 rounded text-center">
                    <p className="text-xs text-amber-300 font-bold animate-pulse">"O QUE QUER FAZER SENHOR?"</p>
                    <p className="text-[10px] text-slate-400 mt-1">Fale a opção ou pisque 2x os dois olhos para confirmar a seleção.</p>
                  </div>
                )}
              </div>
            )}

            {/* GUIAS DE COMANDOS POR GESTOS E MENSAGENS DO SISTEMA */}
            <div className="flex flex-col md:flex-row justify-between items-end gap-4 pointer-events-auto">
              
              {/* Painel de Instruções dos Gestos */}
              <div className="bg-slate-900/85 border border-cyan-500/40 rounded-lg p-4 backdrop-blur-md max-w-md w-full space-y-2">
                <div className="text-xs font-bold text-cyan-300 border-b border-cyan-500/30 pb-1">
                  COMANDOS DE GESTOS OCULARES:
                </div>
                <ul className="text-[11px] space-y-1 text-slate-300">
                  <li className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
                    <span><strong className="text-cyan-200">Piscar 1x Olho Direito:</strong> Ativa / Desativa a Mira.</span>
                  </li>
                  <li className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                    <span><strong className="text-amber-200">Piscar 1x Olho Esquerdo:</strong> Escaneia ambiente (Com Mira Ativa).</span>
                  </li>
                  <li className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span><strong className="text-emerald-200">Piscar 1x Ambos os Olhos:</strong> Responde por voz e Executa na hora.</span>
                  </li>
                </ul>
              </div>

              {/* Caixa de Feedback em Tempo Real */}
              <div className="bg-slate-900/90 border border-cyan-400/60 rounded-lg p-4 backdrop-blur-md max-w-lg w-full">
                <div className="text-[10px] text-cyan-500 font-bold tracking-widest uppercase mb-1">LOG DE RETORNO DO SISTEMA</div>
                <div className="text-sm font-semibold text-cyan-200 bg-slate-950 p-2.5 rounded border border-cyan-900/50 min-h-[48px] flex items-center">
                  {feedbackMsg}
                </div>
              </div>

            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CyberHUD />);
  </script>
</body>
</html>
