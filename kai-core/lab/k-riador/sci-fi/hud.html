<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visão Cibernética AI - Reconhecimento Facial & Gestos</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React e ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel para transpilar JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- MediaPipe Face Mesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    @keyframes scan {
      0% { top: 0%; opacity: 0.8; }
      50% { opacity: 1; }
      100% { top: 100%; opacity: 0.8; }
    }
    .animate-scan {
      animation: scan 2s linear infinite;
    }
    .hud-glow {
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
    }
    .hud-glow-red {
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
    }
  </style>
</head>
<body class="bg-slate-950 text-cyan-400 font-mono overflow-hidden select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function CyberHUD() {
      // Estados do HUD e Sistema
      const [status, setStatus] = useState('INICIALIZANDO SISTEMA...');
      const [faceDetected, setFaceDetected] = useState(false);
      const [aimActive, setAimActive] = useState(false);
      const [scanning, setScanning] = useState(false);
      const [scanResults, setScanResults] = useState(null);
      const [priorities, setPriorities] = useState([]);
      const [awaitingVoice, setAwaitingVoice] = useState(false);
      const [selectedActionIndex, setSelectedActionIndex] = useState(null);
      const [feedbackMsg, setFeedbackMsg] = useState('Aguardando câmera e reconhecimento facial...');
      const [eyeStatusText, setEyeStatusText] = useState('Analisando Visão...');

      // Refs de Câmera, Canvas e Detecção
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const blinkStateRef = useRef({ lastActionTime: 0 });

      // Síntese de Voz (Text-to-Speech)
      const speak = (text, callback) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'pt-BR';
          utterance.rate = 1.0;
          if (callback) utterance.onend = callback;
          window.speechSynthesis.speak(utterance);
        }
      };

      // Inicializa MediaPipe Face Mesh & Câmera
      useEffect(() => {
        let camera = null;

        const faceMesh = new FaceMesh({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.6,
          minTrackingConfidence: 0.6
        });

        faceMesh.onResults(onFaceResults);

        if (videoRef.current) {
          camera = new Camera(videoRef.current, {
            onFrame: async () => {
              if (videoRef.current) {
                await faceMesh.send({ image: videoRef.current });
              }
            },
            width: 1280,
            height: 720
          });
          camera.start();
        }

        return () => {
          if (camera) camera.stop();
          faceMesh.close();
        };
      }, []);

      // Leitura Facial e Gestos dos Olhos em Tempo Real
      const onFaceResults = (results) => {
        const canvasCtx = canvasRef.current?.getContext('2d');
        if (!canvasCtx || !canvasRef.current) return;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          if (!faceDetected) {
            setFaceDetected(true);
            setStatus('SISTEMA OPERACIONAL');
            setFeedbackMsg('Rosto reconhecido com sucesso. Pisque 1x o olho direito para ligar a mira.');
            speak('Rosto reconhecido automaticamente.');
          }

          const landmarks = results.multiFaceLandmarks[0];

          // Pontos de rastreio de interface no rosto
          canvasCtx.fillStyle = '#22d3ee';
          [33, 263, 1, 61, 291].forEach(idx => {
            const pt = landmarks[idx];
            canvasCtx.beginPath();
            canvasCtx.arc(pt.x * canvasRef.current.width, pt.y * canvasRef.current.height, 3, 0, 2 * Math.PI);
            canvasCtx.fill();
          });

          // Cálculo simplificado de Eye Aspect Ratio (EAR)
          const leftTop = landmarks[159].y;
          const leftBottom = landmarks[145].y;
          const leftDist = Math.abs(leftTop - leftBottom);

          const rightTop = landmarks[386].y;
          const rightBottom = landmarks[374].y;
          const rightDist = Math.abs(rightTop - rightBottom);

          const threshold = 0.015; // Limiar de fechamento da pálpebra
          const leftClosed = leftDist < threshold;
          const rightClosed = rightDist < threshold;

          const now = Date.now();
          const cooldown = 900; // Cooldown entre gestos oculares (ms)

          if (now - blinkStateRef.current.lastActionTime > cooldown) {
            // Piscar 1x os DOIS OLHOS
            if (leftClosed && rightClosed) {
              blinkStateRef.current.lastActionTime = now;
              setEyeStatusText('PISCADA DUPLA (AMBOS OS OLHOS)');
              handleBothEyesBlink();
            } 
            // Piscar 1x só OLHO DIREITO
            else if (rightClosed && !leftClosed) {
              blinkStateRef.current.lastActionTime = now;
              setEyeStatusText('OLHO DIREITO PISCOU (1X)');
              handleRightEyeBlink();
            } 
            // Piscar 1x só OLHO ESQUERDO
            else if (leftClosed && !rightClosed) {
              blinkStateRef.current.lastActionTime = now;
              setEyeStatusText('OLHO ESQUERDO PISCOU (1X)');
              handleLeftEyeBlink();
            }
          }
        } else {
          if (faceDetected) {
            setFaceDetected(false);
            setStatus('PROCURANDO ROSTO...');
          }
        }
        canvasCtx.restore();
      };

      // 1. Piscar 1x Olho Direito -> Ativa Mira
      const handleRightEyeBlink = () => {
        setAimActive(prev => {
          const nextState = !prev;
          if (nextState) {
            setFeedbackMsg('Mira ativada! Pisque 1x o olho ESQUERDO para escanear o ambiente.');
            speak('Mira ativada.');
          } else {
            setFeedbackMsg('Mira desativada.');
            speak('Mira desativada.');
          }
          return nextState;
        });
      };

      // 2. Piscar 1x Olho Esquerdo -> Mira faz escaner de tudo
      const handleLeftEyeBlink = () => {
        setAimActive(currentAim => {
          if (!currentAim) {
            setFeedbackMsg('Ative a mira primeiro piscando 1x o Olho DIREITO!');
            speak('Ative a mira primeiro piscando o olho direito.');
            return false;
          }

          executeEnvironmentScan();
          return currentAim;
        });
      };

      // Execução do Escaneamento e Áudio "O que quer fazer senhor?"
      const executeEnvironmentScan = () => {
        setScanning(true);
        setStatus('ESCANEANDO AMBIENTE...');
        setFeedbackMsg('Escaner ativado. Lendo objetos, pessoas, animais e situações...');
        speak('Escaneando todo o ambiente.');

        setTimeout(() => {
          setScanning(false);
          setStatus('ESCANEAMENTO CONCLUÍDO');

          const currentScan = {
            objetos: 'Terminal Cyber, Tela Principal, Xícara de Café',
            pessoas: '1 Pessoa detectada (Operador Principal)',
            animais: 'Nenhum animal detectado na área',
            situacao: 'Ambiente seguro. Sessão de desenvolvimento ativa.'
          };

          const top3Priorities = [
            'Executar otimização de rotina no terminal',
            'Sincronizar dados de varredura com a nuvem',
            'Realizar verificação preventiva de sistema'
          ];

          setScanResults(currentScan);
          setPriorities(top3Priorities);
          setAwaitingVoice(true);

          setFeedbackMsg('Varredura completa! Voz ativada. O que quer fazer senhor?');

          // Mensagem de voz obrigatória após escanear
          speak('O que quer fazer senhor?', () => {
            listenVoiceResponse();
          });
        }, 3000);
      };

      // Captura a opção por Voz
      const listenVoiceResponse = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          setSelectedActionIndex(0);
          setFeedbackMsg('Voz não suportada. Opção 1 marcada. Pisque os dois olhos para executar.');
          return;
        }

        try {
          const recognition = new SpeechRecognition();
          recognition.lang = 'pt-BR';
          recognition.continuous = false;
          recognition.interimResults = false;

          recognition.onstart = () => {
            setFeedbackMsg('Escutando comando de voz... Fale: "Primeira", "Segunda" ou "Terceira".');
          };

          recognition.onresult = (event) => {
            const speechResult = event.results[0][0].transcript.toLowerCase();
            
            if (speechResult.includes('1') || speechResult.includes('primeira') || speechResult.includes('otimização')) {
              setSelectedActionIndex(0);
              speak('Primeira opção selecionada. Pisque os dois olhos para executar na hora.');
            } else if (speechResult.includes('2') || speechResult.includes('segunda') || speechResult.includes('sincronizar')) {
              setSelectedActionIndex(1);
              speak('Segunda opção selecionada. Pisque os dois olhos para executar na hora.');
            } else if (speechResult.includes('3') || speechResult.includes('terceira') || speechResult.includes('verificação')) {
              setSelectedActionIndex(2);
              speak('Terceira opção selecionada. Pisque os dois olhos para executar na hora.');
            } else {
              setSelectedActionIndex(0);
              speak('Comando recebido. Primeira opção configurada. Pisque os dois olhos para executar.');
            }
          };

          recognition.onerror = () => {
            setSelectedActionIndex(0);
            setFeedbackMsg('Opção 1 configurada. Pisque 1x com os dois olhos para executar.');
          };

          recognition.start();
        } catch (err) {
          console.error(err);
        }
      };

      // 3. Piscar 1x os Dois Olhos -> Executa a Ação Selecionada na Hora
      const handleBothEyesBlink = () => {
        if (!aimActive) return;

        if (awaitingVoice || selectedActionIndex !== null) {
          const selectedIdx = selectedActionIndex !== null ? selectedActionIndex : 0;
          const chosenTask = priorities[selectedIdx] || 'Ação do Escaneamento';

          setStatus('EXECUTANDO AÇÃO IMEDIATAMENTE');
          setFeedbackMsg(`Ação acionada: "${chosenTask}"`);
          speak(`Executando agora: ${chosenTask}`);

          setTimeout(() => {
            setAwaitingVoice(false);
            setSelectedActionIndex(null);
            setStatus('SISTEMA OPERACIONAL');
          }, 3500);
        }
      };

      return (
        <div className="relative w-screen h-screen bg-slate-950 flex flex-col items-center justify-center overflow-hidden">
          
          {/* Câmera Real com Overlay HUD */}
          <div className="absolute inset-0 z-0">
            <video 
              ref={videoRef} 
              className="w-full h-full object-cover opacity-40 scale-x-[-1]" 
              playsInline 
              muted 
            />
            <canvas 
              ref={canvasRef} 
              className="absolute inset-0 w-full h-full object-cover scale-x-[-1]" 
              width={1280} 
              height={720} 
            />
          </div>

          {/* Moldura Cibernética HUD */}
          <div className="absolute inset-0 z-10 pointer-events-none border-[12px] border-cyan-500/20 m-2 rounded-xl flex flex-col justify-between p-6">
            
            {/* Topo do Painel HUD */}
            <div className="flex justify-between items-start bg-slate-900/80 p-4 rounded-lg border border-cyan-500/40 backdrop-blur-md pointer-events-auto">
              <div>
                <h1 className="text-xl font-bold tracking-widest text-cyan-300 flex items-center gap-2">
                  <span className="inline-block w-3 h-3 bg-cyan-400 rounded-full animate-ping"></span>
                  VISÃO CIBERNÉTICA AI // MIRA & SCANNER
                </h1>
                <p className="text-xs text-cyan-400/70 mt-1">RECONHECIMENTO FACIAL AUTÔNOMO & GESTOS OCULARES</p>
              </div>

              <div className="text-right">
                <div className="text-xs text-slate-400">STATUS DO SISTEMA</div>
                <div className={`text-sm font-bold tracking-wider ${faceDetected ? 'text-emerald-400' : 'text-amber-400'}`}>
                  {status}
                </div>
                <div className="text-[10px] text-cyan-400/80 mt-1">{eyeStatusText}</div>
              </div>
            </div>

            {/* MIRA ATIVADA COM OLHO DIREITO */}
            {aimActive && (
              <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none flex flex-col items-center justify-center">
                <div className={`relative w-72 h-72 border-2 rounded-full flex items-center justify-center transition-all duration-300 ${scanning ? 'border-red-500 animate-pulse hud-glow-red' : 'border-cyan-400 hud-glow'}`}>
                  
                  <div className="absolute inset-2 border border-dashed border-cyan-300/40 rounded-full"></div>
                  <div className="w-4 h-4 bg-cyan-400/80 rounded-full animate-ping"></div>
                  <div className="absolute w-full h-[1px] bg-cyan-400/50"></div>
                  <div className="absolute h-full w-[1px] bg-cyan-400/50"></div>
                  
                  {scanning && (
                    <div className="absolute w-full h-1 bg-red-500 shadow-[0_0_15px_#ef4444] animate-scan"></div>
                  )}

                  <div className="absolute -top-7 text-xs font-bold text-cyan-300 bg-slate-900/90 px-3 py-1 rounded border border-cyan-400">
                    {scanning ? 'ESCANEANDO TUDO NO AMBIENTE...' : 'MIRA ATIVADA (OLHO DIREITO)'}
                  </div>
                </div>
              </div>
            )}

            {/* PAINEL DE RESULTADOS DO ESCANER E 3 AÇÕES PRIORITÁRIAS */}
            {scanResults && (
              <div className="absolute left-8 top-28 w-96 bg-slate-900/90 border border-cyan-500/50 rounded-lg p-5 backdrop-blur-md pointer-events-auto shadow-2xl space-y-4">
                <div className="border-b border-cyan-500/30 pb-2 flex justify-between items-center">
                  <h2 className="text-sm font-bold text-cyan-300 tracking-wider">DIAGNÓSTICO DO ESCANER</h2>
                  <span className="text-[10px] bg-cyan-950 text-cyan-300 px-2 py-0.5 rounded border border-cyan-500/40">SITUAÇÃO ATIVA</span>
                </div>

                <div className="space-y-1.5 text-xs">
                  <p><span className="text-cyan-400 font-semibold">Objetos:</span> {scanResults.objetos}</p>
                  <p><span className="text-cyan-400 font-semibold">Pessoas:</span> {scanResults.pessoas}</p>
                  <p><span className="text-cyan-400 font-semibold">Animais:</span> {scanResults.animais}</p>
                  <p><span className="text-cyan-400 font-semibold">Situação:</span> {scanResults.situacao}</p>
                </div>

                <div className="pt-2 border-t border-cyan-500/30">
                  <h3 className="text-xs font-bold text-amber-400 mb-2 tracking-wider">3 COISAS PRIORITÁRIAS PARA FAZER:</h3>
                  <div className="space-y-2">
                    {priorities.map((item, idx) => (
                      <div 
                        key={idx}
                        className={`p-2 rounded border text-xs flex items-center justify-between transition-all ${selectedActionIndex === idx ? 'bg-cyan-500/20 border-cyan-400 text-white font-bold' : 'bg-slate-800/60 border-slate-700 text-cyan-200'}`}
                      >
                        <span>{idx + 1}. {item}</span>
                        {selectedActionIndex === idx && (
                          <span className="text-[10px] bg-emerald-500 text-slate-950 font-extrabold px-1.5 py-0.5 rounded">PRONTO</span>
                        )}
                      </div>
                    ))}
                  </div>
                </div>

                {awaitingVoice && (
                  <div className="p-3 bg-amber-500/10 border border-amber-500/40 rounded text-center">
                    <p className="text-xs text-amber-300 font-bold animate-pulse">"O QUE QUER FAZER SENHOR?"</p>
                    <p className="text-[10px] text-slate-400 mt-1">Responda em voz alta ou pisque os dois olhos para executar a opção.</p>
                  </div>
                )}
              </div>
            )}

            {/* PAINEL INFERIOR DE INSTRUÇÕES E LOG */}
            <div className="flex flex-col md:flex-row justify-between items-end gap-4 pointer-events-auto">
              
              <div className="bg-slate-900/85 border border-cyan-500/40 rounded-lg p-4 backdrop-blur-md max-w-md w-full space-y-2">
                <div className="text-xs font-bold text-cyan-300 border-b border-cyan-500/30 pb-1">
                  COMANDOS DE GESTOS DOS OLHOS:
                </div>
                <ul className="text-[11px] space-y-1 text-slate-300">
                  <li className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
                    <span><strong className="text-cyan-200">Olho Direito (1x):</strong> Ativa a Mira Cibernética.</span>
                  </li>
                  <li className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                    <span><strong className="text-amber-200">Olho Esquerdo (1x):</strong> Mira escanear tudo e gera as 3 opções.</span>
                  </li>
                  <li className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span><strong className="text-emerald-200">Dois Olhos (1x):</strong> Confirma resposta por voz e executa a ação na hora.</span>
                  </li>
                </ul>
              </div>

              <div className="bg-slate-900/90 border border-cyan-400/60 rounded-lg p-4 backdrop-blur-md max-w-lg w-full">
                <div className="text-[10px] text-cyan-500 font-bold tracking-widest uppercase mb-1">MENSAGEM DO SISTEMA</div>
                <div className="text-sm font-semibold text-cyan-200 bg-slate-950 p-2.5 rounded border border-cyan-900/50 min-h-[48px] flex items-center">
                  {feedbackMsg}
                </div>
              </div>

            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CyberHUD />);
  </script>
</body>
</html>
