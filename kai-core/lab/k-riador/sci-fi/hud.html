<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visão Cibernética AI - Sistema HUD & Gestos Oculares</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- MediaPipe Face Mesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <!-- Custom HUD Styles & Animations -->
  <style>
    @keyframes scan {
      0% { top: 0%; opacity: 0.8; }
      50% { opacity: 1; }
      100% { top: 100%; opacity: 0.8; }
    }
    .animate-scan {
      animation: scan 2s linear infinite;
    }
    .hud-glow {
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
    }
    .hud-glow-red {
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
    }
  </style>
</head>
<body class="bg-[#020a12] text-cyan-300 font-mono overflow-hidden select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function CyberHUD() {
      // Estados do HUD
      const [status, setStatus] = useState('INICIALIZANDO SISTEMA...');
      const [faceDetected, setFaceDetected] = useState(false);
      const [aimActive, setAimActive] = useState(false);
      const [scanning, setScanning] = useState(false);
      const [scanResults, setScanResults] = useState(null);
      const [priorities, setPriorities] = useState([]);
      const [awaitingVoice, setAwaitingVoice] = useState(false);
      const [selectedActionIndex, setSelectedActionIndex] = useState(null);
      const [feedbackMsg, setFeedbackMsg] = useState('Aguardando câmera e reconhecimento facial...');
      const [eyeStatusText, setEyeStatusText] = useState('Aguardando Detecção...');

      // Refs
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const blinkStateRef = useRef({ lastActionTime: 0 });

      // Síntese de Voz (TTS)
      const speak = (text, callback) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'pt-BR';
          utterance.rate = 1.0;
          if (callback) utterance.onend = callback;
          window.speechSynthesis.speak(utterance);
        }
      };

      // Inicialização da Câmera + MediaPipe Face Mesh
      useEffect(() => {
        let camera = null;

        const faceMesh = new FaceMesh({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.6,
          minTrackingConfidence: 0.6
        });

        faceMesh.onResults(onFaceResults);

        if (videoRef.current) {
          camera = new Camera(videoRef.current, {
            onFrame: async () => {
              if (videoRef.current) {
                await faceMesh.send({ image: videoRef.current });
              }
            },
            width: 1280,
            height: 720
          });
          camera.start();
        }

        return () => {
          if (camera) camera.stop();
          faceMesh.close();
        };
      }, []);

      // Processamento Facial & Detecção dos Olhos
      const onFaceResults = (results) => {
        const canvasCtx = canvasRef.current?.getContext('2d');
        if (!canvasCtx || !canvasRef.current) return;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          if (!faceDetected) {
            setFaceDetected(true);
            setStatus('OPERACIONAL // OPERADOR DETECTADO');
            setFeedbackMsg('Operador reconhecido. Pisque 1x o olho direito para ligar a mira.');
            speak('Rosto reconhecido.');
          }

          const landmarks = results.multiFaceLandmarks[0];

          // Desenha os pontos de HUD no rosto
          canvasCtx.fillStyle = '#22d3ee';
          [33, 263, 1, 61, 291].forEach(idx => {
            const pt = landmarks[idx];
            canvasCtx.beginPath();
            canvasCtx.arc(pt.x * canvasRef.current.width, pt.y * canvasRef.current.height, 2, 0, 2 * Math.PI);
            canvasCtx.fill();
          });

          // Pálpebra Olho Esquerdo
          const leftTop = landmarks[159].y;
          const leftBottom = landmarks[145].y;
          const leftDist = Math.abs(leftTop - leftBottom);

          // Pálpebra Olho Direito
          const rightTop = landmarks[386].y;
          const rightBottom = landmarks[374].y;
          const rightDist = Math.abs(rightTop - rightBottom);

          const threshold = 0.015;
          const leftClosed = leftDist < threshold;
          const rightClosed = rightDist < threshold;

          const now = Date.now();
          const cooldown = 900; // Cooldown em ms

          if (now - blinkStateRef.current.lastActionTime > cooldown) {
            // Piscar Dois Olhos
            if (leftClosed && rightClosed) {
              blinkStateRef.current.lastActionTime = now;
              setEyeStatusText('PISCADA DUPLA (AMBOS OS OLHOS)');
              handleBothEyesBlink();
            } 
            // Piscar Olho Direito
            else if (rightClosed && !leftClosed) {
              blinkStateRef.current.lastActionTime = now;
              setEyeStatusText('OLHO DIREITO PISCOU (MIRA)');
              handleRightEyeBlink();
            } 
            // Piscar Olho Esquerdo
            else if (leftClosed && !rightClosed) {
              blinkStateRef.current.lastActionTime = now;
              setEyeStatusText('OLHO ESQUERDO PISCOU (SCANNER)');
              handleLeftEyeBlink();
            }
          }
        } else {
          if (faceDetected) {
            setFaceDetected(false);
            setStatus('PROCURANDO OPERADOR...');
          }
        }
        canvasCtx.restore();
      };

      // Piscar Olho Direito (1x)
      const handleRightEyeBlink = () => {
        setAimActive(prev => {
          const nextState = !prev;
          if (nextState) {
            setFeedbackMsg('Mira ativada. Pisque 1x o olho ESQUERDO para iniciar o escaneamento.');
            speak('Mira ativada.');
          } else {
            setFeedbackMsg('Mira desativada.');
            speak('Mira desativada.');
          }
          return nextState;
        });
      };

      // Piscar Olho Esquerdo (1x)
      const handleLeftEyeBlink = () => {
        setAimActive(currentAim => {
          if (!currentAim) {
            setFeedbackMsg('Ative a mira primeiro piscando 1x o olho DIREITO!');
            speak('Ative a mira primeiro piscando o olho direito.');
            return false;
          }
          executeEnvironmentScan();
          return currentAim;
        });
      };

      // Executa a varredura do ambiente
      const executeEnvironmentScan = () => {
        setScanning(true);
        setStatus('ESCANEANDO AMBIENTE...');
        setFeedbackMsg('Escaner em execução. Mapeando objetos e ambiente...');
        speak('Escaneando o ambiente.');

        setTimeout(() => {
          setScanning(false);
          setStatus('ESCANEAMENTO CONCLUÍDO');

          const currentScan = {
            objetos: 'Terminal Cyber, Tela Principal, Dispositivos de E/S',
            pessoas: '1 Pessoa detectada (Operador Principal)',
            animais: 'Nenhum animal detectado',
            situacao: 'Ambiente seguro. Sessão ativa.'
          };

          const top3Priorities = [
            'Otimizar rotina de execução no terminal',
            'Sincronizar telemetria com a nuvem',
            'Realizar verificação preventiva de sistema'
          ];

          setScanResults(currentScan);
          setPriorities(top3Priorities);
          setAwaitingVoice(true);
          setFeedbackMsg('Escaneamento concluído! O que quer fazer senhor?');

          speak('O que quer fazer senhor?', () => {
            listenVoiceResponse();
          });
        }, 3000);
      };

      // Captura áudio/voz
      const listenVoiceResponse = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          setSelectedActionIndex(0);
          setFeedbackMsg('Comando de voz indisponível. Opção 1 pré-selecionada.');
          return;
        }

        try {
          const recognition = new SpeechRecognition();
          recognition.lang = 'pt-BR';
          recognition.continuous = false;
          recognition.interimResults = false;

          recognition.onstart = () => {
            setFeedbackMsg('Escutando... Diga: "Primeira", "Segunda" ou "Terceira".');
          };

          recognition.onresult = (event) => {
            const speechResult = event.results[0][0].transcript.toLowerCase();

            if (speechResult.includes('1') || speechResult.includes('primeira')) {
              setSelectedActionIndex(0);
              speak('Primeira opção selecionada. Pisque os dois olhos para executar.');
            } else if (speechResult.includes('2') || speechResult.includes('segunda')) {
              setSelectedActionIndex(1);
              speak('Segunda opção selecionada. Pisque os dois olhos para executar.');
            } else if (speechResult.includes('3') || speechResult.includes('terceira')) {
              setSelectedActionIndex(2);
              speak('Terceira opção selecionada. Pisque os dois olhos para executar.');
            } else {
              setSelectedActionIndex(0);
              speak('Comando recebido. Primeira opção configurada.');
            }
          };

          recognition.onerror = () => {
            setSelectedActionIndex(0);
            setFeedbackMsg('Opção 1 pré-selecionada. Pisque os dois olhos para confirmar.');
          };

          recognition.start();
        } catch (e) {
          console.error(e);
        }
      };

      // Piscar Ambos os Olhos
      const handleBothEyesBlink = () => {
        if (!aimActive) return;

        if (awaitingVoice || selectedActionIndex !== null) {
          const selectedIdx = selectedActionIndex !== null ? selectedActionIndex : 0;
          const chosenTask = priorities[selectedIdx] || 'Ação da Varredura';

          setStatus('EXECUTANDO AÇÃO...');
          setFeedbackMsg(`Executando: "${chosenTask}"`);
          speak(`Executando agora: ${chosenTask}`);

          setTimeout(() => {
            setAwaitingVoice(false);
            setSelectedActionIndex(null);
            setStatus('OPERACIONAL // AGUARDANDO');
          }, 3500);
        }
      };

      return (
        <div className="relative w-screen h-screen bg-[#020a12] flex flex-col items-center justify-center overflow-hidden">
          
          {/* Câmera Real e Overlay do Canvas */}
          <div className="absolute inset-0 z-0">
            <video 
              ref={videoRef} 
              className="w-full h-full object-cover opacity-40 scale-x-[-1]" 
              playsInline 
              muted 
            />
            <canvas 
              ref={canvasRef} 
              className="absolute inset-0 w-full h-full object-cover scale-x-[-1]" 
              width={1280} 
              height={720} 
            />
          </div>

          {/* HUD Cyberpunk Frame */}
          <div className="absolute inset-0 z-10 pointer-events-none border-[18px] border-cyan-400/20 m-2 rounded-[48px] flex flex-col justify-between p-6">
            
            {/* Cabeçalho */}
            <div className="flex justify-between items-start bg-black/80 p-4 rounded-xl border border-cyan-400/40 backdrop-blur-md pointer-events-auto">
              <div>
                <h1 className="text-lg font-bold tracking-[0.2em] text-cyan-300 flex items-center gap-2">
                  <span className="inline-block w-2.5 h-2.5 bg-cyan-400 rounded-full animate-ping"></span>
                  CYBER VISION AI // INTERFACE DE COMANDO
                </h1>
                <p className="text-[10px] text-cyan-400/70 mt-0.5 tracking-wider">MIRA & ESCANER DE AMBIENTE REVOLUCIONÁRIO</p>
              </div>

              <div className="text-right">
                <div className="text-[10px] text-cyan-200/60">STATUS DO SISTEMA</div>
                <div className={`text-xs font-bold tracking-wider ${faceDetected ? 'text-cyan-300' : 'text-yellow-300'}`}>
                  {status}
                </div>
                <div className="text-[9px] text-cyan-400/80 mt-0.5">{eyeStatusText}</div>
              </div>
            </div>

            {/* Retícula de Mira HUD */}
            {aimActive && (
              <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none flex flex-col items-center justify-center">
                <div className={`relative w-72 h-72 border-2 rounded-full flex items-center justify-center transition-all duration-300 ${scanning ? 'border-red-500 animate-pulse hud-glow-red' : 'border-cyan-400 hud-glow'}`}>
                  <div className="absolute inset-2 border border-dashed border-cyan-300/40 rounded-full"></div>
                  <div className="w-3 h-3 bg-cyan-400/80 rounded-full animate-ping"></div>
                  <div className="absolute w-full h-[1px] bg-cyan-400/50"></div>
                  <div className="absolute h-full w-[1px] bg-cyan-400/50"></div>
                  
                  {scanning && (
                    <div className="absolute w-full h-1 bg-red-500 shadow-[0_0_15px_#ef4444] animate-scan"></div>
                  )}

                  <div className="absolute -top-8 text-[11px] font-bold text-cyan-300 bg-black/90 px-3 py-1 rounded border border-cyan-400">
                    {scanning ? 'ESCANEANDO AMBIENTE COMPLETO...' : 'MIRA ATIVADA (OLHO DIREITO)'}
                  </div>
                </div>
              </div>
            )}

            {/* Painel com Diagnóstico e Ações */}
            {scanResults && (
              <div className="absolute left-8 top-28 w-96 bg-black/90 border border-cyan-400/50 rounded-xl p-5 backdrop-blur-md pointer-events-auto shadow-2xl space-y-4">
                <div className="border-b border-cyan-400/30 pb-2 flex justify-between items-center">
                  <h2 className="text-xs font-bold text-cyan-300 tracking-wider">DIAGNÓSTICO DO ESCANER</h2>
                  <span className="text-[9px] bg-cyan-950/60 text-cyan-300 px-2 py-0.5 rounded border border-cyan-400/40">ATIVO</span>
                </div>

                <div className="space-y-1.5 text-[11px] text-cyan-200/80">
                  <p><strong className="text-cyan-300">Objetos:</strong> {scanResults.objetos}</p>
                  <p><strong className="text-cyan-300">Pessoas:</strong> {scanResults.pessoas}</p>
                  <p><strong className="text-cyan-300">Animais:</strong> {scanResults.animais}</p>
                  <p><strong className="text-cyan-300">Situação:</strong> {scanResults.situacao}</p>
                </div>

                <div className="pt-2 border-t border-cyan-400/30">
                  <h3 className="text-[11px] font-bold text-yellow-300 mb-2 tracking-wider">3 AÇÕES PRIORITÁRIAS DETECTADAS:</h3>
                  <div className="space-y-2">
                    {priorities.map((item, idx) => (
                      <div 
                        key={idx}
                        className={`p-2 rounded border text-[11px] flex items-center justify-between transition-all ${selectedActionIndex === idx ? 'bg-cyan-400/30 border-cyan-300 text-white font-bold' : 'bg-black/50 border-cyan-400/20 text-cyan-200'}`}
                      >
                        <span>{idx + 1}. {item}</span>
                        {selectedActionIndex === idx && (
                          <span className="text-[9px] bg-cyan-300 text-black font-extrabold px-1.5 py-0.5 rounded">SELECIONADO</span>
                        )}
                      </div>
                    ))}
                  </div>
                </div>

                {awaitingVoice && (
                  <div className="p-3 bg-yellow-950/80 border border-yellow-400/50 rounded-lg text-center">
                    <p className="text-xs text-yellow-300 font-bold animate-pulse">"O QUE QUER FAZER SENHOR?"</p>
                    <p className="text-[10px] text-white/60 mt-1">Fale em voz alta ou pisque os dois olhos para confirmar.</p>
                  </div>
                )}
              </div>
            )}

            {/* Painel Inferior */}
            <div className="flex flex-col md:flex-row justify-between items-end gap-4 pointer-events-auto">
              
              <div className="bg-black/80 border border-cyan-400/40 rounded-xl p-4 backdrop-blur-md max-w-md w-full space-y-2">
                <div className="text-xs font-bold text-cyan-300 border-b border-cyan-400/30 pb-1">
                  COMANDOS POR GESTO OCULAR:
                </div>
                <ul className="text-[11px] space-y-1 text-white/80">
                  <li className="flex items-center gap-2">
                    <span className="w-1.5 h-1.5 rounded-full bg-cyan-300"></span>
                    <span><strong className="text-cyan-300">Olho Direito (1x):</strong> Ativa / Desativa Mira.</span>
                  </li>
                  <li className="flex items-center gap-2">
                    <span className="w-1.5 h-1.5 rounded-full bg-yellow-300"></span>
                    <span><strong className="text-yellow-300">Olho Esquerdo (1x):</strong> Executa escaner do ambiente.</span>
                  </li>
                  <li className="flex items-center gap-2">
                    <span className="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
                    <span><strong className="text-cyan-200">Ambos os Olhos (1x):</strong> Confirma e executa a ação na hora.</span>
                  </li>
                </ul>
              </div>

              <div className="bg-black/90 border border-cyan-400/60 rounded-xl p-4 backdrop-blur-md max-w-lg w-full">
                <div className="text-[10px] text-cyan-400/70 font-bold tracking-widest uppercase mb-1">LOG DE TELEMETRIA</div>
                <div className="text-xs font-semibold text-cyan-200 bg-[#021018] p-3 rounded-lg border border-cyan-900/50 min-h-[48px] flex items-center">
                  {feedbackMsg}
                </div>
              </div>

            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CyberHUD />);
  </script>
</body>
</html>
