<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interface HUD J.A.R.V.I.S. - Mark 42</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React e ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel para transpilação JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Fonte Futurista / Monospaçada -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Share Tech Mono', 'Courier New', monospace;
    }
    @keyframes pulseHud {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.9; }
    }
    @keyframes scanSweep {
      0% { top: -10%; }
      100% { top: 110%; }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
      90% { opacity: 0.9; }
    }
    @keyframes bootIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    .glow-cyan {
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.6), inset 0 0 12px rgba(0, 240, 255, 0.15);
    }
    .glow-orange {
      box-shadow: 0 0 12px rgba(255, 140, 0, 0.6), inset 0 0 8px rgba(255, 140, 0, 0.2);
    }
    .text-glow {
      text-shadow: 0 0 8px currentColor;
    }
    .scanline {
      background: linear-gradient(to bottom, transparent, rgba(0, 240, 255, 0.35), transparent);
      height: 80px;
    }
  </style>
</head>
<body class="bg-black text-cyan-400 overflow-hidden select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function JarvisHUD() {
      // Estados do Sistema
      const [bootStep, setBootStep] = useState(0);
      const [power, setPower] = useState(88);
      const [altitude, setAltitude] = useState(85000);
      const [coreTemp, setCoreTemp] = useState(74);
      const [thrusterOutput, setThrusterOutput] = useState(92);
      const [chestIntegrity, setChestIntegrity] = useState(98);
      
      const [aimPos, setAimPos] = useState({ x: 50, y: 45 });
      const [faceBox, setFaceBox] = useState({ x: 50, y: 42, w: 22, h: 28, locked: true });
      const [flightEngaged, setFlightEngaged] = useState(false);
      const [camOffline, setCamOffline] = useState(false);

      const [commandLog, setCommandLog] = useState("INICIALIZANDO SUBSISTEMAS DA ARMADURA...");
      const videoRef = useRef(null);

      // Sequência de Inicialização (Boot)
      useEffect(() => {
        const bootTimers = [
          setTimeout(() => setBootStep(1), 600),
          setTimeout(() => setBootStep(2), 1200),
          setTimeout(() => setBootStep(3), 1800),
          setTimeout(() => setBootStep(4), 2400),
          setTimeout(() => {
            setBootStep(5);
            setCommandLog("BEM-VINDO, SENHOR. TODOS OS SISTEMAS MARK 42 ESTÃO OPERACIONAIS.");
          }, 3000)
        ];

        return () => bootTimers.forEach(clearTimeout);
      }, []);

      // Inicialização da Câmera (Com Fallback para Módulo Grid)
      useEffect(() => {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: true })
            .then((stream) => {
              if (videoRef.current) {
                videoRef.current.srcObject = stream;
              }
            })
            .catch(() => {
              setCamOffline(true);
            });
        } else {
          setCamOffline(true);
        }
      }, []);

      // Simulação Telemétrica Contínua
      useEffect(() => {
        if (bootStep < 5) return;

        const interval = setInterval(() => {
          setAltitude(prev => Math.max(1000, prev + (flightEngaged ? 120 : (Math.random() * 40 - 20))));
          setCoreTemp(prev => Math.min(100, Math.max(50, prev + (flightEngaged ? 0.8 : (Math.random() * 2 - 1)))));
          setPower(prev => Math.max(5, prev - (flightEngaged ? 0.05 : 0.01)));

          // Leve oscilação natural na mira
          setAimPos(prev => ({
            x: Math.min(80, Math.max(20, prev.x + (Math.random() * 2 - 1))),
            y: Math.min(80, Math.max(20, prev.y + (Math.random() * 2 - 1)))
          }));
        }, 300);

        return () => clearInterval(interval);
      }, [bootStep, flightEngaged]);

      // Alternar Modo de Voo / Pós-Combustor
      const toggleFlight = () => {
        setFlightEngaged(prev => {
          const next = !prev;
          if (next) {
            setCommandLog("PÓS-COMBUSTOR ENGAJADO // MÓDULO DE VOO EM ALTA ALTITUDE ATIVO");
            setThrusterOutput(100);
          } else {
            setCommandLog("ESTABILIZADORES REATIVADOS // RETORNANDO AO VOO DE CRUZEIRO");
            setThrusterOutput(92);
          }
          return next;
        });
      };

      return (
        <div className="relative w-screen h-screen bg-black overflow-hidden font-mono">
          
          {/* Feed da Câmera Principal */}
          <video 
            ref={videoRef}
            autoPlay 
            muted 
            playsInline 
            className="absolute inset-0 w-full h-full object-cover"
            style={{ transform: 'scaleX(-1)', filter: 'contrast(1.15) brightness(0.9) saturate(0.9)' }}
          />

          {/* Grid de Substituição caso a Câmera esteja Offline */}
          {camOffline && (
            <div className="absolute inset-0 bg-[#020a12]">
              <div 
                className="absolute inset-0 opacity-[0.15]"
                style={{
                  backgroundImage: 'linear-gradient(rgba(0,229,255,0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,0.3) 1px, transparent 1px)',
                  backgroundSize: '40px 40px'
                }}
              />
              <div className="absolute inset-0 flex items-center justify-center">
                <span className="text-cyan-400/40 text-xs tracking-[0.4em]">
                  FEED DE CÂMERA OFFLINE // MODO DE GRADE ATIVO
                </span>
              </div>
            </div>
          )}

          {/* Efeitos de Lente e Vignette HUD */}
          <div className="absolute inset-0 pointer-events-none">
            <div 
              className="absolute inset-0"
              style={{ background: 'radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.35) 68%, rgba(0,0,0,0.95) 92%)' }}
            />
            <div 
              className="absolute inset-0 border-[18px] md:border-[34px] border-black/90 rounded-[48px] md:rounded-[80px]"
              style={{ boxShadow: 'inset 0 0 120px rgba(0,0,0,1), inset 0 0 40px rgba(0,240,255,0.15)' }}
            />
          </div>

          {/* Linha de Varredura Sweep */}
          <div 
            className="absolute left-0 right-0 h-[2px] bg-cyan-400/20 pointer-events-none z-20 top-1/2 mix-blend-screen opacity-60"
            style={{ animation: 'scanSweep 4s linear infinite' }}
          />

          {/* TELA DE INICIALIZAÇÃO (BOOT) */}
          {bootStep < 5 && (
            <div className="absolute inset-0 z-[100] bg-black/80 flex items-center justify-center p-6">
              <div className="w-full max-w-[520px]">
                <div className="border border-cyan-400/50 bg-cyan-950/20 backdrop-blur-md p-6 glow-cyan">
                  <div className="flex items-center gap-3 mb-6">
                    <div className="w-2 h-2 bg-cyan-400 rounded-full animate-ping" />
                    <span className="text-cyan-300 text-[11px] tracking-[0.35em]">
                      J.A.R.V.I.S. INICIALIZANDO
                    </span>
                  </div>
                  
                  <div className="space-y-2 text-[10px] text-cyan-200/80">
                    <div className={bootStep >= 1 ? "opacity-100" : "opacity-0"} style={{ animation: bootStep >= 1 ? "bootIn 0.4s" : "" }}>
                      &gt; CONECTANDO À INTERFACE CENTRAL... {bootStep >= 1 ? "OK" : ""}
                    </div>
                    <div className={bootStep >= 2 ? "opacity-100" : "opacity-0"} style={{ animation: bootStep >= 2 ? "bootIn 0.4s" : "" }}>
                      &gt; CARREGANDO PREFERÊNCIAS DO OPERADOR [{Math.round(power)}%]
                    </div>
                    <div className={bootStep >= 3 ? "opacity-100" : "opacity-0"} style={{ animation: bootStep >= 3 ? "bootIn 0.4s" : "" }}>
                      &gt; CALIBRANDO AMBIENTE VIRTUAL DE VOO...
                    </div>
                    <div className={bootStep >= 4 ? "opacity-100" : "opacity-0"} style={{ animation: bootStep >= 4 ? "bootIn 0.4s" : "" }}>
                      &gt; VERIFICAÇÃO DE SUPERFÍCIES DE CONTROLE... COMO DESEJAR, SENHOR
                    </div>

                    <div className="pt-4 flex gap-1">
                      {[0, 1, 2, 3, 4].map((step) => (
                        <div 
                          key={step} 
                          className={`h-[2px] flex-1 ${step < bootStep ? "bg-cyan-400" : "bg-cyan-900"} transition-all duration-500`}
                        />
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* BARRA SUPERIOR DE STATUS */}
          <div className={`absolute top-0 left-0 right-0 z-40 flex flex-wrap items-center justify-between gap-2 px-3 md:px-8 py-2 md:py-3 bg-black/30 backdrop-blur-[12px] border-b border-cyan-400/30 transition-all duration-700 ${bootStep >= 2 ? "translate-y-0 opacity-100" : "-translate-y-full opacity-0"}`}>
            <div className="flex items-center gap-3 md:gap-6">
              <div className="flex items-center gap-2">
                <div className="w-2 h-2 bg-red-500 rounded-full animate-pulse shadow-[0_0_8px_red]" />
                <span className="text-red-400 text-[10px] md:text-xs tracking-widest text-glow">GRAVANDO</span>
              </div>
              <span className="text-cyan-300 text-[10px] md:text-[11px] tracking-[0.2em]">J.A.R.V.I.S. ONLINE</span>
              <span className="hidden md:inline text-cyan-400/60 text-[10px] tracking-[0.2em]">PAINEL HD ATIVO</span>
            </div>

            <div className="flex items-center gap-4 md:gap-8 text-[10px] md:text-xs">
              <div className="flex items-center gap-2">
                <span className="text-white/50">ENERGIA</span>
                <div className="w-[68px] md:w-[92px] h-[8px] border border-cyan-400/50 bg-black/50 p-[1px]">
                  <div 
                    className="h-full bg-gradient-to-r from-cyan-400 to-cyan-200 transition-all duration-300"
                    style={{ width: `${power}%`, boxShadow: '0 0 8px #00f0ff' }}
                  />
                </div>
                <span className="text-cyan-300 w-[34px]">{Math.round(power)}%</span>
              </div>

              <span className="text-white/70 hidden sm:inline">
                ALT <span className="text-cyan-200">{Math.round(altitude).toLocaleString()} FT</span>
              </span>

              <span className="text-orange-300 hidden md:inline">
                NÚCLEO <span className="text-white">{Math.round(coreTemp)}%</span>
              </span>
            </div>
          </div>

          {/* PAINEL ESQUERDO: NÚCLEO E PROPULSÃO */}
          <div className={`absolute left-2 md:left-6 top-[56px] md:top-[68px] bottom-[92px] w-[148px] md:w-[280px] z-30 flex flex-col gap-2 md:gap-3 transition-all duration-700 delay-300 ${bootStep >= 3 ? "translate-x-0 opacity-100" : "-translate-x-20 opacity-0"}`}>
            
            {/* Núcleo de Energia */}
            <div className="border border-cyan-400/40 bg-black/35 backdrop-blur-md glow-cyan p-2 md:p-3">
              <div className="flex justify-between items-center mb-2">
                <span className="text-[8px] md:text-[10px] tracking-[0.25em] text-cyan-300">NÚCLEO REATOR</span>
                <span className="text-[8px] text-orange-400 animate-pulse">● EM OPERAÇÃO</span>
              </div>

              <div className="relative h-[52px] md:h-[68px] border border-cyan-400/20 bg-cyan-950/20 overflow-hidden flex items-center justify-center">
                <svg viewBox="0 0 200 40" className="w-full h-full">
                  <path 
                    d={`M0 20 Q 10 ${20 - coreTemp / 5} 20 20 T 60 ${20 + Math.sin(Date.now() / 300) * 6} T 100 20 T 140 20 T 200 20`}
                    stroke="#00e5ff" strokeWidth="1.2" fill="none" opacity="0.9" 
                  />
                  <path 
                    d={`M0 24 Q 30 ${24 + thrusterOutput / 10} 60 20 T 120 22 T 200 20`} 
                    stroke="#ff8c00" strokeWidth="0.8" fill="none" opacity="0.6" 
                  />
                </svg>
                <div className="absolute bottom-1 left-2 text-[7px] text-cyan-200/60">
                  SAÍDA {coreTemp.toFixed(1)}%
                </div>
              </div>

              <div className="mt-2 grid grid-cols-2 gap-1 text-[7px] md:text-[8px]">
                <div className="bg-black/60 border border-white/10 p-1">
                  <span className="text-white/40">PROPULSORES</span>
                  <div className="text-cyan-300">{thrusterOutput.toFixed(0)}% POTÊNCIA</div>
                </div>
                <div className="bg-black/60 border border-white/10 p-1">
                  <span className="text-white/40">PLACA TORÁCICA</span>
                  <div className="text-cyan-300">{chestIntegrity.toFixed(0)}% INTEGRIDADE</div>
                </div>
              </div>
            </div>

            {/* Vetor de Propulsão */}
            <div className="border border-cyan-400/30 bg-black/30 backdrop-blur-md p-2 md:p-3">
              <div className="text-[8px] tracking-widest text-cyan-400/70 mb-2">VETOR DE PROPULSÃO</div>
              <div className="flex gap-2">
                <div className="flex-1 space-y-[3px]">
                  {[68, 84, 92, 77].map((val, idx) => (
                    <div key={idx} className="h-[4px] bg-black border border-cyan-900/50">
                      <div className="h-full bg-cyan-400" style={{ width: `${val}%`, opacity: 0.6 + idx * 0.1 }} />
                    </div>
                  ))}
                </div>
                <div className="w-[48px] h-[48px] border border-cyan-400/30 rounded-full flex items-center justify-center relative">
                  <div className="w-[28px] h-[28px] border border-cyan-400/50 rounded-full" style={{ animation: 'pulseHud 2s infinite' }} />
                  <div className="absolute w-[4px] h-[4px] bg-cyan-300 rounded-full" style={{ left: '50%', top: '20%' }} />
                </div>
              </div>
            </div>

            {/* Alerta do Sistema */}
            <div className="border border-orange-400/40 bg-orange-950/20 backdrop-blur p-2 glow-orange">
              <div className="text-[8px] text-orange-300 tracking-widest flex items-center gap-1">
                <span className="w-3 h-[1px] bg-orange-400 inline-block" />
                ALERTA DO SISTEMA
              </div>
              <div className="text-[9px] text-orange-200/80 mt-1 leading-tight">
                PEÇA TORÁCICA NÃO PROJETADA PARA VOO SUSTENTADO. ENERGIA REDUZIDA PARA {Math.round(coreTemp - 12)}%.
              </div>
            </div>

            <div className="hidden md:block text-[7px] text-cyan-300/30 tracking-widest mt-auto">
              PROCESSANDO TELEMETRIA... 842 TB/s // LINK DE CONTROLE EM TERRA ATIVO
            </div>
          </div>

          {/* PAINEL DIREITO: AQUISIÇÃO DE ALVO E MAPA */}
          <div className={`absolute right-2 md:right-6 top-[56px] md:top-[68px] bottom-[92px] w-[148px] md:w-[280px] z-30 flex flex-col gap-2 md:gap-3 transition-all duration-700 delay-500 ${bootStep >= 4 ? "translate-x-0 opacity-100" : "translate-x-20 opacity-0"}`}>
            
            {/* Aquisição de Alvos */}
            <div className="border border-cyan-400/40 bg-black/35 backdrop-blur-md glow-cyan p-2 md:p-3">
              <div className="flex justify-between items-center mb-2">
                <span className="text-[8px] md:text-[10px] tracking-[0.25em] text-cyan-300">AQUISIÇÃO DE ALVO</span>
                <span className="text-[7px] px-1 border border-cyan-400/50 text-cyan-300 animate-pulse">ESCANEANDO</span>
              </div>

              <div className="space-y-1.5">
                {[
                  { id: "DRN-01", dist: "124m", type: "INIMIGO", col: "text-red-400" },
                  { id: "DRN-02", dist: "342m", type: "DESCONHECIDO", col: "text-yellow-300" },
                  { id: "ALY-01", dist: "89m", type: "ALIADO", col: "text-cyan-300" }
                ].map((target, idx) => (
                  <div key={target.id} className="flex items-center justify-between border border-white/10 bg-black/50 px-2 py-[4px] text-[8px]">
                    <div className="flex items-center gap-1.5">
                      <div className={`w-[6px] h-[6px] border ${idx === 0 ? "border-red-400" : idx === 1 ? "border-yellow-400" : "border-cyan-400"} flex items-center justify-center`}>
                        <div className={`w-[2px] h-[2px] ${idx === 0 ? "bg-red-400" : idx === 1 ? "bg-yellow-400" : "bg-cyan-400"}`} />
                      </div>
                      <span className={target.col}>{target.id}</span>
                    </div>
                    <div className="text-right leading-none">
                      <div className="text-white/60">{target.dist}</div>
                      <div className="text-[6px] text-white/30">{target.type}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Mapa de Terreno */}
            <div className="border border-cyan-400/30 bg-black/30 backdrop-blur p-2 md:p-3">
              <div className="text-[8px] text-cyan-400/70 tracking-widest mb-2 flex justify-between">
                <span>MAPA DE TERRENO</span>
                <span className="text-white/30">FL-85K FT</span>
              </div>
              <div className="relative h-[64px] md:h-[84px] bg-[#021018] border border-cyan-900/50 overflow-hidden">
                <div 
                  className="absolute inset-0 opacity-40"
                  style={{
                    backgroundImage: 'linear-gradient(rgba(0,229,255,0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,0.2) 1px, transparent 1px)',
                    backgroundSize: '18px 18px'
                  }}
                />
                <div className="absolute w-full h-[1px] bg-cyan-400/40 top-1/2" />
                <div className="absolute left-1/2 top-0 bottom-0 w-[1px] bg-cyan-400/30" />
                <div className="absolute left-[30%] top-[40%] w-1 h-1 bg-orange-400 rounded-full animate-ping" />
                <div className="absolute left-[62%] top-[55%] w-[10px] h-[10px] border border-cyan-400/60 rotate-45" />
              </div>
              <div className="mt-1 flex justify-between text-[6px] text-white/40">
                <span>CONTROLE DE TRÁFEGO: CONECTADO</span>
                <span>ALTITUDE: 85.000 FT</span>
              </div>
            </div>

            <div className="border border-white/10 bg-black/20 backdrop-blur p-2 text-[7px] text-white/40 leading-tight hidden md:block">
              VETOR DE VOO: {aimPos.x.toFixed(0)}° / {aimPos.y.toFixed(0)}° • VENTO 12KT • TEMP -42°C • O₂ 100% • NÍVEL DE AMEAÇA: <span className="text-orange-300">ELEVADO</span>
            </div>
          </div>

          {/* MIRA CENTRAL E QUADRO DE RECONHECIMENTO FACIAL */}
          <div className="absolute inset-0 z-20 pointer-events-none">
            
            {/* Retícula Principal da Mira */}
            <div 
              className="absolute transition-transform duration-150 ease-out will-change-transform"
              style={{ left: `${aimPos.x}%`, top: `${aimPos.y}%`, transform: 'translate(-50%, -50%)' }}
            >
              <div className="relative w-[120px] h-[120px] md:w-[180px] md:h-[180px] flex items-center justify-center">
                <div className="absolute inset-0 border border-cyan-400/30 rounded-full" style={{ animation: 'pulseHud 3s infinite' }} />
                <div className="absolute inset-[18%] border border-cyan-300/50 rounded-full" style={{ animation: 'pulseHud 2.2s infinite' }} />
                <div className="absolute w-[1px] h-[220px] md:h-[260px] bg-gradient-to-b from-transparent via-cyan-400/50 to-transparent left-1/2 -translate-x-1/2" />
                <div className="absolute h-[1px] w-[220px] md:w-[260px] bg-gradient-to-r from-transparent via-cyan-400/50 to-transparent top-1/2 -translate-y-1/2" />
                
                <div className="absolute top-0 left-0 w-6 h-6 border-l-2 border-t-2 border-cyan-300" />
                <div className="absolute top-0 right-0 w-6 h-6 border-r-2 border-t-2 border-cyan-300" />
                <div className="absolute bottom-0 left-0 w-6 h-6 border-l-2 border-b-2 border-cyan-300" />
                <div className="absolute bottom-0 right-0 w-6 h-6 border-r-2 border-b-2 border-cyan-300" />
                <div className="w-2 h-2 bg-cyan-300 rounded-full shadow-[0_0_10px_#00f0ff]" />
              </div>
            </div>

            {/* Quadro de Reconhecimento Facial / Biométrico */}
            <div 
              className="absolute border transition-all duration-500 ease-out"
              style={{
                left: `${faceBox.x}%`,
                top: `${faceBox.y}%`,
                width: `${faceBox.w}%`,
                height: `${faceBox.h}%`,
                transform: 'translate(-50%, -50%)',
                borderColor: faceBox.locked ? '#00f0ff' : 'rgba(255,255,255,0.3)',
                boxShadow: faceBox.locked ? '0 0 18px rgba(0,240,255,0.6), inset 0 0 12px rgba(0,240,255,0.2)' : 'none'
              }}
            >
              <div className="absolute -top-[2px] -left-[2px] w-3 h-3 border-l-2 border-t-2 border-cyan-300" />
              <div className="absolute -top-[2px] -right-[2px] w-3 h-3 border-r-2 border-t-2 border-cyan-300" />
              <div className="absolute -bottom-[2px] -left-[2px] w-3 h-3 border-l-2 border-b-2 border-cyan-300" />
              <div className="absolute -bottom-[2px] -right-[2px] w-3 h-3 border-r-2 border-b-2 border-cyan-300" />
              
              <div className="absolute -top-5 left-0 text-[7px] px-1 bg-black/70 border border-cyan-400/40 text-cyan-300 tracking-widest">
                TRAVA FACIAL 94%
              </div>
              <div 
                className="absolute left-0 right-0 h-[1px] bg-cyan-300/70"
                style={{ top: '40%', animation: 'scanSweep 1.6s linear infinite' }}
              />
            </div>

          </div>

          {/* RODAPÉ DO SISTEMA E CONTROLE DE VOO */}
          <div className={`absolute bottom-0 left-0 right-0 z-40 transition-all duration-700 delay-700 ${bootStep >= 3 ? "translate-y-0 opacity-100" : "translate-y-full opacity-0"}`}>
            
            {/* Terminal do Log de Comandos */}
            <div className="mx-2 md:mx-6 mb-2 md:mb-4 border border-cyan-400/30 bg-black/45 backdrop-blur-[14px] glow-cyan">
              <div className="flex items-center gap-2 px-3 py-1.5 border-b border-cyan-400/20 bg-cyan-950/20">
                <span className="text-[8px] tracking-[0.3em] text-cyan-300">TERMINAL DE COMANDOS</span>
                <div className="flex-1 h-[1px] bg-gradient-to-r from-cyan-400/40 to-transparent" />
                <span className="text-[7px] text-white/30">MARK 42 • STARK INDUSTRIES</span>
              </div>
              <div className="px-3 py-2 flex items-center gap-3">
                <span className="text-[10px] md:text-xs text-cyan-200 tracking-wide min-h-[1.2em]">
                  {commandLog}
                  <span className="ml-1 inline-block w-[8px] h-[12px] bg-cyan-300 align-middle" style={{ animation: 'blink 1s infinite' }} />
                </span>
              </div>
            </div>

            {/* Botoeira Central de Ação */}
            <div className="flex justify-center items-end gap-3 md:gap-6 pb-3 md:pb-4 px-3">
              <div className="hidden md:flex items-center gap-2 text-[7px] text-white/30">
                <div className="w-16 h-[2px] bg-white/10">
                  <div className="h-full bg-cyan-400" style={{ width: `${thrusterOutput}%` }} />
                </div>
                <span>ESTABILIZADORES</span>
              </div>

              <button 
                onClick={toggleFlight}
                className={`pointer-events-auto relative px-6 md:px-10 py-2.5 md:py-3 border text-[11px] md:text-[13px] tracking-[0.35em] transition-all duration-300 ${
                  flightEngaged 
                    ? "bg-orange-500 text-black border-orange-300 shadow-[0_0_30px_rgba(255,140,0,0.8)]" 
                    : "bg-black/60 text-cyan-300 border-cyan-400/60 hover:bg-cyan-950/40 hover:shadow-[0_0_24px_rgba(0,240,255,0.5)] backdrop-blur"
                }`}
              >
                <span className="relative z-10">
                  {flightEngaged ? "VOO ENGAJADO // 85K FT" : "ENGAJAR VOO"}
                </span>
                <div 
                  className="absolute inset-0 border border-cyan-400/20 pointer-events-none"
                  style={{ clipPath: 'polygon(8% 0, 100% 0, 92% 100%, 0 100%)' }}
                />
              </button>

              <div className="hidden md:flex items-center gap-2 text-[7px] text-white/30">
                <span>ENERGIA</span>
                <div className="w-16 h-[2px] bg-white/10">
                  <div className="h-full bg-orange-400" style={{ width: `${power}%` }} />
                </div>
              </div>
            </div>

          </div>

          {/* Efeito Visual do Pós-Combustor em Voo */}
          {flightEngaged && (
            <div 
              className="absolute inset-0 z-30 pointer-events-none border-[3px] border-orange-400/50"
              style={{ boxShadow: 'inset 0 0 120px rgba(255,140,0,0.35)', animation: 'flicker 0.15s infinite' }}
            >
              <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-orange-300 text-[12px] tracking-[0.6em] border border-orange-400 px-4 py-2 bg-black/60">
                PÓS-COMBUSTOR ATIVO
              </div>
            </div>
          )}

          {/* Grão de Ruído de Fundo */}
          <div 
            className="absolute inset-0 pointer-events-none opacity-[0.06] mix-blend-overlay"
            style={{
              backgroundImage: `url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E")`
            }}
          />

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <React.StrictMode>
        <JarvisHUD />
      </React.StrictMode>
    );
  </script>
</body>
</html>
