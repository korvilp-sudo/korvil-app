<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cgm iron ui</title>
<style>
  body { margin:0; background:#000; overflow:hidden; }
  #video { position:absolute; width:100vw; height:100vh; object-fit:cover; z-index:1; filter:brightness(0.35); }
  #canvas { position:absolute; width:100vw; height:100vh; z-index:2; }
  #msg { position:absolute; z-index:3; top:15px; width:100%; text-align:center; color:#0ff; font-family:'Courier New'; font-size:14px; text-shadow:0 0 8px #0ff; }
 .btn { position:absolute; z-index:4; padding:10px 16px; background:rgba(0,255,255,0.15); border:2px solid #0ff; color:#0ff; border-radius:20px; font-family:'Courier New'; }
  #btn_cap { bottom:20px; left:20px; }
  #btn_luva { bottom:20px; right:20px; }
  #btn_camera { bottom:70px; right:20px; }
 .btn.active { background:#0ff; color:#000; box-shadow:0 0 20px #0ff; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
  <div id="msg">clique em CAPACETE ou LUVAS para ativar</div>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <button id="btn_cap" class="btn">CAPACETE</button>
  <button id="btn_luva" class="btn">LUVAS</button>
  <button id="btn_camera" class="btn">CAMERA</button>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let capAtivo = false;
let luvaAtiva = false;
let useFront = true;
let face = null, hand1 = null, hand2 = null;
let appScreen = null;

// 1. HANDS = LUVAS
const hands = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({maxNumHands: 2});
hands.onResults(r => {
  if(r.multiHandLandmarks.length > 0){
    hand1 = r.multiHandLandmarks[0];
    hand2 = r.multiHandLandmarks[1] || null;
  } else { hand1 = null; hand2 = null; }
});

// 2. FACEMESH = CAPACETE
const faceMesh = new FaceMesh({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
faceMesh.setOptions({maxNumFaces: 1, refineLandmarks: true});
faceMesh.onResults(r => {
  face = r.multiFaceLandmarks[0] || null;
});

// LOOP PRINCIPAL
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 25;

  if(capAtivo && face) drawCapacete(face);
  if(luvaAtiva && hand1) drawLuvas(hand1, hand2);
  if(appScreen && hand1) drawTela(appScreen, hand1);

  requestAnimationFrame(draw);
}
draw();

// CAPACETE: VISOR + MIRA + PONTOS
function drawCapacete(landmarks){
  const olhoE = landmarks[159];
  const olhoD = landmarks[386];
  const boca = landmarks[13];

  const ex = olhoE.x * canvas.width, ey = olhoE.y * canvas.height;
  const dx = olhoD.x * canvas.width, dy = olhoD.y * canvas.height;
  const bx = boca.x * canvas.width, by = boca.y * canvas.height;

  // VISOR
  ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(dx, dy); ctx.stroke();

  // MIRA OLHOS
  ctx.fillStyle = '#ff0000';
  ctx.beginPath(); ctx.arc(ex, ey, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(dx, dy, 5, 0, Math.PI*2); ctx.fill();

  // MIRA BOCA
  ctx.strokeStyle = '#00ff00';
  ctx.beginPath(); ctx.arc(bx, by, 20, 0, Math.PI*2); ctx.stroke();

  // PONTOS CAPACETE
  for(let i=0; i<468; i+=30){
    const p = landmarks[i];
    ctx.fillStyle = 'rgba(0,255,255,0.4)';
    ctx.beginPath(); ctx.arc(p.x*canvas.width, p.y*canvas.height, 2, 0, Math.PI*2); ctx.fill();
  }
}

// LUVAS: HOLOGRAMA + 3 BOTOES
function drawLuvas(h1, h2){
  const px = h1[9].x * canvas.width; // palma
  const py = h1[9].y * canvas.height;
  const tx = h1[4].x * canvas.width; // polegar

  // aneis
  for(let i=0; i<3; i++){
    ctx.beginPath();
    ctx.arc(px, py, 50 + i*20, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(0,255,255,${1 - i*0.3})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // BOTOES DA LUVA
  const botoes = [
    {id:'menu', text:'MENU', y:-50},
    {id:'mapa', text:'MAPA', y:0},
    {id:'arma', text:'ARMA', y:50},
  ];

  botoes.forEach(b => {
    b.x = tx + 90;
    b.y = py + b.y;
    ctx.fillStyle = 'rgba(0,255,255,0.2)';
    ctx.fillRect(b.x-30, b.y-15, 60, 30);
    ctx.strokeStyle = '#00ffff';
    ctx.strokeRect(b.x-30, b.y-15, 60, 30);
    ctx.fillStyle = '#fff'; ctx.font = '14px Courier New'; ctx.textAlign = 'center';
    ctx.fillText(b.text, b.x, b.y+5);

    // CLIQUE COM OUTRA MAO
    if(h2){
      const cx = h2[8].x * canvas.width;
      const cy = h2[8].y * canvas.height;
      if(cx > b.x-30 && cx < b.x+30 && cy > b.y-15 && cy < b.y+15){
        ativarFuncao(b.id);
        // desenha dedo
        ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI*2); ctx.fillStyle = '#ff00ff'; ctx.fill();
      }
    }
  });
}

function ativarFuncao(id){
  if(id === 'menu') { appScreen = 'menu'; msg.innerText = "MENU ATIVO"; }
  if(id === 'mapa') { appScreen = 'mapa'; msg.innerText = "MAPA ATIVO"; }
  if(id === 'arma') { appScreen = 'arma'; msg.innerText = "ARMA ATIVA"; }
  setTimeout(()=> appScreen = null, 2000); // fecha tela em 2s
}

function drawTela(tipo, hand){
  const x = hand[9].x * canvas.width - 120;
  const y = hand[9].y * canvas.height - 60;
  ctx.fillStyle = 'rgba(0,10,30,0.9)';
  ctx.fillRect(x,y,240,120);
  ctx.strokeStyle = '#0ff'; ctx.strokeRect(x,y,240,120);
  ctx.fillStyle = '#0ff'; ctx.font = '16px Courier New'; ctx.textAlign = 'center';
  ctx.fillText(tipo.toUpperCase(), x+120, y+60);
}

// BOTOES DE ATIVAR
document.getElementById('btn_cap').onclick = () => {
  capAtivo =!capAtivo;
  document.getElementById('btn_cap').classList.toggle('active');
  msg.innerText = capAtivo? "CAPACETE ATIVADO" : "CAPACETE DESATIVADO";
}

document.getElementById('btn_luva').onclick = () => {
  luvaAtiva =!luvaAtiva;
  document.getElementById('btn_luva').classList.toggle('active');
  msg.innerText = luvaAtiva? "LUVAS ATIVADAS" : "LUVAS DESATIVADAS";
}

document.getElementById('btn_camera').onclick = async () => {
  useFront =!useFront;
  const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: useFront? "user":"environment"}});
  video.srcObject = stream;
  video.style.transform = useFront? 'scaleX(-1)' : 'scaleX(1)';
}

// LIGA CAMERA
navigator.mediaDevices.getUserMedia({video:true}).then(stream=>{
  video.srcObject = stream;
  const camera = new Camera(video, {
    onFrame: async () => {
      await hands.send({image: video});
      await faceMesh.send({image: video});
    }
  });
  camera.start();
});
</script>
</body>
</html>
