<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>holograma cgm auto</title>
<style>
  body { margin:0; background:#000; overflow:hidden; }
  #video { position:absolute; top:0; left:0; width:100vw; height:100vh; object-fit:cover; z-index:1; filter:brightness(0.35); transform:scaleX(-1); }
  #canvas { position:absolute; top:0; left:0; width:100vw; height:100vh; z-index:2; pointer-events:none; }
  #ui { position:absolute; z-index:3; top:10px; width:100%; text-align:center; font-size:12px; color:#0ff; font-family:'Courier New'; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
</head>
<body>
  <div id="ui">aponte a mao para ativar o holograma</div>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

<script>
const videoElement = document.getElementById('video');
const canvasElement = document.getElementById('canvas');
const canvasCtx = canvasElement.getContext('2d');
const uiText = document.getElementById('ui');

let handBase = null; // mao 1 - segura o holograma
let handInteract = null; // mao 2 - clica
let hologramActive = false;
let appScreen = null;
let loadingPercent = 0;
let lastClickTime = 0;

const buttons = [
  {id: 'grid', icon: '■', y_offset: -50, active: false},
  {id: 'settings', icon: '⚙', y_offset: 0, active: false},
  {id: 'power', icon: '⚡', y_offset: 50, active: false},
];

function resize() {
  canvasElement.width = window.innerWidth;
  canvasElement.height = window.innerHeight;
}
resize();
window.onresize = resize;

// LIGA CAMERA AUTOMATICO
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "user"}});
  videoElement.srcObject = stream;

  const camera = new Camera(videoElement, {
    onFrame: async () => { await hands.send({image: videoElement}); },
    width: 1280, height: 720
  });
  camera.start();
}

// MEDIAPIPE
const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
hands.setOptions({ maxNumHands: 2, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

hands.onResults((results) => {
  canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
  canvasCtx.shadowColor = '#00ffff';
  canvasCtx.shadowBlur = 30;

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    // AUTO ATIVAR
    if(!hologramActive) {
      hologramActive = true;
      uiText.innerText = "holograma ativo - use a outra mao para clicar";
    }

    handBase = results.multiHandLandmarks[0]; // primeira mao = base
    handInteract = results.multiHandLandmarks[1] || null; // segunda mao = interage

    // 1. DESENHA HOLOGRAMA FIXO NA PALMA DA MAO 1
    drawHologramOnHand(handBase);

    // 2. SE TIVER MAO 2, ELA CLICA
    if(handInteract) {
      drawPointer(handInteract[8]);
      handleButtonClick(handInteract[8], handBase);
    }

    // 3. DESENHA TELA DO APP SE ESTIVER ABERTA
    if(appScreen) drawAppScreen(handBase);

  } else {
    // SEM MAO = DESATIVA
    if(hologramActive) {
      hologramActive = false;
      appScreen = null;
      uiText.innerText = "aponte a mao para ativar o holograma";
    }
  }
});

function drawHologramOnHand(landmarks) {
  const palmX = landmarks[9].x * canvasElement.width; // centro da palma
  const palmY = landmarks[9].y * canvasElement.height;
  const thumbX = landmarks[4].x * canvasElement.width; // polegar

  // circulos girando na palma
  for(let i=0; i<4; i++) {
    canvasCtx.beginPath();
    canvasCtx.arc(palmX, palmY, 50 + i*25, 0, 2 * Math.PI);
    canvasCtx.strokeStyle = `rgba(0,255,255,${1 - i*0.2})`;
    canvasCtx.lineWidth = 2;
    canvasCtx.stroke();
  }

  // botoes flutuando do lado do polegar - SEMPRE SEGUEM A MAO
  buttons.forEach(b => {
    b.x = thumbX + 90; // 90px do polegar
    b.y = palmY + b.y_offset;
    drawHexagon(b.x, b.y, 28, b.active);
    canvasCtx.fillStyle = '#fff';
    canvasCtx.font = '20px sans-serif';
    canvasCtx.textAlign = 'center';
    canvasCtx.fillText(b.icon, b.x, b.y + 7);
  });
}

function drawHexagon(x, y, radius, active) {
  canvasCtx.beginPath();
  for(let i=0; i<6; i++){
    const angle = Math.PI / 3 * i - Math.PI/6;
    const px = x + radius * Math.cos(angle);
    const py = y + radius * Math.sin(angle);
    if(i===0) canvasCtx.moveTo(px, py); else canvasCtx.lineTo(px, py);
  }
  canvasCtx.closePath();
  canvasCtx.fillStyle = active? 'rgba(0,255,255,1)' : 'rgba(0,255,255,0.25)';
  canvasCtx.fill();
  canvasCtx.strokeStyle = '#00ffff';
  canvasCtx.lineWidth = 2;
  canvasCtx.stroke();
}

function drawAppScreen(landmarks) {
  const x = landmarks[9].x * canvasElement.width - 160;
  const y = landmarks[9].y * canvasElement.height - 100;
  const w = 320; const h = 200;

  canvasCtx.fillStyle = 'rgba(0, 10, 30, 0.8)';
  canvasCtx.fillRect(x, y, w, h);
  canvasCtx.strokeStyle = '#00ffff';
  canvasCtx.strokeRect(x, y, w, h);

  if(appScreen === 'loading') {
    canvasCtx.fillStyle = '#00ffff';
    canvasCtx.font = '24px Courier New';
    canvasCtx.textAlign = 'center';
    canvasCtx.fillText(`loading ${loadingPercent}%`, x + w/2, y + h/2);
  }

  if(appScreen === 'mapa') {
    canvasCtx.fillStyle = 'rgba(0, 80, 40, 0.9)';
    canvasCtx.fillRect(x + 10, y + 10, w - 20, h - 20);
    canvasCtx.strokeStyle = '#00ff88';
    for(let i=0; i<3; i++){
      canvasCtx.beginPath();
      canvasCtx.moveTo(x + 10, y + 10 + i*50);
      canvasCtx.lineTo(x + w - 10, y + 10 + i*50);
      canvasCtx.stroke();
    }
    canvasCtx.fillStyle = '#ff0000';
    canvasCtx.beginPath();
    canvasCtx.arc(x + 70, y + 50, 4, 0, 2 * Math.PI); canvasCtx.fill();
    canvasCtx.fillStyle = '#fff';
    canvasCtx.font = '11px Courier New';
    canvasCtx.fillText("3 km - 30 min", x + 160, y + 180);
  }
}

function handleButtonClick(landmark, baseHand) {
  const now = Date.now();
  if(now - lastClickTime < 500) return; // anti spam

  const x = landmark.x * canvasElement.width;
  const y = landmark.y * canvasElement.height;

  buttons.forEach(b => {
    const dist = Math.sqrt(Math.pow(x - b.x, 2) + Math.pow(y - b.y, 2));
    if(dist < 35) {
      lastClickTime = now;
      b.active = true;
      setTimeout(() => b.active = false, 250);

      if(b.id === 'grid') {
        appScreen = 'loading';
        loadingPercent = 0;
        let interval = setInterval(() => {
          loadingPercent += 5;
          if(loadingPercent >= 100) {
            clearInterval(interval);
            appScreen = 'mapa';
          }
        }, 100);
      }
      if(b.id === 'power') {
        appScreen = null;
      }
    }
  })
}

function drawPointer(landmark) {
  const x = landmark.x * canvasElement.width;
  const y = landmark.y * canvasElement.height;
  canvasCtx.beginPath();
  canvasCtx.arc(x, y, 12, 0, 2 * Math.PI);
  canvasCtx.fillStyle = '#ff00ff';
  canvasCtx.fill();
}

startCamera();
</script>
</body>
</html>
