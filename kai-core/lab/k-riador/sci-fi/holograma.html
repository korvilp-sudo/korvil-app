<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>luva ui</title>
<style>
  body { margin:0; background:#000; overflow:hidden; }
  #video { position:absolute; width:100vw; height:100vh; object-fit:cover; z-index:1; filter:brightness(0.3); transform:scaleX(-1); }
  #canvas { position:absolute; width:100vw; height:100vh; z-index:2; }
  #msg { position:absolute; z-index:3; top:20px; width:100%; text-align:center; color:#0ff; font-family:'Courier New'; font-size:18px; text-shadow:0 0 10px #0ff; }
  #btn_luva { position:absolute; z-index:4; bottom:30px; left:50%; transform:translateX(-50%); padding:15px 30px; background:rgba(0,255,255,0.1); border:3px solid #0ff; color:#0ff; border-radius:30px; font-family:'Courier New'; font-size:18px; }
  #btn_luva.active { background:#0ff; color:#000; }
  #alvo { position:absolute; z-index:3; width:100px; height:100px; border:4px dashed #ff0; border-radius:50%; left:50%; top:50%; transform:translate(-50%,-50%); display:none; box-shadow:0 0 30px #ff0; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>
  <div id="msg">clique em LUVAS</div>
  <div id="alvo"></div>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <button id="btn_luva">LUVAS</button>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');
const alvo = document.getElementById('alvo');
const btn = document.getElementById('btn_luva');

canvas.width = innerWidth; canvas.height = innerHeight;

let luvaOn = false, luvaPega = false;
let luvaX = canvas.width/2, luvaY = canvas.height/2;
let tempo = 0, ultimoClick = 0;
let handsData = null;

// HANDS
const hands = new Hands({locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
hands.setOptions({maxNumHands: 2});
hands.onResults(res => { handsData = res.multiHandLandmarks; });

// LIGA CAMERA
navigator.mediaDevices.getUserMedia({video:true}).then(s => { video.srcObject = s; });

btn.onclick = () => {
  luvaOn =!luvaOn;
  btn.classList.toggle('active');
  alvo.style.display = luvaOn? 'block' : 'none';
  luvaPega = false; tempo = 0;
  msg.innerText = luvaOn? "coloque a mao no circulo" : "clique em LUVAS";
}

function draw(){
  if(video.readyState >= 2){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.shadowBlur = 20; ctx.shadowColor = '#0ff';

    if(luvaOn && handsData){
      const m1 = handsData[0];
      const m2 = handsData[1];

      if(m1){
        // ESPELHO PRA FICAR CERTO NA FRONTAL
        let px = (1 - m1[9].x) * canvas.width;
        let py = m1[9].y * canvas.height;

        // 1. ATIVAR NO ALVO
        if(!luvaPega){
          let d = Math.hypot(px - luvaX, py - luvaY);
          if(d < 70){
            tempo += 0.016;
            msg.innerText = `segurando... ${Math.ceil(3-tempo)}`;
            ctx.beginPath(); ctx.arc(luvaX, luvaY, 60, 0, Math.PI*2 * tempo/3); ctx.strokeStyle='#ff0'; ctx.lineWidth=4; ctx.stroke();
            if(tempo >= 3){ luvaPega = true; alvo.style.display='none'; msg.innerText="luva ativa"; }
          } else { tempo = 0; }
        }
        // 2. SEGUIR MAO
        else {
          luvaX = px; luvaY = py;
          // desenha holograma
          for(let i=0;i<3;i++){
            ctx.beginPath(); ctx.arc(luvaX, luvaY, 50+i*15, 0, Math.PI*2);
            ctx.strokeStyle=`rgba(0,255,255,${1-i*0.3})`; ctx.lineWidth=3; ctx.stroke();
          }

          // BOTOES
          let botoes = [{t:'MENU',y:-60},{t:'MAPA',y:0},{t:'ARMA',y:60}];
          botoes.forEach(b=>{
            let bx = luvaX+100, by = luvaY+b.y;
            ctx.fillStyle='rgba(0,255,255,0.2)'; ctx.fillRect(bx-40,by-20,80,40);
            ctx.strokeStyle='#0ff'; ctx.strokeRect(bx-40,by-20,80,40);
            ctx.fillStyle='#fff'; ctx.font='16px Courier'; ctx.textAlign='center'; ctx.fillText(b.t,bx,by+6);

            // 3. PINÇA PRA CLICAR
            if(m2){
              let ix = (1 - m2[8].x) * canvas.width;
              let iy = m2[8].y * canvas.height;
              let pix = (1 - m2[4].x) * canvas.width;
              let piy = m2[4].y * canvas.height;
              let pinca = Math.hypot(ix-pix, iy-piy);
              if(pinca < 40 && Date.now()-ultimoClick > 600){
                if(ix>bx-40 && ix<bx+40 && iy>by-20 && iy<by+20){
                  ultimoClick = Date.now();
                  msg.innerText = b.t + " CLICADO";
                  setTimeout(()=>msg.innerText="luva ativa",1000);
                }
              }
            }
          });
        }
      }
    }
  }
  hands.send({image: video});
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
