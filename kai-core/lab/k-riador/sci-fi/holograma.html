<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cgm luva ui</title>
<style>
  body { margin:0; background:#000; overflow:hidden; }
  #video { position:absolute; width:100vw; height:100vh; object-fit:cover; z-index:1; transform:scaleX(-1); filter:brightness(0.3); }
  #canvas { position:absolute; width:100vw; height:100vh; z-index:2; }
  #msg { position:absolute; z-index:3; top:20px; width:100%; text-align:center; color:#0ff; font-family:'Courier New'; font-size:18px; text-shadow:0 0 10px #0ff; }
.btn { position:absolute; z-index:4; bottom:30px; left:50%; transform:translateX(-50%); padding:15px 35px; background:rgba(0,255,255,0.1); border:3px solid #0ff; color:#0ff; border-radius:30px; font-family:'Courier New'; font-size:18px; }
.btn.active { background:#0ff; color:#000; box-shadow:0 0 25px #0ff; }
 #alvo { position:absolute; z-index:3; width:120px; height:120px; border:4px dashed #ff0; border-radius:50%; left:50%; top:50%; transform:translate(-50%,-50%); display:none; box-shadow:0 0 30px #ff0; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
  <div id="msg">clique em LUVAS para ativar</div>
  <div id="alvo"></div>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <button id="btn_luva" class="btn">LUVAS</button>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');
const alvo = document.getElementById('alvo');
const btn = document.getElementById('btn_luva');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let luvaAtiva = false;
let hands = null;
let luvaPega = false;
let luvaPos = {x: canvas.width/2, y: canvas.height/2};
let contagem = 0, ultimoClique = 0;

// 1. HANDS
const handsDetector = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
handsDetector.setOptions({maxNumHands: 2, minDetectionConfidence: 0.5});
handsDetector.onResults(r => { hands = r.multiHandLandmarks; });

function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 20;

  if(luvaAtiva && hands) desenharLuvas(hands);

  requestAnimationFrame(loop);
}
loop();

// LUVAS: PONTO -> 3S -> SEGUIR MAO -> PINÇAR
function desenharLuvas(handsData){
  const mao1 = handsData[0]; // mao que ativa e segue
  const mao2 = handsData[1] || null; // mao que clica

  if(!mao1) { if(!luvaPega) contagem = 0; return; }

  // CORREÇÃO: video ta espelhado com scaleX(-1)
  // entao pra ficar certo: lado esquerdo real = lado esquerdo tela
  // basta inverter o X que vem do mediapipe
  let palmaX = (1 - mao1[9].x) * canvas.width;
  let palmaY = mao1[9].y * canvas.height;

  // 1. MOSTRA PONTO ALVO
  if(!luvaPega){
    alvo.style.display = 'block';
    const dist = Math.hypot(palmaX - luvaPos.x, palmaY - luvaPos.y);

    // 2. DEIXAR MAO NO PONTO POR 3S
    if(dist < 80){
      contagem += 1/60;
      msg.innerText = `segure no ponto... ${Math.ceil(3 - contagem)}s`;
      ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(luvaPos.x, luvaPos.y, 70, 0, Math.PI*2 * (contagem/3)); ctx.stroke();

      if(contagem >= 3){
        luvaPega = true;
        contagem = 0;
        alvo.style.display = 'none';
        msg.innerText = "luva ativa - use a outra mao para clicar";
      }
    } else {
      contagem = 0;
      msg.innerText = "coloque a palma da mao no circulo amarelo";
    }
  }

  // 3. SE JA PEGOU, HOLOGRAMA SEGUE A MAO
  if(luvaPega){
    luvaPos.x = palmaX;
    luvaPos.y = palmaY;

    // DESENHAR HOLOGRAMA NA MAO
    for(let i=0; i<3; i++){
      ctx.beginPath();
      ctx.arc(luvaPos.x, luvaPos.y, 55 + i*18, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(0,255,255,${1 - i*0.3})`;
      ctx.lineWidth = 3; ctx.stroke();
    }

    // BOTOES DO HOLOGRAMA
    const botoes = [
      {id:'menu', text:'MENU', y:-70},
      {id:'mapa', text:'MAPA', y:0},
      {id:'arma', text:'ARMA', y:70},
    ];

    botoes.forEach(b => {
      b.x = luvaPos.x + 110; b.y = luvaPos.y + b.y;
      ctx.fillStyle = 'rgba(0,255,255,0.2)';
      ctx.fillRect(b.x-45, b.y-22, 90, 44);
      ctx.strokeStyle = '#00ffff'; ctx.strokeRect(b.x-45, b.y-22, 90, 44);
      ctx.fillStyle = '#fff'; ctx.font = '16px Courier New'; ctx.textAlign = 'center';
      ctx.fillText(b.text, b.x, b.y+6);

      // 4. CLIQUE PINÇA: indicador + polegar da mao2
      if(mao2){
        // tambem inverte X da mao2 por causa do espelho
        let indX = (1 - mao2[8].x) * canvas.width;
        let indY = mao2[8].y * canvas.height;
        let poleX = (1 - mao2[4].x) * canvas.width;
        let poleY = mao2[4].y * canvas.height;
        let distPinca = Math.hypot(indX-poleX, indY-poleY);

        if(distPinca < 45 && Date.now() - ultimoClique > 600){ // pinçou
          if(indX > b.x-45 && indX < b.x+45 && indY > b.y-22 && indY < b.y+22){
            ultimoClique = Date.now();
            msg.innerText = b.text + " ATIVADO";
            setTimeout(()=> msg.innerText = "luva ativa - use a outra mao para clicar", 1000);
          }
        }
      }
    });
  }
}

// BOTAO LUVA
btn.onclick = () => {
  luvaAtiva =!luvaAtiva;
  btn.classList.toggle('active');
  luvaPega = false;
  contagem = 0;
  alvo.style.display = luvaAtiva? 'block' : 'none';
  msg.innerText = luvaAtiva? "coloque a palma da mao no circulo amarelo" : "clique em LUVAS para ativar";
}

// CAMERA
navigator.mediaDevices.getUserMedia({video:{width:1280, height:720}}).then(stream=>{
  video.srcObject = stream;
  const camera = new Camera(video, {
    onFrame: async () => { await handsDetector.send({image: video}); }
  });
  camera.start();
});
</script>
</body>
</html>
