<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KORVIL G15 V6.2 // AUTO FORJAMENTO 4X</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; user-select: none; font-family: 'Courier New', Courier, monospace; }
  body { background: #000; color: #00f0ff; overflow: hidden; width: 100vw; height: 100vh; perspective: 1200px; }
.grid-bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 240, 255, 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.06) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; z-index: 1; }
.scanlines { position: absolute; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%); background-size: 100% 4px; pointer-events: none; z-index: 2; }
  #video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.35; filter: grayscale(20%) contrast(150%); pointer-events:none; }

  #startOverlay {position:absolute;inset:0;background:rgba(0,0,0,0.97);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;}
  #startBtn { padding:30px 60px; background:linear-gradient(90deg,#00ff66,#00f0ff); border:none; color:#000; font:30px bold 'Courier'; border-radius:20px; box-shadow:0 0 80px #00ff66; }

  /* PONTO DE FOCO CENTRAL 4X MAIOR */
  #pontoFoco { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:160px; height:480px; border:4px dashed #ff0044; border-radius:80px; z-index:15; pointer-events:none; background:rgba(255,0,68,0.04); transition: all 0.3s; }
  #pontoFoco::before { content:'POSICIONE ANTEBRAÇO AQUI'; position:absolute; top:-50px; left:50%; transform:translateX(-50%); color:#ff0044; font-size:14px; white-space:nowrap; font-weight:bold; text-shadow:0 0 10px #ff0044; }
  #pontoFoco.ativo { border-color:#00ff66; background:rgba(0,255,102,0.15); box-shadow:0 0 80px #00ff66; animation: pulsarFoco 0.8s infinite; }
  #pontoFoco.ativo::before { content:'ESCANEANDO... FIQUe PARADO'; color:#00ff66; text-shadow:0 0 10px #00ff66; }
  @keyframes pulsarFoco { 0%,100%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-50%,-50%) scale(1.05);} }

  /* CONTAINER 3D QUE SEGUE O BRAÇO */
  #braceleteContainer { position:absolute; z-index:16; pointer-events:none; transform-style: preserve-3d; transition: transform 0.06s linear; }

  /* 6 PEÇAS 3D AUTO ESCALA */
.pecaBracelete { position:absolute; border:4px solid; border-radius:25px; background:linear-gradient(180deg, rgba(0,240,255,0.1), rgba(0,240,255,0.2)); backdrop-filter: blur(20px); pointer-events:none; display:none; transform-style: preserve-3d; transition: all 4s cubic-bezier(0.16, 1, 0.3, 1); }
.pecaBracelete.encaixando { display:block; border-color:#ffe600; box-shadow:0 0 80px #ffe600, inset 0 0 30px #ffe600; animation: materializar 4s forwards; }
.pecaBracelete.ativa { display:block; border-color:#00f0ff; box-shadow:0 0 60px #00f0ff, inset 0 0 20px #00f0ff; background:linear-gradient(180deg, rgba(0,240,255,0.2), rgba(0,240,255,0.3)); }
  @keyframes materializar { 0%{opacity:0; transform:scale(0.3) rotateX(90deg) translateZ(200px);} 30%{opacity:1; transform:scale(1.2) rotateX(0) translateZ(0);} 100%{opacity:1; transform:scale(1) rotateX(0) translateZ(0);} }

  #barraProgresso { position:absolute; bottom:120px; left:50%; transform:translateX(-50%); width:500px; height:12px; background:#001122; border:2px solid #00ff66; border-radius:6px; overflow:hidden; display:none; box-shadow:0 0 20px #00ff66; }
  #barraFill { height:100%; width:0%; background:linear-gradient(90deg,#00ff66,#00f0ff,#ffe600); transition: width 0.1s linear; }

  #status { position: absolute; bottom: 20px; left: 50%; transform:translateX(-50%); color: #00ff66; font-size: 16px; background: rgba(0, 20, 10, 0.98); border: 3px solid #00ff66; padding: 18px 30px; border-radius: 15px; min-width: 520px; text-align:center; z-index: 10; box-shadow:0 0 30px #00ff66; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanlines"></div>

<div id="startOverlay">
  <h1 style="color:#00ff66;text-shadow:0 0 50px #00ff66;margin-bottom:25px;font-size:40px;">KORVIL G15 V6.2 AUTO</h1>
  <p style="color:#aaa;margin-bottom:8px;">1. Posicione antebraço no PONTO CENTRAL</p>
  <p style="color:#aaa;margin-bottom:8px;">2. Mão fechada, dorso pra câmera</p>
  <p style="color:#aaa;margin-bottom:25px;">3. Fique 4s parado. O resto é automático</p>
  <button id="startBtn">🔷 INICIAR SISTEMA</button>
</div>

<video id="video" autoplay playsinline muted></video>
<div id="pontoFoco"></div>
<div id="braceleteContainer"></div>
<div id="barraProgresso"><div id="barraFill"></div></div>

<div id="status">
  <div>STATUS: <span id="st-status">AGUARDANDO NO PONTO CENTRAL</span></div>
  <div>PEÇA: <span id="st-peca">0/6</span> | TAMANHO: <span id="st-tamanho">AUTO</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
let AudioContext = window.AudioContext || window.webkitAudioContext; let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }
function playSound(freq, type = 'sine', duration = 0.3, vol = 0.18) { if (!audioCtx) return; try { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime); gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration); } catch(e) {}}
const SFX = { foco: () => playSound(600, 'sine', 0.2, 0.1), encaixe: () => {playSound(900,'sine',0.5,0.18);setTimeout(()=>playSound(1300,'sine',0.5,0.18),250)}, completo: () => {for(let i=0;i<3;i++)setTimeout(()=>playSound(400+i*400,'sine',0.6,0.18),i*300)} };
const falas=window.speechSynthesis; function falar(texto){falas.cancel();let msg=new SpeechSynthesisUtterance(texto);msg.lang='pt-BR';msg.rate=0.9;falas.speak(msg);}

const video = document.getElementById('video');
const pontoFoco = document.getElementById('pontoFoco');
const braceleteContainer = document.getElementById('braceleteContainer');
const stStatus = document.getElementById('st-status'); const stPeca = document.getElementById('st-peca'); const stTamanho = document.getElementById('st-tamanho');
const barra = document.getElementById('barraProgresso'); const barraFill = document.getElementById('barraFill');

let estado = 'aguardando'; // aguardando, forjando, ativo
let tempoParado = 0; let autoIniciou = false;
let antebracoData = {largura:160, altura:480, x:0, y:0, rotX:0, rotY:0, rotZ:0};
let pecas = []; let pecaAtual = 0;
const nomesPecas = ['BASE', 'ENERGIA', 'SENSOR', 'CPU', 'COMMS', 'TOPO'];
const centroTela = {x: window.innerWidth/2, y: window.innerHeight/2};

// --- CRIA 6 PEÇAS ---
function criarPecas(){
  for(let i=0; i<6; i++){
    const peca = document.createElement('div'); peca.className = 'pecaBracelete';
    peca.dataset.id = i;
    braceleteContainer.appendChild(peca); pecas.push(peca);
  }
}

// --- CALCULA E AUTO ESCALA ANTEBRAÇO ---
function calcularAutoEscala(hand){
  const pulso = hand[0]; const meio = hand[9]; const indicador = hand[8]; const mindinho = hand[20];

  // Mede tamanho real do antebraço do usuário
  const alturaReal = Math.hypot(pulso.x - meio.x, pulso.y - meio.y) * 3.8;
  const larguraReal = Math.hypot(hand[5].x - hand[17].x) * 1.8;

  // Converte pra pixels baseado na tela
  const alturaPx = alturaReal * window.innerHeight;
  const larguraPx = larguraReal * window.innerWidth;

  // Posição central do ponto
  const x = centroTela.x;
  const y = centroTela.y;

  // Rotação 3D
  const rotY = Math.atan2(meio.x - pulso.x, meio.z - pulso.z) * 180 / Math.PI;
  const rotX = Math.atan2(meio.y - pulso.y, meio.z - pulso.z) * 180 / Math.PI;
  const rotZ = Math.atan2(indicador.y - mindinho.y, indicador.x - mindinho.x) * 180 / Math.PI;

  antebracoData = {x, y, rotX, rotY, rotZ, altura: alturaPx, largura: larguraPx};
  stTamanho.textContent = `${Math.round(larguraPx)}x${Math.round(alturaPx)}px`;

  return antebracoData;
}

// --- APLICA TRANSFORMAÇÃO 3D ---
function aplicarTransformacao3D(data){
  braceleteContainer.style.left = `${data.x - data.largura/2}px`;
  braceleteContainer.style.top = `${data.y - data.altura/2}px`;
  braceleteContainer.style.width = `${data.largura}px`;
  braceleteContainer.style.height = `${data.altura}px`;
  braceleteContainer.style.transform = `rotateX(${data.rotX}deg) rotateY(${data.rotY}deg) rotateZ(${data.rotZ}deg)`;
}

// --- POSICIONA PEÇAS AUTO ESCALA ---
function posicionarPecasAuto(){
  const alturaSecao = antebracoData.altura / 6;
  pecas.forEach((p,i)=>{
    p.style.width = `100%`;
    p.style.height = `${alturaSecao + 20}px`;
    p.style.left = `0px`;
    p.style.top = `${i * alturaSecao}px`;
  });
}

// --- FORJAMENTO AUTOMÁTICO ---
function iniciarForjamentoAuto(){
  estado = 'forjando';
  barra.style.display = 'block';
  pontoFoco.style.display = 'none';
  falar("Forjamento iniciado. Fique parado");
  forjarProximaPeca();
}

function forjarProximaPeca(){
  if(pecaAtual >= 6){
    estado = 'ativo';
    SFX.completo(); falar("Bracelete forjado e aderido. Pode se mover");
    stStatus.textContent = "BRACELETE ATIVO 3D - MOVIMENTO LIBERADO";
    pecas.forEach(p=>p.classList.add('ativa'));
    return;
  }

  const peca = pecas[pecaAtual];
  peca.classList.add('encaixando');
  stPeca.textContent = `${pecaAtual+1}/6`;
  stStatus.textContent = `MONTANDO: ${nomesPecas[pecaAtual]}`;
  SFX.encaixe();

  let progresso = 0;
  const intervalo = setInterval(()=>{
    progresso += 100/40;
    barraFill.style.width = `${((pecaAtual*100)+progresso)/6}%`;
    if(progresso >= 100){
      clearInterval(intervalo);
      pecaAtual++;
      forjarProximaPeca();
    }
  }, 100);
}

// --- DETECÇÃO AUTOMÁTICA NO PONTO CENTRAL ---
function detectarNoPontoCentral(hand){
  const pulso = hand[0];
  const x = (1 - pulso.x) * window.innerWidth;
  const y = pulso.y * window.innerHeight;

  // Distância do pulso ao centro do ponto
  const distCentro = Math.hypot(x - centroTela.x, y - centroTela.y);

  // Mão fechada + Vertical
  const isFechado = Math.hypot(hand[8].x-hand[5].x, hand[8].y-hand[5].y) < 0.12;
  const isVertical = Math.abs(hand[0].x - hand[9].x) < 0.2;
  const dorsoPraFrente = hand[0].z < hand[12].z;

  return distCentro < 120 && isFechado && isVertical && dorsoPraFrente;
}

// --- LOOP PRINCIPAL ---
let hands, camera;
function iniciarSistema(){
  document.getElementById('startOverlay').style.display='none'; initAudio();
  criarPecas();

  hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
  hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.75 });
  hands.onResults(res => {
    const maos = res.multiHandLandmarks;
    if (maos && maos.length > 0) {
      const h1 = maos[0];
      const data3D = calcularAutoEscala(h1);

      if(estado === 'aguardando'){
        if(detectarNoPontoCentral(h1)){
          pontoFoco.classList.add('ativo');
          SFX.foco();
          tempoParado += 0.1;
          stStatus.textContent = `DETECTADO! ESCANEANDO... ${Math.round(tempoParado)}s/4s`;

          if(tempoParado >= 4 &&!autoIniciou){
            autoIniciou = true;
            posicionarPecasAuto();
            aplicarTransformacao3D(data3D);
            iniciarForjamentoAuto();
          }
        } else {
          pontoFoco.classList.remove('ativo');
          tempoParado = 0;
          stStatus.textContent = "POSICIONE ANTEBRAÇO NO PONTO CENTRAL";
        }
      }

      if(estado === 'forjando'){
        aplicarTransformacao3D(data3D); // Mantém alinhado durante forjamento
      }

      if(estado === 'ativo'){
        aplicarTransformacao3D(data3D); // Segue em tempo real
        stStatus.textContent = "BRACELETE ATIVO - MEXA LIVREMENTE";
      }
    } else {
      if(estado === 'aguardando'){
        pontoFoco.classList.remove('ativo');
        tempoParado = 0;
      }
    }
  });
  navigator.mediaDevices.getUserMedia({video: {facingMode: "user", width:1920, height:1080}}).then(stream=>{
    video.srcObject = stream;
    camera = new Camera(video, { onFrame: async () => { await hands.send({ image: video }); }});
    camera.start();
  });
}

document.getElementById('startBtn').onclick = iniciarSistema;
</script>
</body>
</html>
