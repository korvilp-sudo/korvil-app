<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KORVIL G15 V7.2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;font-family:'Courier New';}
body{background:#000;overflow:hidden;width:100vw;height:100vh;perspective:1200px;}
#video{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0.3;}
#startOverlay{position:absolute;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;}
#startBtn{padding:30px 60px;background:#00ff66;border:none;color:#000;font:28px bold;cursor:pointer;border-radius:15px;}
#menu{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:50;}
.btn{padding:12px 20px;background:#003344;color:#00f0ff;border:2px solid #00f0ff;border-radius:10px;font-size:12px;cursor:pointer;}
.btn.ativo{background:#00f0ff;color:#000;}
#ponto{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:160px;height:480px;border:4px dashed red;border-radius:80px;display:none;z-index:10;}
#bracelete{position:absolute;display:none;z-index:11;transform-style:preserve-3d;}
.peca{position:absolute;border:4px solid #00f0ff;background:rgba(0,240,255,0.2);border-radius:20px;}
#escudo{position:absolute;width:300px;height:300px;border:6px solid #00f0ff;border-radius:50%;background:rgba(0,240,255,0.1);display:none;animation:giro 2s linear infinite;}
@keyframes giro{to{transform:rotate(360deg)}}
#visor{position:absolute;width:120px;height:120px;border:3px solid yellow;background:rgba(255,255,0,0.1);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);display:none;}
.arm{position:absolute;border:3px solid #00f0ff;background:rgba(0,240,255,0.2);display:none;}
#status{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);color:#00ff66;background:#001100;padding:15px;border:2px solid #00ff66;border-radius:10px;}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="startOverlay"><button id="startBtn">INICIAR</button></div>
<div id="ponto"></div>
<div id="bracelete"></div>
<div id="escudo"></div>
<div id="visor"></div>
<div id="capacete" class="arm" style="width:200px;height:240px;border-radius:50%"></div>
<div id="peito" class="arm" style="width:280px;height:320px;border-radius:40px"></div>
<div id="bracoE" class="arm" style="width:100px;height:280px;border-radius:50px"></div>
<div id="bracoD" class="arm" style="width:100px;height:280px;border-radius:50px"></div>
<div id="menu">
  <div class="btn ativo" data-f="bracelete">BRACELETE</div>
  <div class="btn" data-f="escudo">ESCUDO</div>
  <div class="btn" data-f="visor">VISOR</div>
  <div class="btn" data-f="armadura">ARMADURA</div>
</div>
<div id="status">AGUARDANDO</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script>
let forma='bracelete', hand, face, pose, travado=false;
const video=document.getElementById('video');
const ponto=document.getElementById('ponto');
const bracelete=document.getElementById('bracelete');
const status=document.getElementById('status');

// CRIA 6 PEÇAS
for(let i=0;i<6;i++){let p=document.createElement('div');p.className='peca';bracelete.appendChild(p);}

// BOTÕES
document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.btn').forEach(x=>x.classList.remove('ativo'));
  b.classList.add('ativo'); forma=b.dataset.f; reset();
  status.textContent='MODO: '+forma.toUpperCase();
});

function reset(){
  ponto.style.display='none'; bracelete.style.display='none'; travado=false;
  document.getElementById('escudo').style.display='none';
  document.getElementById('visor').style.display='none';
  document.querySelectorAll('.arm').forEach(a=>a.style.display='none');
}

// INICIAR
document.getElementById('startBtn').onclick=async()=>{
  document.getElementById('startOverlay').style.display='none';
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
  video.srcObject=stream;
};

// MEDIAPIPE
const hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});
hands.setOptions({maxNumHands:2});
hands.onResults(r=>{hand=r.multiHandLandmarks?r.multiHandLandmarks[0]:null;});

const fm=new FaceMesh({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/'+f});
fm.setOptions({maxNumFaces:1});
fm.onResults(r=>{face=r.multiFaceLandmarks?r.multiFaceLandmarks[0]:null;});

const pose=new Pose({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/pose/'+f});
pose.setOptions({modelComplexity:1});
pose.onResults(r=>{pose=r.poseLandmarks;});

function loop(){
  if(hand){
    let x=(1-hand[0].x)*innerWidth, y=hand[0].y*innerHeight;

    // FORMA 1: BRACELETE - FICA FIXO NO ANTEBRAÇO EM QUALQUER LUGAR
    if(forma==='bracelete'){
      ponto.style.display='block';
      bracelete.style.display='block';
      let dist=Math.hypot(x-innerWidth/2,y-innerHeight/2);
      if(dist<120){status.textContent='ESCANEANDO 4s...'}else{status.textContent='POSICIONE NO PONTO'}

      // trava após 4s no ponto
      if(dist<120 &&!travado){
        if(!window.t){window.t=0}
        window.t+=0.016;
        if(window.t>4){travado=true;status.textContent='BRACELETE ATIVO'}
      }else{window.t=0}

      if(travado){
        // SEGUE EM QUALQUER DIREÇÃO NA VERTICAL DO ANTEBRAÇO
        let pulso=hand[0], meio=hand[9];
        let rotX=(meio.y-pulso.y)*180, rotY=(meio.x-pulso.x)*180, rotZ=(hand[8].x-hand[20].x)*180;
        let alt=Math.hypot(pulso.x-meio.x,pulso.y-meio.y)*3.5*innerHeight;
        let larg=Math.hypot(hand[5].x-hand[17].x)*1.8*innerWidth;
        bracelete.style.left=`${x-larg/2}px`; bracelete.style.top=`${y-alt/2}px`;
        bracelete.style.width=`${larg}px`; bracelete.style.height=`${alt}px`;
        bracelete.style.transform=`rotateX(${rotX}deg) rotateY(${rotY}deg) rotateZ(${rotZ}deg)`;
        let sec=alt/6;
        [...bracelete.children].forEach((p,i)=>{p.style.width='100%';p.style.height=`${sec}px`;p.style.top=`${i*sec}px`;});
      }
    }

    // FORMA 2: ESCUDO - 1 MÃO ABERTA + BALANÇAR LADOS
    if(forma==='escudo'){
      let aberto=Math.hypot(hand[8].x-hand[5].x,hand[8].y-hand[5].y)>0.2;
      if(aberto && Math.abs(hand[0].x-(window.lx||0))>0.08){
        let e=document.getElementById('escudo'); e.style.display='block';
        e.style.left=`${x-150}px`; e.style.top=`${y-150}px`;
        setTimeout(()=>e.style.display='none',3000); status.textContent='ESCUDO ATIVO';
      }
      window.lx=hand[0].x;
    }
  }

  // FORMA 3: VISOR - LEVANTAR SOBRANCELHA
  if(face && forma==='visor'){
    let sob=face[65].y-face[159].y;
    if(sob<0.025){
      let v=document.getElementById('visor'); v.style.display='block';
      let ox=(1-face[468].x)*innerWidth, oy=face[468].y*innerHeight;
      v.style.left=`${ox-60}px`; v.style.top=`${oy-60}px`; status.textContent='VISOR ATIVO';
    }
  }

  // FORMA 4: ARMADURA - CRUZAR BRAÇOS
  if(pose && forma==='armadura'){
    if(Math.abs(pose[15].x-pose[16].x)<0.15 && pose[15].y<pose[11].y){
      document.querySelectorAll('.arm').forEach(a=>a.style.display='block');
      document.getElementById('capacete').style.left=`${(1-pose[0].x)*innerWidth-100}px`;
      document.getElementById('capacete').style.top=`${pose[0].y*innerHeight-120}px`;
      document.getElementById('peito').style.left=`${(1-pose[0].x)*innerWidth-140}px`;
      document.getElementById('peito').style.top=`${pose[0].y*innerHeight+50}px`;
      status.textContent='ARMADURA ATIVA';
    }
  }
  requestAnimationFrame(loop);
}
loop();

new Camera(video,{onFrame:async()=>{await hands.send({image:video});await fm.send({image:video});await pose.send({image:video});}}).start();
</script>
</body>
</html>
