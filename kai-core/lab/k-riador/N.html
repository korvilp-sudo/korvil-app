<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KORVIL HOLOGRAM</title>
<style>
  body { margin:0; background:#000; overflow:hidden; touch-action:none; }
  canvas { display:block; }
  #info { position:absolute; top:10px; width:100%; text-align:center; color:#00ffff; font:16px Arial; text-shadow: 0 0 10px #00ffff; }
  #gesture { position:absolute; bottom:80px; width:100%; text-align:center; color:#00ffaa; font:14px Arial; }
  #startBtn { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); padding:15px 30px; background:#00ffff; color:#000; border:none; border-radius:30px; font:18px bold Arial; }
  #video { position:absolute; bottom:10px; right:10px; width:120px; height:160px; border:2px solid #00ffff; opacity:0.4; border-radius:10px; }
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js","@mediapipe/hands": "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js","@mediapipe/camera_utils": "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"}}</script>
</head>
<body>
<div id="info">KORVIL HOLOGRAM<br>Toque e permita a câmera</div>
<div id="gesture">Status: Aguardando</div>
<button id="startBtn">ATIVAR CÂMERA</button>
<video id="video" autoplay playsinline muted></video>

<script type="module">
import * as THREE from 'three';
import { Hands } from '@mediapipe/hands';
import { Camera } from '@mediapipe/camera_utils';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x001a33, 0.04);
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 2, 4);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x003333));
const grid = new THREE.GridHelper(8, 40, 0x00ffff, 0x004444);
grid.material.opacity = 0.5; grid.material.transparent = true; scene.add(grid);

const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32, 24), new THREE.MeshPhongMaterial({color:0x00ffff, transparent:true, opacity:0.4, emissive:0x00aaff, emissiveIntensity:1}));
helmet.scale.y = 0.8; helmet.position.y = 1.8; scene.add(helmet);

const octahedrons = [];
for(let i=0; i<8; i++){
  const octa = new THREE.Mesh(new THREE.OctahedronGeometry(0.1, 0), new THREE.MeshBasicMaterial({color:0x00ffff, wireframe:true}));
  octa.position.set(Math.sin(i)*1.2, 1.8, Math.cos(i)*1.2);
  octahedrons.push(octa); scene.add(octa);
}

let handPos = new THREE.Vector3(0, 1.8, 0);
let isActive = false;

document.getElementById('startBtn').onclick = async () => {
  document.getElementById('startBtn').style.display = 'none';
  const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
  hands.setOptions({maxNumHands: 1, minDetectionConfidence: 0.6});
  hands.onResults((r) => {
    if(r.multiHandLandmarks.length > 0){
      const l = r.multiHandLandmarks[0];
      handPos.x = (l[8].x - 0.5) * 3;
      handPos.y = 2 - (l[8].y - 0.5) * 2;
      document.getElementById('gesture').innerText = 'Status: Mão detectada!';
    }
  });
  const videoElement = document.getElementById('video');
  const cam = new Camera(videoElement, {onFrame: async () => { await hands.send({image: videoElement}); }, width: 320, height: 480});
  cam.start();
  document.getElementById('info').innerText = 'KORVIL ATIVO - Mexa a mão';
  isActive = true;
};

function animate(){
  requestAnimationFrame(animate);
  if(isActive) helmet.position.lerp(handPos, 0.15);
  octahedrons.forEach((octa, i) => { octa.rotation.x += 0.02; octa.position.y = 1.8 + Math.sin(Date.now()*0.002 + i)*0.2; });
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
