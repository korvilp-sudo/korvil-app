<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KORVIL G15 AVANÇADO 4.3 // BRACELETE REAL</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; user-select: none; font-family: 'Courier New', Courier, monospace; }
  body { background: #000; color: #00f0ff; overflow: hidden; width: 100vw; height: 100vh; }
.grid-bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 240, 255, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.08) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 1; }
.scanlines { position: absolute; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%); background-size: 100% 3px; pointer-events: none; z-index: 2; }
  #video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.25; filter: grayscale(50%) contrast(140%); pointer-events:none; }

  #startOverlay {position:absolute;inset:0;background:rgba(0,0,0,0.95);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;}
  #startBtn { padding:25px 50px; background:linear-gradient(90deg,#00ff66,#00f0ff); border:none; color:#000; font:26px bold 'Courier'; border-radius:16px; box-shadow:0 0 50px #00ff66; }

  /* BRACELETE TAMANHO REAL ANTEBRAÇO */
  #bracelete { position:absolute; width:200px; height:200px; border:6px solid #00ff66; border-radius:50%; z-index:15; pointer-events:none; display:none; box-shadow:0 0 0px #00ff66; transition: all 0.3s; }
  #bracelete::before { content:''; position:absolute; inset:20px; border:3px dashed #00ff66; border-radius:50%; animation: girar 8s linear infinite; }
  #bracelete::after { content:'VESTIR'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:14px; color:#00ff66; }
  @keyframes girar { from {transform:rotate(0deg);} to {transform:rotate(360deg);} }
  #bracelete.pronto { box-shadow:0 0 40px #00ff66; border-color:#00ff66; }
  #bracelete.vestido { border-color:#00f0ff; box-shadow:0 0 60px #00f0ff; }
  #bracelete.vestido::after { content:'VESTIDO'; color:#00f0ff; }
  #bracelete.expandido { border-color:#ffe600; box-shadow:0 0 80px #ffe600; }
  #bracelete.removendo { border-color:#ff0044; box-shadow:0 0 80px #ff0044; animation: piscarRapido 0.15s infinite; }
  @keyframes piscarRapido { 0%,100%{opacity:1;} 50%{opacity:0.2;} }

  /* 6 PEÇAS REAIS */
.peca { position:absolute; width:55px; height:55px; border:3px solid #00f0ff; border-radius:12px; background:rgba(0,240,255,0.1); box-shadow:0 0 20px #00f0ff; z-index:14; pointer-events:none; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:bold; text-align:center; transition: all 1s cubic-bezier(0.68,-0.55,0.265,1.55); }
.peca.hover { border-color:#00ff66; box-shadow:0 0 40px #00ff66; background:rgba(0,255,102,0.3); transform:scale(1.1); }
.peca.selecionada { border-color:#ffe600; box-shadow:0 0 50px #ffe600; background:rgba(255,230,0,0.4); transform:scale(1.25); }
.peca.solta { border-color:#ff00ea; box-shadow:0 0 45px #ff00ea; background:rgba(255,0,234,0.3); }

 .pino { position: absolute; width: 22px; height: 22px; border-radius: 50%; pointer-events: none; z-index: 20; transform: translate(-50%, -50%); border: 3px solid #fff; }
  #pino1 { background: #ff00ea; box-shadow: 0 0 15px #ff00ea; }
  #pino2 { background: #00f0ff; box-shadow: 0 0 15px #00f0ff; }
  #status { position: absolute; bottom: 20px; left: 50%; transform:translateX(-50%); color: #00ff66; font-size: 11px; background: rgba(0, 20, 10, 0.9); border: 2px solid #00ff66; padding: 10px 15px; border-radius: 8px; min-width: 380px; text-align:center; z-index: 10; }
 #indicadorVoz { position:absolute; top:20px; right:20px; background:rgba(0,255,102,0.3); border:2px solid #00ff66; padding:8px 15px; border-radius:25px; font-size:12px; display:none; font-weight:bold; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanlines"></div>
<div id="indicadorVoz">🎤 OUVINDO: "EXPANDIR BRACELETE"</div>

<div id="startOverlay">
  <h1 style="color:#00ff66;text-shadow:0 0 30px #00ff66;margin-bottom:15px;font-size:32px;">KORVIL G15 AVANÇADO 4.3</h1>
  <p style="color:#aaa;margin-bottom:5px;">1. Passe a mão pelo centro do bracelete</p>
  <p style="color:#aaa;margin-bottom:20px;">2. Feche a mão para VESTIR</p>
  <button id="startBtn">🔷 ATIVAR BRACELETE</button>
</div>

<video id="video" autoplay playsinline muted></video>
<div id="pino1" class="pino"></div>
<div id="pino2" class="pino"></div>
<div id="bracelete"></div>

<div id="status">
  <div>STATUS: <span id="st-status">AGUARDANDO</span> | PEÇA: <span id="st-peca">NENHUMA</span></div>
  <div>GESTO M1: <span id="st-gesto1">NENHUM</span> | GESTO M2: <span id="st-gesto2">NENHUM</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
let AudioContext = window.AudioContext || window.webkitAudioContext; let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }
function playSound(freq, type = 'sine', duration = 0.15, vol = 0.12) { if (!audioCtx) return; try { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime); gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration); } catch(e) {}}
const SFX = { vestir: () => {playSound(400,'sine',0.3,0.15);setTimeout(()=>playSound(800,'sine',0.3,0.15),200)}, expandir: () => {playSound(600,'sine',0.4,0.15);setTimeout(()=>playSound(1200,'sine',0.4,0.15),200)}, click: () => playSound(1200, 'square', 0.05, 0.15), separar: () => playSound(900, 'sine', 0.2, 0.12), encaixe: () => playSound(1500, 'sine', 0.2, 0.15) };
const falas=window.speechSynthesis; function falar(texto){falas.cancel();let msg=new SpeechSynthesisUtterance(texto);msg.lang='pt-BR';msg.rate=1.0;falas.speak(msg);}

const video = document.getElementById('video'); const pino1 = document.getElementById('pino1'); const pino2 = document.getElementById('pino2');
const stStatus = document.getElementById('st-status'); const stPeca = document.getElementById('st-peca');
const stGesto1 = document.getElementById('st-gesto1'); const stGesto2 = document.getElementById('st-gesto2');
const bracelete = document.getElementById('bracelete');

let pecas = []; let pecaSelecionada = null; let pecaSegurada = null;
let braceleteVestido = false; let braceleteExpandido = false; let braceletePos = {x: window.innerWidth/2, y: window.innerHeight/2};
let posM1 = {x:-100,y:-100, pulso:null}, posM2 = {x:-100,y:-100};
let tempoParado = 0; let ultimoToque = 0; let historicoFlip = []; let ultimoFlip = 0;

// --- CRIA 6 PEÇAS ---
const nomesPecas = ['CPU', 'SENSOR', 'LED', 'BATERIA', 'ANTENA', 'MOD'];
function criarPecasHolograma(cx, cy){
  pecas.forEach(p=>p.remove()); pecas = [];
  for(let i=0; i<6; i++){
    const peca = document.createElement('div'); peca.className = 'peca';
    peca.innerText = nomesPecas[i]; peca.dataset.id = i;
    peca.dataset.origX = cx; peca.dataset.origY = cy;
    peca.style.left = `${cx-27}px`; peca.style.top = `${cy-27}px`;
    document.body.appendChild(peca); pecas.push(peca);
    setTimeout(()=>{
      const angulo = (i/6) * Math.PI * 2 - Math.PI/2;
      const raio = 140;
      peca.style.left = `${cx + Math.cos(angulo)*raio - 27}px`;
      peca.style.top = `${cy + Math.sin(angulo)*raio - 27}px`;
    }, 200*i);
  }
  SFX.expandir(); falar("Bracelete expandido");
}

// --- DETECÇÃO REAL DE VESTIR ---
function detectarAntebracoDentro(hand){
  const pulso = hand[0]; const meio = hand[12];
  const distPulsoMeio = Math.hypot(pulso.x - meio.x, pulso.y - meio.y);
  return distPulsoMeio > 0.25; // Antebraço esticado
}

function checarVestir(hand, x, y){
  if(braceleteVestido) return;
  const distCentro = Math.hypot(x - braceletePos.x, y - braceletePos.y);
  const isDentro = distCentro < 90;
  const isFechado = Math.hypot(hand[8].x-hand[5].x, hand[8].y-hand[5].y) < 0.1;
  const temAntebraco = detectarAntebracoDentro(hand);

  if(isDentro && isFechado && temAntebraco){
    braceleteVestido = true;
    bracelete.classList.add('vestido');
    braceletePos = {x,y};
    SFX.vestir(); falar("Bracelete vestido");
    stStatus.textContent = "VESTIDO";
    iniciarReconhecimentoVoz();
  }
}

// --- DETECÇÃO DE HOVER E SELEÇÃO ---
function checarHover(x, y){
  let maisProxima = null; let menorDist = 9999;
  pecas.forEach(p=>{
    if(p.classList.contains('solta')) return;
    const rect = p.getBoundingClientRect();
    const dist = Math.hypot(x - (rect.left + 27), y - (rect.top + 27));
    if(dist < menorDist && dist < 100){ menorDist = dist; maisProxima = p; }
  });
  pecas.forEach(p=>p.classList.remove('hover'));
  if(maisProxima){ maisProxima.classList.add('hover'); stPeca.textContent = nomesPecas[maisProxima.dataset.id]; }
  else{ if(!pecaSelecionada) stPeca.textContent = "NENHUMA"; }
}

function selecionarPeca(x, y){
  let maisProxima = null; let menorDist = 9999;
  pecas.forEach(p=>{
    const rect = p.getBoundingClientRect();
    const dist = Math.hypot(x - (rect.left + 27), y - (rect.top + 27));
    if(dist < menorDist && dist < 70){ menorDist = dist; maisProxima = p; }
  });
  if(maisProxima){
    pecas.forEach(p=>p.classList.remove('selecionada'));
    maisProxima.classList.add('selecionada');
    pecaSelecionada = maisProxima;
    stPeca.textContent = "SEL: " + nomesPecas[maisProxima.dataset.id];
    SFX.click();
  }
}

function soltarPeca(){
  if(pecaSelecionada &&!pecaSelecionada.classList.contains('solta')){
    pecaSelecionada.classList.add('solta');
    SFX.separar(); falar("Peça solta");
  }
}

function segurarPeca(x, y, gesto){
  if(gesto === "PUNHO" && pecaSelecionada && pecaSelecionada.classList.contains('solta') &&!pecaSegurada){
    const rect = pecaSelecionada.getBoundingClientRect();
    if(x > rect.left && x < rect.right && y > rect.top && y < rect.bottom){
      pecaSegurada = pecaSelecionada; SFX.click();
    }
  }
  if(gesto === "ABERTO" && pecaSegurada){
    pecaSegurada = null;
  }
}

function reencaixarPeca(){
  if(pecaSegurada){
    const id = pecaSegurada.dataset.id;
    const cx = parseFloat(pecaSegurada.dataset.origX); const cy = parseFloat(pecaSegurada.dataset.origY);
    const angulo = (id/6) * Math.PI * 2 - Math.PI/2;
    const raio = 140;
    pecaSegurada.style.left = `${cx + Math.cos(angulo)*raio - 27}px`;
    pecaSegurada.style.top = `${cy + Math.sin(angulo)*raio - 27}px`;
    pecaSegurada.classList.remove('solta','selecionada');
    pecaSegurada = null; pecaSelecionada = null; stPeca.textContent = "NENHUMA";
    SFX.encaixe(); falar("Peça encaixada");
  }
}

// --- FLIP 2X DETECTOR ---
function detectarFlip2x(hand){
  const pulso = hand[0]; const meio = hand[12];
  const angulo = Math.atan2(meio.y - pulso.y, meio.x - pulso.x);
  historicoFlip.push({ang: angulo, t: performance.now()});
  if(historicoFlip.length > 12) historicoFlip.shift();
  if(historicoFlip.length < 6) return false;
  const diffAng = Math.abs(historicoFlip[historicoFlip.length-1].ang - historicoFlip[0].ang);
  const diffTime = historicoFlip[historicoFlip.length-1].t - historicoFlip[0].t;
  if(diffAng > 1.8 && diffTime < 350){
    if(performance.now() - ultimoFlip < 500){
      ultimoFlip = 0; historicoFlip = []; return true;
    }
    ultimoFlip = performance.now();
  }
  return false;
}

// --- REMOÇÃO POR PARAR ---
function checarRemocao(x,y){
  if(!braceleteVestido) return;
  let mov = Math.hypot(x - braceletePos.x, y - braceletePos.y);
  if(mov < 8) tempoParado += 0.1; else tempoParado = 0;

  if(tempoParado > 4 &&!bracelete.classList.contains('removendo')){
    bracelete.classList.add('removendo'); falar("Removendo bracelete em 4 segundos");
    setTimeout(()=>{
      braceleteVestido=false; braceleteExpandido=false;
      bracelete.classList.remove('vestido','removendo','expandido');
      bracelete.style.left = window.innerWidth/2-100+'px'; bracelete.style.top = window.innerHeight/2-100+'px';
      stStatus.textContent = "AGUARDANDO";
      pecas.forEach(p=>p.remove()); pecas=[];
    },4000);
  }
  braceletePos = {x,y};
}

// --- VOZ ---
let recognition;
function iniciarReconhecimentoVoz(){
  if(!('webkitSpeechRecognition' in window)) return;
  recognition = new webkitSpeechRecognition();
  recognition.continuous = true; recognition.lang = 'pt-BR';
  recognition.onresult = (event)=>{
    const comando = event.results[event.results.length-1][0].transcript.toLowerCase();
    if(comando.includes('expandir')){
      if(!braceleteExpandido && braceleteVestido){
        braceleteExpandido=true; bracelete.classList.add('expandido');
        criarPecasHolograma(braceletePos.x, braceletePos.y);
      }
    }
    if(comando.includes('fechar')){
      if(braceleteExpandido){
        braceleteExpandido=false; bracelete.classList.remove('expandido');
        pecas.forEach(p=>p.remove()); pecas=[];
      }
    }
  };
  recognition.start(); document.getElementById('indicadorVoz').style.display = 'block';
}

// --- MEDIAPIPE ---
let hands, camera;
function iniciarSistema(){
  document.getElementById('startOverlay').style.display='none'; initAudio();
  bracelete.style.display='block'; bracelete.classList.add('pronto');
  bracelete.style.left=window.innerWidth/2-100+'px'; bracelete.style.top = window.innerHeight/2-100+'px';

  hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
  hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6 });
  hands.onResults(res => {
    const maos = res.multiHandLandmarks;
    if (maos && maos.length > 0) {
      // MÃO 1
      const h1 = maos[0];
      let targetX1 = (1 - h1[8].x) * window.innerWidth; let targetY1 = h1[8].y * window.innerHeight;
      posM1 = {x:targetX1, y:targetY1, pulso:h1[0]};
      pino1.style.left = `${posM1.x}px`; pino1.style.top = `${posM1.y}px`;
      const gesto1 = (Math.hypot(h1[8].x-h1[5].x, h1[8].y-h1[5].y) < 0.11)? "PUNHO" : "ABERTO";
      stGesto1.textContent = gesto1;

      if(!braceleteVestido){
        checarVestir(h1, posM1.x, posM1.y);
      } else {
        checarRemocao(posM1.x, posM1.y);
        bracelete.style.left = `${posM1.x-100}px`; bracelete.style.top = `${posM1.y-100}px`;
        checarHover(posM1.x, posM1.y);
        if(detectarFlip2x(h1)){ soltarPeca(); }
        segurarPeca(posM1.x, posM1.y, gesto1);
        if(pecaSegurada){
          pecaSegurada.style.left = `${posM1.x-27}px`; pecaSegurada.style.top = `${posM1.y-27}px`;
        }
      }

      // MÃO 2
      if(maos.length > 1){
        const h2 = maos[1];
        let targetX2 = (1 - h2[8].x) * window.innerWidth; let targetY2 = h2[8].y * window.innerHeight;
        posM2.x = targetX2; posM2.y = targetY2;
        pino2.style.left = `${posM2.x}px`; pino2.style.top = `${posM2.y}px`;
        const gesto2 = (Math.hypot(h2[8].x-h2[5].x, h2[8].y-h2[5].y) < 0.11)? "PUNHO" : "ABERTO";
        stGesto2.textContent = gesto2;

        if(braceleteVestido){
          checarHover(posM2.x, posM2.y);
          if(detectarFlip2x(h2)){
            if(pecaSegurada){ reencaixarPeca(); }
            else { selecionarPeca(posM2.x, posM2.y); }
          }
        }
      }
    }
  });
  navigator.mediaDevices.getUserMedia({video: {facingMode: "user", width:1280, height:720}}).then(stream=>{
    video.srcObject = stream;
    camera = new Camera(video, { onFrame: async () => { await hands.send({ image: video }); }});
    camera.start();
  });
}

// --- TOQUE DUPLO ---
document.body.addEventListener('touchend', (e)=>{
  const agora = performance.now();
  if(agora - ultimoToque < 300){
    selecionarPeca(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }
  ultimoToque = agora;
});

document.getElementById('startBtn').onclick = iniciarSistema;
</script>
</body>
</html>
