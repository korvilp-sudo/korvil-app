<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>NEXUS GEN - 3D Hand Gestures</title>
  <style>
    body { margin: 0; overflow: hidden; background: #05050a; font-family: sans-serif; }
    #webcam { position: absolute; top: 10px; right: 10px; width: 160px; height: 120px; border-radius: 8px; transform: scaleX(-1); opacity: 0.7; }
    #ui-overlay { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #00ffcc; text-align: center; text-shadow: 0 0 10px #00ffcc; }
  </style>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline></video>
  <div id="ui-overlay">
    <h2 id="mode-title">NEXUS GEN: AGUARDANDO GESTO</h2>
    <p id="gesture-hint">Aproxime a mão da câmera: [Palma Aberta] Ativar | [Pinch/Pinça] Alternar Modo</p>
  </div>

  <script>
    // ----------------------------------------------------
    // 1. CONFIGURAÇÃO DA CENA THREE.JS (3D)
    // ----------------------------------------------------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Iluminação
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    const pointLight = new THREE.PointLight(0x00ffcc, 2, 50);
    pointLight.position.set(0, 0, 5);
    scene.add(ambientLight, pointLight);

    // Objeto Central NEXUS GEN (Núcleo + Anel)
    const coreGroup = new THREE.Group();

    // Núcleo Turbo (Max Steel)
    const coreGeo = new THREE.IcosahedronGeometry(1, 2);
    const coreMat = new THREE.MeshStandardMaterial({ color: 0x00aaff, wireframe: true, emissive: 0x0044ff });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    coreGroup.add(coreMesh);

    // Anel Seletor (Omnitrix)
    const ringGeo = new THREE.TorusGeometry(1.8, 0.08, 16, 100);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, metalness: 0.8, roughness: 0.2 });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.rotation.x = Math.PI / 2;
    coreGroup.add(ringMesh);

    scene.add(coreGroup);
    camera.position.z = 5;

    // ----------------------------------------------------
    // 2. RECONHECIMENTO DE GESTOS (MediaPipe)
    // ----------------------------------------------------
    const videoElement = document.getElementById('webcam');
    const modeTitle = document.getElementById('mode-title');

    function onResults(results) {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const hand = results.multiHandLandmarks[0];

        // Mapear posição da mão para rotação do objeto 3D
        const handX = (hand[9].x - 0.5) * 4;
        const handY = -(hand[9].y - 0.5) * 4;
        coreGroup.position.x = handX;
        coreGroup.position.y = handY;

        // Distância entre polegar (4) e indicador (8) -> Gesto de Pinça (Pinch)
        const thumbTip = hand[4];
        const indexTip = hand[8];
        const distance = Math.hypot(hand[4].x - hand[8].x, hand[4].y - hand[8].y);

        if (distance < 0.05) {
          // Gesto: Ativar Carga Max Turbo / Fusão Ranger
          coreMat.color.setHex(0xff0055);
          coreMat.emissive.setHex(0xff0000);
          coreGroup.rotation.y += 0.2;
          modeTitle.innerText = "NEXUS GEN: MODO SOBRECARGA TURBO";
        } else {
          // Estado Padrão Omnitrix / Holo
          coreMat.color.setHex(0x00aaff);
          coreMat.emissive.setHex(0x0044ff);
          modeTitle.innerText = "NEXUS GEN: SINTONIZANDO ADN ALIEN";
        }
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7 });
    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => { await hands.send({ image: videoElement }); },
      width: 640,
      height: 480
    });
    cameraUtils.start();

    // ----------------------------------------------------
    // 3. LOOP DE RENDERIZAÇÃO 3D
    // ----------------------------------------------------
    function animate() {
      requestAnimationFrame(animate);
      coreMesh.rotation.y += 0.01;
      ringMesh.rotation.z -= 0.02;
      renderer.render(scene, camera);
    }
    animate();

    // Responsividade da tela
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
