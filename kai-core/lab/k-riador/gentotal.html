
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>GENTOTAL - HUB K-RIADOR 4D</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}
body {
  background:#000;display:flex;justify-content:center;align-items:center;height:100vh;
  overflow:hidden;perspective:2500px;font-family:'Orbitron',sans-serif;
}

/* MENU SELEÇÃO UNIVERSO */
.menu-universo {
  position:absolute;top:20px;width:95%;display:flex;justify-content:center;gap:15px;z-index:999
}
.btn-universo {
  padding:15px 25px;border:3px solid;color:#FFF;background:rgba(0,0,0,0.6);
  border-radius:15px;font-weight:900;cursor:pointer;font-size:14px;backdrop-filter:blur(10px);
  transition:0.3s
}
.btn-universo:hover {transform:scale(1.1)}
.btn-ben {border-color:#00FF00;box-shadow:0 0 30px #00FF00}
.btn-rex {border-color:#00CCFF;box-shadow:0 0 30px #00CCFF}
.btn-max {border-color:#FF6600;box-shadow:0 0 30px #FF6600}
.btn-pr {border-color:#FFF;box-shadow:0 0 30px #FFF}

/* CONTAINER GERAL */
.universo {position:absolute;width:100%;height:100%;display:none;justify-content:center;align-items:center}
.universo.ativo {display:flex}

/* === BEN 10 === */
.ben-bg {background:radial-gradient(circle, #001100 0%, #000 100%)}
.ben-omni {width:400px;height:400px;border-radius:50%;background:radial-gradient(circle, #00FF00 0%, #008800 50%, #000 80%);
  border:8px solid #00FF00;box-shadow:0 0 400px #00FF00;cursor:pointer;animation:pulseGreen 3s infinite}
.ben-core {width:200px;height:200px;border-radius:50%;background:#000;position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);color:#00FF00;font-size:40px;display:flex;align-items:center;justify-content:center}

/* === GENERATOR REX === */
.rex-bg {background:radial-gradient(circle, #001828 0%, #000 100%)}
.rex-console {width:400px;height:400px;border-radius:50%;background:radial-gradient(circle, #00CCFF 0%, #003344 80%);
  border:8px solid #00CCFF;box-shadow:0 0 400px #00CCFF;cursor:pointer}
.rex-core {width:200px;height:200px;border-radius:50%;background:conic-gradient(#00CCFF, #88EEFF, #00CCFF);
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#000;font-size:24px;
  display:flex;align-items:center;justify-content:center;font-weight:900}

/* === MAX STEEL === */
.max-bg {background:radial-gradient(circle, #1a0800 0%, #000 100%)}
.max-watch {width:450px;height:450px;border-radius:50%;background:conic-gradient(#FFCC00, #FF6600, #FF0000, #FFCC00);
  border:10px solid #FF6600;box-shadow:0 0 500px #FF6600;cursor:pointer;animation:spin 8s linear infinite}
.max-core {width:250px;height:250px;border-radius:50%;background:#000;position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);color:#FFCC00;font-size:40px;display:flex;align-items:center;justify-content:center;
  font-weight:900;border:6px solid #FF6600}
.steel-holo {position:absolute;left:100px;bottom:150px;width:350px;height:350px;opacity:0;transition:1.5s;
  transform:scale(0.5)}
.steel-holo.ativo {opacity:1;transform:scale(1)}
.steel-avatar {width:100%;height:100%;border-radius:50%;background:radial-gradient(circle, rgba(0,200,255,0.3) 0%, transparent 70%);
  border:4px solid #00CCFF;box-shadow:0 0 150px #00CCFF;display:flex;align-items:center;justify-content:center;font-size:120px}

/* === POWER RANGERS === */
.pr-bg {background:radial-gradient(circle, #000011 0%, #000 100%)}
.pr-morpher {width:420px;height:420px;border-radius:50%;background:radial-gradient(circle, #FFF 0%, #222 80%);
  border:10px solid #FFF;box-shadow:0 0 400px #FFF;cursor:pointer}
.pr-core {width:220px;height:220px;border-radius:50%;background:#000;position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);color:#FFF;font-size:32px;display:flex;align-items:center;justify-content:center;
  font-weight:900;border:6px solid #FFF}

/* HOLOGRAMAS GERAIS */
.holo {position:absolute;bottom:500px;width:700px;height:700px;opacity:0;transition:1.5s}
.holo.ativo {opacity:1}
.tela {position:absolute;top:0;left:0;width:100%;height:100%;background:#000;display:none;justify-content:center;
  align-items:center;flex-direction:column;z-index:99}
.tela.ativo {display:flex}
.tela h1 {font-size:90px;text-shadow:0 0 100px currentColor}

@keyframes pulseGreen {50%{box-shadow:0 0 500px #00FF00}}
@keyframes spin {100%{transform:rotateZ(360deg)}}
</style>
</head>
<body>

<!-- MENU -->
<div class="menu-universo">
  <button class="btn-universo btn-ben" onclick="trocarUniverso('ben')">BEN 10</button>
  <button class="btn-universo btn-rex" onclick="trocarUniverso('rex')">GENERATOR REX</button>
  <button class="btn-universo btn-max" onclick="trocarUniverso('max')">MAX STEEL</button>
  <button class="btn-universo btn-pr" onclick="trocarUniverso('pr')">POWER RANGERS</button>
</div>

<!-- BEN 10 -->
<div class="universo ben-bg" id="ben">
  <div class="holo" id="benHolo"></div>
  <div class="tela" id="benTela"><h1 style="color:#00FF00">IT'S HERO TIME!</h1></div>
  <div class="ben-omni" onclick="ativarBen()">
    <div class="ben-core">OMNI</div>
  </div>
</div>

<!-- GENERATOR REX -->
<div class="universo rex-bg" id="rex">
  <div class="holo" id="rexHolo"></div>
  <div class="tela" id="rexTela"><h1 style="color:#00CCFF">CONSTRUINDO ARMA</h1></div>
  <div class="rex-console" onclick="ativarRex()">
    <div class="rex-core">REX</div>
  </div>
</div>

<!-- MAX STEEL -->
<div class="universo max-bg" id="max">
  <div class="steel-holo" id="steelHolo"><div class="steel-avatar">🤖</div></div>
  <div class="holo" id="maxHolo"></div>
  <div class="tela" id="maxTela"><h1 style="color:#FF6600">TURBO ATIVADO</h1></div>
  <div class="max-watch" onclick="ativarMax()">
    <div class="max-core">N-TECH</div>
  </div>
</div>

<!-- POWER RANGERS -->
<div class="universo pr-bg" id="pr">
  <div class="holo" id="prHolo"></div>
  <div class="tela" id="prTela">
    <h1 style="color:#FFF">IT'S MORPHIN TIME!</h1>
    <div style="color:#FFD700;font-size:50px">GO GO POWER RANGERS!</div>
  </div>
  <div class="pr-morpher" onclick="ativarPR()">
    <div class="pr-core">MORPH</div>
  </div>
</div>

<script>
let universoAtual = 'ben';

function trocarUniverso(univ) {
  document.querySelectorAll('.universo').forEach(u=>u.classList.remove('ativo'));
  document.getElementById(univ).classList.add('ativo');
  universoAtual = univ;
}
trocarUniverso('ben'); // começa no Ben

// BEN 10
function ativarBen() {
  document.getElementById('benTela').classList.add('ativo');
  document.getElementById('benHolo').classList.add('ativo');
  document.getElementById('benHolo').innerHTML = '<div style="font-size:200px">👽</div>';
  setTimeout(()=>{document.getElementById('benTela').classList.remove('ativo')},3000);
}

// GENERATOR REX
function ativarRex() {
  document.getElementById('rexTela').classList.add('ativo');
  document.getElementById('rexHolo').classList.add('ativo');
  document.getElementById('rexHolo').innerHTML = '<div style="font-size:200px">⚔️</div>';
  setTimeout(()=>{document.getElementById('rexTela').classList.remove('ativo')},3000);
}

// MAX STEEL
function ativarMax() {
  document.getElementById('steelHolo').classList.add('ativo');
  document.getElementById('maxTela').classList.add('ativo');
  document.getElementById('maxHolo').classList.add('ativo');
  document.getElementById('maxHolo').innerHTML = '<div style="font-size:200px">🔥</div>';
  setTimeout(()=>{document.getElementById('maxTela').classList.remove('ativo')},3000);
}

// POWER RANGERS
function ativarPR() {
  document.getElementById('prTela').classList.add('ativo');
  document.getElementById('prHolo').classList.add('ativo');
  document.getElementById('prHolo').innerHTML = '<div style="font-size:200px">🦸</div>';
  setTimeout(()=>{document.getElementById('prTela').classList.remove('ativo')},3000);
}
</script>

</body></html>
