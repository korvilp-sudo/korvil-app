<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>K-HOLOGRAM BRACELETE v2.0</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;font-family:'Orbitron',monospace}

  #camera{position:absolute;opacity:0;width:1px;height:1px}
  #cena{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center, #001a2e 0%, #000 100%)}

 .grid{position:absolute;bottom:0;width:100%;height:50%;background-image:linear-gradient(rgba(0,247,255,0.15) 1px, transparent 1px),linear-gradient(90deg, rgba(0,247,255,0.15) 1px, transparent 1px);background-size:30px 30px;transform:perspective(800px) rotateX(60deg);animation:gridMove 15s linear infinite}
  @keyframes gridMove{100%{background-position:0 30px}}

  /* LIXEIRA MAGNÉTICA */
  #lixeira{position:absolute;bottom:5%;left:5%;width:80px;height:80px;border:2px dashed #ff0044;border-radius:50%;box-shadow:0 0 30px #ff0044;transition:0.3s}
  #lixeira.magnet{border-color:#ffaa00;box-shadow:0 0 60px #ffaa00;transform:scale(1.3)}

  /* HUD */
  #hud{position:absolute;bottom:3%;right:2%;color:#00f7ff;background:rgba(0,0,0,0.8);padding:12px;border:1px solid #00f7ff;border-radius:8px;font-size:11px}
 .alerta{color:#00ff88;font-weight:900}
</style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>
<div id="cena"></div>
<div class="grid"></div>
<div id="lixeira"></div>

<div id="hud">
  <div><b>K-HOLOGRAM BRACELETE v2.0</b></div>
  <div class="alerta">STATUS: <span id="status">ESCANEANDO</span></div>
  <div>PEÇA: <span id="peca">NENHUMA</span></div>
  <div>GESTO: <span id="gesto">AGUARDANDO</span></div>
</div>

<script>
// ===== 1. THREE.JS CENA =====
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);
document.getElementById('cena').appendChild(renderer.domElement);
camera.position.set(0,3,6);

scene.add(new THREE.AmbientLight(0x00f7ff,0.4));
const light=new THREE.PointLight(0x00f7ff,3,20);light.position.set(0,4,3);scene.add(light);

// ===== 2. BRACELETE 3D COM PEÇAS =====
const braceleteGroup=new THREE.Group();scene.add(braceleteGroup);
const pecas=[];

// Base do bracelete
const baseGeo=new THREE.TorusGeometry(1.2,0.15,16,100);
const baseMat=new THREE.MeshPhongMaterial({color:0x00f7ff,transparent:true,opacity:0.3,wireframe:true});
const base=new THREE.Mesh(baseGeo,baseMat);braceleteGroup.add(base);

// 8 PEÇAS NO BRACELETE
for(let i=0;i<8;i++){
  const ang=i*Math.PI/4;
  const geo=new THREE.BoxGeometry(0.3,0.3,0.2);
  const mat=new THREE.MeshPhongMaterial({color:0x00ff88,emissive:0x00ff88,emissiveIntensity:0.5});
  const peca=new THREE.Mesh(geo,mat);
  peca.position.set(Math.cos(ang)*1.2,0,Math.sin(ang)*1.2);
  peca.rotation.y=-ang;
  peca.userData={id:i,noBracelete:true,angulo:ang};
  braceleteGroup.add(peca);pecas.push(peca);
}

// ===== 3. LÓGICA DE INTERAÇÃO =====
const video=document.getElementById('camera');
let maoEsq=null, maoDir=null, pecaSegurando=null, raycaster=new THREE.Raycaster();

navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(s=>video.srcObject=s);

// HANDS
const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({maxNumHands:2});
hands.onResults(onHands);
new Camera(video,{onFrame:async()=>{await hands.send({image:video})}}).start();

function get3DPos(handLandmark){
  // Converte 2D da mão para 3D na cena
  return new THREE.Vector3(
    (handLandmark.x-0.5)*8,
    (0.5-handLandmark.y)*6,
    (handLandmark.z)*4
  );
}

function onHands(res){
  if(!res.multiHandLandmarks) return;
  maoEsq=null;maoDir=null;
  res.multiHandLandmarks.forEach((lm,i)=>{
    const tipo=res.multiHandedness[i].label;
    if(tipo==='Left') maoEsq=lm; else maoDir=lm;
  });

  const posMaoDir=maoDir?get3DPos(maoDir[8]):null;
  const punhoFechado=maoDir?dist(maoDir[4],maoDir[8])<0.05:false;

  // 1. PASSAR A MÃO DENTRO DO HOLOGRAMA
  if(posMaoDir){
    braceleteGroup.children.forEach(obj=>{
      const d=posMaoDir.distanceTo(obj.position);
      if(d<0.5){
        obj.material.emissiveIntensity=1.5; // Brilha ao passar a mão
        setTimeout(()=>obj.material.emissiveIntensity=0.5,200);
      }
    });
  }

  // 2. SEGURAR E TIRAR PEÇA DO BRACELETE
  if(punhoFechado &&!pecaSegurando && posMaoDir){
    // Verifica qual peça tá perto
    pecas.forEach(p=>{
      if(p.userData.noBracelete && posMaoDir.distanceTo(p.position)<0.4){
        pecaSegurando=p;
        p.userData.noBracelete=false;
        p.parent=scene; // Tira do bracelete
        document.getElementById('status').innerText='PEÇA REMOVIDA';
        document.getElementById('peca').innerText='PEÇA '+p.userData.id;
        document.getElementById('gesto').innerText='SEGURANDO';
      }
    });
  }

  // 3. ARRASTAR PEÇA
  if(pecaSegurando && posMaoDir){
    pecaSegurando.position.copy(posMaoDir);
    pecaSegurando.rotation.x+=0.02; // Gira 360

    // 4. LIXEIRA MAGNÉTICA - JOGAR FORA
    const lixeiraPos=new THREE.Vector3(-3,-2,0);
    const distLixeira=pecaSegurando.position.distanceTo(lixeiraPos);

    if(distLixeira<2){
      document.getElementById('lixeira').classList.add('magnet');
      document.getElementById('gesto').innerText='SOLTE PRA DESCARTAR';

      // SOLTAR MÃO PERTO DA LIXEIRA = PUXA SOZINHA
      if(!punhoFechado){
        const dir=lixeiraPos.clone().sub(pecaSegurando.position).normalize();
        pecaSegurando.position.add(dir.multiplyScalar(0.2));
        if(distLixeira<0.5){
          scene.remove(pecaSegurando);
          pecaSegurando=null;
          document.getElementById('status').innerText='PEÇA DESCARTADA';
          document.getElementById('lixeira').classList.remove('magnet');
        }
      }
    }else{
      document.getElementById('lixeira').classList.remove('magnet');
    }
  }

  // 5. SOLTAR PEÇA NO AR
  if(!punhoFechado && pecaSegurando && distLixeira>2){
    pecaSegurando=null;
    document.getElementById('gesto').innerText='SOLTO';
    document.getElementById('peca').innerText='NENHUMA';
  }
}

function dist(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2)}

// ===== 4. BRACELETE SEGUE O MOVIMENTO DO BRAÇO =====
function animate(){
  requestAnimationFrame(animate);

  // Se tiver mão esquerda, bracelete segue ela = "vestir"
  if(maoEsq){
    const posPulso=get3DPos(maoEsq[0]);
    braceleteGroup.position.copy(posPulso);
    braceleteGroup.rotation.y+=0.01; // Gira 360 sozinho
  }

  // Cubos giram
  pecas.forEach(p=>{if(!p.userData.noBracelete)p.rotation.y+=0.03});

  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
