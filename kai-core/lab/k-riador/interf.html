<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>K-BRACELETE JARVIS v5.0</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;font-family:'Orbitron',monospace}

  #camera{position:absolute;opacity:0;width:1px;height:1px}
  #cena{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center, #001a2e 0%, #000 100%)}

  /* TERRENO HOLO */
.grid{position:absolute;bottom:0;width:100%;height:65%;background-image:linear-gradient(rgba(0,247,255,0.2) 1px, transparent 1px),linear-gradient(90deg, rgba(0,247,255,0.2) 1px, transparent 1px);background-size:35px 35px;transform:perspective(1200px) rotateX(70deg);animation:gridMove 20s linear infinite}
  @keyframes gridMove{100%{background-position:0 35px}}

  /* LIXEIRA MAGNÉTICA INFERIOR ESQUERDA IGUAL PEDIU */
  #lixeira{position:absolute;bottom:6%;left:4%;width:90px;height:90px;border:3px dashed #ff0044;border-radius:50%;box-shadow:0 0 30px #ff0044;transition:0.3s;display:flex;align-items:center;justify-content:center;color:#ff0044;font-size:10px}
  #lixeira.magnet{border-color:#ffaa00;box-shadow:0 0 80px #ffaa00;transform:scale(1.5);color:#ffaa00}

  /* HUD JARVIS */
.jarvis{position:absolute;top:4%;left:50%;transform:translateX(-50%);color:#00f7ff;background:rgba(0,247,255,0.05);padding:14px 24px;border:2px solid #00f7ff;border-radius:10px;font-size:13px;text-align:center;box-shadow:0 0 40px rgba(0,247,255,0.5)}
</style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>
<div id="cena"></div>
<div class="grid"></div>
<div id="lixeira">LIXEIRA</div>

<div class="jarvis">
  <b>JARVIS K-BRACELETE v5.0</b><br>
  STATUS: <span id="status">AGUARDANDO VESTIR</span><br>
  MÃO ESQ: <span id="maoEsq">LIVRE</span> | MÃO DIR: <span id="maoDir">LIVRE</span>
</div>

<script>
// ===== 1. THREE.JS =====
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);
document.getElementById('cena').appendChild(renderer.domElement);
camera.position.set(0,2.5,5.5);

scene.add(new THREE.AmbientLight(0x00f7ff,0.5));
const pointLight=new THREE.PointLight(0x00f7ff,2,30);pointLight.position.set(0,3,3);scene.add(pointLight);

// ===== 2. BRACELETE TONY STARK NO CENTRO =====
const braceleteGroup=new THREE.Group();
braceleteGroup.position.set(0,0.6,0);
scene.add(braceleteGroup);

// Base wireframe grossa
const baseGeo=new THREE.TorusGeometry(1.4,0.14,12,120);
const baseMat=new THREE.MeshPhongMaterial({color:0x00f7ff,wireframe:true,transparent:true,opacity:0.8});
const base=new THREE.Mesh(baseGeo,baseMat);braceleteGroup.add(base);

// 3 PEÇAS MODULARES IGUAL FILME
const pecas=[];
const pecasConfig=[
  {type:'hex', pos:-1.4, color:0x00ff88},
  {type:'rect', pos:0, color:0x00f7ff},
  {type:'hex', pos:1.4, color:0xff00ff}
];

pecasConfig.forEach(cfg=>{
  let geo = cfg.type==='hex'? new THREE.CylinderGeometry(0.24,0.24,0.14,6) : new THREE.BoxGeometry(0.28,0.38,0.14);
  const mat=new THREE.MeshPhongMaterial({color:cfg.color,emissive:cfg.color,emissiveIntensity:0.8});
  const peca=new THREE.Mesh(geo,mat);
  peca.position.set(cfg.pos,0,0);
  peca.userData={noBracelete:true,originalPos:peca.position.clone()};
  braceleteGroup.add(peca);pecas.push(peca);
});

// ===== 3. CONTROLE JARVIS - 2 MÃOS =====
const video=document.getElementById('camera');
let maoEsq=null, maoDir=null;
let braceleteVestido=false, pecaSegurando=null;

navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(s=>video.srcObject=s);

const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({maxNumHands:2});
hands.onResults(onHands);
new Camera(video,{onFrame:async()=>{await hands.send({image:video})}}).start();

function get3D(lm){return new THREE.Vector3((lm.x-0.5)*6,(0.5-lm.y)*4.5,lm.z*3)}
function dist(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2)}

function onHands(res){
  if(!res.multiHandLandmarks) return;
  maoEsq=null;maoDir=null;
  res.multiHandLandmarks.forEach((lm,i)=>{
    if(res.multiHandedness[i].label==='Left') maoEsq=lm; else maoDir=lm;
  });

  const posEsq=maoEsq?get3D(maoEsq[0]):null;
  const posDir=maoDir?get3D(maoDir[8]):null;
  const punhoEsq=maoEsq?dist(maoEsq[4],maoEsq[8])<0.05:false;
  const punhoDir=maoDir?dist(maoDir[4],maoDir[8])<0.05:false;
  const abertaEsq=maoEsq?dist(maoEsq[4],maoEsq[8])>0.15:false;
  const abertaDir=maoDir?dist(maoDir[4],maoDir[8])>0.15:false;

  // ===== 1. VESTIR BRACELETE - PASSAR BRAÇO POR DENTRO =====
  if(posEsq &&!braceleteVestido){
    if(posEsq.distanceTo(braceleteGroup.position)<1.3){
      braceleteVestido=true;
      document.getElementById('status').innerText='BRACELETE VESTIDO';
      baseMat.color.set(0x00ffff);
      document.getElementById('maoEsq').innerText='VESTINDO';
    }
  }

  // ===== 2. MOVER BRACELETE COM MÃO ESQUERDA =====
  if(braceleteVestido && posEsq){
    braceleteGroup.position.copy(posEsq);
    braceleteGroup.position.y+=0.6;
    document.getElementById('maoEsq').innerText='MOVENDO';
  }

  // ===== 3. ROTACIONAR BRACELETE COM 2 MÃOS =====
  if(maoEsq && maoDir && abertaEsq && abertaDir){
    const dx=posDir.x-posEsq.x;
    const dy=posDir.y-posEsq.y;
    braceleteGroup.rotation.z=dx*1.8;
    braceleteGroup.rotation.x=dy*1.8;
    document.getElementById('status').innerText='ROTACIONANDO';
  }

  // ===== 4. MÃO DIREITA: PEGAR PEÇA E JOGAR FORA =====
  if(punhoDir && posDir && braceleteVestido &&!pecaSegurando){
    pecas.forEach(p=>{
      const worldPos=p.position.clone().add(braceleteGroup.position);
      if(worldPos.distanceTo(posDir)<0.45){
        pecaSegurando=p;
        scene.add(p); // TIRA DO BRACELETE
        p.userData.noBracelete=false;
        document.getElementById('maoDir').innerText='SEGURANDO';
        document.getElementById('status').innerText='PEÇA REMOVIDA';
        p.material.emissiveIntensity=1.8;
      }
    });
  }

  // ARRASTAR PEÇA
  if(pecaSegurando && posDir){
    pecaSegurando.position.copy(posDir);
    pecaSegurando.rotation.x+=0.05;pecaSegurando.rotation.y+=0.05; // Gira 360

    // LIXEIRA MAGNÉTICA
    const lixeiraPos=new THREE.Vector3(-2.8,-2,0);
    const distLix=pecaSegurando.position.distanceTo(lixeiraPos);
    if(distLix<2){
      document.getElementById('lixeira').classList.add('magnet');
      if(abertaDir){ // SOLTA E PUXA SOZINHA
        const dir=lixeiraPos.clone().sub(pecaSegurando.position).normalize();
        pecaSegurando.position.add(dir.multiplyScalar(0.18));
        document.getElementById('status').innerText='DESCARTANDO...';
        if(distLix<0.4){
          scene.remove(pecaSegurando);
          pecaSegurando=null;
          document.getElementById('lixeira').classList.remove('magnet');
          document.getElementById('status').innerText='PEÇA DESCARTADA';
          document.getElementById('maoDir').innerText='LIVRE';
        }
      }
    }else{document.getElementById('lixeira').classList.remove('magnet')}
  }

  // SOLTAR PEÇA NO AR
  if(abertaDir && pecaSegurando && distLix>2){
    pecaSegurando=null;
    document.getElementById('maoDir').innerText='LIVRE';
    document.getElementById('status').innerText='BRACELETE VESTIDO';
  }

  // ===== 5. TIRAR BRACELETE =====
  if(braceleteVestido && posEsq && posEsq.y<-2.5){
    braceleteVestido=false;
    braceleteGroup.position.set(0,0.6,0);
    baseMat.color.set(0x00f7ff);
    document.getElementById('status').innerText='AGUARDANDO VESTIR';
    document.getElementById('maoEsq').innerText='LIVRE';
  }
}

// ===== 4. ANIMAÇÃO =====
function animate(){
  requestAnimationFrame(animate);

  // Passar a mão dentro = brilho
  if(maoDir){
    const pos=get3D(maoDir[8]);
    pecas.forEach(p=>{
      const wp=p.position.clone().add(braceleteGroup.position);
      if(wp.distanceTo(pos)<0.5) p.material.emissiveIntensity=1.5;
      else p.material.emissiveIntensity=0.8;
    });
  }

  if(!pecaSegurando) braceleteGroup.rotation.y+=0.003;
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
