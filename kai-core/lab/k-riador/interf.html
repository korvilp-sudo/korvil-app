<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>K-HOLOGRAM</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial;
}

canvas{
display:block;
}

#info{
position:absolute;
top:10px;
left:10px;
z-index:10;
color:#00ffff;
background:rgba(0,0,0,.5);
padding:10px;
border:1px solid #00ffff;
}

</style>
</head>
<body>

<div id="info">
K-HOLOGRAM v1
</div>

<script type="module">

import * as THREE from 'https://unpkg.com/three@0.166.1/build/three.module.js';

const scene = new THREE.Scene();

scene.fog =
new THREE.Fog(
0x000000,
10,
80
);

const camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(
0,
8,
15
);

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(
window.devicePixelRatio
);

document.body.appendChild(
renderer.domElement
);

const ambient =
new THREE.AmbientLight(
0x00ffff,
2
);

scene.add(
ambient
);

const grid =
new THREE.GridHelper(
60,
60,
0x00ffff,
0x003333
);

scene.add(
grid
);

const terrenoGeo =
new THREE.PlaneGeometry(
50,
50,
80,
80
);

const terrenoMat =
new THREE.MeshBasicMaterial({
color:0x00ffff,
wireframe:true,
transparent:true,
opacity:0.3
});

const terreno =
new THREE.Mesh(
terrenoGeo,
terrenoMat
);

terreno.rotation.x =
-Math.PI/2;

scene.add(
terreno
);
function criarCubo(x,z){

const cubo =
new THREE.Mesh(

new THREE.BoxGeometry(
2,
2,
2
),

new THREE.MeshBasicMaterial({
color:0x00ffff,
wireframe:true
})

);

cubo.position.set(
x,
1,
z
);

scene.add(
cubo
);

return cubo;

}

const cubo1 =
criarCubo(-8,0);

const cubo2 =
criarCubo(0,0);

const cubo3 =
criarCubo(8,0);

const cubos = [
cubo1,
cubo2,
cubo3
];

let cuboSelecionado=0;

/* BRACELETE */

const bracelete =
new THREE.Group();

for(let i=0;i<5;i++){

const anel =
new THREE.Mesh(

new THREE.TorusGeometry(
2+(i*0.3),
0.05,
16,
120
),

new THREE.MeshBasicMaterial({
color:0x00ffff,
transparent:true,
opacity:0.8
})

);

anel.rotation.x =
Math.PI/2;

anel.position.y = 5;

bracelete.add(
anel
);

}

scene.add(
bracelete
);
/* PORTAL */

const portal =
new THREE.Mesh(

new THREE.RingGeometry(
2,
3,
128
),

new THREE.MeshBasicMaterial({
color:0x00ffff,
side:THREE.DoubleSide,
transparent:true,
opacity:1
})

);

portal.rotation.x =
-Math.PI/2;

portal.position.y =
0.05;

scene.add(
portal
);

/* FEIXE */

const beam =
new THREE.Mesh(

new THREE.CylinderGeometry(
1.5,
2.5,
10,
32,
1,
true
),

new THREE.MeshBasicMaterial({
color:0x00ffff,
transparent:true,
opacity:0.12,
side:THREE.DoubleSide
})

);

beam.position.y=5;

scene.add(
beam
);

/* PARTÍCULAS */

const particlesGeo =
new THREE.BufferGeometry();

const vertices=[];

for(let i=0;i<5000;i++){

vertices.push(
(Math.random()-0.5)*40,
Math.random()*15,
(Math.random()-0.5)*40
);

}

particlesGeo.setAttribute(
'position',
new THREE.Float32BufferAttribute(
vertices,
3
)
);

const particles =
new THREE.Points(

particlesGeo,

new THREE.PointsMaterial({
color:0x00ffff,
size:0.03
})

);

scene.add(
particles
);
function holograma(){

const t =
Date.now()*0.001;

terreno.material.opacity =
0.25 +
Math.sin(t*4)*0.1;

portal.rotation.z +=
0.01;

bracelete.rotation.y +=
0.03;

bracelete.children.forEach(
(a,i)=>{

a.rotation.z +=
0.01*(i+1);

}
);

beam.material.opacity =
0.08 +
Math.sin(t*5)*0.05;

particles.rotation.y +=
0.0005;

cubos.forEach(c=>{

c.rotation.y +=
0.01;

});

}

window.KAI = {

segurar(){
console.log("SEGURANDO");
},

soltar(){
console.log("SOLTOU");
},

aumentar(){
cubos[cuboSelecionado]
.scale.multiplyScalar(1.05);
},

diminuir(){
cubos[cuboSelecionado]
.scale.multiplyScalar(0.95);
},

zoomMais(){
camera.position.z -= 1;
},

zoomMenos(){
camera.position.z += 1;
},

passarMao(x,z){

portal.scale.set(
1.3,
1.3,
1.3
);

cubos[cuboSelecionado]
.position.set(
x,
1,
z
);

setTimeout(()=>{

portal.scale.set(
1,
1,
1
);

},100);

}

};

function animate(){

requestAnimationFrame(
animate
);

holograma();

renderer.render(
scene,
camera
);

}

animate();

</script>
</body>
</html>
