<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-HOLOGRAM v1</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;font-family:'Orbitron',monospace;color:#00f7ff}

  #camera,#canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#000}
  #camera{z-index:1} #canvas{z-index:2;pointer-events:none}

  /* HOLOGRAMAS */
.holo{position:absolute;z-index:3;border:2px solid #00f7ff;background:rgba(0,247,255,0.05);backdrop-filter:blur(10px);color:#00f7ff;padding:15px;border-radius:10px;box-shadow:0 0 30px rgba(0,247,255,0.5);transition:0.3s;animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-10px)}}
.holo.active{border-color:#00ff88;box-shadow:0 0 50px #00ff88;background:rgba(0,255,136,0.1)}
.holo.grab{border-color:#ffaa00;box-shadow:0 0 50px #ffaa00}

 .top-left{top:10%;left:5%}
 .top-right{top:10%;right:5%}
 .center{top:50%;left:50%;transform:translate(-50%,-50%)}

  #info{position:absolute;bottom:3%;left:2%;z-index:4;background:rgba(0,0,0,0.8);border:1px solid #00f7ff;padding:12px;border-radius:8px;font-size:12px;width:90%}

.ponto{position:absolute;width:8px;height:8px;background:#00ff88;border-radius:50%;box-shadow:0 0 10px #00ff88;z-index:3}
</style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<!-- HOLOGRAMAS -->
<div id="h1" class="holo top-left"><div>ARMA: <span id="arma">LASER</span></div></div>
<div id="h2" class="holo top-right"><div>ENERGIA: <span id="energia">100%</span></div></div>
<div id="h3" class="holo center"><div>MENU K-HOLO</div></div>

<div id="info">
  <div><b>K-HOLOGRAM v1 ONLINE</b></div>
  <div>GESTO: <span id="gesto">AGUARDANDO</span></div>
  <div>MÃO: <span id="mao">NENHUMA</span></div>
</div>

<script>
const video=document.getElementById('camera'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let lastGesture='', energia=100;

// LIGAR CÂMERA
navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}})
.then(s=>video.srcObject=s).catch(e=>alert("Erro câmera: "+e));

// HANDS
const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({maxNumHands:2,minDetectionConfidence:0.7,minTrackingConfidence:0.7});
hands.onResults(onResults);
new Camera(video,{onFrame:async()=>{await hands.send({image:video})}}).start();

function desenharMao(landmarks, cor='#00f7ff'){
  // Desenha esqueleto da mão
  ctx.strokeStyle=cor;ctx.lineWidth=2;ctx.shadowBlur=10;ctx.shadowColor=cor;
  const conexoes=HAND_CONNECTIONS;
  for(let con of conexoes){
    ctx.beginPath();
    ctx.moveTo(landmarks[con[0]].x*canvas.width, landmarks[con[0]].y*canvas.height);
    ctx.lineTo(landmarks[con[1]].x*canvas.width, landmarks[con[1]].y*canvas.height);
    ctx.stroke();
  }
  // Desenha pontos
  for(let lm of landmarks){
    ctx.fillStyle=cor;
    ctx.beginPath();
    ctx.arc(lm.x*canvas.width, lm.y*canvas.height, 4, 0, Math.PI*2);
    ctx.fill();
  }
}

function detectarGesto(lm){
  // Distâncias dos dedos
  const thumbTip=lm[4], indexTip=lm[8], middleTip=lm[12], ringTip=lm[16], pinkyTip=lm[20];
  const thumbBase=lm[2], indexBase=lm[5];

  const dist = (a,b)=>Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);

  let dedosLevantados=0;
  if(dist(thumbTip, thumbBase) > 0.1) dedosLevantados++;
  if(dist(indexTip, lm[6]) > 0.08) dedosLevantados++;
  if(dist(middleTip, lm[10]) > 0.08) dedosLevantados++;
  if(dist(ringTip, lm[14]) > 0.08) dedosLevantados++;
  if(dist(pinkyTip, lm[18]) > 0.08) dedosLevantados++;

  // GESTOS
  if(dedosLevantados===0) return 'PUNHO'; // Fechar mão
  if(dedosLevantados===1 && dist(indexTip, lm[6]) > 0.08) return 'APONTAR'; // Só indicador
  if(dedosLevantados===2) return 'PEACE'; // V de vitória
  if(dedosLevantados===5) return 'PALMA'; // Mão aberta
  if(dist(thumbTip, indexTip) < 0.04) return 'PINÇA'; // Beliscar

  return 'NEUTRO';
}

function executarGesto(gesto, mao, x, y){
  document.getElementById('gesto').innerText=gesto;
  document.getElementById('mao').innerText=mao;

  const h1=document.getElementById('h1'), h2=document.getElementById('h2'), h3=document.getElementById('h3');
  [h1,h2,h3].forEach(h=>h.classList.remove('active','grab'));

  if(gesto==='PALMA'){
    h3.classList.add('active'); // Abre menu central
  }
  if(gesto==='PUNHO'){
    h1.classList.add('grab'); // Segura/arrasta holograma
    h1.style.left=(x*100-10)+'%'; h1.style.top=(y*100-10)+'%';
  }
  if(gesto==='APONTAR'){
    // Move ponteiro
    ctx.strokeStyle='#00ff88';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(x*canvas.width, y*canvas.height, 15, 0, Math.PI*2);ctx.stroke();
  }
  if(gesto==='PEACE'){
    energia=Math.min(100,energia+2);
    document.getElementById('energia').innerText=energia+'%';
    h2.classList.add('active');
  }
  if(gesto==='PINÇA'){
    // Zoom no holograma
    h3.style.transform='translate(-50%,-50%) scale(1.3)';
    setTimeout(()=>h3.style.transform='translate(-50%,-50%)',300);
  }
}

function onResults(res){
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(!res.multiHandLandmarks?.length){
    document.getElementById('gesto').innerText='NENHUMA MÃO';
    document.getElementById('mao').innerText='NENHUMA';
    return
  }

  res.multiHandLandmarks.forEach((landmarks, i)=>{
    const mao = res.multiHandedness[i].label; // Left ou Right
    desenharMao(landmarks, i===0?'#00f7ff':'#ff00ff');

    const gesto=detectarGesto(landmarks);
    const x=landmarks[8].x; // ponta do indicador
    const y=landmarks[8].y;
    executarGesto(gesto, mao, x, y);
  });
}
</script>
</body>
</html>
