<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OMNITRIX HOLOGRAMA 4D</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}
body {
  background:radial-gradient(circle at center, #000800 0%, #000 100%);
  display:flex;justify-content:center;align-items:center;height:100vh;
  overflow:hidden;perspective:2000px;
}

/* CHÃO REFLEXIVO */
.floor {
  position:absolute;bottom:0;width:100%;height:40%;
  background:linear-gradient(transparent, rgba(0,255,0,0.1));
  transform:rotateX(90deg) translateZ(-200px);
}

/* OMNITRIX */
.omnitrix {
  width:380px;height:380px;border-radius:50%;position:relative;z-index:5;
  background:radial-gradient(circle, #00FF00 0%, #00AA00 40%, #001100 80%);
  box-shadow:0 0 300px #00FF00, inset 0 0 150px #00FF00;
  animation:idle 6s infinite ease-in-out;cursor:pointer;
}
.omnitrix-core {
  width:220px;height:220px;border-radius:50%;background:#00FF00;
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 100px #00FF00;border:8px solid #003300;
}
.omnitrix-face {
  width:90px;height:90px;background:#000;border-radius:50%;position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);border:4px solid #00FF00;
}

/* PROJETOR DE HOLOGRAMA */
.projetor {
  position:absolute;top:-250px;width:500px;height:500px;
  opacity:0;transition:1.2s;
  pointer-events:none;
}
.projetor.ativo {opacity:1}

/* EFEITO HOLOGRAMA REAL */
.holo {
  width:100%;height:100%;position:relative;
  background:radial-gradient(circle, rgba(0,255,0,0.15) 0%, transparent 70%);
  border-radius:50%;
  animation:holoFloat 4s ease-in-out infinite;
}

/* LINHAS DE SCAN HOLO */
.holo::before {
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(transparent 0px, rgba(0,255,0,0.2) 2px, transparent 4px);
  border-radius:50%;animation:scanHolo 2s linear infinite;
}

/* DISTORÇÃO HOLO */
.holo::after {
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle, transparent 40%, rgba(0,255,0,0.1) 70%);
  border-radius:50%;animation:distort 0.3s infinite;
}

/* IMAGEM DO ALIEN DENTRO DO HOLO */
.alien-img {
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:180px;filter:drop-shadow(0 0 50px #00FF00);
  animation:glitch 3s infinite;
}

/* CORPO HOLOGRÁFICO 360 */
.corpo-holo {
  position:absolute;bottom:80px;width:250px;height:450px;
  opacity:0;transition:1s;transform-style:preserve-3d;
}
.corpo-holo.ativo {opacity:0.8;animation:rotate360 12s infinite linear}
.corpo-modelo {
  width:100%;height:100%;border-radius:100px 100px 40px 40px;
  background:linear-gradient(rgba(0,255,0,0.2), rgba(0,255,0,0.05));
  border:2px solid rgba(0,255,0,0.5);
  box-shadow:inset 0 0 80px rgba(0,255,0,0.3);
}

/* MENU */
.menu {
  position:absolute;bottom:40px;display:flex;gap:18px;z-index:10
}
.btn {
  padding:16px 28px;background:rgba(0,255,0,0.08);border:2px solid #00FF00;
  color:#00FF00;border-radius:15px;font-weight:900;cursor:pointer;
  backdrop-filter:blur(15px);transition:0.3s
}
.btn:hover {background:#00FF00;color:#000;transform:scale(1.1) translateZ(30px)}

/* TRANSFORMAÇÃO */
.transf {
  position:absolute;top:0;left:0;width:100%;height:100%;background:#000;
  display:none;justify-content:center;align-items:center;z-index:99
}
.transf.ativo {display:flex;animation:flash 5s}
.transf h1 {color:#00FF00;font-size:70px;text-shadow:0 0 60px #00FF00}

@keyframes idle {50%{box-shadow:0 0 400px #00FF00}}
@keyframes holoFloat {50%{transform:translateY(-25px)}}
@keyframes scanHolo {0%{transform:translateY(-100%)} 100%{transform:translateY(100%)}}
@keyframes distort {50%{transform:scale(1.02)}}
@keyframes glitch {10%{transform:translate(-50%,-50%) translateX(3px)} 20%{transform:translate(-50%,-50%) translateX(-3px)}}
@keyframes rotate360 {100%{transform:rotateY(360deg)}}
@keyframes flash {0%,100%{opacity:0} 5%,25%{opacity:1}}
</style>
</head>
<body>

<div class="floor"></div>

<!-- PROJETOR HOLOGRAFICO -->
<div class="projetor" id="projetor">
  <div class="holo">
    <div class="alien-img" id="alienImg">🔥</div>
  </div>
</div>

<!-- CORPO HOLOGRÁFICO -->
<div class="corpo-holo" id="corpoHolo"><div class="corpo-modelo"></div></div>

<!-- OMNITRIX -->
<div class="omnitrix" onclick="ativar()">
  <div class="omnitrix-core"></div>
  <div class="omnitrix-face"></div>
</div>

<!-- MENU -->
<div class="menu">
  <button class="btn" onclick="escolher('FOGO','🔥')">FOGO</button>
  <button class="btn" onclick="escolher('QUATRO BRAÇOS','💪')">4 BRAÇOS</button>
  <button class="btn" onclick="escolher('ULTRA T','⚙️')">ULTRA T</button>
  <button class="btn" onclick="escolher('XLR8','💨')">XLR8</button>
</div>

<!-- TELA TRANSFORMAÇÃO -->
<div class="transf" id="transf"><h1 id="txt">TRANSFORMANDO</h1></div>

<audio id="snd" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA="></audio>

<script>
function ativar() {
  document.getElementById('snd').play();
  document.querySelector('.omnitrix').style.animation = 'spin 2s linear';
  setTimeout(()=>{document.querySelector('.omnitrix').style.animation = 'idle 6s infinite'}, 2000);
}

function escolher(nome, emoji) {
  ativar();
  
  // LIGA PROJETOR HOLOGRÁFICO
  document.getElementById('projetor').classList.add('ativo');
  document.getElementById('alienImg').innerText = emoji;
  
  // LIGA CORPO HOLO
  document.getElementById('corpoHolo').classList.add('ativo');
  document.querySelector('.corpo-modelo').style.borderColor = 
    nome==='FOGO'?'rgba(255,0,0,0.5)':nome==='QUATRO BRAÇOS'?'rgba(255,0,0,0.5)':nome==='ULTRA T'?'rgba(128,128,128,0.5)':'rgba(0,255,255,0.5)';
  
  // TRANSFORMAÇÃO 5S
  document.getElementById('transf').classList.add('ativo');
  document.getElementById('txt').innerText = 'TRANSFORMANDO EM ' + nome;
  
  setTimeout(()=>{
    document.getElementById('transf').classList.remove('ativo');
  }, 5000);
}
</script>

</body></html>
