<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KORVIL G15 ULTRA 7.0 // CONTROLE REAL</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;font-family:'Courier New';user-select:none;touch-action:none;}
body{background:#030712;color:#00f0ff;overflow:hidden;width:100vw;height:100vh;}
#video{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0.15;}
.grid-bg{position:absolute;inset:0;background:linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px);background-size:30px 30px;z-index:1;}
#menu{position:absolute;top:15px;left:15px;width:250px;background:rgba(5,12,24,.95);border:2px solid #00f0ff;padding:12px;border-radius:8px;z-index:10;}
.menu-title{font-size:12px;font-weight:bold;color:#ffe600;margin-bottom:10px;}
.btn{width:100%;padding:10px;margin:4px 0;background:rgba(0,240,255,.1);border:1px solid #00f0ff;color:#00f0ff;font-size:11px;cursor:pointer;border-radius:5px;}
.btn:hover{background:rgba(0,240,255,.3);color:#fff;}
.cubo{position:absolute;width:100px;height:100px;border:3px solid #00f0ff;background:rgba(0,240,255,.15);box-shadow:0 0 20px rgba(0,240,255,.6);border-radius:10px;display:flex;align-items:center;justify-content:center;z-index:5;}
.cubo::after{content:'K-AI';font-size:10px;opacity:.6;}
.cubo.segurado{border-color:#ff00ea;box-shadow:0 0 35px #ff00ea;transform:scale(1.1);}
.cubo.travado{border-color:#ffe600;box-shadow:0 0 35px #ffe600;}
#lixeira{position:absolute;bottom:20px;left:20px;width:80px;height:80px;border:3px dashed #ff3366;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:35px;background:rgba(255,51,102,.1);z-index:10;}
#lixeira.ativo{background:rgba(255,0,68,.4);transform:scale(1.2);}
.pino{position:absolute;width:20px;height:20px;border-radius:50%;pointer-events:none;z-index:20;transform:translate(-50%,-50%);}
#pino1{background:#ff00ea;box-shadow:0 0 20px #ff00ea;border:2px solid #fff;}
#pino2{background:#00f0ff;box-shadow:0 0 20px #00f0ff;border:2px solid #fff;}
#status{position:absolute;bottom:20px;right:20px;width:350px;background:rgba(5,12,24,.95);border:2px solid #00f0ff;padding:12px;border-radius:8px;z-index:10;font-size:11px;}
.status-title{color:#ffe600;font-weight:bold;margin-bottom:5px;}
.calib-bar{width:100%;height:6px;background:#001122;border-radius:3px;margin:5px 0;}
.calib-fill{height:100%;width:0%;background:linear-gradient(90deg,#00ff00,#00f0ff);transition:.3s;}
#hold-bar{width:0%;height:4px;background:#ffe600;margin-top:4px;transition:.1s;}
.erro{color:#ff3366}.sucesso{color:#00ff66}
</style>
</head>
<body>
<div class="grid-bg"></div>
<video id="video" autoplay playsinline muted></video>
<div id="pino1" class="pino"></div><div id="pino2" class="pino"></div>

<div id="menu">
  <div class="menu-title">> G15 ULTRA v7.0</div>
  <button class="btn" id="calibrar">[1] CALIBRAR MÃO</button>
  <button class="btn" id="novo">[2] NOVO CUBO</button>
  <button class="btn" id="limpar">[3] LIMPAR TUDO</button>
  <button class="btn" id="voz">🔊 VOZ: ON</button>
  <div class="calib-bar"><div class="calib-fill" id="calibFill"></div></div>
</div>

<div id="lixeira">🗑️</div>

<div id="status">
  <div class="status-title">📡 K-AI CONTROLE</div>
  <div>STATUS: <span id="st">AGUARDANDO CALIBRAÇÃO</span></div>
  <div>GESTO: <span id="gesto" style="color:#ff00ea">NENHUM</span></div>
  <div>OBJETO: <span id="obj">NENHUM</span></div>
  <div>FEEDBACK: <span id="feed" class="sucesso">CALIBRE PRIMEIRO</span></div>
  <div id="hold-bar"></div>
  <div id="help" style="margin-top:8px;">Mostre MÃO ABERTA por 2s</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="./korvil.js"></script>
</body>
</html>
