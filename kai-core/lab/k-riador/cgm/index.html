<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KORVIL G15 ULTRA 5.0 // FOTO COM GESTOS</title>
<style>
/*... MANTEM TODO CSS ANTERIOR... */
#contador {position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:200px;color:#ffe600;text-shadow:0 0 50px #ffe600;z-index:50;display:none;font-weight:900;}
#galeria {position:absolute;bottom:100px;right:20px;width:120px;height:80vh;overflow-y:auto;z-index:9;}
.foto-mini {width:100px;height:75px;margin:5px;border:2px solid #00f0ff;border-radius:5px;cursor:pointer;object-fit:cover;transition:0.3s;}
.foto-mini:hover {transform:scale(1.1);border-color:#ff00ea;}
#zonaLixeira {position:absolute;bottom:20px;left:20px;width:100px;height:100px;border:3px dashed #ff3366;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:40px;background:rgba(255,51,102,0.1);}
#zonaSalvar {position:absolute;bottom:20px;right:20px;width:100px;height:100px;border:3px dashed #00ff66;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:40px;background:rgba(0,255,102,0.1);}
#zonaLixeira.ativo {background:rgba(255,0,68,0.5);transform:scale(1.2);}
#zonaSalvar.ativo {background:rgba(0,255,102,0.5);transform:scale(1.2);}
.flash {position:absolute;inset:0;background:white;opacity:0;pointer-events:none;z-index:60;}
</style>
</head>
<body>

<div id="contador">10</div>
<div class="flash" id="flash"></div>
<div id="galeria"></div>
<div id="zonaLixeira">🗑️</div>
<div id="zonaSalvar">💾</div>

<!--... RESTO DO HTML ANTERIOR... -->

<script>
// ===== ADICIONAR NO JS =====
let fotos = [];
let fotoAtual = null;
let pincaTimer = null;
let contagemAtiva = false;
let contador = 10;
let swipeInicio = {x:0, y:0, tempo:0};

function tirarFoto() {
  if (contagemAtiva) return;
  contagemAtiva = true;
  contador = 10;
  document.getElementById('contador').style.display = 'block';
  falar("Foto em 10 segundos", 'sucesso');

  const interval = setInterval(() => {
    document.getElementById('contador').innerText = contador;
    falar(contador.toString());
    contador--;
    if (contador < 0) {
      clearInterval(interval);
      capturarFrame();
      document.getElementById('contador').style.display = 'none';
      contagemAtiva = false;
    }
  }, 1000);
}

function capturarFrame() {
  const canvas = document.createElement('canvas');
  canvas.width = 640; canvas.height = 480;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, 640, 480);

  // FLASH
  document.getElementById('flash').style.opacity = '0.8';
  setTimeout(() => document.getElementById('flash').style.opacity = '0', 200);

  const dataURL = canvas.toDataURL('image/png');
  fotoAtual = {id: Date.now(), src: dataURL};
  adicionarNaGaleria(fotoAtual);
  falar("Foto capturada", 'sucesso');
  SFX.sucesso();
}

function adicionarNaGaleria(foto) {
  fotos.push(foto);
  const img = document.createElement('img');
  img.src = foto.src; img.className = 'foto-mini'; img.dataset.id = foto.id;
  img.draggable = true;
  document.getElementById('galeria').prepend(img);
}

function salvarFoto(foto) {
  const a = document.createElement('a');
  a.href = foto.src; a.download = `KORVIL-FOTO-${foto.id}.png`;
  a.click();
  falar("Foto salva na pasta Downloads");
  SFX.click();
}

function deletarFoto(fotoId) {
  fotos = fotos.filter(f => f.id!= fotoId);
  document.querySelector(`.foto-mini[data-id="${fotoId}"]`).remove();
  falar("Foto excluída");
  SFX.trash();
}

// ===== MODIFICAR O LOOP PRINCIPAL hands.onResults =====
hands.onResults(res => {
  const maos = res.multiHandLandmarks;
  if (maos && maos.length > 0) {
    const h1 = maos[0];
    let tx = (1 - h1[8].x) * window.innerWidth, ty = h1[8].y * window.innerHeight;
    posSuave.x += (tx - posSuave.x) * 0.4 * sensibilidade;
    posSuave.y += (ty - posSuave.y) * 0.4 * sensibilidade;
    pino1.style.left = posSuave.x + 'px'; pino1.style.top = posSuave.y + 'px';

    const gesto1 = identificarGesto(h1);

    // ===== NOVA AÇÃO 21: PINÇA 2s = FOTO =====
    if (gesto1 === "PINÇA" &&!pincaTimer &&!contagemAtiva) {
      pincaTimer = setTimeout(() => {
        tirarFoto();
      }, 2000);
      stFeedback.textContent = "SEGURE PINÇA 2s...";
      falar("Segure para tirar foto");
    }
    if (gesto1!== "PINÇA" && pincaTimer) {
      clearTimeout(pincaTimer); pincaTimer = null;
    }

    // ===== DETECTAR SWIPE NA FOTO =====
    const fotoElements = document.querySelectorAll('.foto-mini');
    fotoElements.forEach(img => {
      const rect = img.getBoundingClientRect();
      if (posSuave.x > rect.left && posSuave.x < rect.right && posSuave.y > rect.top && posSuave.y < rect.bottom) {
        if (!swipeInicio.tempo) {
          swipeInicio = {x: posSuave.x, y: posSuave.y, tempo: Date.now(), id: img.dataset.id};
        } else {
          let dx = posSuave.x - swipeInicio.x;
          let dt = Date.now() - swipeInicio.tempo;
          if (dt < 500 && Math.abs(dx) > 80) { // swipe rápido
            if (dx < -80) { // ESQUERDA = LIXEIRA
              document.getElementById('zonaLixeira').classList.add('ativo');
              deletarFoto(swipeInicio.id);
            }
            if (dx > 80) { // DIREITA = SALVAR
              document.getElementById('zonaSalvar').classList.add('ativo');
              const foto = fotos.find(f => f.id == swipeInicio.id);
              if (foto) salvarFoto(foto);
            }
            setTimeout(() => {
              document.getElementById('zonaLixeira').classList.remove('ativo');
              document.getElementById('zonaSalvar').classList.remove('ativo');
            }, 300);
            swipeInicio = {x:0,y:0,tempo:0};
          }
        }
      }
    });

    //... RESTO DO CODIGO ANTERIOR DE GESTOS 1-20...
    if (calibrado) executarAcao(gesto1, maos.length > 1? identificarGesto(maos[1]) : "NEUTRO");

  } else {
    if (pincaTimer) { clearTimeout(pincaTimer); pincaTimer = null; }
    swipeInicio = {x:0,y:0,tempo:0};
  }
});

// ===== ATUALIZAR TABELA DE AÇÕES =====
function executarAcao(g1,g2){
  //... CODIGO ANTERIOR...
  // ADICIONAR AÇÃO 21
  if(g1==="PINÇA" && g2==="NEUTRO" && Date.now()>cooldownGesto+2000){
    stAcao.textContent="[AÇÃO 21] MODO FOTO";
    tutorialBox.innerHTML="📸 <b>AÇÃO 21:</b><br>Segure Pinça 2s para iniciar contagem de 10s";
  }
}
</script>
</body>
</html>
