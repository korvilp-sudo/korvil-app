<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>KORVIL K-AI v4.2 - FEEDBACK NEON</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;font-family:'Orbitron',monospace;color:#00f7ff}
  #camera,#canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  #camera{z-index:1} #canvas{z-index:2;pointer-events:none;transform:scaleX(-1)}

.neon-green{color:#00ff88;text-shadow:0 0 5px #00ff88,0 0 15px #00ff88;animation:pulseGreen 1s infinite}
.neon-red{color:#ff0044;text-shadow:0 0 5px #ff0044,0 0 15px #ff0044;animation:flashRed 0.3s}
  @keyframes pulseGreen{0%,100%{opacity:1;filter:drop-shadow(0 0 10px #00ff88)}50%{opacity:0.4;filter:drop-shadow(0 0 20px #00ff88)}}
  @keyframes flashRed{0%{opacity:1}100%{opacity:0}}

.panel{position:absolute;z-index:3;border:1px solid #00f7ff;background:rgba(0,247,255,0.05);backdrop-filter:blur(5px);padding:8px;border-radius:6px;font-size:11px;transition:0.3s}
.panel.active{border-color:#00ff88;box-shadow:0 0 20px #00ff88;background:rgba(0,255,136,0.1)}
.panel.inactive{border-color:#ff0044;box-shadow:0 0 20px #ff0044;animation:flashRed 0.5s}

#pointer{position:absolute;width:24px;height:24px;z-index:4;pointer-events:none;display:none}
.octa-pointer{width:100%;height:100%;border:2px solid #00ff88;transform:rotate(45deg);box-shadow:0 0 20px #00ff88;animation:spin 0.8s linear infinite}
@keyframes spin{100%{transform:rotate(405deg)}}

#miniMenu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;background:rgba(0,10,20,0.9);border:2px solid #00f7ff;padding:15px;border-radius:10px;display:none;transition:0.3s}
#miniMenu.active{border-color:#00ff88;box-shadow:0 0 30px #00ff88}
#miniMenu div{padding:8px;margin:5px 0;border:1px solid #00f7ff;cursor:pointer}
#miniMenu div:hover{background:rgba(0,255,136,0.2)}

#tutorial{position:absolute;bottom:10%;left:2%;z-index:3;width:35%;font-size:10px;background:rgba(0,0,0,0.7);padding:10px}

#btnRecord{position:absolute;bottom:2%;right:3%;z-index:4;background:rgba(0,247,255,0.15);border:2px solid #00f7ff;color:#00f7ff;padding:10px 18px;border-radius:50px;box-shadow:0 0 20px #00f7ff}
#btnRecord.rec{border-color:#00ff88;background:rgba(0,255,136,0.2);box-shadow:0 0 25px #00ff88}
</style>
</head>
<body>

<video id="camera" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<div id="pointer"><div class="octa-pointer"></div></div>

<div id="miniMenu">
  <div class="neon-green">K-AI MENU</div>
  <div onclick="alert('ARMAS ATIVAS')">1. ARMAS</div>
  <div onclick="alert('ESCUDO ATIVO')">2. ESCUDO</div>
  <div onclick="alert('SCANNING...')">3. SCAN</div>
  <div onclick="menu.style.display='none'">4. SAIR</div>
</div>

<div id="panelStatus" class="panel top left">
  <div class="neon-green">KORVIL K-AI v4.2</div>
  <div>STATUS: <span id="status">INICIANDO</span></div>
  <div>CONTROLE: <span id="control">DESATIVADO</span></div>
</div>

<div id="panelGesture" class="panel top right">
  <div class="neon-green">ANÁLISE</div>
  <div>GESTO: <span id="gesture">NENHUM</span></div>
</div>

<div id="tutorial">
  <div class="neon-green">TUTORIAL K-AI</div>
  <div>👁️ Piscar 1x ESQ: Ativar Mouse</div>
  <div>👁️ Piscar 2x ESQ: CLIQUE</div>
  <div>🙂 2 Sobrancelhas: MENU</div>
</div>

<div id="panelBottom" class="panel bottom">
  <div>K-AI: <span id="aiMsg">Aguardando comandos...</span></div>
</div>

<button id="btnRecord">● GRAVAR HUD</button>

<script>
const video=document.getElementById('camera'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const pointer=document.getElementById('pointer'), menu=document.getElementById('miniMenu');
const panelStatus=document.getElementById('panelStatus'), panelGesture=document.getElementById('panelGesture'), panelBottom=document.getElementById('panelBottom');
let recorder, chunks=[], angle=0;
let mouseActive=false, lastBlinkL=0, lastBlinkR=0, lastBrow=0, clickCooldown=0;

// FUNÇÃO FEEDBACK COR
function setActive(el, active){
  if(active){el.classList.add('active');el.classList.remove('inactive')}
  else{el.classList.remove('active');el.classList.add('inactive');setTimeout(()=>el.classList.remove('inactive'),500)}
}

// 1. CÂMERA + GRAVAÇÃO
navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(stream=>{
  video.srcObject=stream;
  const outStream=canvas.captureStream(30);
  recorder=new MediaRecorder(outStream);
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`KORVIL_KAI_${Date.now()}.webm`;a.click()}
});
btnRecord.onclick=()=>{if(recorder.state==='inactive'){recorder.start();chunks=[];btnRecord.innerText='■ PARAR';btnRecord.classList.add('rec');setActive(panelStatus,true)}else{recorder.stop();btnRecord.innerText='● GRAVAR HUD';btnRecord.classList.remove('rec');setActive(panelStatus,false)}};

// 2. FACE MESH
const faceMesh=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true});
faceMesh.onResults(onResults);
new Camera(video,{onFrame:async()=>await faceMesh.send({image:video}),width:1280,height:720}).start();

function drawOcta(x,y,size,rot=0,color='#00ff88',active=true){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.strokeStyle=color;ctx.lineWidth=active?2.5:1.5;
  ctx.shadowBlur=active?20:5;ctx.shadowColor=color;
  ctx.beginPath();ctx.moveTo(0,-size);ctx.lineTo(size,0);ctx.lineTo(0,size);ctx.lineTo(-size,0);ctx.closePath();
  ctx.moveTo(0,-size);ctx.lineTo(0,size);ctx.moveTo(-size,0);ctx.lineTo(size,0);ctx.stroke();ctx.restore();
}

// 3. DETECÇÃO COM FEEDBACK
function detectGestures(lm){
  const now=Date.now();
  const eyeRightPerson=lm[145]; // Olho esq da tela
  const eyeLeftPerson=lm[374]; // Olho dir da tela
  const browL=lm[105], browR=lm[334];
  const mouth=lm[13];

  // 1.1 PISCAR OLHO ESQUERDO = ATIVA MOUSE
  if(eyeRightPerson.y - lm[159].y < 0.012 && now - lastBlinkL > 500){
    lastBlinkL=now;
    if(!mouseActive && now-clickCooldown>300){
      mouseActive=true;pointer.style.display='block';document.getElementById('control').innerText='MOUSE ATIVO';
      document.getElementById('aiMsg').innerText='Mouse ocular: ATIVADO';setActive(panelStatus,true);setActive(panelGesture,true)
    }else if(mouseActive && now-clickCooldown>300){ // 1.2 CLIQUE
      document.elementFromPoint(pointer.offsetLeft, pointer.offsetTop)?.click();
      clickCooldown=now;document.getElementById('aiMsg').innerText='CLIQUE!';setActive(panelGesture,true)
    }
  }

  // DESATIVAR MOUSE COM PISCADA LONGA
  if(eyeRightPerson.y - lm[159].y < 0.012 && now - lastBlinkL > 1200){
    mouseActive=false;pointer.style.display='none';document.getElementById('control').innerText='DESATIVADO';
    document.getElementById('aiMsg').innerText='Mouse ocular: DESATIVADO';setActive(panelStatus,false);setActive(panelGesture,false)
  }

  // 2 SOBRANCELHAS = MENU
  if(browL.y < lm[52].y - 0.02 && browR.y < lm[282].y - 0.02 && now-lastBrow>800){
    lastBrow=now;
    const isOpen = menu.style.display==='block';
    menu.style.display = isOpen?'none':'block';menu.classList.toggle('active',!isOpen);
    document.getElementById('aiMsg').innerText=!isOpen?'Menu: ABERTO':'Menu: FECHADO';
    setActive(panelBottom,!isOpen)
  }

  if(mouth.y - lm[14].y > 0.04){document.getElementById('gesture').innerText='BOCA ABERTA';setActive(panelGesture,true)}
}

function onResults(res){
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  ctx.clearRect(0,0,canvas.width,canvas.height);angle+=0.015;

  if(res.multiFaceLandmarks?.length>0){
    document.getElementById('status').innerText='ONLINE';
    const lm=res.multiFaceLandmarks[0];
    detectGestures(lm);

    // COR MUDA: VERDE ATIVO / CIANO INATIVO
    const mouseColor = mouseActive?'#00ff88':'#00f7ff';

    // MOUSE PELO OLHO ESQUERDO
    if(mouseActive){
      const eye=lm[468];
      const x=(1-eye.x)*canvas.width;
      const y=eye.y*canvas.height;
      pointer.style.left=x-12+'px';pointer.style.top=y-12+'px';
      drawOcta(x,y,22,angle*2,mouseColor,true);
    }

    // OCTAEDROS NAS BORDAS - PULSANDO VERDE QUANDO ATIVO
    drawOcta(90,100,45,angle,mouseColor,mouseActive);
    drawOcta(canvas.width-90,130,40,-angle*1.3,mouseColor,mouseActive);
    drawOcta(110,canvas.height-110,42,angle*0.7,mouseColor,mouseActive);
    drawOcta(canvas.width-110,canvas.height-90,38,-angle,mouseColor,mouseActive);

    // LINHAS HUD VERDES QUANDO ATIVO
    ctx.strokeStyle=mouseActive?'rgba(0,255,136,0.4)':'rgba(0,247,255,0.2)';
    ctx.lineWidth=mouseActive?2:1;
    ctx.beginPath();ctx.moveTo(0,canvas.height*0.2);ctx.lineTo(canvas.width,canvas.height*0.2);ctx.stroke();

  }else{document.getElementById('status').innerText='BUSCANDO ROSTO...';setActive(panelStatus,false)}
  requestAnimationFrame(()=>faceMesh.send({image:video}));
}
</script>
</body>
</html>
