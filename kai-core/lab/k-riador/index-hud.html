
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISOR KORVIL - JARVIS v2</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Orbitron', sans-serif; color: #00f7ff; }

  #camera, #canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; object-fit: cover;
  }
  #camera { z-index: 1; filter: contrast(1.1) brightness(0.9); }
  #canvas { z-index: 2; pointer-events: none; }

  /* HUD E ELEMENTOS */
 .hud-text {
    position: absolute; z-index: 3;
    color: #00f7ff; text-shadow: 0 0 8px #00f7ff;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

 .panel {
    position: absolute; z-index: 3; border: 1px solid #00f7ff;
    background: rgba(0, 247, 255, 0.05); backdrop-filter: blur(3px);
    padding: 10px; border-radius: 5px; font-size: 12px;
  }
 .top-left { top: 5%; left: 3%; }
 .bottom { bottom: 10%; width: 94%; left: 3%; }

  /* BOTÃO GRAVAR */
  #btnRecord {
    position: absolute; bottom: 3%; right: 5%; z-index: 4;
    background: rgba(0,247,255,0.2); border: 2px solid #00f7ff;
    color: #00f7ff; padding: 12px 20px; border-radius: 50px;
    font-size: 16px; cursor: pointer;
    box-shadow: 0 0 15px #00f7ff;
  }
  #btnRecord.recording { background: rgba(255,0,0,0.3); border-color: red; }

 .octa { fill: none; stroke: #00f7ff; stroke-width: 1.5; filter: drop-shadow(0 0 5px #00f7ff); }
</style>
</head>
<body>

<video id="camera" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="panel top-left">
  <div class="hud-text">KORVIL SYSTEMS v2.0</div>
  <div>STATUS: <span id="status">INICIALIZANDO</span></div>
  <div>ALVO: <span id="target">BUSCANDO...</span></div>
</div>

<div class="panel bottom">
  <div class="hud-text">DIAGNÓSTICO: VISOR ATIVO</div>
  <div>COORD: BERTIOGA - SP</div>
</div>

<button id="btnRecord">● GRAVAR</button>

<script>
const video = document.getElementById('camera');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const btnRecord = document.getElementById('btnRecord');
let recorder, chunks = [];

// 1. LIGAR CÂMERA
navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
.then(stream => {
  video.srcObject = stream;
  // 2. PREPARAR GRAVAÇÃO
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'visor_korvil.webm'; a.click();
  }
});

// 3. BOTÃO GRAVAR
btnRecord.onclick = () => {
  if(recorder.state === 'inactive'){
    recorder.start(); chunks = [];
    btnRecord.innerText = '■ PARAR'; btnRecord.classList.add('recording');
  } else {
    recorder.stop();
    btnRecord.innerText = '● GRAVAR'; btnRecord.classList.remove('recording');
  }
};

// 4. FACE MESH - DETECTAR ROSTO E OLHO DIREITO
const faceMesh = new FaceMesh({locateFile: (file) => {
  return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
}});
faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });
faceMesh.onResults(onResults);

const camera = new Camera(video, {
  onFrame: async () => { await faceMesh.send({image: video}); },
  width: 1280, height: 720
});
camera.start();

function drawOctahedron(x, y, size) {
  // Desenha um octaedro 2D com linhas
  ctx.beginPath();
  ctx.moveTo(x, y - size); // topo
  ctx.lineTo(x + size, y); // direita
  ctx.lineTo(x, y + size); // baixo
  ctx.lineTo(x - size, y); // esquerda
  ctx.closePath();
  ctx.moveTo(x, y - size); ctx.lineTo(x, y + size); // vertical
  ctx.moveTo(x - size, y); ctx.lineTo(x + size, y); // horizontal
  ctx.stroke();
}

function onResults(results) {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if(results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0){
    document.getElementById('status').innerText = 'ONLINE';
    document.getElementById('target').innerText = 'HUMANO DETECTADO';

    const landmarks = results.multiFaceLandmarks[0];

    // 5. OCTAEDRO SEGUINDO OLHO DIREITO - landmark 468 é o centro do olho direito
    const rightEye = landmarks[468];
    const eyeX = rightEye.x * canvas.width;
    const eyeY = rightEye.y * canvas.height;
    ctx.strokeStyle = '#00f7ff';
    drawOctahedron(eyeX, eyeY, 25);

    // 6. TROCAR CÍRCULOS POR OCTAEDROS NO HUD
    // Radar no canto
    ctx.strokeStyle = '#00f7ff';
    drawOctahedron(100, canvas.height - 100, 60);

    // Octaedros flutuantes
    drawOctahedron(canvas.width - 150, 150, 40);
    drawOctahedron(canvas.width/2, 100, 30);

    // Caixa no rosto
    const box = {xMin:1, yMin:1, xMax:0, yMax:0};
    landmarks.forEach(p => {
      box.xMin = Math.min(box.xMin, p.x); box.yMin = Math.min(box.yMin, p.y);
      box.xMax = Math.max(box.xMax, p.x); box.yMax = Math.max(box.yMax, p.y);
    });
    ctx.strokeRect(box.xMin*canvas.width-20, box.yMin*canvas.height-20,
                   (box.xMax-box.xMin)*canvas.width+40, (box.yMax-box.yMin)*canvas.height+40);

  } else {
    document.getElementById('status').innerText = 'PROCURANDO ROSTO';
    document.getElementById('target').innerText = 'NENHUM';
  }
}
</script>
</body>
</html>
