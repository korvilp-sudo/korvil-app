<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>KORVIL K-AI v5.1 - HOLOGRAMAS 4D</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background: radial-gradient(circle at 50% 50%, #001a2e 0%, #000 100%);
    overflow:hidden;font-family:'Orbitron',monospace;color:#00f7ff;perspective:1000px;
  }

  #camera,#canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  #camera{z-index:1} #canvas{z-index:2;pointer-events:none;transform:scaleX(-1)}

  /* PAINÉIS 4D */
.panel{position:absolute;z-index:3;border:2px solid #00f7ff;background:rgba(0,247,255,0.04);backdrop-filter:blur(12px);color:#00f7ff;padding:14px 18px;border-radius:12px;font-size:13px;font-weight:700;transform:translateZ(20px);box-shadow:0 0 30px rgba(0,247,255,0.3)}
.panel.active{border-color:#00ff88;box-shadow:0 0 50px #00ff88;transform:translateZ(40px)}
.panel.alert{border-color:#ff0044;box-shadow:0 0 50px #ff0044;animation:flash 0.4s}
  @keyframes flash{50%{transform:translateZ(60px) scale(1.05)}}

 .top{top:4%}.left{left:2.5%}.right{right:2.5%}.bottom{bottom:3%}

  /* PONTEIRO */
  #pointer{position:absolute;width:28px;height:28px;z-index:4;display:none}
.octa{width:100%;height:100%;border:2.5px solid #00f7ff;transform:rotateX(45deg) rotateY(45deg) rotateZ(45deg);box-shadow:0 0 25px #00f7ff;animation:float 3s infinite}
  @keyframes float{50%{transform:rotateX(45deg) rotateY(225deg) rotateZ(45deg) translateZ(15px)}}

  /* MENU */
  #menu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) translateZ(80px);z-index:5;background:rgba(0,5,15,0.85);border:2px solid #00f7ff;display:none;padding:25px;border-radius:15px;backdrop-filter:blur(20px)}
  #menu.active{border-color:#00ff88;box-shadow:0 0 80px #00ff88}

  #log{position:absolute;bottom:3%;left:2.5%;z-index:3;width:60%;font-size:12px;background:rgba(0,0,0,0.5);border:1.5px solid #00f7ff;padding:12px;border-radius:10px;backdrop-filter:blur(10px)}

  /* ============ HOLOGRAMAS 4D NAS 4 BORDAS ============ */
.holo{position:absolute;z-index:2;pointer-events:none}

  /* 1. TOPO: BARRA DE ENERGIA PULSANDO */
.holo-top{top:0;left:0;width:100%;height:60px;background:linear-gradient(90deg, transparent, #00f7ff, transparent);animation:energy 2s linear infinite}
  @keyframes energy{
    0%{background-position:-100% 0;opacity:0.3}
    50%{opacity:1;box-shadow:0 0 40px #00f7ff}
    100%{background-position:200% 0;opacity:0.3}
  }
 .holo-top.active{background:linear-gradient(90deg, transparent, #00ff88, transparent)}
 .holo-top.alert{background:linear-gradient(90deg, transparent, #ff0044, transparent)}

  /* 2. DIREITA: OCTAEDROS GIRANDO EM COLUNA */
.holo-right{top:0;right:0;width:60px;height:100%;display:flex;flex-direction:column;justify-content:space-around;align-items:center}
.holo-octa{width:25px;height:25px;border:2px solid #00f7ff;transform:rotate(45deg);animation:spinHolo 4s linear infinite}
  @keyframes spinHolo{100%{transform:rotate(405deg)}}
 .holo-octa:nth-child(2){animation-delay:0.5s}
 .holo-octa:nth-child(3){animation-delay:1s}
 .holo-octa:nth-child(4){animation-delay:1.5s}

  /* 3. BAIXO: ONDAS DE SCAN */
.holo-bottom{bottom:0;left:0;width:100%;height:50px;overflow:hidden}
.holo-wave{width:200%;height:100%;background:repeating-linear-gradient(90deg,#00f7ff00 0px,#00f7ff 2px,#00f7ff00 4px);animation:scanWave 3s linear infinite}
  @keyframes scanWave{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

  /* 4. ESQUERDA: MATRIZ DE DADOS CAINDO */
.holo-left{top:0;left:0;width:50px;height:100%;overflow:hidden}
.holo-matrix{font-size:10px;color:#00f7ff;line-height:14px;animation:matrix 8s linear infinite}
  @keyframes matrix{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}

  /* QUANDO ATIVO MUDA COR DOS HOLOGRAMAS */
.active-holo.holo-octa{border-color:#00ff88;box-shadow:0 0 20px #00ff88}
.active-holo.holo-matrix{color:#00ff88;text-shadow:0 0 10px #00ff88}
.active-holo.holo-wave{background:repeating-linear-gradient(90deg,#00ff8800 0px,#00ff88 2px,#00ff8800 4px)}
.alert-holo.holo-octa{border-color:#ff0044;box-shadow:0 0 20px #ff0044;animation:flash 0.4s}
.alert-holo.holo-matrix{color:#ff0044}
</style>
</head>
<body>
<div id="bodyWrap">

<video id="camera" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<div id="pointer"><div class="octa"></div></div>

<!-- 4 HOLOGRAMAS NAS BORDAS -->
<div class="holo holo-top"></div>
<div class="holo holo-right">
  <div class="holo-octa"></div><div class="holo-octa"></div>
  <div class="holo-octa"></div><div class="holo-octa"></div>
</div>
<div class="holo holo-bottom"><div class="holo-wave"></div></div>
<div class="holo holo-left"><div class="holo-matrix">010101<br>110010<br>101101<br>011100<br>100011<br>111000</div></div>

<div id="menu">
  <div style="font-weight:900;font-size:16px">K-AI MENU</div>
  <div>1. ARMAS</div><div>2. ESCUDO</div><div>3. SAIR</div>
</div>

<div id="p1" class="panel top left">
  <div style="font-weight:900">KORVIL K-AI v5.1</div>
  <div>STATUS: <span id="status">STANDBY</span></div>
  <div>MOUSE: <span id="mouse">OFF</span></div>
</div>

<div id="p2" class="panel top right">
  <div style="font-weight:900">SISTEMA NEURAL</div>
  <div>COMANDO: <span id="cmd">NENHUM</span></div>
</div>

<div id="log">Protocolos holográficos ativos</div>

<script>
const bodyWrap=document.getElementById('bodyWrap');
const video=document.getElementById('camera'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let mouseOn=false, menuOn=false;
let lastEyeL=0, lastBrow=0;

navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:3840}, height:{ideal:2160}}}).then(s=>video.srcObject=s);

const faceMesh=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.75});
faceMesh.onResults(onResults);
new Camera(video,{onFrame:async()=>await faceMesh.send({image:video})}).start();

function feedback(type, msg){
  const els = [document.getElementById('p1'),document.getElementById('p2'),document.getElementById('log')];
  const holoTop = document.querySelector('.holo-top');
  bodyWrap.classList.remove('active-holo','alert-holo');
  els.forEach(el=>{el.classList.remove('active','alert')});

  if(type==='on'){
    els.forEach(el=>el.classList.add('active'));
    bodyWrap.classList.add('active-holo');
    holoTop.classList.add('active');
  }
  if(type==='off'){
    els.forEach(el=>el.classList.add('alert'));
    bodyWrap.classList.add('alert-holo');
    holoTop.classList.add('alert');
    setTimeout(()=>{holoTop.classList.remove('active','alert')},400);
  }
  document.getElementById('cmd').innerText = msg;
  document.getElementById('log').innerText = msg;
}

function drawOcta(x,y,size,active){
  ctx.strokeStyle='#00f7ff';ctx.lineWidth=active?3:2;
  ctx.shadowBlur=active?35:12;ctx.shadowColor=active?'#00ff88':'#00f7ff';
  ctx.beginPath();ctx.moveTo(x,y-size);ctx.lineTo(x+size,y);ctx.lineTo(x,y+size);ctx.lineTo(x-size,y);ctx.closePath();
  ctx.moveTo(x,y-size);ctx.lineTo(x,y+size);ctx.moveTo(x-size,y);ctx.lineTo(x+size,y);ctx.stroke();
}

function onResults(res){
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!res.multiFaceLandmarks?.length){feedback('off',"BUSCANDO ROSTO");return}
  const lm=res.multiFaceLandmarks[0];const now=Date.now();

  const eyeL=lm[145];const browL=lm[70];const browR=lm[300];const eyeTopL=lm[159];

  // PISCAR OLHO ESQ = MOUSE
  if(eyeL.y - eyeTopL.y < 0.008 && now - lastEyeL > 550){
    lastEyeL = now;mouseOn =!mouseOn;
    document.getElementById('mouse').innerText = mouseOn? 'ON' : 'OFF';
    document.getElementById('status').innerText = mouseOn? 'ONLINE' : 'STANDBY';
    feedback(mouseOn? 'on':'off', mouseOn? "MOUSE OCULAR ATIVADO" : "MOUSE DESATIVADO");
    pointer.style.display = mouseOn? 'block' : 'none';
  }

  // 2 SOBRANCELHAS = MENU
  let browUpL = lm[52].y - browL.y;let browUpR = lm[282].y - browR.y;
  if(browUpL > 0.032 && browUpR > 0.032 && now - lastBrow > 700){
    lastBrow = now;menuOn =!menuOn;
    document.getElementById('menu').style.display = menuOn? 'block' : 'none';
    document.getElementById('menu').classList.toggle('active',menuOn);
    feedback(menuOn? 'on':'off', menuOn? "MENU HOLOGRÁFICO ABERTO" : "MENU FECHADO");
  }

  // MOUSE
  if(mouseOn){
    const eye=lm[468];const x=(1-eye.x)*canvas.width;const y=eye.y*canvas.height;
    pointer.style.left=x-14+'px';pointer.style.top=y-14+'px';
    document.querySelector('.octa').style.borderColor = '#00ff88';
    drawOcta(x,y,24,true);
  }
}
</script>
</div>
</body>
</html>
