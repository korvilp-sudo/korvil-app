<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KORVIL K-AI v3.0</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#000;overflow:hidden;font-family:'Orbitron',monospace;color:#00f7ff
  }

  /* VIDEO E CANVAS */
  #camera,#canvas{
    position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;
    transform:scaleX(-1); /* espelhar */
    background:#000;
  }
  #camera{z-index:1}
  #canvas{z-index:2;pointer-events:none}

  /* PAINÉIS 3D SIMPLES */
.panel{
    position:absolute;z-index:3;
    border:2px solid #00f7ff;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(8px);
    color:#00f7ff;
    padding:12px 16px;
    border-radius:8px;
    font-size:12px;
    font-weight:700;
    box-shadow:0 0 20px rgba(0,247,255,0.4);
    transition:0.3s;
  }
.panel.active{
    border-color:#00ff88;
    box-shadow:0 0 30px #00ff88;
  }
.panel.alert{
    border-color:#ff0044;
    box-shadow:0 0 30px #ff0044;
    animation:flash 0.3s;
  }
  @keyframes flash{50%{opacity:0.5}}

.top{top:3%}.left{left:2%}.right{right:2%}
.bottom{bottom:3%}

  /* PONTEIRO OCTA */
  #pointer{
    position:absolute;width:24px;height:24px;z-index:4;display:none;
  }
.octa{
    width:100%;height:100%;
    border:2px solid #00f7ff;
    transform:rotate(45deg);
    box-shadow:0 0 15px #00f7ff;
  }

  /* MENU */
  #menu{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:5;background:rgba(0,0,0,0.9);border:2px solid #00f7ff;
    color:#00f7ff;display:none;padding:20px;border-radius:10px;
    text-align:center;font-size:14px
  }
  #menu.active{border-color:#00ff88}

  #log{
    position:absolute;bottom:3%;left:2%;z-index:3;width:70%;
    font-size:11px;background:rgba(0,0,0,0.7);border:1px solid #00f7ff;
    padding:10px;border-radius:6px
  }
</style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="pointer"><div class="octa"></div></div>

<div id="menu">
  <div style="font-weight:900;margin-bottom:8px">K-AI MENU</div>
  <div>1. ARMAS</div><div>2. ESCUDO</div><div>3. SAIR</div>
</div>

<div id="p1" class="panel top left">
  <div>KORVIL K-AI v3.0</div>
  <div>STATUS: <span id="status">STANDBY</span></div>
  <div>MOUSE: <span id="mouse">OFF</span></div>
</div>

<div id="p2" class="panel top right">
  <div>COMANDO: <span id="cmd">AGUARDANDO</span></div>
</div>

<div id="log">Iniciando câmera...</div>

<script>
const video=document.getElementById('camera'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let mouseOn=false, menuOn=false;
let lastEyeL=0, lastBrow=0;

// LIGAR CÂMERA
navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}})
.then(s=>{video.srcObject=s;document.getElementById('log').innerText="Câmera OK. Piscar olho E para mouse."})
.catch(e=>{document.getElementById('log').innerText="ERRO CÂMERA: "+e.message});

// FACE MESH
const faceMesh=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.6});
faceMesh.onResults(onResults);
new Camera(video,{onFrame:async()=>{await faceMesh.send({image:video})}}).start();

function feedback(type, msg){
  const els = [document.getElementById('p1'),document.getElementById('p2'),document.getElementById('log')];
  els.forEach(el=>{el.classList.remove('active','alert')});
  if(type==='on') els.forEach(el=>el.classList.add('active'));
  if(type==='off') els.forEach(el=>el.classList.add('alert'));
  document.getElementById('cmd').innerText = msg;
  document.getElementById('log').innerText = msg;
}

function drawOcta(x,y,active){
  ctx.strokeStyle=active?'#00ff88':'#00f7ff';
  ctx.lineWidth=3;ctx.shadowBlur=20;ctx.shadowColor=active?'#00ff88':'#00f7ff';
  ctx.beginPath();
  ctx.moveTo(x,y-12);ctx.lineTo(x+12,y);ctx.lineTo(x,y+12);ctx.lineTo(x-12,y);ctx.closePath();
  ctx.moveTo(x,y-12);ctx.lineTo(x,y+12);
  ctx.moveTo(x-12,y);ctx.lineTo(x+12,y);
  ctx.stroke();
}

function onResults(res){
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(!res.multiFaceLandmarks?.length){
    feedback('off',"ROSTO NÃO DETECTADO");return
  }
  const lm=res.multiFaceLandmarks[0];
  const now=Date.now();

  // LANDMARKS
  const eyeL=lm[145]; // pálpebra inf esq
  const eyeTopL=lm[159]; // pálpebra sup esq
  const browL=lm[70];const browR=lm[300];
  const eyeR=lm[374];const eyeTopR=lm[386];

  // COMANDO 1: PISCAR OLHO ESQUERDO = LIGA/DESLIGA MOUSE
  let blinkL = eyeL.y - eyeTopL.y; // quanto menor, mais fechado
  if(blinkL < 0.005 && now - lastEyeL > 600){
    lastEyeL = now;
    mouseOn =!mouseOn;
    document.getElementById('mouse').innerText = mouseOn? 'ON' : 'OFF';
    document.getElementById('status').innerText = mouseOn? 'ONLINE' : 'STANDBY';
    feedback(mouseOn? 'on':'off', mouseOn? "MOUSE ATIVADO" : "MOUSE DESATIVADO");
    document.getElementById('pointer').style.display = mouseOn? 'block' : 'none';
  }

  // COMANDO 2: LEVANTAR 2 SOBRANCELHAS = MENU
  let browUpL = lm[52].y - browL.y; // testa - sobrancelha
  let browUpR = lm[282].y - browR.y;
  if(browUpL > 0.025 && browUpR > 0.025 && now - lastBrow > 800){
    lastBrow = now;
    menuOn =!menuOn;
    document.getElementById('menu').style.display = menuOn? 'block' : 'none';
    document.getElementById('menu').classList.toggle('active',menuOn);
    feedback(menuOn? 'on':'off', menuOn? "MENU ABERTO" : "MENU FECHADO");
  }

  // MOUSE SEGUE OLHO
  if(mouseOn){
    const eye=lm[468]; // iris
    const x=(1-eye.x)*canvas.width;
    const y=eye.y*canvas.height;
    document.getElementById('pointer').style.left=(x-12)+'px';
    document.getElementById('pointer').style.top=(y-12)+'px';
    drawOcta(x,y,true);
  } else {
    drawOcta(canvas.width/2,canvas.height/2,false);
  }
}
</script>
</body>
</html>
