<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>KORVIL - Dashboard Holograma 3D v3</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #01010f; color: #00f0ff; overflow: hidden; }
.container { display: flex; height: 100vh; gap: 10px; padding: 10px; }
.panel-left { width: 36%; background: rgba(0,20,40,0.6); border: 1px solid #00f0ff; border-radius: 12px; padding: 12px; overflow-y: auto; box-shadow: 0 0 20px #00f0ff44; }
.panel-right { width: 64%; display: flex; flex-direction: column; gap: 10px; }
.panel-chart { flex: 1; position: relative; border: 1px solid #00f0ff; border-radius: 12px; box-shadow: 0 0 20px #00f0ff44; }
.panel-kpi { height: 40%; background: rgba(0,20,40,0.6); border: 1px solid #00f0ff; border-radius: 12px; padding: 10px; box-shadow: 0 0 20px #00f0ff44; overflow-y: auto; }

  select, button { width: 100%; padding: 9px; margin-bottom: 8px; background: #001828; color: #00f0ff; border: 1px solid #00f0ff; border-radius: 8px; font-size: 13px; }
  button { background: #00f0ff; color: #000; font-weight: bold; cursor: pointer; }
  button:hover { box-shadow: 0 0 15px #00f0ff; }

  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th, td { border: 1px solid #00f0ff44; padding: 5px; text-align: center; }
  th { background: #002244; position: sticky; top: 0; }
  input[type="number"] { width: 50px; background: #000; color: #00f0ff; border: 1px solid #00f0ff44; text-align: center; }

  #canvas3d { width: 100%; height: 100%; border-radius: 12px; }
.title { text-align: center; margin-bottom: 8px; font-size: 16px; text-shadow: 0 0 10px #00f0ff; }
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.kpi-card { background: #000a1a; border: 1px solid #00f0ff55; padding: 8px; border-radius: 8px; font-size: 12px; }
.kpi-bar { height: 6px; background: #002244; border-radius: 4px; overflow: hidden; margin-top: 4px; }
.kpi-fill { height: 100%; background: linear-gradient(90deg, #00f0ff, #ff00ff); transition: width 0.5s; }
.relatorio { margin-top: 10px; font-size: 12px; }
.relatorio h4 { margin: 6px 0 3px; color: #aaffff; }
.bom { color: #00ff88; }
.ruim { color: #ff4466; }
.orienta { color: #ffdd00; }
</style>
</head>
<body>
<div class="container">
  <div class="panel-left">
    <div class="title">⚡ KORVIL DASHBOARD 3D v3 ⚡</div>
    <select id="setor" onchange="carregarServicos()"></select>
    <select id="area" onchange="carregarServicos()"></select>
    <select id="servico"></select>
    <button onclick="adicionarLinha()">+ Adicionar Serviço</button>

    <table id="tabela">
      <thead><tr><th>Serviço</th><th>Jan-Nov</th><th>Dez</th><th>Total</th><th>X</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="panel-right">
    <div class="panel-chart"><canvas id="canvas3d"></canvas></div>
    <div class="panel-kpi">
      <div class="title">RESULTADOS, PREVISÕES E RELATÓRIO</div>
      <div class="kpi-grid" id="kpiGrid"></div>
      <div class="relatorio" id="relatorio"></div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const DB = {
  "Sistema K": {
    "Serviços Gerais": ["Eletricista", "Carpinteiro", "Faxineira", "Pintor", "Encanador", "Jardineiro", "Montador Móveis", "Técnico PC", "Diarista", "Pedreiro"],
    "Tecnologia": ["Dev FrontEnd", "Dev BackEnd", "UX/UI Design", "Tráfego Pago", "Social Media", "Editor Vídeo", "Suporte TI", "SEO", "Copywriter", "Gestor Tráfego"]
  },
  "K-TP": {
    "Educação Física": ["Treinamento Personalizado", "Consultoria Online", "Plano Alimentar", "Avaliação Física", "Treino Funcional", "Musculação", "Cross Training", "Corrida", "Yoga", "Pilates"]
  },
  "K-AFORTUNADO": {
    "Empreendedorismo": ["Consultoria Negócios", "Mentoria 1:1", "Plano de Negócio", "Gestão Financeira", "Marketing Digital", "Vendas", "Branding", "E-commerce", "Palestra", "Workshop"],
    "Finanças": ["Consultoria Investimentos", "Mentoria Financeira", "Planejamento Orçamento", "Controle Gastos", "Educação Financeira", "Renda Extra", "Trading", "Cripto", "Impostos", "Aposentadoria"]
  },
  "K-ALMA": {
    "Saúde": ["Terapeuta Holístico", "Massoterapeuta", "Dentista", "Fisioterapeuta", "Nutricionista", "Psicólogo", "Acupuntura", "Reiki", "Florais", "Pilates Clínico"],
    "Beleza": ["Cabeleireiro Unissex", "Barbeiro", "Manicure", "Pedicure", "Designer Sobrancelhas", "Maquiador", "Estética Facial", "Estética Corporal", "Depilação", "Alongamento Unhas"]
  }
};

let data = {};
let scene, camera, renderer, controls, bars = [], metaMeta = 10000;

function init() {
  const setorSel = document.getElementById('setor');
  Object.keys(DB).forEach(s => setorSel.innerHTML += `<option value="${s}">${s}</option>`);
  carregarServicos(); initThree(); animate();
}
function carregarServicos() {
  const setor = document.getElementById('setor').value;
  const areaSel = document.getElementById('area'); areaSel.innerHTML = '';
  Object.keys(DB[setor]).forEach(a => areaSel.innerHTML += `<option value="${a}">${a}</option>`);
  const area = document.getElementById('area').value;
  const servSel = document.getElementById('servico'); servSel.innerHTML = '';
  DB[setor][area].forEach(s => servSel.innerHTML += `<option value="${s}">${s}</option>`);
}

function adicionarLinha() {
  const serv = document.getElementById('servico').value;
  if(data[serv]) return alert('Serviço já adicionado!');
  data[serv] = Array(12).fill(0);
  const tbody = document.querySelector('#tabela tbody');
  const tr = document.createElement('tr'); tr.id = `row-${serv}`;
  let tds = `<td>${serv}</td>`;
  for(let i=0; i<11; i++) tds += `<td><input type="number" value="0" oninput="updateData('${serv}', ${i}, this.value)"></td>`;
  tds += `<td id="dez-${serv}">0</td><td id="total-${serv}">0</td><td><button onclick="remover('${serv}')">X</button></td>`;
  tr.innerHTML = tds; tbody.appendChild(tr); updateAll();
}
function updateData(serv, mes, val) {
  data[serv][mes] = parseFloat(val) || 0;
  const soma = data[serv].slice(0,11).reduce((a,b)=>a+b,0);
  const media = soma / 11;
  data[serv][11] = Math.round(media * 1.15);
  document.getElementById(`dez-${serv}`).innerText = data[serv][11];
  document.getElementById(`total-${serv}`).innerText = soma + data[serv][11];
  updateAll();
}
function remover(serv) { delete data[serv]; document.getElementById(`row-${serv}`).remove(); updateAll(); }

// 1. CALCULAR KPIS
function calcularKPIs() {
  let totalGeral = 0;
  Object.values(data).forEach(arr => totalGeral += arr.reduce((a,b)=>a+b,0));
  const desempenho = Math.min(100, Math.round(totalGeral / metaMeta * 100));
  const educacao = Math.min(100, Object.keys(data).length * 10);
  const consistencia = Math.min(100, Object.values(data).flat().filter(v=>v>0).length / (Object.keys(data).length*12 || 1) * 100);
  const crescimento = desempenho > 70? 85 : desempenho > 40? 60 : 30;
  const satisfacao = Math.min(100, desempenho * 0.9 + 10);
  return {totalGeral, desempenho, educacao, consistencia, crescimento, satisfacao};
}

// 2. GERAR RELATORIO AUTOMATICO
function gerarRelatorio(k) {
  let bons = [], ruins = [], orienta = [];

  if(k.desempenho >= 70) bons.push("Desempenho acima da meta. Mantendo ritmo forte.");
  else ruins.push("Desempenho abaixo de 70%. Faturamento precisa subir.");

  if(k.consistencia >= 60) bons.push("Boa consistência de lançamentos mensais.");
  else ruins.push("Baixa consistência. Muitos meses zerados.");

  if(k.educacao >= 50) bons.push("Boa diversificação de serviços.");
  else ruins.push("Poucos serviços ativos. Risco de depender de 1 fonte.");

  // ORIENTAÇÕES
  if(k.desempenho < 50) orienta.push("Foco: Ativar 3 serviços de maior ticket agora.");
  if(k.consistencia < 50) orienta.push("Melhoria: Criar meta mensal mínima para cada serviço.");
  if(k.crescimento < 60) orienta.push("Estratégia: Rodar campanha de Dezembro com +20% de desconto.");
  if(k.desempenho >= 80) orienta.push("Avanço: Lançar serviço Premium e aumentar meta para R$15.000.");

  return `
    <h4 class="bom">✅ PONTOS BONS</h4> ${bons.length? bons.map(b=>`<div>• ${b}</div>`).join('') : '<div>• Ainda nenhum ponto forte registrado</div>'}
    <h4 class="ruim">⚠️ PONTOS A MELHORAR</h4> ${ruins.length? ruins.map(r=>`<div>• ${r}</div>`).join('') : '<div>• Nenhum ponto crítico</div>'}
    <h4 class="orienta">🚀 ORIENTAÇÕES PARA MELHORAR</h4> ${orienta.map(o=>`<div>• ${o}</div>`).join('')}
    <h4>📈 PREVISÃO DEZEMBRO</h4> <div>• Projeção baseada em média +15%. Se manter o ritmo: R$${Math.round(k.totalGeral*1.15)}</div>
  `;
}

function updateKPIs() {
  const k = calcularKPIs();
  document.getElementById('kpiGrid').innerHTML = `
    <div class="kpi-card"><b>Total R$</b><div>${k.totalGeral}</div></div>
    <div class="kpi-card"><b>% Total</b><div>${k.desempenho}%</div><div class="kpi-bar"><div class="kpi-fill" style="width:${k.desempenho}%"></div></div></div>
    <div class="kpi-card"><b>Desempenho</b><div>${k.desempenho}%</div><div class="kpi-bar"><div class="kpi-fill" style="width:${k.desempenho}%"></div></div></div>
    <div class="kpi-card"><b>Educação</b><div>${k.educacao}%</div><div class="kpi-bar"><div class="kpi-fill" style="width:${k.educacao}%"></div></div></div>
    <div class="kpi-card"><b>Consistência</b><div>${Math.round(k.consistencia)}%</div><div class="kpi-bar"><div class="kpi-fill" style="width:${k.consistencia}%"></div></div></div>
    <div class="kpi-card"><b>Crescimento</b><div>${k.crescimento}%</div><div class="kpi-bar"><div class="kpi-fill" style="width:${k.crescimento}%"></div></div></div>
  `;
  document.getElementById('relatorio').innerHTML = gerarRelatorio(k);
}

// 3. THREE.JS
function initThree() {
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x01010f);
  camera = new THREE.PerspectiveCamera(60, window.innerWidth*0.64 / (window.innerHeight*0.6), 0.1, 1000);
  camera.position.set(0, 8, 20);
  renderer = new THREE.WebGLRenderer({canvas: document.getElementById('canvas3d'), antialias: true});
  renderer.setSize(window.innerWidth*0.64, window.innerHeight*0.6);
  controls = new OrbitControls(camera, renderer.domElement);
  scene.add(new THREE.PointLight(0x00f0ff, 2, 50).position.set(5,5,5));
  scene.add(new THREE.AmbientLight(0x004444));
  const grid = new THREE.GridHelper(30, 30, 0x00f0ff, 0x00f0ff);
  grid.material.opacity = 0.2; grid.material.transparent = true; scene.add(grid);
}

function updateGraph() {
  bars.forEach(b => scene.remove(b)); bars = [];
  let servIdx = 0;
  Object.keys(data).forEach((serv) => {
    data[serv].forEach((val, mes) => {
      const height = val / 100 + 0.2;
      const geo = new THREE.BoxGeometry(0.5, height, 0.5);
      const mat = new THREE.MeshPhongMaterial({
        color: mes === 11? 0xff00ff : 0x00f0ff, transparent: true, opacity: 0.8
      });
      const bar = new THREE.Mesh(geo, mat);
      bar.position.set(mes*0.9 - 5, height/2, servIdx*1.5);
      scene.add(bar); bars.push(bar);
    });
    servIdx++;
  });
}
function updateAll(){ updateGraph(); updateKPIs(); }

function animate() {
  requestAnimationFrame(animate);
  bars.forEach(b => { b.rotation.y += 0.003; b.material.opacity = 0.6 + Math.sin(Date.now()*0.002 + b.id)*0.2 });
  controls.update(); renderer.render(scene, camera);
}

window.onload = init;
window.carregarServicos = carregarServicos;
window.adicionarLinha = adicionarLinha;
window.updateData = updateData;
window.remover = remover;
</script>
</body>
</html>
