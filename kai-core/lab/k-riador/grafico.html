<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>KORVIL - Zoom Hiperespaço 4D</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }
  body { background: radial-gradient(circle at center, #000020, #000); color: #00f0ff; overflow: hidden; }
.container { display: flex; height: 100vh; gap: 8px; padding: 8px; }
.panel-left { width: 26%; background: rgba(0,10,30,0.5); backdrop-filter: blur(15px); border: 1px solid #00f0ff; border-radius: 15px; padding: 10px; overflow-y: auto; }
.panel-right { width: 74%; display: flex; flex-direction: column; gap: 8px; }

.tabs { display: flex; gap: 5px; }
.tab { flex: 1; padding: 10px; background: rgba(0,20,40,0.8); border: 1px solid #00f0ff; border-radius: 10px; cursor: pointer; text-align: center; font-size: 11px; }
.tab.active { background: linear-gradient(90deg, #00f0ff, #ff00ff); color: #000; font-weight: bold; }
.tab-content { display: none; flex: 1; }
.tab-content.active { display: flex; flex-direction: column; }

.panel-chart { flex: 1; border: 2px solid #00f0ff; border-radius: 15px; box-shadow: 0 0 40px #00f0ffaa; position: relative; overflow: hidden; }
.btn-voltar { position: absolute; top: 10px; left: 10px; z-index: 10; padding: 8px 15px; background: #ff00ff; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: none; }
.panel-actions { height: 110px; display: flex; flex-wrap: wrap; gap: 8px; }
.btn-download { flex: 1 1 30%; padding: 10px; background: linear-gradient(90deg, #00f0ff, #ff00ff); color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 11px; }

  canvas { width: 100%!important; height: 100%!important; border-radius: 15px; }
  input[type="number"] { width: 40px; background: #000; color: #00f0ff; border: 1px solid #00f0ff44; text-align: center; }
.warp { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: radial-gradient(circle, rgba(0,240,255,0.8), transparent 70%); opacity: 0; transition: opacity 0.5s; }
</style>
</head>
<body>
<audio id="somWarp" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_8b6c1b6c3d.mp3"></audio>

<div class="container">
  <div class="panel-left">
    <div class="title">⚡ KORVIL ZOOM 4D ⚡</div>
    <select id="setor" onchange="carregarServicos()"></select>
    <select id="area" onchange="carregarServicos()"></select>
    <select id="servico"></select>
    <button onclick="adicionarLinha()">+ Adicionar Serviço</button>

    <table id="tabela"><thead><tr><th>Serviço</th><th>J-N</th><th>Dez</th><th>Total</th><th>X</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="panel-right">
    <div class="tabs">
      <div class="tab active" onclick="trocarAba('combinado')">4D COMBINADO</div>
      <div class="tab" onclick="trocarAba('timeline')">TIMELINE CLICÁVEL</div>
    </div>

    <div id="aba-combinado" class="tab-content active">
      <div class="panel-chart">
        <button class="btn-voltar" id="btnVoltar" onclick="voltarZoom()">← VOLTAR VISÃO GERAL</button>
        <div class="warp" id="warp"></div>
        <canvas id="canvas3d"></canvas>
      </div>
    </div>
    <div id="aba-timeline" class="tab-content">
      <div class="panel-chart"><canvas id="canvasTimeline"></canvas></div>
    </div>

    <div class="panel-actions">
      <button class="btn-download" onclick="gravarVideo()">🎥 GRAVAR VÍDEO</button>
      <button class="btn-download" onclick="iniciarTimeline()">⏯️ PLAY TIMELINE</button>
      <button class="btn-download" onclick="baixarGrafico()">🖼️ BAIXAR 8K</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez*'];
const CORES_FASE = {0:0xff0000,1:0xff0000,2:0xff8800,3:0xff8800,4:0xff8800,5:0xffff00,6:0xffff00,7:0xffff00,8:0x00ff00,9:0x00ff00,10:0x00ff00,11:0xff00ff};
const DB = {"Sistema K": {"Serviços Gerais": ["Eletricista", "Carpinteiro"]},"K-TP": {"Educação Física": ["Treino Personalizado"]}};

let data = {}; let scene, camera, renderer, controls, bars = [];
let cameraPosOriginal = {x:18, y:12, z:25}; let zoomAtivo = false; let mesZoom = 0;
const somWarp = document.getElementById('somWarp');

// INIT
function init() {
  const setorSel = document.getElementById('setor');
  Object.keys(DB).forEach(s => setorSel.innerHTML += `<option value="${s}">${s}</option>`);
  carregarServicos(); initThree(); animate();
}
function carregarServicos() {
  const setor = document.getElementById('setor').value;
  const areaSel = document.getElementById('area'); areaSel.innerHTML = '';
  Object.keys(DB[setor]).forEach(a => areaSel.innerHTML += `<option value="${a}">${a}</option>`);
  const area = document.getElementById('area').value;
  const servSel = document.getElementById('servico'); servSel.innerHTML = '';
  DB[setor][area].forEach(s => servSel.innerHTML += `<option value="${s}">${s}</option>`);
}

// TABELA
function adicionarLinha() {
  const serv = document.getElementById('servico').value;
  if(data[serv]) return alert('Serviço já adicionado!');
  data[serv] = Array(12).fill(0);
  const tbody = document.querySelector('#tabela tbody');
  const tr = document.createElement('tr'); tr.id = `row-${serv}`;
  let tds = `<td>${serv}</td>`;
  for(let i=0; i<11; i++) tds += `<td><input type="number" value="0" oninput="updateData('${serv}', ${i}, this.value)"></td>`;
  tds += `<td id="dez-${serv}">0</td><td id="total-${serv}">0</td><td><button onclick="remover('${serv}')">X</button></td>`;
  tr.innerHTML = tds; tbody.appendChild(tr); updateAll();
}
function updateData(serv, mes, val) {
  data[serv][mes] = parseFloat(val) || 0;
  const soma = data[serv].slice(0,11).reduce((a,b)=>a+b,0);
  data[serv][11] = Math.round(soma / 11 * 1.15);
  document.getElementById(`dez-${serv}`).innerText = data[serv][11];
  document.getElementById(`total-${serv}`).innerText = soma + data[serv][11];
  updateAll();
}
function remover(serv) { delete data[serv]; document.getElementById(`row-${serv}`).remove(); updateAll(); }

// 3D
function initThree() {
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x000010);
  camera = new THREE.PerspectiveCamera(60, window.innerWidth*0.74 / (window.innerHeight*0.6), 0.1, 1000);
  camera.position.set(cameraPosOriginal.x, cameraPosOriginal.y, cameraPosOriginal.z);
  renderer = new THREE.WebGLRenderer({canvas: document.getElementById('canvas3d'), antialias: true, preserveDrawingBuffer: true});
  renderer.setSize(window.innerWidth*0.74, window.innerHeight*0.6);
  renderer.setPixelRatio(window.devicePixelRatio * 2);
  controls = new OrbitControls(camera, renderer.domElement); controls.autoRotate = true; controls.autoRotateSpeed = 0.8;
  scene.add(new THREE.PointLight(0x00f0ff, 4, 100).position.set(15,15,15));
  scene.add(new THREE.AmbientLight(0x004488));
}
function updateGraphCombinado() {
  bars.forEach(b => scene.remove(b)); bars = [];
  let servIdx = 0;
  Object.keys(data).forEach((serv) => {
    data[serv].forEach((val, mes) => {
      if(zoomAtivo && mes!== mesZoom) return; // 2.2 SÓ MOSTRA O MÊS DO ZOOM
      const targetHeight = val / 80 + 0.3;
      const geo = new THREE.BoxGeometry(0.7, 0.1, 0.7);
      const mat = new THREE.MeshPhongMaterial({color: 0x00f0ff, emissive: CORES_FASE[mes], transparent: true, opacity: 0.8});
      const bar = new THREE.Mesh(geo, mat);
      bar.position.set(0, 0.05, servIdx*2.2); // centraliza no zoom
      bar.userData.targetHeight = targetHeight;
      scene.add(bar); bars.push(bar);
    });
    servIdx++;
  });
}

// 2.2 ZOOM HIPERESPAÇO
function fazerZoom(mes) {
  zoomAtivo = true; mesZoom = mes;
  document.getElementById('btnVoltar').style.display = 'block';
  document.getElementById('warp').style.opacity = '1';
  somWarp.play();

  const posX = mes*1.2 - 6.5; // posição do mês
  const gsap = { // animação manual
    t: 0,
    animate: function(){
      this.t += 0.02;
      if(this.t < 1){
        camera.position.x = cameraPosOriginal.x + (posX - cameraPosOriginal.x) * this.t;
        camera.position.z = cameraPosOriginal.z + (-5 - cameraPosOriginal.z) * this.t;
        camera.position.y = cameraPosOriginal.y + (8 - cameraPosOriginal.y) * this.t;
        requestAnimationFrame(()=>this.animate());
      } else {
        document.getElementById('warp').style.opacity = '0';
        controls.autoRotate = false;
      }
    }
  };
  gsap.animate();
  updateAll();
}
function voltarZoom() {
  zoomAtivo = false;
  document.getElementById('btnVoltar').style.display = 'none';
  controls.autoRotate = true;
  camera.position.set(cameraPosOriginal.x, cameraPosOriginal.y, cameraPosOriginal.z);
  updateAll();
}
window.voltarZoom = voltarZoom;

// TIMELINE CLICÁVEL
function desenharTimeline() {
  const canvas = document.getElementById('canvasTimeline');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(60, canvas.height/2); ctx.lineTo(canvas.width-60, canvas.height/2); ctx.stroke();

  MESES.forEach((m,i)=>{
    const x = 60 + (i * (canvas.width-120)/11);
    const cor = CORES_FASE[i];
    ctx.fillStyle = `#${cor.toString(16).padStart(6,'0')}`;
    ctx.beginPath(); ctx.arc(x, canvas.height/2, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#00f0ff'; ctx.font = '12px Orbitron';
    ctx.fillText(m, x-15, canvas.height/2 + 35);

    // AREA CLICAVEL
    canvas.onclick = (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      if(Math.abs(mx - x) < 20){ trocarAba('combinado'); fazerZoom(i); }
    }
  });
}

function gravarVideo() { const canvas = document.getElementById('canvas3d'); const stream = canvas.captureStream(30); const recorder = new MediaRecorder(stream); const chunks = []; recorder.ondataavailable = e => chunks.push(e.data); recorder.onstop = () => { const blob = new Blob(chunks); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'korvil_zoom.webm'; a.click(); }; recorder.start(); setTimeout(()=>recorder.stop(), 5000); }
function baixarGrafico() { const canvas = document.getElementById('canvas3d'); const link = document.createElement('a'); link.download = 'korvil_8k.png'; link.href = canvas.toDataURL('image/png'); link.click(); }
window.gravarVideo = gravarVideo; window.baixarGrafico = baixarGrafico;

function updateAll(){ updateGraphCombinado(); desenharTimeline(); }

function animate() {
  requestAnimationFrame(animate);
  const time = Date.now() * 0.001;
  bars.forEach((b,i) => {
    if(b.scale.y < b.userData.targetHeight){ b.scale.y += 0.05; }
    b.position.y = b.scale.y/2;
    b.rotation.y += 0.006;
    b.position.y += Math.sin(time + i)*0.05;
  });
  if(controls) controls.update();
  renderer.render(scene, camera);
}

window.onload = init;
window.carregarServicos = carregarServicos;
window.adicionarLinha = adicionarLinha;
window.updateData = updateData;
window.remover = remover;
window.trocarAba = function(aba){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.querySelector(`[onclick="trocarAba('${aba}')"]`).classList.add('active');
  document.getElementById(`aba-${aba}`).classList.add('active');
}
</script>
</body>
</html>
