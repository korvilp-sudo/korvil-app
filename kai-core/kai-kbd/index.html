<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KORVIL - BANCO ATIVOS 8K</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
  :root{
    --korvil-neon:#00ffff; --korvil-neon2:#00d4ff; --korvil-bg:#000010;
    --metal: linear-gradient(145deg, #001a1a 0%, #000000 50%, #002222 100%);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Orbitron"; -webkit-user-select: none; user-select: none;}
  body{
    background:var(--korvil-bg);
    background-image:
      radial-gradient(circle at 20% 50%, rgba(0,255,255,0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 50%, rgba(0,212,255,0.15) 0%, transparent 50%);
    min-height:100vh; padding:20px; overflow-x:hidden;
  }

  /* MAQUINA 4D METALICA */
  #korvil-machine{
    max-width:1400px; margin:0 auto; padding:30px;
    background:var(--metal);
    border:3px solid var(--korvil-neon);
    border-radius:40px;
    box-shadow:
      0 0 80px var(--korvil-neon),
      0 0 120px rgba(0,255,255,0.3),
      inset 0 0 60px rgba(0,255,255,0.1);
    position:relative; overflow:hidden;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0px);} 50%{transform:translateY(-10px);}}

.holo-scan{position:absolute; top:0; left:0; width:100%; height:3px; background:linear-gradient(90deg, transparent, var(--korvil-neon), transparent); animation: scan 2.5s linear infinite; box-shadow:0 0 20px var(--korvil-neon);}
  @keyframes scan{0%{top:0%;} 100%{top:100%;}}

  h1{
    text-align:center; font-size:3rem; font-weight:900;
    color:var(--korvil-neon); text-shadow:0 0 30px var(--korvil-neon);
    margin-bottom:30px; animation: pulse 2s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1; text-shadow:0 0 30px var(--korvil-neon);} 50%{opacity:0.7; text-shadow:0 0 60px var(--korvil-neon2);}}

  /* CARDS FINANCEIROS */
.finance-grid{display:grid; grid-template-columns: repeat(3, 1fr); gap:20px; margin-bottom:40px;}
.finance-card{
    background:rgba(0,255,255,0.05); border:2px solid var(--korvil-neon);
    border-radius:20px; padding:25px; text-align:center;
    box-shadow:0 0 30px rgba(0,255,255,0.2); backdrop-filter: blur(10px);
    animation: glow 3s infinite;
  }
  @keyframes glow{0%,100%{box-shadow:0 0 30px rgba(0,255,255,0.2);} 50%{box-shadow:0 0 50px rgba(0,255,255,0.4);}}
.finance-card h3{color:var(--korvil-neon); font-size:1.1rem; margin-bottom:10px;}
.finance-card.valor{font-size:2.5rem; font-weight:900; color:#fff; text-shadow:0 0 20px var(--korvil-neon);}
.finance-card.dz{border-color:#00ff88;}.finance-card.dz.valor{color:#00ff88; text-shadow:0 0 20px #00ff88;}

  /* TABELA 3D */
.table-container{border:2px solid var(--korvil-neon); border-radius:20px; overflow:hidden; box-shadow:0 0 40px rgba(0,255,255,0.3);}
  table{width:100%; border-collapse:collapse; font-size:16px; background:rgba(0,0,0,0.6);}
  thead{background:linear-gradient(90deg, var(--korvil-neon), var(--korvil-neon2)); color:#000;}
  th{padding:18px; text-align:left; font-weight:900; font-size:1.1rem;}
  td{padding:15px; border-bottom:1px solid rgba(0,255,255,0.2); color:#d0f8ff;}
  tbody tr:hover{background:rgba(0,255,255,0.1); box-shadow:inset 0 0 20px rgba(0,255,255,0.2);}
 .status-ativo{color:#00ff88; font-weight:700; text-shadow:0 0 10px #00ff88;}
</style>
</head>
<body oncontextmenu="return false">

<div id="korvil-machine">
  <div class="holo-scan"></div>
  <h1>🚨 KORVIL - BANCO DE ALUNOS ATIVOS 🚨</h1>

  <!-- CARDS FINANCEIROS -->
  <div class="finance-grid">
    <div class="finance-card">
      <h3>TOTAL BRUTO MENSAL</h3>
      <div class="valor" id="total-bruto">R$ 0,00</div>
    </div>
    <div class="finance-card dz">
      <h3>50% DZ</h3>
      <div class="valor" id="total-dz">R$ 0,00</div>
    </div>
    <div class="finance-card">
      <h3>TOTAL ALUNOS ATIVOS</h3>
      <div class="valor" id="total-alunos">0</div>
    </div>
  </div>

  <!-- TABELA DE ATIVOS -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>#</th><th>ALUNO</th><th>HORÁRIO</th><th>PLANO</th><th>VALOR</th><th>VENCIMENTO</th><th>STATUS</th>
        </tr>
      </thead>
      <tbody id="tabela-ativos"></tbody>
    </table>
  </div>
</div>

<script>
// ========== SEU CRONOGRAMA_DB ==========
const TABELA_PLANOS = {1:60, 2:80, 3:100, 4:130, 5:150}; // 1x a 5x
let CRONOGRAMA_DB = {
  "PRESENCIAL":[
    {"hora":"08h00 🐢","status":"ATIVOS","alunos":[{"n":1,"aluno":"Magda Gomes dos Santos","status":"Ativo","mensalidade":"13/05/26","freq":"5x"}]},
    {"hora":"09h00 🐢","status":"ATIVOS","alunos":[{"n":2,"aluno":"João Silva","status":"Ativo","mensalidade":"20/05/26","freq":"3x"}]},
    {"hora":"06h00 🐦","status":"DESATIVADOS","alunos":[{"n":4,"aluno":"Alexandra","status":"Desativado","freq":"1x"}]}
  ]
};

function renderAtivos(){
  let html = ""; let totalBruto = 0; let totalAlunos = 0;

  CRONOGRAMA_DB.PRESENCIAL.forEach(h=>{
    h.alunos.filter(a=>a.status==="Ativo").forEach(a=>{
      totalAlunos++;
      let planoVezes = parseInt(a.freq.replace('x',''));
      let valor = TABELA_PLANOS[planoVezes] || 0;
      totalBruto += valor;

      html += `
        <tr>
          <td>${a.n}</td>
          <td>${a.aluno}</td>
          <td>${h.hora}</td>
          <td>${a.freq}</td>
          <td>R$ ${valor.toFixed(2)}</td>
          <td>${a.mensalidade}</td>
          <td class="status-ativo">${a.status}</td>
        </tr>
      `;
    });
  });

  let totalDZ = totalBruto * 0.5; // 50% DZ

  document.getElementById('tabela-ativos').innerHTML = html;
  document.getElementById('total-bruto').innerText = `R$ ${totalBruto.toFixed(2)}`;
  document.getElementById('total-dz').innerText = `R$ ${totalDZ.toFixed(2)}`;
  document.getElementById('total-alunos').innerText = totalAlunos;
}

renderAtivos();
</script>
</body>
</html>
