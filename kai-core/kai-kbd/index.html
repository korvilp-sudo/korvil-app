<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel DZ - Alunos Ativos</title>
<style>
    :root {
        --metal-dark: #2a2e35;
        --metal-light: #d1d5db;
        --metal-shine: #ffffff;
        --accent: #00bfff;
        --bg: #0d1117;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", "Segoe UI", sans-serif; }

    body {
        background: radial-gradient(circle at top, #1a1f2b 0%, var(--bg) 100%);
        color: var(--metal-light);
        padding: 30px 15px;
        min-height: 100vh;
    }

   .container { max-width: 1100px; margin: auto; }

   .logo-topo {
        text-align: center;
        margin-bottom: 20px;
        animation: fadeUp 0.8s ease;
    }
   .logo-topo img {
        max-width: 280px;
        width: 100%;
        filter: drop-shadow(0 0 15px rgba(0,191,255,0.4));
    }

    header {
        background: linear-gradient(145deg, var(--metal-dark), #1c1f24);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 25px;
        text-align: center;
        box-shadow: 0 0 25px rgba(0,191,255,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
        animation: shine 4s infinite linear;
        margin-bottom: 20px;
        position: relative;
    }
    @keyframes shine {
        0% { box-shadow: 0 0 20px rgba(0,191,255,0.1); }
        50% { box-shadow: 0 0 40px rgba(0,191,255,0.4); }
        100% { box-shadow: 0 0 20px rgba(0,191,255,0.1); }
    }
    header h1 { font-size: 1.8rem; letter-spacing: 1.5px; background: linear-gradient(90deg, var(--metal-shine), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

   .btn-pdf {
        position: absolute;
        right: 25px;
        top: 25px;
        background: linear-gradient(145deg, var(--accent), #0088cc);
        color: #000;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 4px 15px rgba(0,191,255,0.3);
    }
   .btn-pdf:hover { transform: scale(1.05); }

   .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
   .card {
        background: rgba(30,34,40,0.7);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        padding: 18px;
        backdrop-filter: blur(8px);
        transition: 0.3s;
        animation: fadeUp 0.6s ease;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
   .card:hover { border-color: var(--accent); transform: translateY(-4px); }
   .card h4 { font-size: 0.85rem; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; }
   .card.valor { font-size: 1.6rem; font-weight: 700; color: var(--metal-shine); }

    table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(30,34,40,0.7);
        border-radius: 14px;
        overflow: hidden;
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,0.08);
        animation: fadeUp 0.8s ease;
    }
    thead { background: linear-gradient(90deg, var(--metal-dark), #333); }
    th, td { padding: 14px 12px; text-align: center; font-size: 0.9rem; }
    th { color: var(--metal-shine); font-weight: 600; }
    tbody tr { border-bottom: 1px solid rgba(255,255,255,0.05); }
    tbody tr:hover { background: rgba(0,191,255,0.05); }

   .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; background: linear-gradient(145deg, #444, #222); }
   .ok { color: #00ff88; font-weight: 700; }
   .alert { color: #ffb700; font-weight: 700; }
   .urgent { color: #ff3b3b; font-weight: 700; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.4; } }

    footer { text-align: center; margin-top: 25px; font-size: 0.8rem; color: #666; }
</style>
</head>
<body>
<div class="container" id="areaPDF">
    <!-- LOGO GRANDE NO TOPO -->
    <div class="logo-topo">
        <img src="sections/ktp/images/logoprojetotransformacao.png" alt="Logo Projeto Transformação">
    </div>

    <header>
        <h1>DZ TREINAMENTO - GESTÃO FINANCEIRA</h1>
        <button class="btn-pdf" onclick="baixarPDF()">⬇ BAIXAR PDF</button>
    </header>

    <div class="cards" id="cardsResumo"></div>

    <table id="tabela">
        <thead>
            <tr>
                <th>Aluno</th>
                <th>Plano</th>
                <th>Valor Mensal</th>
                <th>Dias da Semana</th>
                <th>Horário</th>
                <th>Data Venc.</th>
                <th>Dias Restantes</th>
            </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
            <tr style="background: rgba(0,191,255,0.1); font-weight: bold;">
                <td colspan="2">TOTAL GERAL MENSAL</td>
                <td id="totalGeral" colspan="5"></td>
            </tr>
        </tfoot>
    </table>

    <footer>Atualizado automaticamente • DZ 2026</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
    const TABELA_VALORES = { "1x": 30.00, "2x": 40.00, "3x": 50.00, "4x": 60.00, "5x": 70.00 };

    const ALUNOS = [
        { nome: "Gonzaga", plano: "3x", dias: "Seg / Qua / Sex", horario: "19:00 às 20:00", vencimento: "2026-08-10" },
        { nome: "Carla", plano: "2x", dias: "Ter / Qui", horario: "18:00 às 19:00", vencimento: "2026-08-05" },
        { nome: "Hellem", plano: "5x", dias: "Seg a Sex", horario: "07:00 às 08:00", vencimento: "2026-08-01" },
        { nome: "Katia", plano: "1x", dias: "Sábado", horario: "09:00 às 10:00", vencimento: "2026-08-16" },
        { nome: "Edna", plano: "4x", dias: "Seg / Ter / Qui / Sex", horario: "20:00 às 21:00", vencimento: "2026-07-29" }
    ];

    function diasRestantes(data) {
        const hoje = new Date(); hoje.setHours(0,0,0,0);
        const venc = new Date(data); venc.setHours(23,59,59,999);
        return Math.ceil((venc - hoje) / (1000 * 60 * 60 * 24));
    }

    function moeda(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
    function dataBR(d) { return new Date(d + 'T12:00:00').toLocaleDateString('pt-BR'); }

    function statusDias(d) {
        if (d < 0) return `VENCIDO`;
        if (d <= 3) return `${d} dias`;
        if (d <= 7) return `${d} dias`;
        return `${d} dias`;
    }

    function montarPainel() {
        let totalGeral = 0;
        let qtdPorPlano = { "1x": 0, "2x": 0, "3x": 0, "4x": 0, "5x": 0 };
        let tbody = "";

        ALUNOS.forEach(a => {
            const valor = TABELA_VALORES[a.plano];
            const dias = diasRestantes(a.vencimento);
            totalGeral += valor;
            qtdPorPlano[a.plano]++;

            tbody += `
            <tr>
                <td><b>${a.nome}</b></td>
                <td><span class="badge">${a.plano}</span></td>
                <td>${moeda(valor)}</td>
                <td>${a.dias}</td>
                <td>${a.horario}</td>
                <td>${dataBR(a.vencimento)}</td>
                <td class="${dias<0?'urgent':dias<=3?'urgent':dias<=7?'alert':'ok'}">${statusDias(dias)}</td>
            </tr>`;
        });

        document.querySelector("#tabela tbody").innerHTML = tbody;
        document.getElementById("totalGeral").innerText = moeda(totalGeral);

        let cards = `<div class="card"><h4>Total Mensal</h4><div class="valor">${moeda(totalGeral)}</div></div>`;
        for (let p in qtdPorPlano) {
            if(qtdPorPlano[p] > 0) {
                cards += `<div class="card"><h4>Plano ${p} - ${moeda(TABELA_VALORES[p])}</h4><div class="valor">${qtdPorPlano[p]} Aluno(s)</div></div>`;
            }
        }
        document.getElementById("cardsResumo").innerHTML = cards;
    }

    async function baixarPDF() {
        const { jsPDF } = window.jspdf;
        const area = document.getElementById('areaPDF');

        document.querySelector('.btn-pdf').style.display = 'none';

        const canvas = await html2canvas(area, { scale: 2, backgroundColor: '#0d1117', useCORS: true });
        const imgData = canvas.toDataURL('image/png');

        const pdf = new jsPDF('p', 'mm', 'a4');
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
        pdf.save(`Cronograma_DZ_${new Date().toLocaleDateString('pt-BR')}.pdf`);

        document.querySelector('.btn-pdf').style.display = 'block';
    }

    montarPainel();
</script>
</body>
</html>
