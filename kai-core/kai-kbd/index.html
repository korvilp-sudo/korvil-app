<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KORVIL - K-AI.K-B.D 8K FINAL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
  :root{ --korvil-neon:#00ffff; --korvil-bg:#000010; --glass:rgba(0,255,255,0.05); --metal:linear-gradient(145deg, #001a1a, #000); }
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Orbitron"; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;}
  body{background:var(--korvil-bg); background-image:radial-gradient(circle, rgba(0,255,255,0.1) 0%, transparent 70%); color:#d0f8ff; overflow:hidden; font-size:18px;}

  #db-machine{
    width:90vw; height:90vh; margin:5vh auto; background:var(--metal); border:2px solid var(--korvil-neon); border-radius:30px;
    box-shadow:0 0 60px var(--korvil-neon), inset 0 0 50px rgba(0,255,255,0.1); position:relative; overflow:hidden; transform-style:preserve-3d;
  }
 .holo-line{position:absolute; width:100%; height:2px; background:linear-gradient(90deg, transparent, var(--korvil-neon), transparent); animation: scan 3s linear infinite; z-index:999;}
  @keyframes scan{0%{top:0%;} 100%{top:100%;}} @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.4;}}

  h1{text-align:center; font-size:2.2rem; color:var(--korvil-neon); text-shadow:0 0 30px var(--korvil-neon); padding:15px; animation:pulse 2s infinite;}

 .tabs{display:flex; gap:15px; justify-content:center; padding:15px;}
 .tab-btn{padding:18px 30px; background:var(--glass); border:2px solid var(--korvil-neon); color:var(--korvil-neon); cursor:pointer; border-radius:12px; font-weight:700; font-size:1.2rem; position:relative; backdrop-filter:blur(10px);}
 .tab-btn.locked::after{content:"🔒"; position:absolute; top:-8px; right:-8px; animation: pulse 1s infinite;}
 .count-overlay{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:5rem; color:var(--korvil-neon); display:none; z-index:1000;}

 .screen{display:none; padding:20px; height:calc(100% - 180px); overflow:auto;}
 .screen.active{display:block;}
 .locked-screen{display:flex; align-items:center; justify-content:center; flex-direction:column; height:100%; font-size:1.5rem;}

 .horario-bloco{margin-bottom:30px; border:2px solid rgba(0,255,255,0.3); padding:20px; border-radius:15px; background:rgba(0,0,0,0.4);}
 .horario-titulo{display:flex; justify-content:space-between; font-size:1.5rem; color:var(--korvil-neon); margin-bottom:15px;}
  table{width:100%; font-size:16px; border-collapse:collapse;} th,td{border:1px solid rgba(0,255,255,0.3); padding:12px;}
  th{background:var(--korvil-neon); color:#000; position:sticky; top:0;}

  /* MENUS SECRETOS */
 .secret-menu{position:absolute; left:0; width:100%; height:140px; background:rgba(0,255,255,0.1); border:2px dashed var(--korvil-neon); display:none; justify-content:center; align-items:center; gap:15px; backdrop-filter: blur(10px); z-index:1000;}
 .secret-menu.top{top:0;}.secret-menu.bottom{bottom:0;}
 .menu-btn{padding:12px 20px; background:var(--korvil-neon); color:#000; border:none; border-radius:10px; font-weight:900; cursor:pointer;}

  /* MODO CUBO */
  #cube-container{position:absolute; top:0; left:0; width:100%; height:100%; display:none; transform-style: preserve-3d; transition: transform 0.5s;}
 .cube-face{position:absolute; width:100%; height:100%; background:rgba(0,10,20,0.95); border:2px solid var(--korvil-neon); overflow:auto;}
 .face-title{position:sticky; top:0; background:rgba(0,255,255,0.2); padding:15px; text-align:center; font-size:1.5rem; border-bottom:2px solid var(--korvil-neon); z-index:10;}
 .face1{transform: rotateY(0deg) translateZ(45vw);}.face2{transform: rotateY(90deg) translateZ(45vw);}
 .face3{transform: rotateY(180deg) translateZ(45vw);}.face4{transform: rotateY(-90deg) translateZ(45vw);}
 .face5{transform: rotateX(90deg) translateZ(45vh);}.face6{transform: rotateX(-90deg) translateZ(45vh);}

  /* TERMINAL */
 .terminal{background:#000; color:var(--korvil-neon); padding:15px; height:50%; overflow:auto; border:1px solid var(--korvil-neon); font-size:14px;}
 .terminal-input{width:100%; padding:12px; background:#000; border:2px solid var(--korvil-neon); color:var(--korvil-neon);}
 .editor{width:100%; height:60%; background:#001111; color:var(--korvil-neon); border:2px solid var(--korvil-neon); font-family:monospace; font-size:14px; padding:10px;}
 .countdown{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-size:8rem; color:var(--korvil-neon); display:none; z-index:9999; text-shadow:0 0 50px var(--korvil-neon);}
 .hist-item{padding:10px; margin:5px 0; background:rgba(0,255,255,0.05); border-left:3px solid var(--korvil-neon); cursor:pointer;}
  @keyframes turboGlow{50%{box-shadow:0 0 200px var(--korvil-neon), 0 0 400px var(--korvil-neon);}}
 .turbo{animation: turboGlow 5s ease-out;}
</style>
</head>
<body oncontextmenu="return false">

<div id="db-machine">
  <div class="holo-line"></div>
  <h1>🚨 KORVIL DATABASE 8K HOLOGRAM 🚨</h1>

  <div class="tabs">
    <button class="tab-btn" onclick="showTab('ativos')">1. ALUNOS ATIVOS</button>
    <button class="tab-btn locked" id="tab-desativados"><span class="count-overlay"></span>2. ALUNOS DESATIVADOS</button>
    <button class="tab-btn locked" id="tab-cronograma"><span class="count-overlay"></span>3. CRONOGRAMA COMPLETO</button>
  </div>

  <div id="ativos" class="screen active"><h2>ALUNOS ATIVOS</h2><div id="ativos-por-horario"></div></div>
  <div id="desativados" class="screen"><div class="locked-screen"><p>SEGURE A ABA 5s</p></div><div id="desativados-por-horario"></div></div>
  <div id="cronograma" class="screen"><div class="locked-screen"><p>SEGURE A ABA 5s</p></div><div id="todos-por-horario"></div></div>

  <!-- MENUS SECRETOS DEV -->
  <div class="secret-menu top" id="menu-top">
    <button class="menu-btn" onclick="exportarDB()">EXPORT DB</button>
    <button class="menu-btn" onclick="recalcularTotais()">RECALC</button>
    <button class="menu-btn" onclick="toggleDebug()">DEBUG</button>
  </div>
  <div class="secret-menu bottom" id="menu-bottom">
    <button class="menu-btn" onclick="addAluno()">+ ALUNO</button>
    <button class="menu-btn" onclick="limparCache()">CLEAR</button>
    <button class="menu-btn" onclick="window.open('https://github.com/kai-core/kai-kbd','_blank')">REPO</button>
  </div>

  <!-- MODO CUBO -->
  <div id="cube-container">
    <div class="cube-face face1"><div class="face-title">FACE 1: BANCO DE DADOS KTP</div><div id="cube-db"></div></div>
    <div class="cube-face face2"><div class="face-title">FACE 2: ANALYTICS KORVIL</div><div id="cube-analytics"></div></div>
    <div class="cube-face face3"><div class="face-title">FACE 3: TERMINAL KORVIL</div><div class="terminal" id="termOutput">KORVIL_OS v8.2 > help</div><input class="terminal-input" id="termInput" placeholder="comando..." onkeypress="if(event.key==='Enter') runTerminal()"></div>
    <div class="cube-face face4"><div class="face-title">FACE 4: EDITOR DE PLANOS</div><div id="cube-editor"></div></div>
    <div class="cube-face face5"><div class="face-title">FACE 5: HISTÓRICO</div><div id="cube-history"></div></div>
    <div class="cube-face face6"><div class="face-title">FACE 6: CONFIG</div><div id="cube-config"></div></div>
  </div>
</div>
<div class="countdown" id="countdown"></div>

<script>
// ========== SEU BANCO DE DADOS REAL ==========
const TABELA_PLANOS = {1:60, 2:80, 3:100, 4:130, 5:150};
const VAGAS_MAX = 7;
let CRONOGRAMA_DB = {"PRESENCIAL":[{"hora":"08h00 🐢","status":"ATIVOS","alunos":[{"n":1,"aluno":"Magda Gomes dos Santos","status":"Ativo","mensalidade":"13/05/26","valor":"R$150,00","freq":"5x"}]},{"hora":"06h00 🐦","status":"DESATIVADOS","alunos":[{"n":4,"aluno":"Alexandra","status":"Desativado"}]}]};

const STORAGE_KEY = "KORVIL_DB_v8"; const HISTORY_KEY = "KORVIL_HISTORY_v8";
let editingFaces = []; let faceCodeBackup = {}; let cubeRotation={x:-20,y:0}; let isPinching=false; let pinchStart=0; let dragTop=false,dragBottom=false; let turboCount=0;

function getToday(){ return new Date().toISOString().split('T')[0]; }
function getMonth(){ return new Date().toISOString().slice(0,7); }

function loadData(){
  const saved = localStorage.getItem(STORAGE_KEY);
  faceCodeBackup = saved? JSON.parse(saved) : {
    face1: document.getElementById('ativos').innerHTML,
    face2: "Analytics",
    face3: "Terminal",
    face4: "Editor",
    face5: "Historico",
    face6: "Config"
  };
}

function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(faceCodeBackup));
  let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}'); let month = getMonth();
  Object.keys(history).forEach(m=>{ if(m!== month) delete history[m]; });
  if(!history[month]) history[month] = {};
  history[month][getToday()] = {...faceCodeBackup};
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

// RENDERIZAR SUAS TABELAS
function renderTabelas(){
  let ativosHTML="", todosHTML="", desativadosHTML="";
  CRONOGRAMA_DB.PRESENCIAL.forEach(h=>{
    let ativos = h.alunos.filter(a=>a.status==="Ativo");
    let desativados = h.alunos.filter(a=>a.status==="Desativado");
    if(ativos.length>0) ativosHTML += `<div class="horario-bloco"><div class="horario-titulo"><h3>${h.hora}</h3></div><table><tr><th>ALUNO</th><th>STATUS</th></tr>${ativos.map(a=>`<tr><td>${a.aluno}</td><td>${a.status}</td></tr>`).join('')}</table></div>`;
    if(desativados.length>0) desativadosHTML += `<div class="horario-bloco"><div class="horario-titulo"><h3>${h.hora}</h3></div><table><tr><th>ALUNO</th><th>STATUS</th></tr>${desativados.map(a=>`<tr><td>${a.aluno}</td><td>${a.status}</td></tr>`).join('')}</table></div>`;
    todosHTML += `<div class="horario-bloco"><div class="horario-titulo"><h3>${h.hora}</h3></div><table><tr><th>ALUNO</th><th>STATUS</th></tr>${h.alunos.map(a=>`<tr><td>${a.aluno}</td><td>${a.status}</td></tr>`).join('')}</table></div>`;
  });
  document.getElementById('ativos-por-horario').innerHTML = ativosHTML;
  document.getElementById('desativados-por-horario').innerHTML = desativadosHTML;
  document.getElementById('todos-por-horario').innerHTML = todosHTML;
}

function showTab(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active');}

// SENHA 5S NAS ABAS
function setupTabLock(tabId, screenId){
  const tab = document.getElementById(tabId); let holdTimer;
  tab.addEventListener('mousedown', ()=>{
    let c=0; tab.querySelector('.count-overlay').style.display='block';
    holdTimer = setInterval(()=>{ c++; tab.querySelector('.count-overlay').innerText=c; if(c>=5){ clearInterval(holdTimer); countdown3(); } },1000);
  });
  tab.addEventListener('mouseup', ()=>{clearInterval(holdTimer); tab.querySelector('.count-overlay').style.display='none';});
  function countdown3(){let c=3; tab.querySelector('.count-overlay').innerText=c;
    let cd = setInterval(()=>{ c--; tab.querySelector('.count-overlay').innerText=c;
      if(c<=0){clearInterval(cd); tab.querySelector('.count-overlay').style.display='none'; showTab(screenId);}
    },1000);
  }
}
setupTabLock('tab-desativados','desativados'); setupTabLock('tab-cronograma','cronograma');

// PINÇA PRA AUMENTAR
document.getElementById('db-machine').addEventListener('touchstart', e=>{ if(e.touches.length==2){isPinching=true; pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);} });
document.getElementById('db-machine').addEventListener('touchmove', e=>{ if(isPinching){ let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); let scale=d/pinchStart; document.getElementById('db-machine').style.width=(90*scale)+'vw'; document.getElementById('db-machine').style.height=(90*scale)+'vh'; } });
document.addEventListener('touchend', ()=>{isPinching=false;});

// MENU SECRETO TOPO+BAIXO
document.addEventListener('touchstart', e=>{ if(e.touches[0].clientY<100) dragTop=true; if(e.touches[0].clientY>window.innerHeight-100) dragBottom=true; });
document.addEventListener('touchmove', ()=>{ if(dragTop && dragBottom){document.getElementById('menu-top').style.display='flex'; document.getElementById('menu-bottom').style.display='flex';} });
document.addEventListener('touchend', ()=>{dragTop=false; dragBottom=false; setTimeout(()=>{document.getElementById('menu-top').style.display='none'; document.getElementById('menu-bottom').style.display='none';},1500);});

// MODO CUBO 5S + GIRO
let cubeHold=0;
document.getElementById('db-machine').addEventListener('mousedown', ()=>{ cubeHold=0; let t=setInterval(()=>{cubeHold++; if(cubeHold>=5){clearInterval(t); activateCube();}},1000); });
document.addEventListener('mouseup', ()=>{clearInterval(t);});

function activateCube(){
  loadData(); document.getElementById('cube-container').style.display='block'; document.querySelectorAll('.screen,.tabs,h1').forEach(el=>el.style.display='none');
  Object.keys(faceCodeBackup).forEach(f=>{ if(document.getElementById('cube-'+f.replace('face',''))) document.getElementById('cube-'+f.replace('face','')).innerHTML = faceCodeBackup[f]; });
  carregarProgramasReais(); updateCubeRotation();
}
function updateCubeRotation(){ document.getElementById('cube-container').style.transform = `rotateX(${cubeRotation.x}deg) rotateY(${cubeRotation.y}deg)`; }
document.addEventListener('mousemove', e=>{ if(e.buttons==1){ cubeRotation.y += e.movementX*0.5; cubeRotation.x += e.movementY*0.5; updateCubeRotation(); turboCount++; if(turboCount==3) turboGiro(); } });

function turboGiro(){
  document.getElementById('db-machine').classList.add('turbo');
  let i=0; let turbo=setInterval(()=>{cubeRotation.y+=20; updateCubeRotation(); i++; if(i>30){clearInterval(turbo); setTimeout(()=>{window.location.href='https://github.com/kai-core/kai-kbd/index.html'},1000);}},50);
}

// TERMINAL REAL
function runTerminal(){
  const input=document.getElementById('termInput'); const output=document.getElementById('termOutput'); const cmd=input.value.trim(); input.value='';
  output.innerHTML += `<br>> ${cmd}`;
  let p=cmd.split(' ');
  if(cmd==='help') output.innerHTML+=`<br>editar [face/todas] | confirmar | historico | voltar [data] | save`;
  else if(p[0]==='editar'){ editingFaces = p[1]==='todas'? ['face1','face2','face3','face4','face5','face6'] : [p[1]]; abrirEditor(editingFaces); output.innerHTML+=`<br>EDITANDO: ${editingFaces.join(', ')}`;
  }
  else if(cmd==='confirmar'){ if(editingFaces.length==0) return; iniciarContagem5s(); }
  else if(cmd==='historico'){ carregarHistorico(); }
  else if(p[0]==='voltar'){ voltarVersao(p[1]); }
  else if(cmd==='save'){ saveData(); output.innerHTML+=`<br>✅ SALVO`; }
  output.scrollTop=output.scrollHeight;
}
function abrirEditor(faces){ faces.forEach(f=>{ document.getElementById('cube-'+f.replace('face','')).innerHTML=`<h3>EDITANDO ${f}</h3><textarea class="editor" id="editor-${f}">${faceCodeBackup[f]}</textarea>`; }); }
function iniciarContagem5s(){ let c=5; const cd=document.getElementById('countdown'); cd.style.display='block'; cd.innerText=c; let timer=setInterval(()=>{c--; cd.innerText=c; if(c<=0){clearInterval(timer); cd.style.display='none'; aplicarEdicoes();}},1000); }
function aplicarEdicoes(){ editingFaces.forEach(f=>{ faceCodeBackup[f]=document.getElementById('editor-'+f).value; document.getElementById('cube-'+f.replace('face','')).innerHTML=faceCodeBackup[f]; }); editingFaces=[]; saveData(); document.getElementById('termOutput').innerHTML+=`<br>✅ ATUALIZADO ${getToday()}`; }

function carregarProgramasReais(){
  document.getElementById('cube-analytics').innerHTML=`<h3>Receita: R$150</h3>`;
  document.getElementById('cube-editor').innerHTML=`<h3>Planos: ${JSON.stringify(TABELA_PLANOS)}</h3>`;
  document.getElementById('cube-history').innerHTML=`<h3>Historico do Mes</h3><div id="history-list"></div>`; carregarHistorico();
  document.getElementById('cube-config').innerHTML=`<input type="color" onchange="document.documentElement.style.setProperty('--korvil-neon', this.value)">`;
}
function carregarHistorico(){ let h=JSON.parse(localStorage.getItem(HISTORY_KEY)||'{}'); let m=getMonth(); let html=''; if(h[m]) Object.keys(h[m]).reverse().forEach(d=>{html+=`<div class="hist-item" onclick="voltarVersao('${d}')">${d}</div>`}); document.getElementById('cube-history').innerHTML=`<h3>HISTORICO</h3>`+html; }
function voltarVersao(d){ let h=JSON.parse(localStorage.getItem(HISTORY_KEY)||'{}'); faceCodeBackup=h[getMonth()][d]; Object.keys(faceCodeBackup).forEach(f=>{document.getElementById('cube-'+f.replace('face','')).innerHTML=faceCodeBackup[f];}); saveData(); }

function exportarDB(){alert(JSON.stringify(CRONOGRAMA_DB).slice(0,100))} function recalcularTotais(){alert('Recalculado')} function toggleDebug(){alert('Debug')} function addAluno(){alert('+Aluno')} function limparCache(){localStorage.clear();alert('Limpo')}

renderTabelas(); saveData();
</script>
</body>
</html>
