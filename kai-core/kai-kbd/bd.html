<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>KORVIL CUBO 4D FORMULARIOS</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }
  body { background: radial-gradient(circle, #000020, #000); color: #00f0ff; overflow: hidden; }

.top { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 900; text-shadow: 0 0 20px #00f0ff; z-index: 10; }
.hint { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 11px; z-index: 10; }

.form-overlay { position: absolute; width: 280px; height: 320px; background: rgba(0,10,30,0.9); backdrop-filter: blur(15px); border: 2px solid #00f0ff; border-radius: 15px; padding: 15px; box-shadow: 0 0 40px #00f0ffaa; display: none; z-index: 20; }
.form-overlay h3 { text-align: center; color: #ff00ff; margin-bottom: 10px; font-size: 14px; }
.form-overlay input,.form-overlay select,.form-overlay button { width: 100%; padding: 10px; margin-bottom: 8px; background: #000; color: #00f0ff; border: 1px solid #00f0ff; border-radius: 6px; font-size: 12px; }
.form-overlay button { background: linear-gradient(90deg, #00f0ff, #ff00ff); color: #000; font-weight: 900; cursor: pointer; }
  canvas { width: 100%; height: 100vh; display: block; }
</style>
</head>
<body>
<div class="top">⚡ KORVIL CUBO 4D - 6 FORMULARIOS ⚡</div>
<div class="hint">SEGURE E ARRASTE PARA GIRAR | CLIQUE NO LADO PARA ABRIR FORMULARIO</div>

<div id="form1" class="form-overlay">
  <h3>LADO 1: CADASTRO CLIENTE</h3>
  <input type="text" placeholder="Nome do Cliente">
  <input type="tel" placeholder="Telefone WhatsApp">
  <input type="email" placeholder="Email">
  <select><option>Tipo: PF</option><option>Tipo: PJ</option></select>
  <button onclick="salvar(1)">SALVAR CLIENTE</button>
</div>

<div id="form2" class="form-overlay">
  <h3>LADO 2: CADASTRO SERVIÇO</h3>
  <select><option>Eletricista</option><option>Carpinteiro</option><option>Dev</option></select>
  <input type="number" placeholder="Preço Base R$">
  <input type="text" placeholder="Descrição">
  <select><option>Ativo</option><option>Inativo</option></select>
  <button onclick="salvar(2)">SALVAR SERVIÇO</button>
</div>

<div id="form3" class="form-overlay">
  <h3>LADO 3: LANÇAR VENDA</h3>
  <input type="date">
  <select><option>Cliente 1</option><option>Cliente 2</option></select>
  <input type="number" placeholder="Valor R$">
  <select><option>Pix</option><option>Cartão</option><option>Dinheiro</option></select>
  <button onclick="salvar(3)">LANÇAR VENDA</button>
</div>

<div id="form4" class="form-overlay">
  <h3>LADO 4: META MENSAL</h3>
  <select><option>Janeiro</option><option>Fevereiro</option><option>Dezembro</option></select>
  <input type="number" placeholder="Meta R$">
  <input type="number" placeholder="Meta de Vendas">
  <input type="text" placeholder="Observação">
  <button onclick="salvar(4)">SALVAR META</button>
</div>

<div id="form5" class="form-overlay">
  <h3>LADO 5: ANÁLISE IA</h3>
  <select><option>Analisar Mês</option><option>Analisar Serviço</option></select>
  <input type="text" placeholder="Pergunta para IA">
  <textarea placeholder="Resultado aparecerá aqui" style="height:80px; background:#000; color:#00f0ff; border:1px solid #00f0ff"></textarea>
  <button onclick="salvar(5)">GERAR ANÁLISE</button>
</div>

<div id="form6" class="form-overlay">
  <h3>LADO 6: CONFIG 4D</h3>
  <select><option>Tema: Cyberpunk</option><option>Tema: Matrix</option></select>
  <input type="number" placeholder="Velocidade Rotação">
  <select><option>Som: ON</option><option>Som: OFF</option></select>
  <input type="text" placeholder="Nome do Dashboard">
  <button onclick="salvar(6)">APLICAR CONFIG</button>
</div>

<canvas id="canvas"></canvas>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let scene, camera, renderer, controls, cube;
const forms = [document.getElementById('form1'),document.getElementById('form2'),document.getElementById('form3'),document.getElementById('form4'),document.getElementById('form5'),document.getElementById('form6')];
const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();

function init() {
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x000010);
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 8);

  renderer = new THREE.WebGLRenderer({canvas: document.getElementById('canvas'), antialias: true});
  renderer.setSize(window.innerWidth, window.innerHeight);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.05;

  // LUZ HOLOGRAFICA
  scene.add(new THREE.AmbientLight(0x002244));
  const light = new THREE.PointLight(0x00f0ff, 3, 50); light.position.set(5,5,5); scene.add(light);

  // CUBO 4D = 6 LADOS COM TEXTURA DIFERENTE
  const geometry = new THREE.BoxGeometry(3, 3, 3);
  const materials = [];
  const cores = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff];
  const textos = ['CLIENTE','SERVIÇO','VENDA','META','IA','CONFIG'];

  for(let i=0; i<6; i++){
    const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = `#${cores[i].toString(16).padStart(6,'0')}`;
    ctx.fillRect(0,0,512,512);
    ctx.fillStyle = '#000'; ctx.font = 'bold 80px Orbitron'; ctx.textAlign = 'center';
    ctx.fillText(textos[i], 256, 256);
    const texture = new THREE.CanvasTexture(canvas);
    materials.push(new THREE.MeshPhongMaterial({map: texture, emissive: cores[i], emissiveIntensity: 0.5, transparent: true, opacity: 0.85}));
  }

  cube = new THREE.Mesh(geometry, materials);
  scene.add(cube);

  window.addEventListener('resize', onResize);
  window.addEventListener('click', onClick);
  animate();
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// CLIQUE NO LADO = ABRE FORMULARIO
function onClick(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(cube);

  if(intersects.length > 0){
    const faceIndex = intersects[0].face.materialIndex;
    forms.forEach(f=>f.style.display='none');
    const form = forms[faceIndex];
    form.style.display = 'block';
    form.style.left = event.clientX + 10 + 'px';
    form.style.top = event.clientY - 100 + 'px';
  }
}

function salvar(n){
  alert(`Dados do Lado ${n} salvos!`);
  forms[n-1].style.display='none';
}
window.salvar = salvar;

function animate() {
  requestAnimationFrame(animate);
  cube.rotation.x += 0.002;
  cube.rotation.y += 0.003;
  controls.update();
  renderer.render(scene, camera);
}

init();
</script>
</body>
</html>
