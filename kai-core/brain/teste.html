<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>K-AI FORGE V-2026.4</title>
  <style>
    body{margin:0;background:#010409;color:#00f0ff;font-family:Orbitron;display:flex;flex-direction:column;height:100vh}
    header{padding:10px;background:#0d1117;border-bottom:1px solid #00f0ff}
    .box{display:flex;flex:1}
    .esq{width:50%;padding:20px;background:#0d1117;border-right:1px solid #00f0ff}
    .dir{width:50%;padding:10px;background:#000;overflow:auto;font-size:12px}
    input,button{padding:10px;margin:5px;width:95%;background:#000;color:#00ff66;border:1px solid #00f0ff;border-radius:5px}
    button{background:#00f0ff;color:#000;font-weight:bold;cursor:pointer}
    #respostaKai{padding:10px;background:#161b22;border-top:1px solid #00f0ff}
    pre{margin:2px 0;color:#00ff66}
  </style>
</head>
<body>
  <header><h1>K-AI FORGE V-2026.4 - MODO PONTE</h1></header>
  <div class="box">
    <div class="esq">
      <h2>COMANDOS</h2>
      <input id="cmd" placeholder="Ex: criar projeto loja">
      <button onclick="KAI.processar(cmd.value)">Executar</button>
      <button onclick="KAI.autoUpdate()">Sobe você pro GitHub</button>
    </div>
    <div class="dir">
      <h2>PROGRAMAÇÃO EM TEMPO REAL</h2>
      <div id="editorCodigo"></div>
    </div>
  </div>
  <div id="respostaKai">K-AI: Aguardando comando...</div>

  <!-- ORDEM IMPORTA: PONTE PRIMEIRO -->
  <script src="./kai-core/brain/updater/kai-updater.js"></script>
  <script src="./kai-core/brain/kai-brain.js"></script>
</body>
</html>
