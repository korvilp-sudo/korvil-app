<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>K-AI FORGE V-2026.5</title>
  <style>
    body{margin:0;background:#010409;color:#00f0ff;font-family:Orbitron;display:flex;flex-direction:column;height:100vh}
    header{padding:10px;background:#0d1117;border-bottom:1px solid #00f0ff}
  .box{display:flex;flex:1}
  .esq{width:50%;padding:20px;background:#0d1117;border-right:1px solid #00f0ff}
  .dir{width:50%;padding:10px;background:#000;overflow:auto;font-size:12px}
    input,button{padding:10px;margin:5px;width:95%;background:#000;color:#00ff66;border:1px solid #00f0ff;border-radius:5px}
    button{background:#00f0ff;color:#000;font-weight:bold;cursor:pointer}
    button:hover{background:#00ccdd}
    #respostaKai{padding:10px;background:#161b22;border-top:1px solid #00f0ff}

    /* ===== VISOR FLUTUANTE ===== */
    #kaiVisor{
      position:fixed; bottom:20px; right:20px; width:400px; height:280px;
      background:#0d1117; border:2px solid #00f0ff; border-radius:10px;
      box-shadow:0 0 25px #00f0ff; z-index:9999; display:flex; flex-direction:column;
      font-family:'Courier New'; font-size:11px;
    }
    #kaiVisorHeader{
      background:#00f0ff; color:#000; padding:6px 10px; display:flex;
      justify-content:space-between; font-weight:bold; cursor:move; border-radius:8px 8px 0 0;
    }
    #kaiVisorHeader button{
      background:transparent; border:none; color:#000; font-weight:bold;
      cursor:pointer; font-size:18px; padding:0 5px;
    }
    #kaiVisorCorpo{
      flex:1; overflow:auto; padding:8px; color:#00ff66; background:#010409;
    }
    #kaiVisorCorpo pre{margin:2px 0; white-space:pre-wrap;}
  </style>
</head>
<body>
  <header><h1>K-AI FORGE V-2026.5 - MODO PONTE + VISOR</h1></header>
  <div class="box">
    <div class="esq">
      <h2>COMANDOS</h2>
      <input id="cmd" placeholder="Ex: cria projeto loja">
      <button onclick="KAI.processar(cmd.value)">Executar</button>
      <button onclick="KAI.autoUpdate()">Sobe você pro GitHub</button>
      <button onclick="KAI.analisarSistema()">Se Analisar</button>
      <button onclick="abrirVisor()">Abrir Visor</button>
    </div>
    <div class="dir">
      <h2>PROGRAMAÇÃO EM TEMPO REAL</h2>
      <div id="editorCodigo"></div>
    </div>
  </div>
  <div id="respostaKai">K-AI: Aguardando comando...</div>

  <!-- ===== VISOR FLUTUANTE K-AI ===== -->
  <div id="kaiVisor">
    <div id="kaiVisorHeader">
      <span>K-AI SISTEMA V-2026.5</span>
      <button onclick="fecharVisor()">X</button>
    </div>
    <div id="kaiVisorCorpo"></div>
  </div>

  <script>
    function fecharVisor(){ document.getElementById('kaiVisor').style.display='none'; }
    function abrirVisor(){ document.getElementById('kaiVisor').style.display='flex'; }
  </script>

  <script type="module" src="./kai-core/brain/kai-brain.js"></script>
</body>
</html>
