<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-TP - PROJETO TRANSFORMAÇÃO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Rajdhani:wght@600;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; cursor: pointer; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  /* FUNDO PRETO VIVO SE MEXENDO */
 .bg {
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background:
      radial-gradient(circle at 20% 50%, #001a1a 0%, transparent 50%),
      radial-gradient(circle at 80% 50%, #001f2e 0%, transparent 50%),
      #000;
    animation: bgMove 15s ease-in-out infinite alternate;
    z-index: 0;
  }
  @keyframes bgMove {
    0% { transform: rotate(0deg) scale(1); }
    100% { transform: rotate(5deg) scale(1.1); }
  }

 .slide {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px;
    transform: translateX(100%);
    opacity: 0;
    transition: transform 1s cubic-bezier(0.77,0,0.175,1), opacity 1s;
    z-index: 1;
  }
 .slide.active { transform: translateX(0); opacity: 1; }
 .slide.exit { transform: translateX(-100%); opacity: 0; }

  /* TITULO COM SINALIZADOR PISCANDO 3s */
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 8vw;
    font-weight: 900;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-shadow: 0 0 10px #00ffff, 0 0 30px #00ffff;
    margin-bottom: 40px;
    position: relative;
  }
  h1.blink::before, h1.blink::after {
    content: '';
    position: absolute;
    width: 120%;
    height: 5px;
    background: linear-gradient(90deg, transparent, #00ffff, #00aaff, transparent);
    left: -10%;
    box-shadow: 0 0 30px #00ffff;
    animation: blinkSignal 3s ease-in-out;
  }
  h1.blink::before { top: -20px; }
  h1.blink::after { bottom: -20px; }
  @keyframes blinkSignal {
    0%,100% { opacity: 0; } 50% { opacity: 1; }
  }

  /* SUBTITULOS ALINHADOS VERTICAL + ZOOM 6s */
 .sub-list {
    display: flex;
    flex-direction: column;
    gap: 25px;
    align-items: center;
  }
 .sub-item {
    font-size: 3vw;
    font-weight: 700;
    color: #ddd;
    animation: zoomHighlight 6s ease-in-out;
    transform-origin: center;
  }
  @keyframes zoomHighlight {
    0% { transform: scale(1); color: #ddd; }
    50% { transform: scale(1.15); color: #00ffff; text-shadow: 0 0 20px #00ffff; }
    100% { transform: scale(1); color: #ddd; }
  }

  /* TABELAS ORGANIZADAS */
  table {
    border-collapse: collapse;
    margin: 20px auto;
    font-size: 2.5vw;
    width: 90%;
  }
  th, td {
    border: 2px solid #00ffff44;
    padding: 15px 25px;
    text-align: center;
  }
  th {
    background: #00ffff22;
    color: #00ffff;
    font-family: 'Orbitron';
  }
  td { background: #111; }

 .destaque { color: #00ffff; font-weight: 900; }
 .destaque-red { color: #ff0033; font-weight: 900; animation: alert 0.8s infinite; }

  /* BARRA 6 SEGUNDOS */
 .progress { position: absolute; bottom: 140px; left: 5%; width: 90%; height: 8px; background: #111; border-radius: 10px; }
 .progress-bar { height: 100%; background: linear-gradient(90deg, #00ffff, #00aaff); box-shadow: 0 0 20px #00ffff; width: 0%; animation: load 6s linear forwards; }

  /* BOTOES CONTROLE */
 .controls {
    position: absolute;
    bottom: 40px;
    display: flex;
    gap: 30px;
  }
 .btn {
    padding: 15px 40px;
    font-size: 2vw;
    font-family: 'Orbitron';
    background: linear-gradient(90deg, #00ffff, #00aaff);
    border: none;
    border-radius: 15px;
    color: #000;
    font-weight: 900;
    box-shadow: 0 0 20px #00ffff;
    transition: 0.3s;
  }
 .btn:hover { transform: scale(1.1); }

 .btn-participar {
    position: absolute; right: 40px; bottom: 40px;
    padding: 20px 50px; font-size: 2.2vw; text-decoration: none;
  }

 .counter { position: absolute; top: 40px; right: 50px; font-size: 2vw; color: #00ffff; font-family: 'Orbitron'; }

  @keyframes load { from { width: 0%; } to { width: 100%; } }
  @keyframes alert { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
</style>
</head>
<body>

<div class="bg"></div>
<div id="slides"></div>

<audio id="whoosh">
  <source src="https://cdn.pixabay.com/audio/2024/08/09/audio_8c8b2c5d5e.mp3" type="audio/mpeg">
</audio>

<script>
const slides = [
  {
    t: "K-TP",
    s: "TREINAMENTO PERSONALIZADO",
    p: "<span class='destaque'>PROJETO TRANSFORMAÇÃO - 11° ANO</span>\nO MÉTODO CIENTÍFICO PARA SUA MELHOR VERSÃO"
  },
  {
    t: "4 FASES DO PROJETO",
    lista: ["1. OFF SEASON", "2. BULKING", "3. MAINTENANCE", "4. CUTTING"]
  },
  {
    t: "4 SEMANAS DO MÉTODO",
    lista: ["SEMANA 1: MANUTENÇÃO", "SEMANA 2: RESISTÊNCIA", "SEMANA 3: FORÇA", "SEMANA 4: HIPERTROFIA"]
  },
  {
    t: "NOSSOS OBJETIVOS",
    lista: ["GANHO DE PESO", "EMAGRECIMENTO", "DEFINIÇÃO MUSCULAR", "SAÚDE", "CONDICIONAMENTO FÍSICO", "HIPERTROFIA", "REABILITAÇÃO FÍSICA"]
  },
  {
    t: "CRONOGRAMA",
    tabela: [
      ["PERÍODO", "ETAPA"],
      ["JANEIRO A NOVEMBRO", "EXECUÇÃO E EVOLUÇÃO"],
      ["DEZEMBRO", "CONCLUSÃO E RESULTADOS FINAIS"]
    ]
  },
  {
    t: "PARA TODOS",
    lista: ["CRIANÇAS 10+", "JOVENS", "ADULTOS", "IDOSOS", "ATLETAS", "<span class='destaque'>TREINO 100% PERSONALIZADO</span>"]
  },
  {
    t: "PLANOS E VALORES",
    tabela: [
      ["PLANO", "MODALIDADE", "FREQUÊNCIA"],
      ["AVULSO", "PRESENCIAL / ONLINE", "1X NA SEMANA"],
      ["MENSAL", "PRESENCIAL / ONLINE", "2X NA SEMANA"],
      ["MENSAL", "PRESENCIAL / ONLINE", "3X NA SEMANA"],
      ["MENSAL", "PRESENCIAL / ONLINE", "4X NA SEMANA"],
      ["MENSAL VIP", "PRESENCIAL / ONLINE", "5X NA SEMANA"]
    ]
  },
  {
    t: "FUNCIONAMENTO",
    tabela: [
      ["TIPO", "DIAS"],
      ["TREINO GUIADO", "SEGUNDA A SEXTA-FEIRA"],
      ["ACADEMIA EXCLUSIVA 24H", "DOMINGO A DOMINGO"]
    ]
  },
  {
    t: "HORÁRIOS DISPONÍVEIS",
    tabela: [
      ["MANHÃ", "NOITE / MADRUGADA", "VAGAS"],
      ["06H 07H 08H 09H 10H", "16H A 05H", "<span class='destaque-red'>7 VAGAS POR HORÁRIO</span>"]
    ]
  },
  {
    t: "CHEGOU SUA VEZ",
    s: "PARE DE ADIAR",
    p: "<span class='destaque'>K-TP</span> - SEU CORPO, NOSSA MISSÃO\nA TRANSFORMAÇÃO COMEÇA AGORA",
    vagas: true
  },
];

let current = 0;
let timer;
const container = document.getElementById('slides');
const whoosh = document.getElementById('whoosh');

function renderSlide(i) {
  const slide = slides[i];
  let content = `<h1 class="blink">${slide.t}</h1>`;
  if(slide.s) content += `<h2 style="font-size:3.5vw;color:#00ffff;margin-bottom:30px;">${slide.s}</h2>`;

  if(slide.lista) {
    content += `<div class="sub-list">`;
    slide.lista.forEach(item => content += `<div class="sub-item">${item}</div>`);
    content += `</div>`;
  }
  if(slide.tabela) {
    content += `<table>`;
    slide.tabela.forEach((row, idx) => {
      content += `<tr>`;
      row.forEach(cell => content += idx===0? `<th>${cell}</th>` : `<td>${cell}</td>`);
      content += `</tr>`;
    });
    content += `</table>`;
  }
  if(slide.p) content += `<p style="font-size:3vw;">${slide.p}</p>`;
  if(slide.vagas) content += `<p class="destaque-red" style="font-size:3.5vw;margin-top:20px;">RESTAM POUCAS VAGAS!</p>`;

  container.innerHTML = `
    <div class="slide active">
      ${content}
      <div class="progress"><div class="progress-bar"></div></div>
      <div class="counter">${i + 1} / ${slides.length}</div>
      <div class="controls">
        <button class="btn" onclick="prevSlide()">◀ VOLTAR</button>
        <button class="btn" onclick="pauseResume()">⏯ PAUSAR</button>
        <button class="btn" onclick="nextSlide()">AVANÇAR ▶</button>
      </div>
      <a href="/projetotransformacao/projetotransformacao.html" class="btn btn-participar">QUERO ME TRANSFORMAR</a>
    </div>
  `;
  // Remove classe blink depois de 3s
  setTimeout(()=> document.querySelector('h1')?.classList.remove('blink'), 3000);
}

function nextSlide() {
  clearInterval(timer);
  const prev = container.querySelector('.slide.active');
  if(prev) prev.classList.add('exit');
  whoosh.currentTime = 0; whoosh.play();
  setTimeout(()=> {
    current = (current + 1) % slides.length;
    renderSlide(current);
    startTimer();
  }, 600);
}

function prevSlide() {
  clearInterval(timer);
  const prev = container.querySelector('.slide.active');
  if(prev) prev.classList.add('exit');
  whoosh.currentTime = 0; whoosh.play();
  setTimeout(()=> {
    current = (current - 1 + slides.length) % slides.length;
    renderSlide(current);
    startTimer();
  }, 600);
}

let paused = false;
function pauseResume() {
  paused =!paused;
  if(paused) clearInterval(timer);
  else startTimer();
}

function startTimer() {
  timer = setInterval(nextSlide, 6000); // 6 SEGUNDOS
}

// Clicar na tela avança
document.body.addEventListener('click', (e)=>{
  if(!e.target.classList.contains('btn') &&!e.target.classList.contains('btn-participar')) nextSlide();
});

renderSlide(0);
startTimer();
</script>

</body>
</html>
