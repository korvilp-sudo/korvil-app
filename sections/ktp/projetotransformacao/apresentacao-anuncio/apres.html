<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-TP - PROJETO TRANSFORMAÇÃO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Rajdhani:wght@600;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  /* FUNDO PRETO VIVO */
.bg {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    z-index: 0;
  }
.bg::before {
    content: '';
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background: radial-gradient(circle, #00ffff11 1px, transparent 1px);
    background-size: 80px 80px;
    animation: moveBg 20s linear infinite;
  }
  @keyframes moveBg { from { transform: translate(0,0); } to { transform: translate(80px,80px); } }

  /* LOGO BMW NO TOPO COM BORDA AZUL */
.logo-wrapper {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    padding: 12px;
    border-radius: 20px;
    background: radial-gradient(circle, #00ffff22, transparent);
    border: 3px solid #00ffff;
    box-shadow: 0 0 30px #00ffff, 0 0 60px #00aaff, inset 0 0 20px #00ffff33;
    animation: logoPulse 2s ease-in-out infinite alternate;
  }
.logo-top {
    width: 18vw;
    max-width: 280px;
    display: block;
    filter: drop-shadow(0 0 10px #00ffff);
  }
  @keyframes logoPulse {
    from { box-shadow: 0 0 20px #00ffff, 0 0 40px #00aaff, inset 0 0 10px #00ffff33; }
    to { box-shadow: 0 0 50px #00ffff, 0 0 90px #00aaff, inset 0 0 30px #00ffff55; }
  }

.slide {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    text-align: left;
    padding: 0 8%;
    padding-top: 18vh; /* Espaço pra logo com borda */
    transform: translateX(100%);
    opacity: 0;
    transition: transform 1s cubic-bezier(0.77,0,0.175,1), opacity 1s;
    z-index: 1;
  }
.slide.active { transform: translateX(0); opacity: 1; }
.slide.exit { transform: translateX(-100%); opacity: 0; }

  /* TITULO CENTRALIZADO */
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 6.5vw;
    font-weight: 900;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-shadow: 0 0 10px #00ffff, 0 0 30px #00ffff;
    margin-bottom: 30px;
    position: relative;
    width: 100%;
    text-align: center;
  }
  h1.blink::before, h1.blink::after {
    content: '';
    position: absolute;
    width: 60%;
    height: 4px;
    background: linear-gradient(90deg, transparent, #00ffff, transparent);
    left: 20%;
    box-shadow: 0 0 30px #00ffff;
    animation: blinkSignal 3s ease-in-out;
  }
  h1.blink::before { top: -15px; }
  h1.blink::after { bottom: -15px; }
  @keyframes blinkSignal { 0%,100% { opacity: 0; } 50% { opacity: 1; } }

  /* SUBTITULOS ALINHADOS ESQUERDA + ANIMAÇÃO SEQUENCIAL 10s */
.sub-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: flex-start;
    width: 100%;
  }
.sub-item {
    font-size: 2.6vw;
    font-weight: 700;
    color: #ccc;
    opacity: 0.4;
    transition: all 0.6s ease;
  }
.sub-item.active {
    font-size: 3vw;
    color: #00ffff;
    opacity: 1;
    text-shadow: 0 0 20px #00ffff;
    transform: translateX(20px);
  }

  /* TABELAS */
  table {
    border-collapse: collapse;
    margin: 15px 0;
    font-size: 2vw;
    width: 90%;
  }
  th, td {
    border: 2px solid #00ffff44;
    padding: 10px 18px;
    text-align: left;
  }
  th {
    background: #00ffff22;
    color: #00ffff;
    font-family: 'Orbitron';
    text-align: center;
  }
  td { background: #0a0a0a; }

.destaque { color: #00ffff; font-weight: 900; }
.destaque-red { color: #ff0033; font-weight: 900; animation: alert 0.8s infinite; }

.progress { position: absolute; bottom: 140px; left: 5%; width: 90%; height: 8px; background: #111; border-radius: 10px; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #00ffff, #00aaff); box-shadow: 0 0 20px #00ffff; width: 0%; animation: load 10s linear forwards; }

.controls {
    position: absolute;
    bottom: 40px;
    left: 8%;
    display: flex;
    gap: 20px;
    z-index: 2;
  }
.btn {
    padding: 15px 30px;
    font-size: 1.8vw;
    font-family: 'Orbitron';
    background: linear-gradient(90deg, #00ffff, #00aaff);
    border: none;
    border-radius: 12px;
    color: #000;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 0 20px #00ffff;
    transition: 0.3s;
  }
.btn:hover { transform: scale(1.08); }

.btn-participar {
    position: absolute; right: 8%; bottom: 40px;
    padding: 18px 40px; font-size: 2vw; text-decoration: none; z-index: 2;
  }

.counter { position: absolute; top: 220px; right: 50px; font-size: 2vw; color: #00ffff; font-family: 'Orbitron'; }

  @keyframes load { from { width: 0%; } to { width: 100%; } }
  @keyframes alert { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
</style>
</head>
<body>

<div class="bg"></div>
<div class="logo-wrapper">
  <img src="sections/ktp/images/logoprojetotransformacao.png" alt="Logo K-TP" class="logo-top">
</div>
<div id="slides"></div>

<audio id="whoosh">
  <source src="https://cdn.pixabay.com/audio/2024/08/09/audio_8c8b2c5d5e.mp3" type="audio/mpeg">
</audio>

<script>
const LINK_FINAL = "https://korvilp-sudo.github.io/korvil-app/sections/ktp/projetotransformacao/index.html";

const slides = [
  { t: "K-TP", s: "TREINAMENTO PERSONALIZADO", p: "<span class='destaque'>PROJETO TRANSFORMAÇÃO - 11° ANO</span><br>O MÉTODO CIENTÍFICO PARA SUA MELHOR VERSÃO" },
  { t: "4 FASES DO PROJETO", lista: ["1. OFF SEASON", "2. BULKING", "3. MAINTENANCE", "4. CUTTING"] },
  { t: "4 SEMANAS DO MÉTODO", lista: ["SEMANA 1: MANUTENÇÃO", "SEMANA 2: RESISTÊNCIA", "SEMANA 3: FORÇA", "SEMANA 4: HIPERTROFIA"] },
  { t: "NOSSOS OBJETIVOS", lista: ["GANHO DE PESO", "EMAGRECIMENTO", "DEFINIÇÃO MUSCULAR", "SAÚDE", "CONDICIONAMENTO FÍSICO", "HIPERTROFIA", "REABILITAÇÃO FÍSICA"] },
  { t: "CRONOGRAMA", tabela: [["PERÍODO", "ETAPA"], ["JANEIRO A NOVEMBRO", "EXECUÇÃO E EVOLUÇÃO"], ["DEZEMBRO", "CONCLUSÃO E RESULTADOS FINAIS"]] },
  { t: "PARA TODOS", lista: ["CRIANÇAS 10+", "JOVENS", "ADULTOS", "IDOSOS", "ATLETAS", "<span class='destaque'>TREINO 100% PERSONALIZADO</span>"] },
  { t: "PLANOS E VALORES", tabela: [["PLANO", "MODALIDADE", "FREQUÊNCIA"], ["AVULSO", "PRESENCIAL / ONLINE", "1X NA SEMANA"], ["MENSAL", "PRESENCIAL / ONLINE", "2X NA SEMANA"], ["MENSAL", "PRESENCIAL / ONLINE", "3X NA SEMANA"], ["MENSAL", "PRESENCIAL / ONLINE", "4X NA SEMANA"], ["MENSAL VIP", "PRESENCIAL / ONLINE", "5X NA SEMANA"]] },
  { t: "FUNCIONAMENTO", tabela: [["TIPO", "DIAS"], ["TREINO GUIADO", "SEGUNDA A SEXTA-FEIRA"], ["ACADEMIA EXCLUSIVA 24H", "DOMINGO A DOMINGO"]] },
  { t: "HORÁRIOS DISPONÍVEIS", tabela: [["MANHÃ", "NOITE / MADRUGADA", "VAGAS"], ["06H 07H 08H 09H 10H", "16H ÀS 05H", "<span class='destaque-red'>7 VAGAS POR HORÁRIO</span>"]] },
  { t: "CHEGOU SUA VEZ", s: "PARE DE ADIAR", p: "<span class='destaque'>K-TP</span> - SEU CORPO, NOSSA MISSÃO<br>A TRANSFORMAÇÃO COMEÇA AGORA", vagas: true },
];

let current = 0;
let timer;
let subTimer;
const container = document.getElementById('slides');
const whoosh = document.getElementById('whoosh');

function renderSlide(i) {
  const slide = slides[i];
  let content = `<h1 class="blink">${slide.t}</h1>`;
  if(slide.s) content += `<h2 style="font-size:3vw;color:#00ffff;margin-bottom:25px;width:100%;text-align:center;">${slide.s}</h2>`;

  if(slide.lista) {
    content += `<div class="sub-list">`;
    slide.lista.forEach(item => content += `<div class="sub-item">${item}</div>`);
    content += `</div>`;
  }
  if(slide.tabela) {
    content += `<table>`;
    slide.tabela.forEach((row, idx) => {
      content += `<tr>`;
      row.forEach(cell => content += idx===0? `<th>${cell}</th>` : `<td>${cell}</td>`);
      content += `</tr>`;
    });
    content += `</table>`;
  }
  if(slide.p) content += `<p style="font-size:2.6vw;margin-top:15px;">${slide.p}</p>`;
  if(slide.vagas) content += `<p class="destaque-red" style="font-size:3vw;margin-top:15px;">RESTAM POUCAS VAGAS!</p>`;

  container.innerHTML = `
    <div class="slide active">
      ${content}
      <div class="progress"><div class="progress-bar"></div></div>
      <div class="counter">${i + 1} / ${slides.length}</div>
      <div class="controls">
        <button class="btn" onclick="prevSlide()">◀ VOLTAR</button>
        <button class="btn" onclick="pauseResume()">⏯ PAUSAR</button>
        <button class="btn" onclick="nextSlide()">AVANÇAR ▶</button>
      </div>
      <a href="${LINK_FINAL}" target="_blank" class="btn btn-participar">QUERO ME TRANSFORMAR</a>
    </div>
  `;
  setTimeout(()=> document.querySelector('h1')?.classList.remove('blink'), 3000);
  startSubAnimation();
}

function startSubAnimation(){
  clearInterval(subTimer);
  const items = document.querySelectorAll('.sub-item');
  if(items.length === 0) return;
  let idx = 0;
  const timePerItem = 10000 / items.length;
  items.forEach(it => it.classList.remove('active'));
  items[0].classList.add('active');
  subTimer = setInterval(()=>{
    items.forEach(it => it.classList.remove('active'));
    idx = (idx + 1) % items.length;
    items[idx].classList.add('active');
  }, timePerItem);
}

function goToSlide(n) {
  clearInterval(timer); clearInterval(subTimer);
  const prev = container.querySelector('.slide.active');
  if(prev) prev.classList.add('exit');
  whoosh.currentTime = 0; whoosh.play();
  setTimeout(()=> {
    current = n;
    renderSlide(current);
    startTimer();
  }, 600);
}

function nextSlide() { goToSlide((current + 1) % slides.length); }
function prevSlide() { goToSlide((current - 1 + slides.length) % slides.length); }

let paused = false;
function pauseResume() {
  paused =!paused;
  if(paused) { clearInterval(timer); clearInterval(subTimer); }
  else { startTimer(); startSubAnimation(); }
}

function startTimer() { timer = setInterval(nextSlide, 10000); }

document.body.addEventListener('click', (e)=>{
  if(!e.target.closest('.btn') &&!e.target.closest('.btn-participar')) nextSlide();
});

renderSlide(0);
startTimer();
</script>

</body>
</html>
