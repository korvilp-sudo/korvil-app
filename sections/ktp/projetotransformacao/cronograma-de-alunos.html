<style>

  *{margin:0;padding:0;box-sizing:border-box;font-family:"Consolas", monospace;}

.tabs{display:flex; gap:10px; justify-content:center; margin-bottom:20px;}
.tab-btn{padding:12px 24px; background:var(--glass); border:1px solid var(--neon); color:var(--neon); cursor:pointer; border-radius:8px; font-weight:bold; box-shadow:0 0 15px rgba(0,247,255,0.3); transition:0.3s; position:relative;}
.tab-btn.active{background:var(--neon); color:#000; box-shadow:0 0 30px var(--neon);}
.lock-icon{font-size:14px; margin-left:6px;}

.screen{display:none; backdrop-filter:blur(10px); background:var(--glass); border:1px solid var(--neon2); border-radius:12px; padding:20px; box-shadow:0 0 40px rgba(123,47,255,0.4); transform: perspective(1000px) rotateX(2deg);}
.screen.active{display:block;}
.locked{display:flex; align-items:center; justify-content:center; flex-direction:column; height:400px; gap:20px;}

.horario-bloco{margin-bottom:30px; border:1px solid rgba(0,247,255,0.2); padding:15px; border-radius:8px; background:rgba(0,0,0,0.3);}
.horario-titulo{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--neon2);}
.horario-titulo h3{color:var(--neon); text-shadow:0 0 10px var(--neon);}
.vagas{color:var(--green); font-weight:bold; font-size:14px;}
.vagas.lotado{color:var(--red);}

.table-wrap{overflow-x:auto; margin-bottom:20px;}
  table{width:100%; border-collapse:collapse; font-size:11px; min-width:2000px;}
  th,td{border:1px solid rgba(0,247,255,0.2); padding:6px 8px; text-align:left; white-space:nowrap;}
  th{background:linear-gradient(180deg, var(--neon2), #000); color:var(--neon); position:sticky; top:0;}
  tr:nth-child(even){background:rgba(0,247,255,0.05);}
  tr:hover{background:rgba(0,247,255,0.15);}
.status-Ativo{color:var(--green); font-weight:bold;}
.status-Desativado{color:var(--red);}
.vence-alerta{color:var(--alert); font-weight:bold; animation: blink 1s infinite;}
@keyframes blink {50%{opacity:0.3;}}

.totais{display:grid; grid-template-columns: repeat(3, 1fr); gap:15px; margin-top:20px; background:rgba(0,247,255,0.1); border:1px solid var(--neon); padding:15px; border-radius:8px;}
.totais div{text-align:center;}
.totais h4{color:var(--neon); font-size:12px; margin-bottom:5px;}
.totais p{color:var(--green); font-size:18px; font-weight:bold; text-shadow:0 0 10px var(--green);}

.lembretes{margin-top:20px; padding:15px; border:1px dashed var(--alert); background:rgba(255,170,0,0.1); border-radius:8px;}
.lembretes h3{color:var(--alert); margin-bottom:10px; text-shadow:0 0 10px var(--alert);}
.lembretes ul{list-style:none;}
.lembretes li{padding:4px 0; color:var(--txt);}

.popup{position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:999;}
.popup-content{background:var(--glass); border:2px solid var(--neon); padding:30px; border-radius:12px; text-align:center; box-shadow:0 0 50px var(--neon2);}
.popup-content input{background:#000; border:1px solid var(--neon); color:var(--neon); padding:10px; width:200px; text-align:center;}
.popup-content button{margin-top:15px; padding:10px 20px; background:var(--neon); border:none; color:#000; font-weight:bold; cursor:pointer;}
.countdown{font-size:3rem; color:var(--neon); text-shadow:0 0 20px var(--neon);}
</style>

// FUNÇÕES AUXILIARES
function calcularDiasFaltantes(dataStr){
  if(!dataStr || dataStr === "--") return "--";
  let partes = dataStr.includes("/")? dataStr.split("/") : dataStr.split("-");
  let dia, mes, ano;
  if(dataStr.includes("/")){dia = parseInt(partes[0]); mes = parseInt(partes[1])-1; ano = partes[2].length===2? 2000+parseInt(partes[2]) : parseInt(partes[2]);}
  else {ano = parseInt(partes[0]); mes = parseInt(partes[1])-1; dia = parseInt(partes[2]);}
  let dataVenc = new Date(ano, mes, dia); let hoje = new Date(); hoje.setHours(0,0,0,0);
  return Math.ceil((dataVenc - hoje) / (1000 * 60 * 60 * 24));
}

function gerarBlocosPorHorario(containerId, horarios, filtroStatus=null){
  let html = "";
  horarios.forEach(h=>{
    let alunosFiltrados = h.alunos.filter(a=> a.aluno!== "--" && (!filtroStatus || a.status === filtroStatus));
    let vagasOcupadas = alunosFiltrados.length;
    let vagasDisponiveis = VAGAS_MAX - vagasOcupadas;

    let dadosTabela = JSON.parse(JSON.stringify(alunosFiltrados));
    dadosTabela.forEach(a=> a.FALTAM_DIAS = calcularDiasFaltantes(a.mensalidade));

    html += `
    <div class="horario-bloco">
      <div class="horario-titulo">
        <h3>${h.hora} - ${h.status}</h3>
        <div class="vagas ${vagasDisponiveis === 0? 'lotado':''}">VAGAS DISPONÍVEIS: ${vagasDisponiveis} / 7</div>
      </div>
      ${dadosTabela.length > 0? `<div class="table-wrap"><table>${gerarTabelaHTML(dadosTabela)}</table></div>` : `<p style="color:var(--red);">Nenhum aluno neste horário</p>`}
    </div>`;
  });
  document.getElementById(containerId).innerHTML = html;
}

function gerarTabelaHTML(dados){
  if(dados.length === 0) return "";
  const cols = Object.keys(dados[0]);
  let thead = "<thead><tr>" + cols.map(c=>`<th>${c.toUpperCase()}</th>`).join("") + "</tr></thead>";
  let tbody = "<tbody>" + dados.map(aluno=>{
    return "<tr>" + cols.map(c=>{
      let val = aluno[c]; let cls = "";
      if(c === "status") cls = `class="status-${val}"`;
      if(c === "FALTAM_DIAS" && val!== "--" && parseInt(val) <= 7 && parseInt(val) >= 0) cls = `class="vence-alerta"`;
      return `<td ${cls}>${val}</td>`;
    }).join("") + "</tr>";
  }).join("") + "</tbody>";
  return thead + tbody;
}

// CALCULAR TOTAIS E LEMBRETES
function calcularTotais(ativos){
  let totalBruto = 0; let totalDZ = 0; let lembretes = [];
  let hoje = new Date(); let diaSemana = hoje.getDay();
  let domingoAnterior = new Date(hoje); domingoAnterior.setDate(hoje.getDate() - diaSemana);

  ativos.forEach(a=>{
    let valor = parseFloat(a.valor.replace("R$", "").replace(",", "."));
    if(!isNaN(valor)) totalBruto += valor;
    let freqNum = parseInt(a.freq.replace("x",""));
    if(TABELA_DZ[freqNum]) totalDZ += TABELA_DZ[freqNum];
    let dias = calcularDiasFaltantes(a.mensalidade);
    if(dias!== "--" && dias <= 7 && dias >= 0){
      let dataVenc = new Date(a.mensalidade.includes("/")? a.mensalidade.split("/").reverse().join("-"): a.mensalidade);
      if(dataVenc >= domingoAnterior) lembretes.push({aluno:a.aluno, dias:dias, data:a.mensalidade});
    }
  });
  lembretes.sort((a,b)=>a.dias-b.dias);
  let totalKTP = totalBruto - totalDZ;
  document.getElementById("totais-ativos").innerHTML = `
    <div><h4>TOTAL BRUTO MENSAL</h4><p>R$ ${totalBruto.toFixed(2)}</p></div>
    <div><h4>PARTE DZ</h4><p>R$ ${totalDZ.toFixed(2)}</p></div>
    <div><h4>PARTE KTP</h4><p>R$ ${totalKTP.toFixed(2)}</p></div>
  `;
  document.getElementById("lembretes-semana").innerHTML = lembretes.length > 0?
    `<h3>🔔 LEMBRETES - VENCEM EM ATÉ 7 DIAS</h3><ul>${lembretes.map(l=>`<li>⚠️ ${l.aluno} - Vence em ${l.dias} dias - Data: ${l.data}</li>`).join("")}</ul>` :
    `<h3>🔔 LEMBRETES - VENCEM EM ATÉ 7 DIAS</h3><p>Nenhum vencimento próximo.</p>`;
}

// LOCK E SENHA
let targetTab = ""; let holdTimer = null; let holdCount = 0;
function startHold(tab){targetTab = tab; holdCount = 0; const countEl = tab==="desativados"? document.getElementById("hold-count") : document.getElementById("hold-count2"); holdTimer = setInterval(()=>{holdCount++; countEl.innerText = holdCount; if(holdCount >= 5){clearInterval(holdTimer); document.getElementById("popup").style.display = "flex"; startAccessCountdown();}}, 1000);}
function stopHold(){clearInterval(holdTimer); holdCount = 0; document.getElementById("hold-count").innerText = ""; document.getElementById("hold-count2").innerText = "";}
function startAccessCountdown(){let c = 3; const countEl = targetTab==="desativados"? document.getElementById("hold-count") : document.getElementById("hold-count2"); const interval = setInterval(()=>{countEl.innerText = c > 0? c : "Acesso Aberto: ✅"; c--; if(c < 0){clearInterval(interval); document.getElementById("popup").style.display = "none"; unlockTab(targetTab);}}, 1000);}
function checkPassword(){const senha = document.getElementById("senhaInput").value; if(senha === "quando"){document.getElementById("erroSenha").innerText = ""; startAccessCountdown();} else {document.getElementById("erroSenha").innerText = "Senha incorreta!";}}
function unlockTab(tab){document.getElementById(tab+"-locked").style.display = "none"; document.getElementById(tab+"-content").style.display = "block";}

gerarBlocosPorHorario("desativados-por-horario", horarios.filter(h=>h.alunos.some(a=>a.status==="Desativado")), "Desativado");
gerarBlocosPorHorario("todos-por-horario", horarios);
calcularTotais(ativos);

function showTab(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active")); document.getElementById(id).classList.add("active"); event.target.closest(".tab-btn").classList.add("active");}
