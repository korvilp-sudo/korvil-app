<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>K-AI v-4000 BACKEND</title>
<style>body{background:#000;color:#00FFFF;font-family:monospace;padding:20px}input,button{padding:12px;margin:5px;background:#111;color:#fff;border:1px solid #00FFFF}</style>
</head>
<body>
<h1>K-AI v-4000 // COM BACKEND</h1>
<p>Ele lê todos repos e edita sozinho. Sem token exposto.</p>

<input id="comando" placeholder="Ex: mudar cor do botão pra roxo" style="width:70%">
<input id="arquivo" placeholder="Arquivo: index.html" value="index.html">
<button onclick="enviar()">EXECUTAR E COMMITAR</button>
<div id="log"></div>

<script>
const REPO = "korvilp-sudo/korvil-app";

async function enviar(){
  const comando = document.getElementById('comando').value;
  const arquivo = document.getElementById('arquivo').value;
  
  // 1. LÊ O ARQUIVO ATUAL
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${arquivo}`);
  const data = await res.json();
  const codigoAntigo = atob(data.content);
  
  // 2. "IA" EDITA AQUI NO NAVEGADOR
  const codigoNovo = codigoAntigo.replace('color:#00FFFF','color:#AA00FF'); // exemplo de lógica
  
  log('Enviando pro BACKEND...');
  
  // 3. CHAMA O BACKEND GITHUB ACTIONS
  await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/kai-backend.yml/dispatches`, {
    method: 'POST',
    headers: {'Authorization': 'Bearer SEU_TOKEN_AQUI', 'Accept': 'application/vnd.github.v3+json'},
    body: JSON.stringify({
      ref: 'main',
      inputs: {comando: comando, arquivo: arquivo, codigo: codigoNovo}
    })
  });
  log('Ordem enviada! O K-AI vai commitar em 10s');
}
function log(t){document.getElementById('log').innerHTML += t + '<br>'}
</script>
</body>
</html>
