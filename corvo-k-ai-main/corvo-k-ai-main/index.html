<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><title>K-AI v-6000 GEMINI</title>
<style>
body{background:#000;color:#00FFFF;font-family:monospace;padding:20px}
.card{background:#0a0f14;border:1px solid #00FFFF;padding:15px;border-radius:12px;margin:10px 0}
input,button{padding:12px;background:#111;color:#fff;border:1px solid #00FFFF;border-radius:8px}
button{background:#00FFFF;color:#000;font-weight:900;cursor:pointer}
.log{background:#010;border:1px solid #00FFFF;padding:10px;height:300px;overflow:auto;font-size:12px}
.tag{background:#00FFFF;color:#000;padding:3px 8px;border-radius:5px;margin:2px;display:inline-block}
</style>
</head>
<body>
<h1>K-AI v-6000 // CEREBRO + GEMINI GRÁTIS</h1>

<div class="card">
  <button onclick="lerPasta()">🧠 LER TODA PASTA KORVIL</button>
  <div id="cerebro"></div>
</div>

<div class="card">
  <input id="comando" placeholder="KAI: criar sistema de login com dark mode" style="width:70%">
  <button onclick="enviar()">EXECUTAR COM IA</button>
</div>
<div class="log" id="log"></div>

<script>
const REPO = "korvilp-sudo/korvil-app";
const PATH = "corvo-k-ai-main/corvo-k-ai-main";
let CEREBRO = {};

function log(t){document.getElementById('log').innerHTML += `[${new Date().toLocaleTimeString()}] ${t}<br>`}

// 1. LER TODOS ARQUIVOS
async function lerPasta(){
  log('Lendo pasta...');
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${PATH}`);
  const arquivos = await res.json();
  for(const file of arquivos){
    if(file.name.endsWith('.html') || file.name.endsWith('.js') || file.name.endsWith('.css')){
      CEREBRO[file.name] = await fetch(file.download_url).then(r=>r.text());
      document.getElementById('cerebro').innerHTML += `<span class="tag">${file.name}</span>`;
    }
  }
  log(`CEREBRO PRONTO. ${Object.keys(CEREBRO).length} arquivos.`);
}

// 2. CHAMAR GEMINI GRATIS
async function chamarIA(comando, contexto){
  log('Pensando com Gemini...');
  const prompt = `Você é K-AI, dev senior. Contexto do projeto KORVIL:\n${JSON.stringify(contexto).slice(0,8000)}\n\nComando: ${comando}\n\nResponda SÓ com o código novo completo do arquivo. Sem explicação.`;
  
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
    method: 'POST',
    body: JSON.stringify({contents: [{parts: [{text: prompt}]}]})
  });
  const data = await res.json();
  return data.candidates[0].content.parts[0].text.replace(/```html|```/g,'');
}

// 3. EXECUTAR
async function enviar(){
  if(Object.keys(CEREBRO).length === 0) return alert('LER TODA PASTA primeiro');
  const comando = document.getElementById('comando').value;
  
  const codigoNovo = await chamarIA(comando, CEREBRO);
  
  log('Enviando pro Backend...');
  await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/kai-backend.yml/dispatches`, {
    method: 'POST',
    headers: {'Accept': 'application/vnd.github.v3+json'},
    body: JSON.stringify({
      ref: 'main',
      inputs: {comando: comando, arquivo: `${PATH}/index.html`, codigo: codigoNovo}
    })
  });
  log('✅ Ordem enviada! K-AI commitou sozinho.');
}
</script>
</body>
</html>
