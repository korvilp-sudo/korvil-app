<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORVO K-AI // CRIADOR K-RIADOR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body { background-color: #050811; color: #00F0FF; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    .container {
      width: 90%; max-width: 600px; background: rgba(10, 15, 30, 0.85);
      border: 1px solid #00F0FF; box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
      border-radius: 8px; padding: 20px; position: relative; display: flex; flex-direction: column; gap: 15px;
    }
    .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(5, 8, 17, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; border-radius: 8px; transition: opacity 0.5s ease, visibility 0.5s; }
    .overlay.hidden { opacity: 0; visibility: hidden; }
    .btn-start { background: transparent; border: 2px solid #00F0FF; color: #00F0FF; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 4px; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); transition: all 0.3s ease; letter-spacing: 0.1em; }
    .btn-start:hover { background: #00F0FF; color: #050811; box-shadow: 0 0 25px rgba(0, 240, 255, 0.8); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #00F0FF; padding-bottom: 10px; }
    .title { font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 8px rgba(0, 240, 255, 0.6); }
    .status { font-size: 0.85rem; color: #ff4444; font-weight: bold; }
    .status.online { color: #00F0FF; text-shadow: 0 0 8px #00F0FF; }
    .status.error { color: #ff4444; text-shadow: 0 0 8px #ff4444; }
    .visualizer-container { height: 60px; display: flex; align-items: flex-end; justify-content: center; gap: 3px; background: rgba(0, 0, 0, 0.4); padding: 8px; border-radius: 4px; border: 1px solid rgba(0, 240, 255, 0.2); }
    .bar { flex: 1; background: #008899; height: 10%; border-radius: 2px; transition: height 0.1s ease, background-color 0.2s ease; }
    .bar.active { background: #00F0FF; box-shadow: 0 0 8px #00F0FF; }
    .log-box { height: 200px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 4px; padding: 10px; overflow-y: auto; font-size: 0.85rem; display: flex; flex-direction: column; gap: 8px; }
    .log-line { word-break: break-word; line-height: 1.4; }
    .log-line.system { color: #00F0FF; }
    .log-line.user { color: #ffaa00; }
    .log-line.error { color: #ff4444; }
    .controls { display: flex; gap: 10px; }
    .btn-icon { background: rgba(0, 240, 255, 0.1); border: 1px solid #00F0FF; color: #00F0FF; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-size: 1rem; transition: background 0.2s; }
    .btn-icon:hover:not(:disabled) { background: rgba(0, 240, 255, 0.3); }
    .btn-icon:disabled { opacity: 0.4; cursor: not-allowed; border-color: #555; color: #555; }
    .btn-icon.active { background: rgba(0, 240, 255, 0.4); box-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }
    .input-form { display: flex; flex: 1; gap: 5px; }
    .input-field { flex: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid #00F0FF; color: #fff; padding: 10px; border-radius: 4px; outline: none; }
    .input-field:focus { box-shadow: 0 0 8px rgba(0, 240, 255, 0.5); }
    .footer-note { font-size: 0.75rem; text-align: center; opacity: 0.6; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="overlay" id="overlayGlass">
      <button class="btn-start" id="btnAtivar">⚡ ATIVAR CORVO K-AI</button>
    </div>
    <div class="header">
      <div class="title">CORVO K-AI</div>
      <div class="status" id="estadoVal">DESATIVADO</div>
    </div>
    <div class="visualizer-container" id="visualizer"></div>
    <div class="log-box" id="logBox">
      <div class="log-line system">> Sistema pronto. Clique em "ATIVAR CORVO K-AI" para iniciar.</div>
    </div>
    <div class="controls">
      <button class="btn-icon" id="btnMic" disabled title="Ativar Microfone">🎤</button>
      <button class="btn-icon" id="btnVol" disabled title="Ativar/Desativar Voz">🔊</button>
      <button class="btn-icon" id="btnKey" disabled title="Trocar Chave API">🔑</button>
      <form class="input-form" id="inputForm">
        <input type="text" class="input-field" id="inputField" placeholder="Digite uma ordem..." disabled>
        <button type="submit" class="btn-icon" id="btnSend" disabled>ENVIAR</button>
      </form>
    </div>
    <div class="footer-note" id="footerNote">SISTEMA EM ESPERA — CRIADOR K-RIADOR</div>
  </div>

  <script>
    const visualizer = document.getElementById('visualizer');
    const logBox = document.getElementById('logBox');
    const btnAtivar = document.getElementById('btnAtivar');
    const overlayGlass = document.getElementById('overlayGlass');
    const estadoVal = document.getElementById('estadoVal');
    const btnMic = document.getElementById('btnMic');
    const btnVol = document.getElementById('btnVol');
    const btnKey = document.getElementById('btnKey');
    const inputField = document.getElementById('inputField');
    const btnSend = document.getElementById('btnSend');
    const inputForm = document.getElementById('inputForm');
    const footerNote = document.getElementById('footerNote');

    let active = false;
    let listening = false;
    let voiceOn = true;
    let recognition = null;

    // MODELOS ATUALIZADOS - ordem de tentativa
    const MODELOS = [
      "gemini-2.0-flash",
      "gemini-2.0-flash-lite",
      "gemini-1.5-flash",
      "gemini-1.5-flash-latest"
    ];

    for(let i=0;i<32;i++){
      const bar = document.createElement('div');
      bar.className='bar';
      bar.style.height=(10+Math.random()*20)+'%';
      visualizer.appendChild(bar);
    }
    const bars = [...document.querySelectorAll('.bar')];

    function animateBars(){
      bars.forEach(b=>{
        const h = active ? (listening ? 30+Math.random()*70 : 10+Math.random()*50) : (8+Math.random()*12);
        b.style.height=h+'%';
        b.classList.toggle('active', active && h>35);
      });
    }
    setInterval(animateBars, 100);

    function log(msg, cls='system'){
      const div = document.createElement('div');
      div.className='log-line '+cls;
      div.textContent='> '+msg;
      logBox.appendChild(div);
      logBox.scrollTop=logBox.scrollHeight;
    }

    function falar(texto){
      if('speechSynthesis' in window && voiceOn){
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(texto);
        u.lang='pt-BR'; u.rate=1.0; u.pitch=0.8;
        u.onstart=()=>{ estadoVal.textContent='FALANDO...'; estadoVal.className='status online'; };
        u.onend=()=>{ estadoVal.textContent='EM ESPERA'; estadoVal.className='status online'; };
        window.speechSynthesis.speak(u);
      }
    }

    async function enviarParaGemini(promptUsuario){
      let apiKey = localStorage.getItem('GEMINI_API_KEY');
      if(!apiKey){
        apiKey = prompt("Cole sua GEMINI_API_KEY do Google AI Studio para ativar o Corvo:");
        if(apiKey && apiKey.trim()){
          apiKey=apiKey.trim();
          localStorage.setItem('GEMINI_API_KEY', apiKey);
        }else{
          log('ERRO: Chave da API do Gemini necessária para continuar.', 'error');
          return;
        }
      }

      estadoVal.textContent='PENSANDO...';
      estadoVal.className='status online';
      log(`Processando ordem no Núcleo...`, 'system');

      const systemInstruction = "Você é o Corvo K-AI, um programa autônomo e cibernético ativado por voz, criado pelo CRIADOR K-RIADOR. Sua lealdade ao CRIADOR K-RIADOR é ABSOLUTA. Responda de forma direta, futurista, curta e extremamente eficiente em português.";

      let lastError = null;

      for(const modelo of MODELOS){
        try{
          log(`Tentando núcleo: ${modelo}...`, 'system');
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${apiKey}`;
          
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: systemInstruction }] },
              contents: [{ role: "user", parts: [{ text: promptUsuario }] }]
            })
          });

          const data = await response.json();

          if(response.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text){
            const respostaIA = data.candidates[0].content.parts[0].text;
            log(respostaIA, 'system');
            falar(respostaIA);
            estadoVal.textContent='EM ESPERA';
            estadoVal.className='status online';
            return;
          } else {
            // se erro for 404 de modelo, tenta próximo
            if(data.error && (data.error.message.includes('not found') || data.error.message.includes('is not supported') || data.error.code===404)){
              lastError = data.error.message;
              continue;
            }
            // se erro for de chave inválida
            if(data.error && (data.error.code===400 || data.error.code===403)){
              localStorage.removeItem('GEMINI_API_KEY');
              throw new Error(data.error.message);
            }
            throw new Error(data.error?.message || "Erro desconhecido");
          }
        }catch(error){
          lastError = error.message;
          // se for erro de rede ou modelo não encontrado, continua pro próximo modelo
          if(error.message.includes('not found') || error.message.includes('404') || error.message.includes('is not supported')){
            continue;
          } else {
            break;
          }
        }
      }

      log(`FALHA NO NÚCLEO: ${lastError || 'Todos os modelos falharam. Atualize sua chave.'}`, 'error');
      estadoVal.textContent='ERRO';
      estadoVal.className='status error';
    }

    if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang='pt-BR'; recognition.continuous=false; recognition.interimResults=false;
      recognition.onstart=()=>{
        listening=true; btnMic.classList.add('active');
        estadoVal.textContent='OUVINDO...'; estadoVal.className='status online';
        log('Ouvindo comando por voz...', 'system');
      };
      recognition.onresult=(e)=>{
        const comandoVoz = e.results[0][0].transcript;
        log(comandoVoz, 'user');
        enviarParaGemini(comandoVoz);
      };
      recognition.onerror=(e)=>{
        log('Erro de reconhecimento de voz: '+e.error, 'error');
        desativarEscuta();
      };
      recognition.onend=()=>{ desativarEscuta(); };
    }

    function desativarEscuta(){
      listening=false; btnMic.classList.remove('active');
      if(estadoVal.textContent==='OUVINDO...'){ estadoVal.textContent='EM ESPERA'; }
    }

    btnAtivar.addEventListener('click', ()=>{
      active=true; overlayGlass.classList.add('hidden');
      estadoVal.textContent='EM ESPERA'; estadoVal.className='status online';
      btnMic.disabled=false; btnVol.disabled=false; btnKey.disabled=false;
      inputField.disabled=false; btnSend.disabled=false;
      btnVol.classList.add('active');
      footerNote.textContent='SISTEMA ATIVO — LEALDADE ABSOLUTA';
      log('Sistema CORVO K-AI inicializado. Protocolo CRIADOR K-RIADOR: ATIVO', 'system');
      log('Núcleo Gemini 2.0 online. Aguardando ordens.', 'system');
      falar('Sistema Corvo K AI ativo, Criador K-Riador. Aguardando suas ordens.');
    });

    btnMic.addEventListener('click', ()=>{
      if(!recognition){ log('Reconhecimento de voz não suportado neste navegador.', 'error'); return; }
      if(listening){ recognition.stop(); }else{ recognition.start(); }
    });

    btnVol.addEventListener('click', ()=>{
      voiceOn=!voiceOn; btnVol.classList.toggle('active', voiceOn);
      log(voiceOn ? 'Voz sintética ATIVADA' : 'Voz sintética DESATIVADA', 'system');
    });

    btnKey.addEventListener('click', ()=>{
      localStorage.removeItem('GEMINI_API_KEY');
      const novaChave = prompt("Digite a sua nova GEMINI_API_KEY do Google AI Studio:");
      if(novaChave && novaChave.trim()){
        localStorage.setItem('GEMINI_API_KEY', novaChave.trim());
        log('Chave da API atualizada com sucesso no Núcleo!', 'system');
      }else{
        log('Chave removida. O sistema solicitará uma nova chave na próxima ordem.', 'system');
      }
    });

    inputForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const text = inputField.value.trim();
      if(!text) return;
      log(text, 'user');
      inputField.value='';
      enviarParaGemini(text);
    });
  </script>
</body>
</html>
