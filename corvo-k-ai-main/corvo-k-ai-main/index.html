<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Corvo K-AI // CRIADOR K-RIADOR</title>
  <meta name="description" content="Corvo K-AI — programa autônomo por voz. Online e Offline. Criação do CRIADOR K-RIADOR." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --neon: #00F0FF; --bg: #050505; --card: rgba(18,18,20,0.7); --border: rgba(255,255,255,0.1); --muted: #a1a1aa; }
    body {
      background-color: var(--bg);
      color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      min-height: 100vh;
      display: flex; justify-content: center; align-items: flex-start;
      overflow-x: hidden;
    }
    .background-glow {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(0, 240, 255, 0.12), transparent 60%);
      pointer-events: none;
    }
    .scan-canvas { position: fixed; inset:0; opacity:0.04; pointer-events:none; background: repeating-linear-gradient(0deg, transparent, transparent 2px, var(--neon) 2px, transparent 3px); }
    .container {
      position: relative; z-index: 10; width: 100%; max-width: 440px;
      padding: 20px 16px 28px; display: flex; flex-direction: column; gap: 16px;
      min-height: 100dvh;
    }
    header { display: flex; justify-content: space-between; align-items: center; }
    .title {
      font-family: monospace; font-size: 1.15rem; font-weight: 800;
      letter-spacing: 0.35em; color: var(--neon);
      text-shadow: 0 0 12px rgba(0,240,255,0.7);
    }
    .subtitle { font-size: 10px; text-transform: uppercase; letter-spacing: 0.25em; color: var(--muted); margin-top: 2px; }
    .status-badge { display: flex; align-items: center; gap: 8px; font-family: monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--neon); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 8px var(--neon); animation: blink 1.5s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    @keyframes breathe { 0%,100%{box-shadow:0 0 12px rgba(0,240,255,0.25), inset 0 0 0 1px rgba(255,255,255,0.08)} 50%{box-shadow:0 0 22px rgba(0,240,255,0.45), inset 0 0 0 1px rgba(255,255,255,0.12)} }
    @keyframes scan { 0%{transform:translateY(-100%)} 100%{transform:translateY(300px)} }
    .avatar-frame {
      position: relative; width: 100%; max-width: 300px; aspect-ratio: 1/1; margin: 0 auto;
      border-radius: 20px; border: 1px solid var(--border); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      animation: breathe 3s ease-in-out infinite; background: #0a0a0c;
    }
    .avatar-img { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.1) saturate(0.9); }
    .overlay-glass {
      position: absolute; inset: 0; background: rgba(5,5,5,0.68); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; transition: all 0.6s ease;
    }
    .overlay-glass.hidden { opacity:0; pointer-events:none; transform: scale(1.05); }
    .scanline { position:absolute; left:0; right:0; top:0; height:64px; background: linear-gradient(to bottom, rgba(0,240,255,0.22), transparent); animation: scan 3s linear infinite; pointer-events:none; }
    .octa { position:absolute; left:50%; top:12%; width:14px; height:14px; transform: translateX(-50%) rotate(45deg); background: var(--neon); border-radius:2px; box-shadow:0 0 10px var(--neon); animation: octa-pulse 2s infinite; }
    @keyframes octa-pulse { 0%,100%{opacity:0.8; transform:translateX(-50%) rotate(45deg) scale(1)} 50%{opacity:1; transform:translateX(-50%) rotate(45deg) scale(1.2)} }
    .btn-activate {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      border-radius: 9999px; border: 1px solid rgba(0,240,255,0.5); background: #121215;
      padding: 22px 26px; color: var(--neon); cursor: pointer; transition: all 0.2s ease;
      font-family: monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.3em;
    }
    .btn-activate:hover { background: rgba(0,240,255,0.15); box-shadow: 0 0 18px rgba(0,240,255,0.5); transform: scale(1.03); }
    .visualizer { display: flex; height: 48px; align-items: center; justify-content: center; gap: 3px; }
    .bar { width: 3px; border-radius: 9999px; background: var(--neon); opacity: 0.35; height: 20%; transition: height 0.12s ease, opacity 0.12s ease; }
    .bar.active { opacity: 0.95; box-shadow: 0 0 6px var(--neon); }
    .card { border-radius: 12px; border: 1px solid var(--border); background: var(--card); padding: 16px; backdrop-filter: blur(8px); }
    .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3em; color: var(--neon); text-shadow:0 0 8px rgba(0,240,255,0.5); }
    .status-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 11px; border-bottom: 1px dashed rgba(255,255,255,0.04); }
    .status-row:last-child{border:none}
    .status-label { text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted); }
    .status-value { font-family: monospace; color: var(--neon); text-shadow:0 0 6px rgba(0,240,255,0.4); }
    .log-box { font-family: monospace; font-size: 11px; line-height: 1.6; max-height: 140px; overflow-y: auto; color: #c9c9ce; }
    .log-line { margin-bottom: 4px; }
    .log-line.user { color: #fff; }
    .log-line.system { color: var(--neon); }
    .controls { display: flex; flex-direction: column; gap: 12px; margin-top: auto; }
    .btn-row { display: flex; justify-content: center; align-items: center; gap: 12px; }
    .circle-btn { display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid var(--border); background: #121215; color: var(--neon); cursor: pointer; transition:0.2s; }
    .circle-btn:disabled{opacity:0.35; cursor:not-allowed}
    .circle-btn:not(:disabled):hover{background: rgba(0,240,255,0.12); box-shadow:0 0 10px rgba(0,240,255,0.2)}
    .btn-mic { width: 64px; height: 64px; }
    .btn-vol { width: 48px; height: 48px; color: var(--muted); }
    .btn-vol.active { color: var(--neon); border-color: rgba(0,240,255,0.4); }
    .input-form { display: flex; align-items: center; gap: 8px; }
    .input-field { height: 44px; flex: 1; border-radius: 10px; border: 1px solid var(--border); background: #09090b; padding: 0 14px; font-family: monospace; font-size: 13px; color: #fff; outline: none; transition:0.2s; }
    .input-field:focus { border-color: var(--neon); box-shadow:0 0 0 2px rgba(0,240,255,0.15); }
    .btn-send { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: #121215; color: var(--neon); display: flex; align-items: center; justify-content: center; cursor: pointer; transition:0.2s; }
    .btn-send:hover:not(:disabled){ background: rgba(0,240,255,0.12); }
    .footer-note { text-align: center; font-size: 9px; text-transform: uppercase; letter-spacing: 0.25em; color: var(--muted); }
  </style>
</head>
<body>
  <div class="background-glow"></div>
  <div class="scan-canvas"></div>
  <main class="container">
    <header>
      <div>
        <h1 class="title">CORVO K-AI</h1>
        <p class="subtitle">Criação do CRIADOR K-RIADOR</p>
      </div>
      <div class="status-badge"><span class="dot"></span><span id="netStatus">online</span></div>
    </header>

    <div class="avatar-frame" id="avatarFrame">
      <img src="corvo-kai.jpg" alt="Corvo K-AI, corvo cibernético com armadura e brilho neon ciano" class="avatar-img" id="corvoImg" onerror="this.src='https://images.unsplash.com/photo-1550853024-fae35e2be47f?q=80&w=600'" />
      <div class="scanline"></div>
      <div class="octa"></div>
      <div class="overlay-glass" id="overlayGlass">
        <button class="btn-activate" id="btnAtivar">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>
          <span>Ativar</span>
        </button>
      </div>
    </div>

    <div class="visualizer" id="visualizer"></div>

    <section class="card" aria-label="Painel de status">
      <div class="card-header"><span class="dot"></span><h2 class="card-title">Núcleo</h2></div>
      <div class="status-row"><span class="status-label">Estado</span><span class="status-value" id="estadoVal">EM ESPERA</span></div>
      <div class="status-row"><span class="status-label">Rede</span><span class="status-value">ONLINE</span></div>
      <div class="status-row"><span class="status-label">LLM</span><span class="status-value" style="color:#a1a1aa">GATEWAY</span></div>
      <div class="status-row"><span class="status-label">Lealdade</span><span class="status-value">ABSOLUTA</span></div>
      <div class="status-row"><span class="status-label">QI</span><span class="status-value">∞</span></div>
      <div class="status-row"><span class="status-label">Implante</span><span class="status-value">ATIVO</span></div>
    </section>

    <section class="card" aria-label="Registro de comunicação">
      <div class="card-header"><span class="dot"></span><h2 class="card-title">Log</h2></div>
      <div class="log-box" id="logBox">
        <div class="log-line system">> Sistema inicializado. Aguardando interação, CRIADOR K-RIADOR...</div>
      </div>
    </section>

    <div class="controls">
      <div class="btn-row">
        <button class="circle-btn btn-mic" id="btnMic" aria-label="Falar comando" disabled>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        </button>
        <button class="circle-btn btn-vol" id="btnVol" aria-label="Voz" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
      </div>
      <form class="input-form" id="inputForm">
        <input type="text" id="inputField" placeholder="Digite uma ordem, CRIADOR K-RIADOR..." class="input-field" disabled />
        <button type="submit" class="btn-send" id="btnSend" aria-label="Enviar ordem" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
      <p class="footer-note" id="footerNote">Aguardando suas ordens por voz</p>
    </div>
  </main>

<script>
  const visualizer = document.getElementById('visualizer');
  const logBox = document.getElementById('logBox');
  const btnAtivar = document.getElementById('btnAtivar');
  const overlayGlass = document.getElementById('overlayGlass');
  const estadoVal = document.getElementById('estadoVal');
  const btnMic = document.getElementById('btnMic');
  const btnVol = document.getElementById('btnVol');
  const inputField = document.getElementById('inputField');
  const btnSend = document.getElementById('btnSend');
  const inputForm = document.getElementById('inputForm');
  const footerNote = document.getElementById('footerNote');

  let active = false;
  let listening = false;
  let voiceOn = false;

  // cria 32 barras
  for(let i=0;i<32;i++){
    const bar = document.createElement('div');
    bar.className='bar';
    bar.style.height = (10 + Math.random()*20)+'%';
    visualizer.appendChild(bar);
  }
  const bars = [...document.querySelectorAll('.bar')];

  function log(msg, cls='system'){
    const div = document.createElement('div');
    div.className = 'log-line '+cls;
    div.textContent = '> ' + msg;
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function animateBars(){
    bars.forEach(b=>{
      const h = active ? (listening ? 20+Math.random()*80 : 8+Math.random()*60) : (8+Math.random()*15);
      b.style.height = h+'%';
      b.classList.toggle('active', active && h>35);
    });
  }
  setInterval(animateBars, 120);

  btnAtivar.addEventListener('click', ()=>{
    active = true;
    overlayGlass.classList.add('hidden');
    estadoVal.textContent='ATIVO';
    estadoVal.style.color='#00F0FF';
    btnMic.disabled=false; btnVol.disabled=false; inputField.disabled=false; btnSend.disabled=false;
    footerNote.textContent='SISTEMA ATIVO — LEALDADE ABSOLUTA';
    log('Sistema CORVO K-AI inicializado. Protocolo CRIADOR K-RIADOR: ATIVO','system');
    log('Núcleo online. QI ∞. Implante ATIVO. Aguardando ordens.','system');
    if('speechSynthesis' in window && voiceOn){
      const u = new SpeechSynthesisUtterance('Sistema Corvo K AI ativo, Criador K Riador. Aguardando ordens.');
      u.lang='pt-BR'; speechSynthesis.speak(u);
    }
  });

  btnMic.addEventListener('click', ()=>{
    listening = !listening;
    btnMic.style.background = listening ? 'rgba(0,240,255,0.2)' : '';
    btnMic.style.boxShadow = listening ? '0 0 14px rgba(0,240,255,0.4)' : '';
    log(listening ? 'Escuta por voz ATIVADA' : 'Escuta por voz DESATIVADA','system');
  });

  btnVol.addEventListener('click', ()=>{
    voiceOn = !voiceOn;
    btnVol.classList.toggle('active', voiceOn);
    log(voiceOn ? 'Voz sintética ATIVADA' : 'Voz sintética DESATIVADA','system');
  });

  inputForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const text = inputField.value.trim();
    if(!text) return;
    log(text, 'user');
    inputField.value='';
    setTimeout(()=>{ log(`Ordem recebida: "${text}". Processando no Núcleo...`, 'system'); }, 600);
    setTimeout(()=>{ log('Executado com lealdade ABSOLUTA, CRIADOR K-RIADOR.', 'system'); }, 1300);
  });
</script>
</body>
</html>
