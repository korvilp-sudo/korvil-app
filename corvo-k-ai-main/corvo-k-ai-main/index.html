<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><title>K-AI V0 GRATIS</title>
<style>
body{background:#000;color:#00FFFF;font-family:monospace;padding:20px}
textarea{width:100%;height:400px;background:#111;border:1px solid #00FFFF;color:#fff}
button{background:#00FFFF;color:#000;border:0;padding:12px 20px;font-weight:900;cursor:pointer;border-radius:8px}
</style>
</head>
<body>
<h1>K-AI V0 GRATIS // SEM QUOTA</h1>
<p>Digite: KAI: criar site completo de [tema] com [pasta/pagina1.html, pasta/pagina2.html]</p>
<input id="prompt" style="width:80%;padding:12px;background:#111;border:1px solid #00FFFF;color:#fff">
<button onclick="gerar()">GERAR TUDO</button>
<h3>ARQUIVOS GERADOS:</h3>
<div id="saida"></div>
<textarea id="editor"></textarea>
<button onclick="baixarZip()">⬇ BAIXAR ZIP</button>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
function gerar(){
  const p = document.getElementById('prompt').value.toLowerCase();
  let files = {};

  // V0 LOCAL - GERA MULTI ARQUIVOS
  if(p.includes('barbearia')){
    files['index.html'] = `<!doctype html><html><head><link rel="stylesheet" href="assets/style.css"></head><body><h1>K-BARBER</h1><a href="agendar.html">Agendar</a></body></html>`;
    files['agendar.html'] = `<!doctype html><html><head><link rel="stylesheet" href="assets/style.css"></head><body><h1>AGENDE AQUI</h1></body></html>`;
    files['assets/style.css'] = `body{background:#000;color:#00FFFF} h1{color:#00FFFF}`;
  }
  if(p.includes('portfolio')){
    files['index.html'] = `<!doctype html><html><body><h1>K-RIADOR.DEV</h1></body></html>`;
    files['projetos.html'] = `<!doctype html><html><body><h1>MEUS PROJETOS</h1></body></html>`;
  }

  document.getElementById('saida').innerHTML = Object.keys(files).map(f=>`📁 ${f}`).join('<br>');
  document.getElementById('editor').value = JSON.stringify(files, null, 2);
  window.filesGerados = files;
}

async function baixarZip(){
  const zip = new JSZip();
  for(const [nome, conteudo] of Object.entries(window.filesGerados)){
    zip.file(nome, conteudo);
  }
  const blob = await zip.generateAsync({type:"blob"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "K-AI-SITE.zip";
  a.click();
}
</script>
</body>
</html>
